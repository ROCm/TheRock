# hipDNN
[components.lib."ml-libs/hipDNN/stage"]
exclude = [
  "lib/libhipdnn_backend_private.a",
  "lib/test_plugins/**",
]
[components.run."ml-libs/hipDNN/stage"]
include = [
  "bin/hipdnn_list_engines*",
]
[components.dbg."ml-libs/hipDNN/stage"]
[components.dev."ml-libs/hipDNN/stage"]
include = [
  "share/hipdnn/test_sdk/AsanDefaultSuppressions.cpp",
]
[components.doc."ml-libs/hipDNN/stage"]
[components.test."ml-libs/hipDNN/stage"]
include = [
  "bin/*hipdnn_*_test*",
  "bin/hipdnn/CTestTestfile.cmake",
  "lib/test_plugins/**",
  "share/hipdnn/cudnn_samples/**",
  # TestUedFixtureParity (hipdnn_plugin_sdk_tests) reads the UED fixture corpus and the
  # UED JSON Schema from share/hipdnn_plugin_sdk next to the test binary's bin/ directory.
  "share/hipdnn_plugin_sdk/schemas/**",
  "share/hipdnn_plugin_sdk/test_fixtures/**",
]
