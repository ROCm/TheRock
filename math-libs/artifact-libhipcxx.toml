# libhipcxx
[components.lib."math-libs/libhipcxx/stage"]
optional = true
[components.dbg."math-libs/libhipcxx/stage"]
optional = true
[components.dev."math-libs/libhipcxx/stage"]
include = [
  "include/*",
]
[components.test."math-libs/libhipcxx_tests/build"]
# libhipcxx_tests only exists with THEROCK_BUILD_TESTING and THEROCK_ENABLE_PRIM.
optional = true
include = [
  "libhipcxx/**/*",
]
exclude = [
  # Exclude folders not needed for testing
  "libhipcxx/._upstream/**",
  "libhipcxx/docs/**",
]
