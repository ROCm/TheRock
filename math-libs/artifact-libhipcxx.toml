# libhipcxx
[components.lib."math-libs/libhipcxx/stage"]
optional = true
[components.dbg."math-libs/libhipcxx/stage"]
optional = true
[components.dev."math-libs/libhipcxx/stage"]
include = [
  "include/*",
]
[components.test."math-libs/libhipcxx/stage"]
optional = true
include = [
  # Prebuilt c2h test executables and their relocatable CTest file.
  "bin/libcudacxx.test.*",
  "bin/libhipcxx/CTestTestfile.cmake",
]
[components.test."math-libs/libhipcxx/build"]
include = [
  "libhipcxx/**/*",
]
exclude = [
  # Exclude folders not needed for testing
  "libhipcxx/._upstream/**",
  "libhipcxx/docs/**",
]
