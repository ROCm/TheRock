# rocWMMA
[components.lib."math-libs/rocWMMA/stage"]
optional = true
[components.dbg."math-libs/rocWMMA/stage"]
optional = true
[components.dev."math-libs/rocWMMA/stage"]
include = [
  "include/rocwmma/*",
]
[components.test."math-libs/rocWMMA/stage"]
optional = true
include = [
  # Samples
  "bin/simple_*",
  "bin/perf_*",
  "bin/hipRTC_gemm*",
  # Installed CMake consumers are compiled against the fetched SDK in CI.
  "share/rocwmma/tests/package_consumer/**",
  # Tests
  "bin/*_test*",
  "bin/*-validate*",
  "bin/*-bench*",
  "bin/rocwmma/CTestTestfile.cmake",
  "bin/rocwmma/*/CTestTestfile.cmake",
]
