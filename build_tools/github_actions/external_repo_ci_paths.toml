    "test/therock/test_hipdnn_install.py",
    "test/therock/hipdnn_install_tests/*",
    ".github/workflows/hipdnn-superbuild-ci.yml",
    ".github/requirements-hipdnn-superbuild-ci.txt",
    ".github/scripts/check_wheel_freshness.py",
