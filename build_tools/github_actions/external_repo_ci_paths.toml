    "tools/libraries_pr_bot/*",
    "skills/therock-local-build/scripts/*",
    "skills/worktree-venv/scripts/*",
    # Workflows that manage the repository or shared checks.
    ".github/workflows/auto-retry-failed.yml",
    ".github/workflows/clang-tidy.yml",
    ".github/workflows/close-stale-prs.yml",
