# Base skip-CI patterns that apply to ALL repositories using TheRock CI.
# These are universal patterns for files that never affect build/test workflows.
#
# Individual repos (including TheRock) can extend these with their own
# skip-ci-config.toml for repo-specific patterns.
#
# An extending repo may also declare which workflows constitute its CI:
#
#   [ci_workflows]
#   filenames = ["multi_arch_ci.yml"]   # exact basenames
#   patterns  = ["therock-*"]           # fnmatch globs over the basename
#
# When either key is present, files under .github/workflows are judged only
# against that allowlist -- a workflow outside it never forces a CI run, and is
# not consulted against the skip_ci patterns either. This lets a repo whose CI
# entrypoints share a naming convention avoid enumerating the (much larger) set
# of workflows that are not CI. Repos declaring neither key are unaffected:
# their workflow files are matched against skip_ci like any other path.

version = 1

[skip_ci]
# Patterns that apply to all platforms
common = [
    # Documentation and metadata
    "*.md",
    "*.gitignore",
    "*CODEOWNERS",
    "*LICENSE",
    "docs/*",

    # GitHub metadata that doesn't affect CI
    ".github/dependabot.yml",
]

# Additional patterns for Linux-only skip (currently none)
linux = []

# Additional patterns for Windows-only skip (currently none)
windows = []
