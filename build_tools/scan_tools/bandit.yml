#
# bandit configuration for TheRock, picked up by the rocm-security-gh
# reusable scanner (.github/workflows/security_scan_pr.yml and
# security_scan_weekly.yml) in place of its own org-wide default.
# Reference: https://bandit.readthedocs.io/en/latest/config.html

exclude_dirs:
  - .git
  - .venv
  - venv
  # Match a directory component, not substrings such as build_tools.
  - '*/build/*'
  # Vendored third-party code is maintained upstream.
  - '*/build_tools/third_party/*'
  # Bandit does not recognize submodules. Keep this list in sync with .gitmodules.
  - '*/base/half/*'
  - '*/base/rocm-cmake/*'
  - '*/compiler/amd-llvm/*'
  - '*/compiler/hipify/*'
  - '*/compiler/spirv-llvm-translator/*'
  - '*/debug-tools/rocgdb/source/*'
  - '*/math-libs/libhipcxx/*'
  - '*/rocm-docs/*'
  - '*/rocm-libraries/*'
  - '*/rocm-systems/*'
  - '*/third-party/sysdeps/common/mesa-fork/*'
  # Downloaded sources listed in external-builds/pytorch/.gitignore.
  - '*/external-builds/pytorch/src/*'
  - '*/external-builds/pytorch/pytorch/*'
  - '*/external-builds/pytorch/pytorch_audio/*'
  - '*/external-builds/pytorch/pytorch_vision/*'
  - '*/external-builds/pytorch/triton/*'

# Assertions are expected in tests; keep other checks enabled for these files.
assert_used:
  skips:
    - '*_test.py'
    - '*/test_*.py'

skips:
  - B404 # import subprocess
  - B603 # subprocess call without shell=True
  - B606 # start process with no shell
  - B607 # start process with a partial executable path
