        owner_path: core/whl-next
      networkx:
        owner_path: core/whl-next
      numpy:
        owner_path: core/whl-next
      opt-einsum:
        owner_path: core/whl-next
      pillow:
        owner_path: core/whl-next
      rocm:
        owner_path: core/whl-next
      rocm-bootstrap:
        owner_path: core/whl-next
      rocm-profiler:
        owner_path: core/whl-next
      rocm-sdk-core:
        owner_path: core/whl-next
      rocm-sdk-devel:
        owner_path: core/whl-next
      rocm-sdk-libraries:
        owner_path: core/whl-next
      setuptools:
        owner_path: core/whl-next
      sympy:
        owner_path: core/whl-next
