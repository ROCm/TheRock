# rccl
[components.lib."comm-libs/rccl/stage"]
include = [
  "share/rccl/**",
]
[components.run."comm-libs/rccl/stage"]
include = [
  "bin/rcclras",
]
[components.dbg."comm-libs/rccl/stage"]
[components.dev."comm-libs/rccl/stage"]
[components.doc."comm-libs/rccl/stage"]
[components.test."comm-libs/rccl/stage"]
include = [
  "bin/rccl-UnitTests",
]

# rccl-tests
[components.doc."comm-libs/rccl-tests/stage"]
optional = true
[components.test."comm-libs/rccl-tests/stage"]
include = [
  "bin/**",
]
optional = true

# rccl-translate (present only for gfx1250 hotswap builds)
[components.lib."comm-libs/rccl-translate/stage"]
default_patterns = false
include = [
  "share/rocjitsu/translations/**",
]
optional = true
