[tool.pytest.ini_options]
testpaths = [
    "build_tools/tests",
    "build_tools/github_actions/tests",
    "build_tools/packaging/tests",
    "build_tools/packaging/archives/tests",
    "build_tools/packaging/linux/tests",
    "build_tools/packaging/python/tests",
    "build_tools/packaging/windows/tests",
    "build_tools/third_party/s3_management/tests",
    "external-builds/pytorch/tests",
    "test_tools/tests",
    "skills/therock_pr_bot/policy_check_test.py",
]
python_files = ["*_test.py"]
addopts = [
    "-ra",
    "-m", "not manual",
]
markers = [
    "manual: expensive or environment-dependent tests that require explicit opt-in with -m manual",
]

[tool.coverage.run]
data_file = "build/.coverage"
source = [
    "build_tools",
    "external-builds/pytorch",
    "test_tools",
    "skills/therock_pr_bot",
]
omit = [
    "build_tools/tests/*",
    "build_tools/github_actions/tests/*",
    "build_tools/packaging/tests/*",
    "build_tools/packaging/archives/tests/*",
    "build_tools/packaging/linux/tests/*",
    "build_tools/packaging/python/tests/*",
    "build_tools/packaging/windows/tests/*",
    "build_tools/third_party/s3_management/tests/*",
    "external-builds/pytorch/tests/*",
    "external-builds/pytorch/smoke-tests/*",
    # Downloaded source checkouts and local environments are not TheRock tooling.
    "external-builds/pytorch/src/*",
    "external-builds/pytorch/.venv/*",
    "external-builds/pytorch/pytorch/*",
    "external-builds/pytorch/pytorch_vision/*",
    "external-builds/pytorch/pytorch_audio/*",
    "external-builds/pytorch/triton/*",
    "test_tools/tests/*",
    "skills/therock_pr_bot/policy_check_test.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "build/coverage-html"
