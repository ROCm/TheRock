# trivy configuration for Quartz, picked up by the rocm-security-gh
# reusable scanner (.github/workflows/security_scan_pr.yml and
# security_scan_weekly.yml) in place of its own org-wide default.
# Reference: https://trivy.dev/latest/docs/references/configuration/config-file/

scan:
  skip-dirs:
    - .git
    - .venv
    - venv
    - release-nightly
    - prereleases
