# rocjitsu
[components.lib."emulation/rocjitsu/stage"]
default_patterns = false
include = [
  "lib/librocjitsu.so",
  # Loaded by the rocjitsu launcher when a config enables these plugins.
  "lib/librocjitsu_plugin_*.so",
]
[components.dbg."emulation/rocjitsu/stage"]
[components.dev."emulation/rocjitsu/stage"]
[components.run."emulation/rocjitsu/stage"]
include = [
  "bin/rocjitsu",
  "bin/rj_pretranslate",
  "bin/rocjitsu-pretranslate.py",
  "libexec/rocjitsu/rocjitsu-memory",
  "share/rocjitsu/**",
]
