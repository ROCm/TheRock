version: 2
updates:

  # Check for updates to GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # Wait a week before adopting newly released action versions.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
