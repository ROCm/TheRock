name: "Configure AWS credentials for artifact uploads"

description: >-
  Determine the IAM role for the artifacts S3 bucket and assume it via OIDC.
  * Forks and external repos skip OIDC and use runner base credentials.
  * Release builds use the IAM role for their destination release bucket.
  * Other CI runs use the 'therock-ci' role.
  See the "Authentication" section in docs/development/s3_buckets.md.

inputs:
  release_type:
    description: 'Release type: "ci", "dev", "dev-bkc", "nightly", "nightly-bkc", or "prerelease"'
    default: ci

runs:
  using: "composite"
  steps:
    - name: Enforce CI-only destination for normal validation
      id: normal_guard
      if: ${{ fromJSON(toJSON(github.event.inputs)).profile_normal_validation == 'true' }}
      shell: bash
      env:
        RELEASE_TYPE: ${{ inputs.release_type }}
      run: python build_tools/normal_ci_validation.py guard

    - name: Determine IAM role
      if: ${{ always() && (fromJSON(toJSON(github.event.inputs)).profile_normal_validation != 'true' || steps.normal_guard.outcome == 'success') }}
      id: iam
      shell: bash
      env:
        INPUTS_RELEASE_TYPE: ${{ inputs.release_type }}
      run: |
        python build_tools/github_actions/write_artifacts_bucket_info.py \
          --release-type "${INPUTS_RELEASE_TYPE}"

    - name: Configure AWS Credentials
      if: ${{ always() && steps.iam.outputs.iam_role != '' && (fromJSON(toJSON(github.event.inputs)).profile_normal_validation != 'true' || steps.normal_guard.outcome == 'success') }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ steps.iam.outputs.aws_region }}
        role-to-assume: ${{ steps.iam.outputs.iam_role }}
        special-characters-workaround: ${{ runner.os == 'Windows' }}
