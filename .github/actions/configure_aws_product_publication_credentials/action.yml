name: "Configure AWS credentials for repo.amd.com publication"

description: >-
  Determine the IAM role for a repo.amd.com product bucket and assume it via
  OIDC. This is for publishing builds to repo.amd.com product buckets; artifact
  uploads should keep using configure_aws_artifacts_credentials.

inputs:
  release_type:
    description: 'Release type: "dev", "dev-bkc", "nightly", "nightly-bkc", or "prerelease"'
    required: true
  product:
    description: 'Product bucket: "core", "pytorch", or "jax"'
    required: true

runs:
  using: "composite"
  steps:
    - name: Determine IAM role
      if: ${{ always() }}
      id: iam
      shell: bash
      run: |
        python build_tools/github_actions/write_product_release_bucket_info.py \
          --release-type "${{ inputs.release_type }}" \
          --product "${{ inputs.product }}"

    - name: Configure AWS Credentials
      if: ${{ always() && steps.iam.outputs.iam_role != '' }}
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        aws-region: ${{ steps.iam.outputs.aws_region }}
        role-to-assume: ${{ steps.iam.outputs.iam_role }}
        special-characters-workaround: ${{ runner.os == 'Windows' }}
