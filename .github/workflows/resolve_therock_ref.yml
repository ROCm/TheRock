name: Resolve TheRock Ref

on:
  workflow_call:
    inputs:
      therock-ref-override:
        description: Optional explicit TheRock ref (branch/tag/SHA) to build against
        type: string
        default: ""
    outputs:
      therock-ref:
        description: Resolved TheRock commit SHA
        value: ${{ jobs.resolve.outputs.therock_ref }}

jobs:
  resolve:
    name: Resolve TheRock ref
    runs-on: ubuntu-24.04
    outputs:
      therock_ref: ${{ steps.resolve.outputs.therock_ref }}
    steps:
      - name: Checkout TheRock for script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ROCm/TheRock
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Install dependencies
        run: pip install requests

      - name: Resolve TheRock ref
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THEROCK_REF_OVERRIDE: ${{ inputs.therock-ref-override }}
        run: python build_tools/github_actions/resolve_therock_ref.py
