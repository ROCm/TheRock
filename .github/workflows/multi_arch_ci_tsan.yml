name: Multi-Arch CI Host TSAN

# Keep this qualification workflow manual until the admitted CPU-only suite
# has produced stable green runs.
on:
  workflow_dispatch:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Linux artifact families to build. Tests remain CPU-only."
        default: "all"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name: >-
  Multi-Arch Host TSAN | Linux artifacts: ${{ inputs.linux_amdgpu_families }}

jobs:
  setup:
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "host-tsan"
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families }}
      windows_amdgpu_families: "none"
      # Qualification is intentionally from-source. Cross-variant stage reuse
      # could mix uninstrumented artifacts into a host-TSAN run.
      prebuilt_stages: ""
      baseline_run_id: ""
      build_python_packages: false
      build_pytorch: false
      build_jax: false
      # Native package names/install prefixes are intentionally not shared
      # with release packages during the qualification phase.
      build_native_linux: false
    secrets: inherit

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_ci_linux.yml
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ""
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: host-tsan
    permissions:
      contents: read
      id-token: write

  ci_host_tsan_summary:
    name: CI Host TSAN Summary
    if: always()
    needs: [setup, linux_build_and_test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
