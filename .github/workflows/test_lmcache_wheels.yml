# Builds and tests a fat multi-architecture LMCache wheel. An explicit trusted
# dispatch can publish the exact tested artifact to TheRock's multi-arch index.

name: Test LMCache Wheels

on:
  # TODO: Remove this push trigger before merging to main.
  push:
    branches:
      - users/adkankar/lmcache-port
    paths:
      - .github/workflows/build_linux_lmcache_wheels.yml
      - .github/workflows/test_lmcache_wheels.yml
      - external-builds/lmcache/**

  workflow_call:
    inputs:
      build_runs_on:
        description: Runner label with Docker available.
        type: string
        default: azure-linux-scale-rocm
      test_runs_on:
        description: GPU runner label.
        type: string
        default: linux-gfx942-1gpu-ccs-csp-ossci-rocm
      python_version:
        type: string
        default: "3.12"
      build_device_arch:
        type: string
        default: gfx942
      rocm_arches:
        type: string
        default: gfx90a;gfx942;gfx950;gfx1100;gfx1101;gfx1200;gfx1201;gfx1250
      test_rocm_arch:
        type: string
        default: gfx942
      rocm_index_url:
        type: string
        default: https://rocm.prereleases.amd.com/whl-multi-arch/
      rocm_version:
        type: string
        default: 7.14.0rc3
      torch_version:
        type: string
        default: 2.11.0+rocm7.14.0rc3
      lmcache_git_ref:
        type: string
        default: fa8d5e7f4afdd9450d814ea697c73a576d85d4bb
      publish_to_s3:
        description: Publish the tested wheel to the selected release bucket.
        type: boolean
        default: false
      release_type:
        description: S3 release bucket type.
        type: string
        default: dev
      repository:
        description: TheRock repository to check out.
        type: string
        default: ""
      ref:
        description: TheRock branch, tag, or commit to check out.
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      build_runs_on:
        description: Runner label with Docker available
        required: true
        type: string
        default: azure-linux-scale-rocm
      test_runs_on:
        description: GPU runner label
        required: true
        type: string
        default: linux-gfx942-1gpu-ccs-csp-ossci-rocm
      python_version:
        required: true
        type: string
        default: "3.12"
      build_device_arch:
        description: Device package used in the build environment
        required: true
        type: string
        default: gfx942
      rocm_arches:
        description: Semicolon-separated GPU architectures embedded in the wheel
        required: true
        type: string
        default: gfx90a;gfx942;gfx950;gfx1100;gfx1101;gfx1200;gfx1201;gfx1250
      test_rocm_arch:
        description: Concrete GPU architecture used for CI testing
        required: true
        type: string
        default: gfx942
      rocm_index_url:
        description: TheRock multi-arch Python package index
        required: true
        type: string
        default: https://rocm.prereleases.amd.com/whl-multi-arch/
      rocm_version:
        description: ROCm Python package version
        required: true
        type: string
        default: 7.14.0rc3
      torch_version:
        description: PyTorch version compatible with the LMCache revision
        required: true
        type: string
        default: 2.11.0+rocm7.14.0rc3
      lmcache_git_ref:
        description: LMCache branch, tag, or commit to build and test
        required: true
        type: string
        default: fa8d5e7f4afdd9450d814ea697c73a576d85d4bb
      publish_to_s3:
        description: Publish the tested wheel to S3
        required: true
        type: boolean
        default: false
      release_type:
        description: S3 release bucket type; developer runs must use dev
        required: true
        type: choice
        options:
          - dev
        default: dev

permissions:
  contents: read

run-name: Test multi-arch LMCache (${{ inputs.test_rocm_arch || 'gfx942' }}, py${{ inputs.python_version || '3.12' }})

jobs:
  build_wheel:
    name: Build LMCache wheel
    uses: ./.github/workflows/build_linux_lmcache_wheels.yml
    with:
      build_runs_on: ${{ inputs.build_runs_on || (github.repository_owner == 'ROCm' && 'azure-linux-scale-rocm' || 'ubuntu-24.04') }}
      python_version: ${{ inputs.python_version || '3.12' }}
      build_device_arch: ${{ inputs.build_device_arch || 'gfx942' }}
      rocm_arches: ${{ inputs.rocm_arches || 'gfx90a;gfx942;gfx950;gfx1100;gfx1101;gfx1200;gfx1201;gfx1250' }}
      rocm_index_url: ${{ inputs.rocm_index_url || 'https://rocm.prereleases.amd.com/whl-multi-arch/' }}
      rocm_version: ${{ inputs.rocm_version || '7.14.0rc3' }}
      torch_version: ${{ inputs.torch_version || '2.11.0+rocm7.14.0rc3' }}
      lmcache_git_ref: ${{ inputs.lmcache_git_ref || 'fa8d5e7f4afdd9450d814ea697c73a576d85d4bb' }}
      artifact_name: lmcache-wheel-multiarch-py${{ inputs.python_version || '3.12' }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || '' }}

  test_wheel:
    name: Test LMCache | ${{ inputs.test_rocm_arch || 'gfx942' }}
    needs: build_wheel
    runs-on: ${{ inputs.test_runs_on || 'linux-gfx942-1gpu-ccs-csp-ossci-rocm' }}
    timeout-minutes: 45
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:405945a40deaff9db90b9839c0f41d4cba4a383c1a7459b28627047bf6302a26
      options: >-
        --ipc host
        --device /dev/kfd
        --device /dev/dri
        --group-add render
        --group-add video
        --user root
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    defaults:
      run:
        shell: bash
    env:
      LMCACHE_GIT_REF: ${{ inputs.lmcache_git_ref || 'fa8d5e7f4afdd9450d814ea697c73a576d85d4bb' }}
      PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
      TEST_ROCM_ARCH: ${{ inputs.test_rocm_arch || 'gfx942' }}
      ROCM_INDEX_URL: ${{ inputs.rocm_index_url || 'https://rocm.prereleases.amd.com/whl-multi-arch/' }}
      TORCH_VERSION: ${{ inputs.torch_version || '2.11.0+rocm7.14.0rc3' }}
      VENV_DIR: .venv
      WHEEL_DIR: lmcache-wheels

    steps:
      - name: Checkout TheRock
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Checkout LMCache test sources
        run: |
          python external-builds/lmcache/lmcache_repo.py checkout \
            --repo-hashtag "${LMCACHE_GIT_REF}"

      - name: Download LMCache wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build_wheel.outputs.artifact_name }}
          path: ${{ env.WHEEL_DIR }}

      - name: Set up test environment
        run: |
          python -m venv "${VENV_DIR}"
          echo "${GITHUB_WORKSPACE}/${VENV_DIR}/bin" >> "${GITHUB_PATH}"
          "${VENV_DIR}/bin/python" -m pip install --upgrade pip
          "${VENV_DIR}/bin/python" -m pip install \
            --index-url "${ROCM_INDEX_URL}" \
            "torch[device-${TEST_ROCM_ARCH}]==${TORCH_VERSION}"
          "${VENV_DIR}/bin/python" -m pip install \
            "${WHEEL_DIR}"/lmcache-*.whl
          "${VENV_DIR}/bin/python" -m pip install \
            -r external-builds/lmcache/requirements-test.txt

      - name: Verify installed packages
        run: |
          python -m pip check
          python -m pip freeze
          python -c "import lmcache; print(lmcache.__file__)"

      - name: Runner health status
        run: |
          python build_tools/health_status.py

      - name: Run rocm-sdk sanity tests
        timeout-minutes: 5
        run: |
          rocm-sdk test

      - name: Run LMCache smoke test
        timeout-minutes: 10
        run: |
          python external-builds/lmcache/run_lmcache_smoke_test.py \
            --expected-arch "${TEST_ROCM_ARCH}"

      - name: Run LMCache GPU kernel tests
        timeout-minutes: 20
        run: |
          python -m pytest \
            external-builds/lmcache/lmcache/tests/v1/test_mp_mem_kernels.py \
            --import-mode=importlib \
            --log-cli-level=INFO \
            -v

  publish_wheel:
    name: Publish tested LMCache wheel to S3
    if: >-
      ${{
        !cancelled() &&
        needs.test_wheel.result == 'success' &&
        inputs.publish_to_s3 == true &&
        github.repository_owner == 'ROCm'
      }}
    needs: [build_wheel, test_wheel]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TYPE: ${{ inputs.release_type || 'dev' }}
      WHEEL_DIR: ${{ github.workspace }}/lmcache-wheels

    steps:
      - name: Checkout TheRock
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || '' }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python_version || '3.12' }}

      - name: Download tested LMCache wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build_wheel.outputs.artifact_name }}
          path: ${{ env.WHEEL_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-${{ env.RELEASE_TYPE }}

      - name: Install publication requirements
        run: |
          python -m pip install "boto3>=1.42.79,<1.42.85"

      - name: Publish tested wheel to multi-arch S3 index
        run: |
          python build_tools/github_actions/publish_lmcache_to_release_bucket.py \
            --source-dir="${WHEEL_DIR}" \
            --release-type="${RELEASE_TYPE}"
