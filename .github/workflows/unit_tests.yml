# Temporary manual validation branch for TheRock #8807 / #8505.
# Reuses the existing dispatchable unit_tests.yml workflow; no default-branch change.
name: DVC cache native Windows comparison (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        fixture: [oct12-batchnorm, oct06-sdpa]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install fetcher dependency
        run: python -m pip install "boto3>=1.42.79,<1.42.85"
      - name: Compare baseline and candidate
        env:
          REPLAY_FIXTURE: ${{ matrix.fixture }}
        run: >-
          python validation/dvc-cache-replay/replay.py
          --output results --fixture "$env:REPLAY_FIXTURE"
          --iterations 100 --jobs 12
      - name: Upload results and worker tracebacks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dvc-cache-comparison-${{ matrix.fixture }}
          path: |
            results/results.json
            results/**/result.json
            results/**/process.log
            results/**/pull.log
