# Temporary manual branch: locally generated files, no DVC/S3 transfers.
name: DVC cache fixed implementation validation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, aws-windows-scale-rocm-prod-mix]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            validation/dvc-cache-lite
            .github/workflows/unit_tests.yml
      - name: Check preinstalled native Python
        run: >-
          python -c "import sys; print(sys.version); assert sys.platform == 'win32' and sys.version_info >= (3, 10), 'Preinstalled native Python 3.10+ is required; no interpreter will be downloaded'"
      - name: Probe native file sharing
        continue-on-error: true
        run: >-
          python
          validation/dvc-cache-lite/windows_sharing_probe.py
          --output results/sharing-temp.json
      - name: Probe cache-volume file sharing
        continue-on-error: true
        run: >-
          python
          validation/dvc-cache-lite/windows_sharing_probe.py
          --directory "$env:USERPROFILE/.cache/therock-dvc"
          --output results/sharing-cache.json
      - name: Stress publication with small generated files
        run: >-
          python
          validation/dvc-cache-lite/publication_stress.py
          --directory "$env:USERPROFILE/.cache/therock-dvc"
          --output results/publication-stress.json --iterations 500 --workers 12
      - name: Verify exact fixed implementation
        run: >-
          python validation/dvc-cache-lite/verify_fixed.py
          --directory "$env:USERPROFILE/.cache/therock-dvc"
          --output results/fixed-verification.json
      - name: Check permanent regression against older publication implementations
        if: always()
        run: >-
          python validation/dvc-cache-lite/verify_publication_regression.py
          --output results/publication-regression.json
      - name: Upload small JSON results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dvc-cache-fixed-${{ matrix.runner }}
          path: results/*.json
