name: Unit Tests

on:
  push:
    branches:
      - main
      - release/therock-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    name: "Unit Tests :: ${{ matrix.runs-on}}"
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    env:
        GITHUB_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12

    - name: Install python deps
      run: pip install -r requirements-test.txt

    # Note: build_tools/github_actions/ contains complicated tests in some
    # subdirectories that do not support pytest:
    #   build_tools/github_actions/benchmarks/scripts/
    #   build_tools/github_actions/test_executable_scripts/
    # We could move them if we want a simple `pytest build_tools/` to work.
    - name: Test build_tools
      working-directory: build_tools
      run: |
        python -m pytest -vv --durations=20 \
          --cov --cov-report=term-missing --cov-report=html

    - name: Test scan_tools
      working-directory: build_tools/scan_tools
      run: python -m pytest -vv --durations=20

    - name: Test test_tools
      working-directory: test_tools
      run: python -m pytest -vv --durations=20

    # TODO: upload to AWS S3 instead (so reports are hosted and don't require
    #       a download step to view).
    #       We could also use https://about.codecov.io/ instead of custom infra.
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report-${{ matrix.runs-on }}
        path: build/coverage-html/

    # Report-only: statically parse the super-project CMake (no configure, no
    # submodules) and compare the generated graph to the committed one; the matrix
    # also exercises Windows. `continue-on-error` keeps it non-blocking (remove to
    # gate); the parity summary is echoed to the job summary so failures stay visible.
    - name: "Consumer graph parity (report-only)"
      continue-on-error: true
      run: |
        set +e
        PYTHONPATH=build_tools/consumer_graph python -m cmake_consumer_graph.cli \
          --therock-dir . \
          --output-dir build/consumer_graph_report
        status=$?
        {
          echo "### Consumer graph parity (report-only)"
          if [ -f build/consumer_graph_report/comparison.json ]; then
            echo '```json'
            python -c "import json, sys; json.dump(json.load(open('build/consumer_graph_report/comparison.json'))['summary'], sys.stdout, indent=2)"
            echo
            echo '```'
          else
            echo ":warning: no comparison.json produced — the parser step failed (exit ${status}). See logs."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        exit "${status}"

    - name: "Upload consumer graph parity report"
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: consumer-graph-parity-${{ matrix.runs-on }}
        path: build/consumer_graph_report/

    # Report-only: the real-tree enforcement tests (superset invariant + subtree
    # coverage) are opt-in via CONSUMER_GRAPH_ENFORCE so they never block an
    # unrelated PR. `continue-on-error` keeps them non-gating while still visible.
    - name: "Consumer graph enforcement tests (report-only)"
      continue-on-error: true
      working-directory: build_tools/consumer_graph
      env:
        CONSUMER_GRAPH_ENFORCE: "1"
      run: python -m pytest -vv tests/analyzer_test.py

  unit_tests_summary:
    name: Unit Tests Summary
    if: always()
    needs:
      - unit_tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
