name: rocSOLVER shard dispatcher smoke (01a19119)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-syntax:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: experiment
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          path: source
          persist-credentials: false
      - name: Check pinned base and candidate dispatcher syntax and coverage
        run: |
          test "$(git -C source rev-parse HEAD)" = 5b7cb88373362ab80dc0f19605915e534f4158aa
          git -C source ls-tree HEAD rocm-libraries
          c++ --version
          c++ -std=c++17 -O0 experiment/build_tools/perf_probe/shard_dispatch_smoke.cpp -o shard-smoke
          ./shard-smoke
          echo 'Host syntax/dispatch smoke only; HIP compile, GPU numerical correctness, performance unvalidated.'
