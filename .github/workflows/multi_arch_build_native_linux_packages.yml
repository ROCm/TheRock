name: Build Multi-Arch Native Linux Packages

on:
  workflow_call:
    inputs:
      performance_mode:
        type: string
        default: ''
      dist_amdgpu_families:
        description: "Semicolon-separated list of all GPU families (e.g., 'gfx94X-dcgpu;gfx120X-all')"
        required: true
        type: string
      artifact_run_id:
        description: "Workflow run id to download the artifacts from"
        required: false
        type: string
        default: ""
      rocm_version:
        description: "ROCm version to append to the package (8.0.0, 8.0.1rc1, ...)"
        required: true
        type: string
      native_package_type:
        description: "Package type (deb or rpm)"
        required: true
        type: string
      package_suffix:
        description: "The suffix to be added to package name (asan, tsan, static or rpath)"
        required: false
        type: string
        default: ""
      build_variant:
        description: "Build variant (e.g. 'asan', 'asan-debug', 'host-asan', 'host-asan-debug'). When it contains 'asan', changes the install prefix to DEFAULT_INSTALL_PREFIX-asan-MAJOR.MINOR (e.g. /opt/rocm/core-asan-7.15)."
        required: false
        type: string
        default: ""
      release_type:
        description: "Release type used for artifact storage and package publishing."
        required: false
        type: string
        default: ci
      repository:
        description: "Repository to checkout. Otherwise, defaults to `github.repository`"
        type: string
        required: false
      ref:
        description: "Branch, tag or SHA to checkout. Defaults to the reference or SHA that triggered the workflow"
        type: string
        required: false
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically by the
          top-level orchestrator to link this run to its release lineage. Do not
          set it manually.
        type: string
        default: ""
      build_runs_on:
        description: "Runner label for the build job"
        type: string
        required: false
        default: "aws-linux-scale-rocm-prod"
      enable_pre_upload_build_verify:
        description: >-
          After build_package.py, verify Created Packages listed in
          built_packages.txt exist under the packages directory.
        type: boolean
        default: true
      enable_repo_setup_package:
        description: "Build, verify and upload the amd-repo-setup package"
        type: boolean
        required: false
        default: false
    outputs:
      package_repository_url:
        description: "Public repository URL for package installation"
        value: ${{ jobs.build_native_packages.outputs.package_repository_url }}

permissions:
  contents: read
  actions: read

run-name: Build ${{ inputs.native_package_type }} packages (${{ inputs.rocm_version }}, ${{ inputs.dist_amdgpu_families }}${{ inputs.release_type && format(', {0}', inputs.release_type) || '' }})

jobs:
  # Resolve the parameters used to build and upload the amd-repo-setup package:
  # the OS-profile build matrix for this package type, each profile's container
  # image, and the repo.amd.com stream the build line configures, with its
  # tier, packages base URL, signing-key URL and build sub-folder.
  #
  # The build line and the stream are different vocabularies: prerelease
  # configures rc. release_type stays the workflow input because it also selects
  # the artifact bucket; the stream is derived from it.
  resolve_repo_setup_params:
    name: Resolve amd-repo-setup parameters
    # nightly and prerelease are the lines that upload the package. release
    # configures a stream too, but has no artifacts bucket to upload into.
    # Sanitizer variants skip: the resolved repository URL serves neither ASAN
    # packages (promoted under packages-asan) nor TSAN ones (not promoted).
    if: inputs.enable_repo_setup_package && contains(fromJSON('["nightly", "prerelease"]'), inputs.release_type) && !contains(inputs.build_variant, 'asan') && !contains(inputs.build_variant, 'tsan')
    runs-on: ${{ github.repository_owner == 'ROCm' && inputs.build_runs_on || 'ubuntu-26.04' }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:a13e8370a2d1d33a910e47669cdf075dbe9554685e78592f22935ec7c7c35e39
    # Resolves parameters only; it needs no cloud credentials.
    permissions:
      contents: read
      actions: read
    env:
      NATIVE_PACKAGE_TYPE: ${{ inputs.native_package_type }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
    outputs:
      os_profiles: ${{ steps.derive.outputs.os_profiles }}
      images: ${{ steps.derive.outputs.images }}
      stream: ${{ steps.derive.outputs.stream }}
      tier: ${{ steps.derive.outputs.tier }}
      repo_base_url: ${{ steps.derive.outputs.repo_base_url }}
      gpg_key_url: ${{ steps.derive.outputs.gpg_key_url }}
      repo_sub_folder: ${{ steps.derive.outputs.repo_sub_folder }}
    steps:
      - name: Checking out repository
        timeout-minutes: 15
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa

      - name: Checkout immutable experiment assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .perf-instrumentation

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python requirements
        run: pip install jinja2==3.1.6

      - name: Verify frozen source and record full-run context
        id: perf_context
        env:
          PERF_MODE: ${{ inputs.performance_mode }}
          PERF_CONTEXT_JSON: ${{ toJSON(inputs) }}
          PERF_MATRIX_JSON: ${{ toJSON(matrix) }}
          PERF_REQUESTED_RUNNER: ${{ inputs.build_runs_on || inputs.test_runs_on || '' }}
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py preflight --label resolve_repo_setup_params

      - name: Derive amd-repo-setup parameters
        id: derive
        run: |
          python ./build_tools/packaging/linux/get_url_repo_params.py get-repo-setup-params \
            --pkg-type "${NATIVE_PACKAGE_TYPE}" \
            --release-type "${RELEASE_TYPE}" \
            --run-id "${ARTIFACT_RUN_ID}"

      - name: Record final full-run provenance
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py finalize

      - name: Retain exact solver SDK identity for GPU consumers
        if: ${{ always() && inputs.stage_name == 'math-libs' && hashFiles('.perf-full/solver-sdk-identity.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-solver-identity-${{ inputs.performance_mode }}-${{ inputs.amdgpu_family }}
          path: .perf-full/solver-sdk-identity.json
          include-hidden-files: true
          retention-days: 14

      - name: Retain full-run investigation evidence
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.perf_context.outputs.artifact_name }}
          path: .perf-full
          include-hidden-files: true
          retention-days: 14
          compression-level: 1

  build_native_packages:
    permissions:
      contents: read
      actions: read
      id-token: write # Authenticate to AWS to upload package repositories.
    name: Build ${{ inputs.native_package_type }} packages
    runs-on: ${{ github.repository_owner == 'ROCm' && inputs.build_runs_on || 'ubuntu-26.04' }}
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:a13e8370a2d1d33a910e47669cdf075dbe9554685e78592f22935ec7c7c35e39
    outputs:
      package_repository_url: ${{ steps.upload-packages.outputs.package_repository_url }}
      summary: ${{ steps.summary.outputs.summary }}
    env:
      ROCM_VERSION: ${{ inputs.rocm_version }}
      BUILD_VARIANT: ${{ inputs.build_variant }}
      NATIVE_PACKAGE_TYPE: ${{ inputs.native_package_type }}
      QUARTZ_REPORTING_WORKFLOW: multi_arch_build_native_linux_packages.yml
      QUARTZ_WORKFLOW_POSTFIX: "- build rpm/deb packages"
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      DIST_AMDGPU_FAMILIES: ${{ inputs.dist_amdgpu_families }}
      PACKAGE_SUFFIX: ${{ inputs.package_suffix }}
      # Use relative paths to avoid host/container path mismatch
      OUTPUT_DIR: output
      ARTIFACTS_DIR: output/artifacts
      PACKAGE_DIST_DIR: output/packages
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - name: Checking out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa

      - name: Checkout immutable experiment assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .perf-instrumentation

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python requirements
        run: |
          pip install pyelftools==0.33 boto3==1.39.15 jinja2==3.1.6 pyzstd==0.19.1

      - name: Install System requirements
        run: |
          # Install the needed tools for creating rpm / deb packages
          # Also install tools for creating repo files
          sudo apt-get update
          sudo apt-get install -y llvm-20
          sudo apt-get install -y rpm debhelper-compat build-essential
          sudo apt-get install -y dpkg-dev createrepo-c
          sudo apt-get install -y patchelf

      - name: Verify frozen source and record full-run context
        id: perf_context
        env:
          PERF_MODE: ${{ inputs.performance_mode }}
          PERF_CONTEXT_JSON: ${{ toJSON(inputs) }}
          PERF_MATRIX_JSON: ${{ toJSON(matrix) }}
          PERF_REQUESTED_RUNNER: ${{ inputs.build_runs_on || inputs.test_runs_on || '' }}
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py preflight --label build_native_packages

      - name: Fetch Artifacts for all GPU families
        run: |
          # Use artifact_manager.py for consistent multi-arch artifact fetching
          # NOTE: artifact_manager.py appends /artifacts to --output-dir in non-flatten mode,
          # so we pass OUTPUT_DIR (parent) to have artifacts land in $OUTPUT_DIR/artifacts
          # which matches the ARTIFACTS_DIR environment variable
          python ./build_tools/artifact_manager.py fetch \
            --run-id="${ARTIFACT_RUN_ID}" \
            --stage=all \
            --amdgpu-families="${DIST_AMDGPU_FAMILIES}" \
            --expand-family-to-targets \
            --output-dir="${{ env.OUTPUT_DIR }}"

      - name: Build Packages
        id: build-packages
        run: |
          # GFX architectures are auto-detected from the artifact directory
          # (populated by --expand-family-to-targets in the fetch step).
          # KPACK_SPLIT_ARTIFACTS is auto-detected from therock_manifest.json.
          python ./build_tools/packaging/linux/build_package.py \
            --dest-dir "${{ env.PACKAGE_DIST_DIR }}" \
            --rocm-version "${ROCM_VERSION}" \
            --artifacts-dir "${{ env.ARTIFACTS_DIR }}" \
            --pkg-type "${NATIVE_PACKAGE_TYPE}" \
            --version-suffix "${ARTIFACT_RUN_ID}" \
            --build-variant "${BUILD_VARIANT}"

      # Presence check: Created Packages in built_packages.txt must exist on disk.
      # Blocking — failure skips simulate-install / upload.
      - name: Pre-upload build package verification
        if: ${{ inputs.enable_pre_upload_build_verify }}
        id: pre-upload-build-verify
        run: |
          python ./build_tools/packaging/linux/native_linux_package_pre_upload_test.py \
            --packages-dir "${{ env.PACKAGE_DIST_DIR }}" \
            --pkg-type "${NATIVE_PACKAGE_TYPE}"

      - name: Simulated install Test
        id: test-packages
        run: |
          python ./build_tools/packaging/linux/native_linux_package_install_test.py \
            --test-type simulate \
            --packages-dir "${{ env.PACKAGE_DIST_DIR }}" \
            --pkg-type "${NATIVE_PACKAGE_TYPE}"

      - name: Build Package repository
        run: |
          python ./build_tools/packaging/linux/build_package_repo.py \
            --pkg-type "${NATIVE_PACKAGE_TYPE}" \
            --package-dir "${{ env.PACKAGE_DIST_DIR }}" \
            --release-type "${RELEASE_TYPE}"

      - name: Configure AWS credentials for artifact uploads
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ${{ inputs.release_type }}

      - name: Guard CI-only run-scoped artifact destination
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py guard-ci --label 11

      - name: Upload Package repo to S3
        id: upload-packages
        run: |
          python ./build_tools/packaging/linux/upload_package_repo.py \
            --pkg-type "${NATIVE_PACKAGE_TYPE}" \
            --run-id "${ARTIFACT_RUN_ID}" \
            --package-dir "${{ env.PACKAGE_DIST_DIR }}"

      - name: Capture job summary
        id: summary
        if: always()
        run: python build_tools/github_actions/capture_job_summary.py

      - name: Record final full-run provenance
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py finalize

      - name: Retain exact solver SDK identity for GPU consumers
        if: ${{ always() && inputs.stage_name == 'math-libs' && hashFiles('.perf-full/solver-sdk-identity.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-solver-identity-${{ inputs.performance_mode }}-${{ inputs.amdgpu_family }}
          path: .perf-full/solver-sdk-identity.json
          include-hidden-files: true
          retention-days: 14

      - name: Retain full-run investigation evidence
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.perf_context.outputs.artifact_name }}
          path: .perf-full
          include-hidden-files: true
          retention-days: 14
          compression-level: 1

  stage_repo_setup_package:
    name: Stage amd-repo-setup (${{ matrix.os_profile }})
    needs: [resolve_repo_setup_params]
    if: inputs.enable_repo_setup_package && needs.resolve_repo_setup_params.outputs.repo_base_url != ''
    strategy:
      fail-fast: false
      matrix:
        # resolve_repo_setup_params does not run on the lines that do not upload, and a
        # skipped job's outputs are empty strings, which fromJSON cannot parse.
        # Fall back to an empty matrix so this job skips cleanly.
        os_profile: ${{ fromJSON(needs.resolve_repo_setup_params.outputs.os_profiles || '[]') }}
    runs-on: ${{ github.repository_owner == 'ROCm' && inputs.build_runs_on || 'ubuntu-26.04' }}
    permissions:
      contents: read
      actions: read
      id-token: write # Authenticate to AWS to upload the amd-repo-setup package.
    container:
      # get_url_repo_params.py manages image references for each OS profile.
      # zizmor cannot inspect the dynamically selected image.
      image: ${{ fromJSON(needs.resolve_repo_setup_params.outputs.images || '{}')[matrix.os_profile] }} # zizmor: ignore[unpinned-images]
    env:
      ROCM_VERSION: ${{ inputs.rocm_version }}
      NATIVE_PACKAGE_TYPE: ${{ inputs.native_package_type }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      OS_PROFILE: ${{ matrix.os_profile }}
      STREAM: ${{ needs.resolve_repo_setup_params.outputs.stream }}
      TIER: ${{ needs.resolve_repo_setup_params.outputs.tier }}
      REPO_BASE_URL: ${{ needs.resolve_repo_setup_params.outputs.repo_base_url }}
      GPG_KEY_URL: ${{ needs.resolve_repo_setup_params.outputs.gpg_key_url }}
      REPO_SUB_FOLDER: ${{ needs.resolve_repo_setup_params.outputs.repo_sub_folder }}
    steps:
      - name: Checkout
        timeout-minutes: 15
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa

      - name: Checkout immutable experiment assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .perf-instrumentation

      - name: Install system prerequisites
        run: |
          bash build_tools/packaging/linux/setup_repo_build_deps.sh \
            --os-profile "${OS_PROFILE}"

      - name: Setup Python
        run: |
          bash build_tools/packaging/linux/setup_python_cmd.sh \
            --os-profile "${OS_PROFILE}" \
            --install-runtime \
            --output-format github

      - name: Install Python dependencies
        run: |
          $PYTHON_CMD -m venv /tmp/repo-venv
          /tmp/repo-venv/bin/python -m pip install --upgrade pip
          /tmp/repo-venv/bin/python -m pip install jinja2==3.1.6 boto3==1.39.15
          echo "PYTHON_CMD=/tmp/repo-venv/bin/python" >> "$GITHUB_ENV"
          # configure_aws_artifacts_credentials runs bare `python`, which these
          # per-distro images do not provide. A venv always does, so putting its
          # bin/ on PATH lets the credentials action run here and the package
          # upload from the job that built it.
          echo "/tmp/repo-venv/bin" >> "$GITHUB_PATH"

      - name: Verify frozen source and record full-run context
        id: perf_context
        env:
          PERF_MODE: ${{ inputs.performance_mode }}
          PERF_CONTEXT_JSON: ${{ toJSON(inputs) }}
          PERF_MATRIX_JSON: ${{ toJSON(matrix) }}
          PERF_REQUESTED_RUNNER: ${{ inputs.build_runs_on || inputs.test_runs_on || '' }}
        run: |
          "${PYTHON_CMD:-python3}" .perf-instrumentation/build_tools/perf_full/full_probe.py preflight --label stage_repo_setup_package

      - name: Build amd-repo-setup
        run: |
          # The build sub-folder is empty except on a per-build stream, which is
          # the only kind the builder accepts one for. The key URL is empty on an
          # unsigned stream, where the builder needs none.
          $PYTHON_CMD build_tools/packaging/linux/build_repo_setup_package.py \
            --os-profile "${OS_PROFILE}" \
            --stream "${STREAM}" \
            --repo-base-url "${REPO_BASE_URL}" \
            --gpg-key-url "${GPG_KEY_URL}" \
            --repo-sub-folder "${REPO_SUB_FOLDER}" \
            --rocm-version "${ROCM_VERSION}" \
            --dest-dir repo-setup-package-out \
            --verify-repo-url

      # Check the package before it is uploaded: the repository file for this
      # stream (and, on a signed stream, the key) at the expected paths, nothing
      # it must not ship, and everything owned by root.
      - name: Inspect amd-repo-setup
        run: |
          $PYTHON_CMD build_tools/packaging/linux/inspect_repo_setup_package.py \
            --package-dir repo-setup-package-out \
            --os-profile "${OS_PROFILE}" \
            --stream "${STREAM}"

      # Configured after the build so the key fetch, the repository check and
      # the package build run without artifacts-bucket credentials.
      - name: Configure AWS credentials for artifact uploads
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ${{ inputs.release_type }}

      - name: Guard CI-only run-scoped artifact destination
        run: |
          "${PYTHON_CMD:-python3}" .perf-instrumentation/build_tools/perf_full/full_probe.py guard-ci --label 8

      - name: Upload amd-repo-setup
        id: upload-repo-setup-package
        run: |
          $PYTHON_CMD build_tools/packaging/linux/upload_repo_setup_package.py \
            --dest-dir repo-setup-package-out \
            --tier "${TIER}" \
            --run-id "${ARTIFACT_RUN_ID}" \
            --os-profile "${OS_PROFILE}" \
            --pkg-type "${NATIVE_PACKAGE_TYPE}"

  # Report the amd-repo-setup jobs' result to Quartz. resolve_repo_setup_params reports
  # their start, so this runs only when that job ran.
      - name: Record final full-run provenance
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        run: |
          "${PYTHON_CMD:-python3}" .perf-instrumentation/build_tools/perf_full/full_probe.py finalize

      - name: Retain exact solver SDK identity for GPU consumers
        if: ${{ always() && inputs.stage_name == 'math-libs' && hashFiles('.perf-full/solver-sdk-identity.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-solver-identity-${{ inputs.performance_mode }}-${{ inputs.amdgpu_family }}
          path: .perf-full/solver-sdk-identity.json
          include-hidden-files: true
          retention-days: 14

      - name: Retain full-run investigation evidence
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.perf_context.outputs.artifact_name }}
          path: .perf-full
          include-hidden-files: true
          retention-days: 14
          compression-level: 1

