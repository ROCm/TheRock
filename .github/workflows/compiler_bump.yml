# SPDX-License-Identifier: MIT

# This workflow automates the compiler team's daily branch creation and testing.
#
# It replaces the Jenkins pipeline that:
# 1. Creates a branch `amd-compiler-YYYY-MM-DD[-suffix]` in TheRock
# 2. Updates compiler submodules (amd-llvm, hipify, spirv-llvm-translator) to amd-staging HEAD
# 3. Builds for ALL architectures but only tests on gfx94x (Linux) and gfx110x (Windows)
# 4. Publishes artifacts to release buckets for downstream teams
#
# Key difference from multi_arch_release.yml:
# - Builds ALL architectures (release + ASAN)
# - Tests only gfx94x/gfx950/gfx1151 (Linux) and gfx110x (Windows) with quick test type
# - ASAN build dispatched separately via workflow_dispatch

# Notes on security:
#   * Higher-trust entry point: manually triggered by maintainers.
#   * Inherit secrets to avoid repeating mappings across nested workflows.

name: Compiler Daily Bump

on:
  schedule:
    # Run daily at 1:30 AM ET (5:30 AM UTC, or 6:30 AM UTC during DST)
    # Using 5:30 AM UTC which is 1:30 AM ET during standard time
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      branch_suffix:
        description: 'Optional suffix for branch name (e.g., "COT", "SMP"). Branch will be: amd-compiler-YYYY-MM-DD[-suffix]'
        type: string
        default: "COT"
      llvm_ref:
        description: 'llvm-project ref (branch/tag/SHA). Default: amd-staging HEAD'
        type: string
        default: "amd-staging"
      hipify_ref:
        description: 'HIPIFY ref (branch/tag/SHA). Default: amd-staging HEAD'
        type: string
        default: "amd-staging"
      spirv_ref:
        description: 'SPIRV-LLVM-Translator ref (branch/tag/SHA). Default: amd-staging HEAD'
        type: string
        default: "amd-staging"
      build_only:
        description: 'Build only - skip test triggers (still produces artifacts)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run - create branch but do not trigger builds'
        type: boolean
        default: false
      linux_amdgpu_families:
        description: 'Linux GPU families to build (comma-separated, or "all"/"none")'
        type: string
        default: "all"
      windows_amdgpu_families:
        description: 'Windows GPU families to build (comma-separated, or "all"/"none")'
        type: string
        default: "all"

permissions:
  contents: read

run-name: >-
  Compiler Bump (${{ inputs.branch_suffix || 'COT' }})
  ${{ inputs.build_only && '| Build Only' || '' }}
  | Linux: ${{ inputs.linux_amdgpu_families || 'all' }}
  | Windows: ${{ inputs.windows_amdgpu_families || 'all' }}

jobs:
  # ==========================================================================
  # Phase 1: Create branch with bumped compiler submodules
  # ==========================================================================
  create-branch:
    permissions:
      contents: write # Push the compiler bump branch.
    name: Create compiler bump branch
    runs-on: ubuntu-24.04
    outputs:
      branch_name: ${{ steps.create-branch.outputs.branch_name }}
    steps:
      - name: Generate branch name
        id: branch-name
        env:
          BRANCH_SUFFIX: ${{ inputs.branch_suffix || 'COT' }}
        run: |
          DATE=$(date +%Y-%-m-%-d)
          if [ -n "${BRANCH_SUFFIX}" ]; then
            BRANCH_NAME="amd-compiler-${DATE}-${BRANCH_SUFFIX}"
          else
            BRANCH_NAME="amd-compiler-${DATE}"
          fi
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "## Branch Name" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${BRANCH_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout TheRock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          # Retain GITHUB_TOKEN for the "Create and push branch" step below.
          persist-credentials: true
          fetch-depth: 0

      - name: Initialize compiler submodules
        run: |
          git submodule init compiler/amd-llvm compiler/hipify compiler/spirv-llvm-translator
          git submodule update --depth=1 compiler/amd-llvm compiler/hipify compiler/spirv-llvm-translator

      - name: Update submodules to specified refs
        id: update-submodules
        env:
          LLVM_REF: ${{ inputs.llvm_ref || 'amd-staging' }}
          HIPIFY_REF: ${{ inputs.hipify_ref || 'amd-staging' }}
          SPIRV_REF: ${{ inputs.spirv_ref || 'amd-staging' }}
        run: |
          set -e

          echo "## Submodule Updates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Ref | SHA |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-----|-----|" >> "$GITHUB_STEP_SUMMARY"

          # Update llvm-project
          cd compiler/amd-llvm
          git fetch origin "${LLVM_REF}"
          git checkout FETCH_HEAD
          LLVM_SHA=$(git rev-parse HEAD)
          echo "| llvm-project | ${LLVM_REF} | \`${LLVM_SHA:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
          cd ../..

          # Update HIPIFY
          cd compiler/hipify
          git fetch origin "${HIPIFY_REF}"
          git checkout FETCH_HEAD
          HIPIFY_SHA=$(git rev-parse HEAD)
          echo "| HIPIFY | ${HIPIFY_REF} | \`${HIPIFY_SHA:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
          cd ../..

          # Update SPIRV-LLVM-Translator
          cd compiler/spirv-llvm-translator
          git fetch origin "${SPIRV_REF}"
          git checkout FETCH_HEAD
          SPIRV_SHA=$(git rev-parse HEAD)
          echo "| SPIRV-LLVM-Translator | ${SPIRV_REF} | \`${SPIRV_SHA:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
          cd ../..

      # git push uses GITHUB_TOKEN persisted by "Checkout TheRock".
      - name: Create and push branch
        id: create-branch
        env:
          LLVM_REF: ${{ inputs.llvm_ref || 'amd-staging' }}
          HIPIFY_REF: ${{ inputs.hipify_ref || 'amd-staging' }}
          SPIRV_REF: ${{ inputs.spirv_ref || 'amd-staging' }}
          BRANCH_NAME: ${{ steps.branch-name.outputs.branch_name }}
        run: |
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH_NAME}"
          git add compiler/amd-llvm compiler/hipify compiler/spirv-llvm-translator

          if git diff --cached --quiet; then
            echo "No submodule changes detected"
            echo "> **Note:** No submodule changes - already at specified refs" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "${BRANCH_NAME}

          Compiler submodule bump:
          - llvm-project: ${LLVM_REF}
          - HIPIFY: ${HIPIFY_REF}
          - SPIRV-LLVM-Translator: ${SPIRV_REF}"
          fi

          git push origin "${BRANCH_NAME}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch pushed: [\`${BRANCH_NAME}\`](https://github.com/${{ github.repository }}/tree/${BRANCH_NAME})" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Phase 2: Build, package, and test via multi_arch_ci
  # ==========================================================================
  release-ci:
    needs: create-branch
    if: ${{ inputs.dry_run != true }}
    uses: ./.github/workflows/multi_arch_ci.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || 'all' }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families || 'all' }}
      pr_labels: >-
        test_filter:quick${{
          inputs.build_only == true && ',ci:skip-tests' || ''
        }}
      build_python_packages: true
      build_pytorch: true
      build_jax: true
      build_native_linux: true
    permissions:
      contents: read
      actions: read
      id-token: write

  # ==========================================================================
  # Phase 3: ASAN build (dispatched separately via workflow_dispatch)
  # ==========================================================================
  dispatch-asan-build:
    permissions:
      actions: write # Dispatch downstream workflows.
    name: Dispatch ASAN Build
    needs: create-branch
    if: ${{ inputs.dry_run != true && (inputs.linux_amdgpu_families || 'all') != 'none' }}
    runs-on: ubuntu-24.04
    outputs:
      run_url: ${{ steps.dispatch.outputs.runUrlHtml }}
    steps:
      - name: Dispatch multi_arch_ci_asan
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: multi_arch_ci_asan.yml
          ref: ${{ needs.create-branch.outputs.branch_name }}
          inputs: |
            {
              "linux_amdgpu_families": "${{ inputs.linux_amdgpu_families || 'all' }}"
            }

      - name: Output ASAN run URL
        env:
          ASAN_URL: ${{ steps.dispatch.outputs.runUrlHtml }}
        run: |
          echo "## ASAN Build Dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run URL:** ${ASAN_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "ASAN build runs as a separate workflow to ensure artifacts are stored"
          echo "under a unique run_id, preventing mixing with release artifacts."

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Summary
    needs:
      - create-branch
      - release-ci
      - dispatch-asan-build
    if: always()
    runs-on: ubuntu-24.04
    env:
      LLVM_REF: ${{ inputs.llvm_ref || 'amd-staging' }}
      HIPIFY_REF: ${{ inputs.hipify_ref || 'amd-staging' }}
      SPIRV_REF: ${{ inputs.spirv_ref || 'amd-staging' }}

    steps:
      - name: Generate summary
        env:
          ASAN_URL: ${{ needs.dispatch-asan-build.outputs.run_url }}
          BRANCH_NAME: ${{ needs.create-branch.outputs.branch_name }}
        run: |
          echo "## Workflow Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Branch
          if [ "${{ needs.create-branch.result }}" == "success" ]; then
            echo "- :white_check_mark: Branch: [\`${BRANCH_NAME}\`](https://github.com/${{ github.repository }}/tree/${BRANCH_NAME})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: Branch creation failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Release CI (Build + Package + Test)" >> "$GITHUB_STEP_SUMMARY"

          # Release CI
          if [ "${{ needs.release-ci.result }}" == "success" ]; then
            echo "- :white_check_mark: Multi-arch CI completed successfully" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.release-ci.result }}" == "failure" ]; then
            echo "- :x: Multi-arch CI failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.release-ci.result }}" == "skipped" ]; then
            echo "- :fast_forward: Multi-arch CI skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ASAN" >> "$GITHUB_STEP_SUMMARY"

          # ASAN build (dispatched as separate workflow)
          if [ "${{ needs.dispatch-asan-build.result }}" == "success" ]; then
            if [ -n "$ASAN_URL" ]; then
              echo "- :white_check_mark: ASAN Build dispatched: [View Run]($ASAN_URL)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- :white_check_mark: ASAN Build dispatched" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${{ needs.dispatch-asan-build.result }}" == "failure" ]; then
            echo "- :x: ASAN Build dispatch failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.dispatch-asan-build.result }}" == "skipped" ]; then
            echo "- :fast_forward: ASAN Build skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Dry run note
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Dry Run:** Branch was created but no builds were triggered." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Build only note
          if [ "${{ inputs.build_only }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Build Only:** Tests were skipped as requested." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Config
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Filter | \`quick\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Only | \`${{ inputs.build_only || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linux Families | \`${{ inputs.linux_amdgpu_families || 'all' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Windows Families | \`${{ inputs.windows_amdgpu_families || 'all' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| llvm-project | \`${LLVM_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HIPIFY | \`${HIPIFY_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SPIRV-LLVM-Translator | \`${SPIRV_REF}\` |" >> "$GITHUB_STEP_SUMMARY"
