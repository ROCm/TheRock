# Copyright Advanced Micro Devices, Inc.
# SPDX-License-Identifier: MIT

# This workflow automates the compiler team's daily branch creation and testing.
#
# It replaces the Jenkins pipeline that:
# 1. Creates a branch `amd-compiler-YYYY-MM-DD[-suffix]` in TheRock
# 2. Updates compiler submodules (amd-llvm, hipify, spirv-llvm-translator) to amd-staging HEAD
# 3. Builds for ALL architectures but only tests on gfx94x (Linux) and gfx110x (Windows)
# 4. Publishes artifacts to release buckets for downstream teams
#
# Key difference from multi_arch_release.yml:
# - Builds ALL architectures (release + ASAN)
# - Tests only gfx94x (Linux) and gfx110x (Windows) with quick/standard test type
# - No ASAN tests (build only for downstream consumption)
#
# Architecture note:
# This workflow dispatches builds as SEPARATE workflow runs to ensure each build
# variant (release vs ASAN) gets its own run_id and thus its own S3 artifact path.
# This prevents artifact mixing and keeps tarballs at expected sizes (~5GB not 30GB).

name: Compiler Daily Bump

on:
  workflow_dispatch:
    inputs:
      branch_suffix:
        description: 'Optional suffix for branch name (e.g., "COT", "SMP"). Branch will be: amd-compiler-YYYY-MM-DD[-suffix]'
        type: string
        default: "COT"
      llvm_ref:
        description: 'llvm-project ref (branch/tag/SHA). Default: amd-staging HEAD'
        type: string
        default: "amd-staging"
      hipify_ref:
        description: 'HIPIFY ref (branch/tag/SHA). Default: amd-staging HEAD'
        type: string
        default: "amd-staging"
      spirv_ref:
        description: 'SPIRV-LLVM-Translator ref (branch/tag/SHA). Default: amd-staging HEAD'
        type: string
        default: "amd-staging"
      test_type:
        description: 'Test type'
        type: choice
        options:
          - quick
          - standard
        default: "quick"
      build_only:
        description: 'Build only - skip test triggers (still produces artifacts)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run - create branch but do not trigger builds'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  id-token: write

run-name: >-
  Compiler Bump (${{ inputs.branch_suffix || 'COT' }})
  | Test: ${{ inputs.test_type || 'quick' }}
  ${{ inputs.build_only && '| Build Only' || '' }}

jobs:
  # ==========================================================================
  # Phase 1: Create branch with bumped compiler submodules
  # ==========================================================================
  create-branch:
    name: Create compiler bump branch
    runs-on: ubuntu-24.04
    outputs:
      branch_name: ${{ steps.create-branch.outputs.branch_name }}
    steps:
      - name: Generate branch name
        id: branch-name
        env:
          BRANCH_SUFFIX: ${{ inputs.branch_suffix || 'COT' }}
        run: |
          DATE=$(date +%Y-%-m-%-d)
          if [ -n "${BRANCH_SUFFIX}" ]; then
            BRANCH_NAME="amd-compiler-${DATE}-${BRANCH_SUFFIX}"
          else
            BRANCH_NAME="amd-compiler-${DATE}"
          fi
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "## Branch Name" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${BRANCH_NAME}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout TheRock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          fetch-depth: 0

      - name: Initialize compiler submodules
        run: |
          git submodule init compiler/amd-llvm compiler/hipify compiler/spirv-llvm-translator
          git submodule update --depth=1 compiler/amd-llvm compiler/hipify compiler/spirv-llvm-translator

      - name: Update submodules to specified refs
        id: update-submodules
        env:
          LLVM_REF: ${{ inputs.llvm_ref || 'amd-staging' }}
          HIPIFY_REF: ${{ inputs.hipify_ref || 'amd-staging' }}
          SPIRV_REF: ${{ inputs.spirv_ref || 'amd-staging' }}
        run: |
          set -e

          echo "## Submodule Updates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Ref | SHA |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-----|-----|" >> "$GITHUB_STEP_SUMMARY"

          # Update llvm-project
          cd compiler/amd-llvm
          git fetch origin "${LLVM_REF}"
          git checkout FETCH_HEAD
          LLVM_SHA=$(git rev-parse HEAD)
          echo "| llvm-project | ${LLVM_REF} | \`${LLVM_SHA:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
          cd ../..

          # Update HIPIFY
          cd compiler/hipify
          git fetch origin "${HIPIFY_REF}"
          git checkout FETCH_HEAD
          HIPIFY_SHA=$(git rev-parse HEAD)
          echo "| HIPIFY | ${HIPIFY_REF} | \`${HIPIFY_SHA:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
          cd ../..

          # Update SPIRV-LLVM-Translator
          cd compiler/spirv-llvm-translator
          git fetch origin "${SPIRV_REF}"
          git checkout FETCH_HEAD
          SPIRV_SHA=$(git rev-parse HEAD)
          echo "| SPIRV-LLVM-Translator | ${SPIRV_REF} | \`${SPIRV_SHA:0:12}\` |" >> "$GITHUB_STEP_SUMMARY"
          cd ../..

      - name: Create and push branch
        id: create-branch
        env:
          LLVM_REF: ${{ inputs.llvm_ref || 'amd-staging' }}
          HIPIFY_REF: ${{ inputs.hipify_ref || 'amd-staging' }}
          SPIRV_REF: ${{ inputs.spirv_ref || 'amd-staging' }}
        run: |
          BRANCH_NAME="${{ steps.branch-name.outputs.branch_name }}"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH_NAME}"
          git add compiler/amd-llvm compiler/hipify compiler/spirv-llvm-translator

          if git diff --cached --quiet; then
            echo "No submodule changes detected"
            echo "> **Note:** No submodule changes - already at specified refs" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "${BRANCH_NAME}

          Compiler submodule bump:
          - llvm-project: ${LLVM_REF}
          - HIPIFY: ${HIPIFY_REF}
          - SPIRV-LLVM-Translator: ${SPIRV_REF}"
          fi

          git push origin "${BRANCH_NAME}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch pushed: [\`${BRANCH_NAME}\`](https://github.com/${{ github.repository }}/tree/${BRANCH_NAME})" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Phase 2 - Setup: Generate build configurations
  # ==========================================================================
  setup-linux:
    name: Setup Linux Release
    needs: create-branch
    if: ${{ inputs.dry_run != true }}
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "release"
      release_type: dev
      linux_amdgpu_families: "all"
      windows_amdgpu_families: "none"
      build_pytorch: true
      build_jax: true
      repository: ${{ github.repository }}
      ref: ${{ needs.create-branch.outputs.branch_name }}
    secrets: inherit

  setup-windows:
    name: Setup Windows Release
    needs: create-branch
    if: ${{ inputs.dry_run != true }}
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "release"
      release_type: dev
      linux_amdgpu_families: "none"
      windows_amdgpu_families: "all"
      build_pytorch: false
      build_jax: false
      repository: ${{ github.repository }}
      ref: ${{ needs.create-branch.outputs.branch_name }}
    secrets: inherit

  setup-asan:
    name: Setup ASAN Build
    needs: create-branch
    if: ${{ inputs.dry_run != true }}
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "asan-debug"
      release_type: dev
      linux_amdgpu_families: "all"
      windows_amdgpu_families: "none"
      build_pytorch: false
      build_jax: false
      repository: ${{ github.repository }}
      ref: ${{ needs.create-branch.outputs.branch_name }}
    secrets: inherit

  # ==========================================================================
  # Phase 2 - Linux Release: Dispatch build, then package/publish
  # ==========================================================================
  dispatch-linux-release-build:
    name: Dispatch Linux Release Build
    needs: [create-branch, setup-linux]
    if: ${{ inputs.dry_run != true && needs.setup-linux.outputs.linux_build_config != '' }}
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.wait.outputs.run_id }}
      run_url: ${{ steps.dispatch.outputs.runUrlHtml }}
    steps:
      - name: Dispatch Linux Release Build
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: multi_arch_build_portable_linux_dispatch.yml
          ref: ${{ needs.create-branch.outputs.branch_name }}
          inputs: |
            {
              "matrix_per_family_json": ${{ toJSON(toJSON(fromJSON(needs.setup-linux.outputs.linux_build_config).per_family_info)) }},
              "dist_amdgpu_families": "${{ fromJSON(needs.setup-linux.outputs.linux_build_config).dist_amdgpu_families }}",
              "artifact_group": "${{ fromJSON(needs.setup-linux.outputs.linux_build_config).artifact_group }}",
              "build_variant_label": "${{ fromJSON(needs.setup-linux.outputs.linux_build_config).build_variant_label }}",
              "build_variant_cmake_preset": "${{ fromJSON(needs.setup-linux.outputs.linux_build_config).build_variant_cmake_preset }}",
              "build_variant_suffix": "${{ fromJSON(needs.setup-linux.outputs.linux_build_config).build_variant_suffix }}",
              "build_runs_on": "${{ fromJSON(needs.setup-linux.outputs.linux_build_config).build_runs_on }}",
              "rocm_package_version": "${{ needs.setup-linux.outputs.rocm_package_version }}",
              "release_type": "dev",
              "repository": "${{ github.repository }}",
              "ref": "${{ needs.create-branch.outputs.branch_name }}"
            }

      - name: Wait for Linux Release Build
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ steps.dispatch.outputs.runUrlHtml }}"
          # Extract run ID from URL (format: .../actions/runs/12345678)
          RUN_ID=$(echo "$RUN_URL" | grep -oP 'runs/\K[0-9]+')
          echo "Waiting for run $RUN_ID to complete..."
          echo "Run URL: $RUN_URL"

          # Poll until complete (check every 60 seconds)
          while true; do
            STATUS=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json status,conclusion -q '.status')
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion -q '.conclusion')
              echo "Run completed with conclusion: $CONCLUSION"
              if [ "$CONCLUSION" != "success" ]; then
                echo "::error::Linux Release Build failed with conclusion: $CONCLUSION"
                exit 1
              fi
              break
            fi
            echo "Status: $STATUS - waiting 60s..."
            sleep 60
          done

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "## Linux Release Build" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run ID:** \`$RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run URL:** $RUN_URL" >> "$GITHUB_STEP_SUMMARY"

  build-linux-tarballs:
    name: Build Linux Tarballs
    needs: [create-branch, setup-linux, dispatch-linux-release-build]
    if: ${{ inputs.dry_run != true && needs.dispatch-linux-release-build.result == 'success' }}
    uses: ./.github/workflows/multi_arch_build_tarballs.yml
    secrets: inherit
    with:
      artifact_run_id: ${{ needs.dispatch-linux-release-build.outputs.run_id }}
      dist_amdgpu_families: ${{ fromJSON(needs.setup-linux.outputs.linux_build_config).dist_amdgpu_families }}
      platform: linux
      package_version: ${{ needs.setup-linux.outputs.rocm_package_version }}
      release_type: dev
      repository: ${{ github.repository }}
      ref: ${{ needs.setup-linux.outputs.ref }}

  build-linux-python-packages:
    name: Build Linux Python Packages
    needs: [create-branch, setup-linux, dispatch-linux-release-build]
    if: ${{ inputs.dry_run != true && needs.dispatch-linux-release-build.result == 'success' }}
    uses: ./.github/workflows/build_portable_linux_python_packages.yml
    secrets: inherit
    with:
      artifact_run_id: ${{ needs.dispatch-linux-release-build.outputs.run_id }}
      artifact_group: ${{ fromJSON(needs.setup-linux.outputs.linux_build_config).artifact_group }}
      amdgpu_families: ${{ fromJSON(needs.setup-linux.outputs.linux_build_config).dist_amdgpu_families }}
      linux_amdgpu_families: ${{ fromJSON(needs.setup-linux.outputs.linux_build_config).linux_amdgpu_families }}
      windows_amdgpu_families: ${{ fromJSON(needs.setup-linux.outputs.linux_build_config).windows_amdgpu_families }}
      multiarch_index: true
      package_version: ${{ needs.setup-linux.outputs.rocm_package_version }}
      release_type: dev
      repository: ${{ github.repository }}
      ref: ${{ needs.setup-linux.outputs.ref }}

  publish-linux-artifacts:
    name: Publish Linux Artifacts
    needs: [create-branch, setup-linux, dispatch-linux-release-build, build-linux-tarballs, build-linux-python-packages]
    if: ${{ inputs.dry_run != true && needs.build-linux-tarballs.result == 'success' && needs.build-linux-python-packages.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          ref: ${{ needs.setup-linux.outputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure_aws_product_publication_credentials
        with:
          release_type: dev
          product: core

      - name: Publish to release buckets
        run: |
          python build_tools/github_actions/publish_rocm_to_release_buckets.py \
            --run-id="${{ needs.dispatch-linux-release-build.outputs.run_id }}" \
            --platform=linux \
            --release-type="dev" \
            --kpack-split="${{ needs.build-linux-python-packages.outputs.kpack_split }}" \
            --structured \
            --build-variant="release"

  # ==========================================================================
  # Phase 2 - Windows Release: Dispatch build, then package/publish
  # ==========================================================================
  dispatch-windows-release-build:
    name: Dispatch Windows Release Build
    needs: [create-branch, setup-windows]
    if: ${{ inputs.dry_run != true && needs.setup-windows.outputs.windows_build_config != '' }}
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.wait.outputs.run_id }}
      run_url: ${{ steps.dispatch.outputs.runUrlHtml }}
    steps:
      - name: Dispatch Windows Release Build
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: multi_arch_build_windows_dispatch.yml
          ref: ${{ needs.create-branch.outputs.branch_name }}
          inputs: |
            {
              "matrix_per_family_json": ${{ toJSON(toJSON(fromJSON(needs.setup-windows.outputs.windows_build_config).per_family_info)) }},
              "dist_amdgpu_families": "${{ fromJSON(needs.setup-windows.outputs.windows_build_config).dist_amdgpu_families }}",
              "artifact_group": "${{ fromJSON(needs.setup-windows.outputs.windows_build_config).artifact_group }}",
              "build_variant_label": "${{ fromJSON(needs.setup-windows.outputs.windows_build_config).build_variant_label }}",
              "build_variant_cmake_preset": "${{ fromJSON(needs.setup-windows.outputs.windows_build_config).build_variant_cmake_preset }}",
              "build_variant_suffix": "${{ fromJSON(needs.setup-windows.outputs.windows_build_config).build_variant_suffix }}",
              "build_runs_on": "${{ fromJSON(needs.setup-windows.outputs.windows_build_config).build_runs_on }}",
              "rocm_package_version": "${{ needs.setup-windows.outputs.rocm_package_version }}",
              "release_type": "dev",
              "repository": "${{ github.repository }}",
              "ref": "${{ needs.create-branch.outputs.branch_name }}"
            }

      - name: Wait for Windows Release Build
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ steps.dispatch.outputs.runUrlHtml }}"
          # Extract run ID from URL (format: .../actions/runs/12345678)
          RUN_ID=$(echo "$RUN_URL" | grep -oP 'runs/\K[0-9]+')
          echo "Waiting for run $RUN_ID to complete..."
          echo "Run URL: $RUN_URL"

          # Poll until complete (check every 60 seconds)
          while true; do
            STATUS=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json status,conclusion -q '.status')
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion -q '.conclusion')
              echo "Run completed with conclusion: $CONCLUSION"
              if [ "$CONCLUSION" != "success" ]; then
                echo "::error::Windows Release Build failed with conclusion: $CONCLUSION"
                exit 1
              fi
              break
            fi
            echo "Status: $STATUS - waiting 60s..."
            sleep 60
          done

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "## Windows Release Build" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run ID:** \`$RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run URL:** $RUN_URL" >> "$GITHUB_STEP_SUMMARY"

  build-windows-tarballs:
    name: Build Windows Tarballs
    needs: [create-branch, setup-windows, dispatch-windows-release-build]
    if: ${{ inputs.dry_run != true && needs.dispatch-windows-release-build.result == 'success' }}
    uses: ./.github/workflows/multi_arch_build_tarballs.yml
    secrets: inherit
    with:
      artifact_run_id: ${{ needs.dispatch-windows-release-build.outputs.run_id }}
      dist_amdgpu_families: ${{ fromJSON(needs.setup-windows.outputs.windows_build_config).dist_amdgpu_families }}
      platform: windows
      package_version: ${{ needs.setup-windows.outputs.rocm_package_version }}
      release_type: dev
      repository: ${{ github.repository }}
      ref: ${{ needs.setup-windows.outputs.ref }}

  build-windows-python-packages:
    name: Build Windows Python Packages
    needs: [create-branch, setup-windows, dispatch-windows-release-build]
    if: ${{ inputs.dry_run != true && needs.dispatch-windows-release-build.result == 'success' }}
    uses: ./.github/workflows/build_windows_python_packages.yml
    secrets: inherit
    with:
      artifact_run_id: ${{ needs.dispatch-windows-release-build.outputs.run_id }}
      artifact_group: ${{ fromJSON(needs.setup-windows.outputs.windows_build_config).artifact_group }}
      amdgpu_families: ${{ fromJSON(needs.setup-windows.outputs.windows_build_config).dist_amdgpu_families }}
      linux_amdgpu_families: ${{ fromJSON(needs.setup-windows.outputs.windows_build_config).linux_amdgpu_families }}
      windows_amdgpu_families: ${{ fromJSON(needs.setup-windows.outputs.windows_build_config).windows_amdgpu_families }}
      multiarch_index: true
      package_version: ${{ needs.setup-windows.outputs.rocm_package_version }}
      release_type: dev
      repository: ${{ github.repository }}
      ref: ${{ needs.setup-windows.outputs.ref }}

  publish-windows-artifacts:
    name: Publish Windows Artifacts
    needs: [create-branch, setup-windows, dispatch-windows-release-build, build-windows-tarballs, build-windows-python-packages]
    if: ${{ inputs.dry_run != true && needs.build-windows-tarballs.result == 'success' && needs.build-windows-python-packages.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          ref: ${{ needs.setup-windows.outputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure_aws_product_publication_credentials
        with:
          release_type: dev
          product: core

      - name: Publish to release buckets
        run: |
          python build_tools/github_actions/publish_rocm_to_release_buckets.py \
            --run-id="${{ needs.dispatch-windows-release-build.outputs.run_id }}" \
            --platform=windows \
            --release-type="dev" \
            --kpack-split="${{ needs.build-windows-python-packages.outputs.kpack_split }}" \
            --structured \
            --build-variant="release"

  # ==========================================================================
  # Phase 2 - ASAN: Dispatch build only (no packaging, no tests)
  # ==========================================================================
  dispatch-asan-build:
    name: Dispatch ASAN Build
    needs: [create-branch, setup-asan]
    if: ${{ inputs.dry_run != true && needs.setup-asan.outputs.linux_build_config != '' }}
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.wait.outputs.run_id }}
      run_url: ${{ steps.dispatch.outputs.runUrlHtml }}
    steps:
      - name: Dispatch ASAN Build
        id: dispatch
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: multi_arch_build_portable_linux_dispatch.yml
          ref: ${{ needs.create-branch.outputs.branch_name }}
          inputs: |
            {
              "matrix_per_family_json": ${{ toJSON(toJSON(fromJSON(needs.setup-asan.outputs.linux_build_config).per_family_info)) }},
              "dist_amdgpu_families": "${{ fromJSON(needs.setup-asan.outputs.linux_build_config).dist_amdgpu_families }}",
              "artifact_group": "${{ fromJSON(needs.setup-asan.outputs.linux_build_config).artifact_group }}",
              "build_variant_label": "${{ fromJSON(needs.setup-asan.outputs.linux_build_config).build_variant_label }}",
              "build_variant_cmake_preset": "${{ fromJSON(needs.setup-asan.outputs.linux_build_config).build_variant_cmake_preset }}",
              "build_variant_suffix": "${{ fromJSON(needs.setup-asan.outputs.linux_build_config).build_variant_suffix }}",
              "build_runs_on": "${{ fromJSON(needs.setup-asan.outputs.linux_build_config).build_runs_on }}",
              "rocm_package_version": "${{ needs.setup-asan.outputs.rocm_package_version }}",
              "release_type": "dev",
              "repository": "${{ github.repository }}",
              "ref": "${{ needs.create-branch.outputs.branch_name }}"
            }

      - name: Wait for ASAN Build
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ steps.dispatch.outputs.runUrlHtml }}"
          # Extract run ID from URL (format: .../actions/runs/12345678)
          RUN_ID=$(echo "$RUN_URL" | grep -oP 'runs/\K[0-9]+')
          echo "Waiting for run $RUN_ID to complete..."
          echo "Run URL: $RUN_URL"

          # Poll until complete (check every 60 seconds)
          while true; do
            STATUS=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json status,conclusion -q '.status')
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion -q '.conclusion')
              echo "Run completed with conclusion: $CONCLUSION"
              if [ "$CONCLUSION" != "success" ]; then
                echo "::error::ASAN Build failed with conclusion: $CONCLUSION"
                exit 1
              fi
              break
            fi
            echo "Status: $STATUS - waiting 60s..."
            sleep 60
          done

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "## ASAN Build" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run ID:** \`$RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run URL:** $RUN_URL" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Phase 3 - Testing: gfx94x (Linux) and gfx110x (Windows) only
  # ==========================================================================
  trigger-linux-tests:
    name: Trigger Linux Tests (gfx94X-dcgpu)
    needs: [create-branch, setup-linux, dispatch-linux-release-build]
    if: ${{ inputs.dry_run != true && inputs.build_only != true && needs.dispatch-linux-release-build.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      test_run_url: ${{ steps.trigger-tests.outputs.runUrlHtml }}
    steps:
      - name: Get gfx94X-dcgpu family info
        id: family-info
        env:
          BUILD_CONFIG: ${{ needs.setup-linux.outputs.linux_build_config }}
        run: |
          FAMILY_INFO=$(echo "$BUILD_CONFIG" | jq -r '.per_family_info[] | select(.amdgpu_family == "gfx94X-dcgpu")')
          echo "test_runs_on=$(echo "$FAMILY_INFO" | jq -r '.["test-runs-on"] // ""')" >> "$GITHUB_OUTPUT"
          echo "amdgpu_targets=$(echo "$FAMILY_INFO" | jq -r '.amdgpu_targets // ""')" >> "$GITHUB_OUTPUT"

      - name: Trigger test_artifacts for gfx94X-dcgpu
        id: trigger-tests
        if: ${{ steps.family-info.outputs.test_runs_on != '' }}
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: test_artifacts.yml
          inputs: |
            {
              "artifact_group": "gfx94X-dcgpu",
              "artifact_run_id": "${{ needs.dispatch-linux-release-build.outputs.run_id }}",
              "amdgpu_families": "gfx94X-dcgpu",
              "amdgpu_targets": "${{ steps.family-info.outputs.amdgpu_targets }}",
              "test_runs_on": "${{ steps.family-info.outputs.test_runs_on }}",
              "test_type": "${{ inputs.test_type || 'quick' }}",
              "release_type": "dev",
              "repository": "${{ github.repository }}",
              "ref": "${{ needs.create-branch.outputs.branch_name }}",
              "build_variant": "release"
            }

      - name: Output test run URL
        if: ${{ steps.trigger-tests.outputs.runUrlHtml != '' }}
        run: |
          echo "## Linux Tests Triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "**Test Run:** ${{ steps.trigger-tests.outputs.runUrlHtml }}" >> "$GITHUB_STEP_SUMMARY"

  trigger-windows-tests:
    name: Trigger Windows Tests (gfx110X-all)
    needs: [create-branch, setup-windows, dispatch-windows-release-build]
    if: ${{ inputs.dry_run != true && inputs.build_only != true && needs.dispatch-windows-release-build.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      test_run_url: ${{ steps.trigger-tests.outputs.runUrlHtml }}
    steps:
      - name: Get gfx110X-all family info
        id: family-info
        env:
          BUILD_CONFIG: ${{ needs.setup-windows.outputs.windows_build_config }}
        run: |
          FAMILY_INFO=$(echo "$BUILD_CONFIG" | jq -r '.per_family_info[] | select(.amdgpu_family == "gfx110X-all")')
          echo "test_runs_on=$(echo "$FAMILY_INFO" | jq -r '.["test-runs-on"] // ""')" >> "$GITHUB_OUTPUT"
          echo "amdgpu_targets=$(echo "$FAMILY_INFO" | jq -r '.amdgpu_targets // ""')" >> "$GITHUB_OUTPUT"

      - name: Trigger test_artifacts for gfx110X-all (Windows)
        id: trigger-tests
        if: ${{ steps.family-info.outputs.test_runs_on != '' }}
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: test_artifacts.yml
          inputs: |
            {
              "artifact_group": "gfx110X-all",
              "artifact_run_id": "${{ needs.dispatch-windows-release-build.outputs.run_id }}",
              "amdgpu_families": "gfx110X-all",
              "amdgpu_targets": "${{ steps.family-info.outputs.amdgpu_targets }}",
              "test_runs_on": "${{ steps.family-info.outputs.test_runs_on }}",
              "test_type": "${{ inputs.test_type || 'quick' }}",
              "release_type": "dev",
              "repository": "${{ github.repository }}",
              "ref": "${{ needs.create-branch.outputs.branch_name }}",
              "build_variant": "release"
            }

      - name: Output test run URL
        if: ${{ steps.trigger-tests.outputs.runUrlHtml != '' }}
        run: |
          echo "## Windows Tests Triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "**Test Run:** ${{ steps.trigger-tests.outputs.runUrlHtml }}" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Summary
    needs:
      - create-branch
      - setup-linux
      - dispatch-linux-release-build
      - build-linux-tarballs
      - build-linux-python-packages
      - publish-linux-artifacts
      - setup-windows
      - dispatch-windows-release-build
      - build-windows-tarballs
      - build-windows-python-packages
      - publish-windows-artifacts
      - setup-asan
      - dispatch-asan-build
      - trigger-linux-tests
      - trigger-windows-tests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate artifact URLs
        id: artifact-urls
        env:
          RELEASE_TYPE: dev
          LINUX_BUILD_RUN_ID: ${{ needs.dispatch-linux-release-build.outputs.run_id }}
          WINDOWS_BUILD_RUN_ID: ${{ needs.dispatch-windows-release-build.outputs.run_id }}
        run: |
          cd build_tools
          python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          from _therock_utils.workflow_outputs import WorkflowOutputRoot

          linux_run_id = os.environ.get('LINUX_BUILD_RUN_ID', '')
          windows_run_id = os.environ.get('WINDOWS_BUILD_RUN_ID', '')

          if linux_run_id:
              root = WorkflowOutputRoot.from_workflow_run(
                  run_id=linux_run_id,
                  platform='linux',
                  release_type='dev'
              )
              print(f'linux_artifact_url={root.artifact_index().https_url}')
              print(f'linux_log_url={root.log_root_index().https_url}')
              print(f'linux_manifest_url={root.manifests_index().https_url}')
          else:
              print('linux_artifact_url=N/A')
              print('linux_log_url=N/A')
              print('linux_manifest_url=N/A')

          if windows_run_id:
              root = WorkflowOutputRoot.from_workflow_run(
                  run_id=windows_run_id,
                  platform='windows',
                  release_type='dev'
              )
              print(f'windows_artifact_url={root.artifact_index().https_url}')
              print(f'windows_log_url={root.log_root_index().https_url}')
              print(f'windows_manifest_url={root.manifests_index().https_url}')
          else:
              print('windows_artifact_url=N/A')
              print('windows_log_url=N/A')
              print('windows_manifest_url=N/A')
          " >> "$GITHUB_OUTPUT"

      - name: Generate summary
        run: |
          echo "## Workflow Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Branch
          if [ "${{ needs.create-branch.result }}" == "success" ]; then
            echo "- :white_check_mark: Branch: [\`${{ needs.create-branch.outputs.branch_name }}\`](https://github.com/${{ github.repository }}/tree/${{ needs.create-branch.outputs.branch_name }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: Branch creation failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Linux" >> "$GITHUB_STEP_SUMMARY"

          # Linux Release build
          if [ "${{ needs.dispatch-linux-release-build.result }}" == "success" ]; then
            echo "- :white_check_mark: Build (all architectures) - [Run](${{ needs.dispatch-linux-release-build.outputs.run_url }})" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.dispatch-linux-release-build.result }}" == "failure" ]; then
            echo "- :x: Build failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.dispatch-linux-release-build.result }}" == "skipped" ]; then
            echo "- :fast_forward: Build skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Linux packaging
          if [ "${{ needs.build-linux-tarballs.result }}" == "success" ] && [ "${{ needs.build-linux-python-packages.result }}" == "success" ]; then
            echo "- :white_check_mark: Packaging (tarballs + Python packages)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build-linux-tarballs.result }}" == "failure" ] || [ "${{ needs.build-linux-python-packages.result }}" == "failure" ]; then
            echo "- :x: Packaging failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build-linux-tarballs.result }}" == "skipped" ]; then
            echo "- :fast_forward: Packaging skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Linux publish
          if [ "${{ needs.publish-linux-artifacts.result }}" == "success" ]; then
            echo "- :white_check_mark: Published to release buckets" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.publish-linux-artifacts.result }}" == "failure" ]; then
            echo "- :x: Publishing failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.publish-linux-artifacts.result }}" == "skipped" ]; then
            echo "- :fast_forward: Publishing skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Linux tests
          if [ "${{ needs.trigger-linux-tests.result }}" == "success" ]; then
            LINUX_TEST_URL="${{ needs.trigger-linux-tests.outputs.test_run_url }}"
            if [ -n "$LINUX_TEST_URL" ]; then
              echo "- :white_check_mark: Tests triggered (gfx94X-dcgpu): [View Run]($LINUX_TEST_URL)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- :white_check_mark: Tests triggered (gfx94X-dcgpu)" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${{ needs.trigger-linux-tests.result }}" == "failure" ]; then
            echo "- :x: Test trigger failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Windows" >> "$GITHUB_STEP_SUMMARY"

          # Windows build
          if [ "${{ needs.dispatch-windows-release-build.result }}" == "success" ]; then
            echo "- :white_check_mark: Build (all architectures) - [Run](${{ needs.dispatch-windows-release-build.outputs.run_url }})" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.dispatch-windows-release-build.result }}" == "failure" ]; then
            echo "- :x: Build failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.dispatch-windows-release-build.result }}" == "skipped" ]; then
            echo "- :fast_forward: Build skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Windows packaging
          if [ "${{ needs.build-windows-tarballs.result }}" == "success" ] && [ "${{ needs.build-windows-python-packages.result }}" == "success" ]; then
            echo "- :white_check_mark: Packaging (tarballs + Python packages)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build-windows-tarballs.result }}" == "failure" ] || [ "${{ needs.build-windows-python-packages.result }}" == "failure" ]; then
            echo "- :x: Packaging failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.build-windows-tarballs.result }}" == "skipped" ]; then
            echo "- :fast_forward: Packaging skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Windows publish
          if [ "${{ needs.publish-windows-artifacts.result }}" == "success" ]; then
            echo "- :white_check_mark: Published to release buckets" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.publish-windows-artifacts.result }}" == "failure" ]; then
            echo "- :x: Publishing failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.publish-windows-artifacts.result }}" == "skipped" ]; then
            echo "- :fast_forward: Publishing skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Windows tests
          if [ "${{ needs.trigger-windows-tests.result }}" == "success" ]; then
            WINDOWS_TEST_URL="${{ needs.trigger-windows-tests.outputs.test_run_url }}"
            if [ -n "$WINDOWS_TEST_URL" ]; then
              echo "- :white_check_mark: Tests triggered (gfx110X-all): [View Run]($WINDOWS_TEST_URL)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- :white_check_mark: Tests triggered (gfx110X-all)" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${{ needs.trigger-windows-tests.result }}" == "failure" ]; then
            echo "- :x: Test trigger failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ASAN" >> "$GITHUB_STEP_SUMMARY"

          # Linux ASAN build
          if [ "${{ needs.dispatch-asan-build.result }}" == "success" ]; then
            echo "- :white_check_mark: Linux ASAN Build (all architectures) - [Run](${{ needs.dispatch-asan-build.outputs.run_url }})" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.dispatch-asan-build.result }}" == "failure" ]; then
            echo "- :x: Linux ASAN Build failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.dispatch-asan-build.result }}" == "skipped" ]; then
            echo "- :fast_forward: Linux ASAN Build skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Dry run note
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Dry Run:** Branch was created but no builds were triggered." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Build only note
          if [ "${{ inputs.build_only }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Build Only:** Tests were skipped as requested." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Build outputs
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Outputs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Artifacts | Logs | Manifests |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-----------|------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linux | ${{ steps.artifact-urls.outputs.linux_artifact_url }} | ${{ steps.artifact-urls.outputs.linux_log_url }} | ${{ steps.artifact-urls.outputs.linux_manifest_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Windows | ${{ steps.artifact-urls.outputs.windows_artifact_url }} | ${{ steps.artifact-urls.outputs.windows_log_url }} | ${{ steps.artifact-urls.outputs.windows_manifest_url }} |" >> "$GITHUB_STEP_SUMMARY"

          # Dispatched run IDs
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Dispatched Build Run IDs" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | Run ID |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          LINUX_RUN_ID="${{ needs.dispatch-linux-release-build.outputs.run_id }}"
          WINDOWS_RUN_ID="${{ needs.dispatch-windows-release-build.outputs.run_id }}"
          ASAN_RUN_ID="${{ needs.dispatch-asan-build.outputs.run_id }}"
          echo "| Linux Release | ${LINUX_RUN_ID:-N/A} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Windows Release | ${WINDOWS_RUN_ID:-N/A} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linux ASAN | ${ASAN_RUN_ID:-N/A} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Tip:** Use \`gh run download <run_id>\` to download artifacts from a specific build." >> "$GITHUB_STEP_SUMMARY"

          # Links
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Find Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Test Artifacts runs](https://github.com/${{ github.repository }}/actions/workflows/test_artifacts.yml)" >> "$GITHUB_STEP_SUMMARY"

          # Config
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Configuration" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Type | \`${{ inputs.test_type || 'quick' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Only | \`${{ inputs.build_only || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linux Test Family | \`gfx94X-dcgpu\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Windows Test Family | \`gfx110X-all\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| llvm-project | \`${{ inputs.llvm_ref || 'amd-staging' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HIPIFY | \`${{ inputs.hipify_ref || 'amd-staging' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SPIRV-LLVM-Translator | \`${{ inputs.spirv_ref || 'amd-staging' }}\` |" >> "$GITHUB_STEP_SUMMARY"
