name: Test Python Packages Per AMDGPU Family

on:
  workflow_call:
    inputs:
      amdgpu_family:
        description: AMDGPU family under test
        required: true
        type: string

      test_runs_on:
        description: Test runner for the AMDGPU family
        required: true
        type: string

      test_matrix:
        description: JSON Python package test matrix
        required: true
        type: string

      package_find_links_url:
        description: Package index produced by the build
        required: true
        type: string

      rocm_package_version:
        description: ROCm package version
        required: true
        type: string

      repository:
        description: Repository to checkout
        required: false
        type: string
        default: ""

      ref:
        description: Branch, tag, or SHA to checkout
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test_python_packages:
    name: >-
      Test Python packages |
      ${{ inputs.amdgpu_family }} |
      py${{ matrix.python_version }} |
      ${{ matrix.container_image_name }}
    if: >-
      ${{
        !failure() &&
        !cancelled() &&
        fromJSON(inputs.test_matrix) != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.test_matrix) }}

    uses: ./.github/workflows/test_rocm_wheels.yml
    secrets: inherit
    with:
      amdgpu_family: ${{ inputs.amdgpu_family }}
      test_runs_on: ${{ inputs.test_runs_on }}
      package_find_links_url: ${{ inputs.package_find_links_url }}
      python_version: ${{ matrix.python_version }}
      rocm_version: ${{ inputs.rocm_package_version }}
      container_image_name: ${{ matrix.container_image_name }}
      container_image_url: ${{ matrix.container_image_url }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref }}

