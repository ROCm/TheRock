name: Publish TheRock Docker image
on:
  workflow_call:
    inputs:
      DOCKER_FILE_NAME:
        type: string
      DOCKER_IMAGE_NAME:
        type: string
      BUILD_ARGS:
        description: >-
          Optional newline-separated list of Docker build args (e.g.
          "BASE_IMAGE=...") to pass through to docker/build-push-action.
          Ignored when BASE_IMAGE_NAME is set.
        type: string
        default: ""
      BASE_IMAGE_NAME:
        description: >-
          Optional logical image key from dockerfiles/docker_images.json. When
          set, it is resolved to a full image reference and passed as the
          BASE_IMAGE build arg, instead of using BUILD_ARGS.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-and-push-image:
    runs-on: ubuntu-26.04
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ROCm/${{ inputs.DOCKER_IMAGE_NAME }}
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          # Image pushes use registry authentication from "Log in to the Container registry".
          persist-credentials: false

      - name: Resolve base image reference
        if: ${{ inputs.BASE_IMAGE_NAME != '' }}
        id: resolve_base_image
        uses: ./.github/actions/resolve_docker_image
        with:
          image_name: ${{ inputs.BASE_IMAGE_NAME }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sanitization of tag names is done automatically by the metadata-action
      - name: Determine Docker tag
        id: tag
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == stage/docker/* ]]; then
            suffix="${ref#stage/docker/}"
            echo "TAG_SUFFIX=stage-${suffix}" >> "$GITHUB_OUTPUT"
          elif [[ "$ref" == "main" ]]; then
            echo "TAG_SUFFIX=latest" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_SUFFIX=${ref}" >> "$GITHUB_OUTPUT"
          fi

      # Adds extra tags to the image, with the default tags from https://github.com/docker/metadata-action#tags-input
      # The custom tag is for the branches prefixed with `stage/docker/`.
      # For the default branch (i.e., main), the default behaviour remains and is labelled `latest`.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=${{ steps.tag.outputs.TAG_SUFFIX }}

      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      # Registry pushes use GITHUB_TOKEN supplied to docker/login-action above, not Git credentials.
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dockerfiles/
          file: dockerfiles/${{ inputs.DOCKER_FILE_NAME }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.BASE_IMAGE_NAME != '' && format('BASE_IMAGE={0}', steps.resolve_base_image.outputs.image_ref) || inputs.BUILD_ARGS }} # zizmor: ignore[unpinned-images]
