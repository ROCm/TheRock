# Temporary validation caller; not intended for merging.
# Reuse the registered path; production TheRock pins remain unchanged.
# Exact companion 0f22333e and source artifact run are separate inputs/evidence.
# Default artifacts are the old abad125f build (control only). Use 41565168474
# for 54d84c8f combined acceptance after its Linux/Windows artifacts are ready.
name: Test Artifacts - rocKE owner deployment validation

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "rocKE-enabled ROCm/rocm-libraries build run to test"
        type: string
        required: true
        default: "40934086629"

permissions:
  contents: read

run-name: "rocKE owner deployment | TheRock 0f22333e | artifacts ${{ inputs.artifact_run_id }}"

jobs:
  installed_rocke:
    name: "Installed rocKE owner | ${{ matrix.platform }} | ${{ matrix.family }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            family: gfx94X-dcgpu
            targets: gfx942
            runner: linux-gfx942-1gpu-ccs-csp-ossci-rocm
            container_options: >-
              --user 0:0 --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576
              --security-opt seccomp=unconfined --group-add video
              --device /dev/kfd --device /dev/dri
              --group-add 993 --group-add 992 --group-add 110
              --env-file /etc/podinfo/gha-gpu-isolation-settings
              -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST
          - platform: windows
            family: gfx110X-all
            targets: gfx1100,gfx1101,gfx1102,gfx1103
            runner: windows-gfx110X-gpu-rocm
            container_options: ""
    uses: ROCm/TheRock/.github/workflows/test_component.yml@0f22333ec77e038f403800443aae7018f5fc692b # PR #9577, validation only
    # No secrets are needed for public artifact downloads or component tests.
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      artifact_group: ${{ matrix.family }}
      amdgpu_families: ${{ matrix.family }}
      amdgpu_targets: ${{ matrix.targets }}
      test_runs_on: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      release_type: ci
      build_variant: release
      repository: ROCm/TheRock
      ref: 0f22333ec77e038f403800443aae7018f5fc692b
      # Same standard-tier component entry as fetch_test_configurations.py.
      # One complete shard per platform avoids duplicate artifact/SDK downloads.
      # Extra timeout headroom accommodates the unsharded suite.
      component: >-
        {
          "job_name": "hipkernelprovider",
          "fetch_artifact_args": "--hipdnn --hipkernelprovider --hipdnn-integration-tests --tests --run-github-repo ROCm/rocm-libraries",
          "additional_requirements_files": ["build_tools/github_actions/test_executable_scripts/requirements-test-hipkernelprovider.txt"],
          "test_script": "python build_tools/github_actions/test_executable_scripts/test_hipkernelprovider.py",
          "test_type": "standard",
          "timeout_minutes": 45,
          "shard_arr": [1],
          "total_shards": 1,
          "container_options": "${{ matrix.container_options }}"
        }
