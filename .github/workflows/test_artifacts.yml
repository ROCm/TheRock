# Notes on security:
#   * Inherit caller-provided secrets; limited-trust PR entry points restrict the set.
#   * Higher-trust push/manual runs and https://github.com/ROCm/rockrel also supply secrets.

name: Test Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_group:
        description: >-
          Artifact group name used to fetch build artifacts
          (e.g., "multi-arch-release").
        type: string
      artifact_run_id:
        description: >-
          Workflow run ID to retrieve build artifacts from (e.g., from a
          Multi-Arch CI run). Required for manual dispatch since this workflow
          only runs tests and has no build artifacts of its own.
        type: string
        required: true
      amdgpu_families:
        description: >-
          GPU family group to test (e.g., "gfx94X-dcgpu", "gfx110X-all",
          "gfx950-dcgpu", "gfx120X-all", "gfx125X-dcgpu"). This selects
          which GPU family the tests target.
        type: string
      amdgpu_targets:
        description: >-
          Specific GPU targets within a family (e.g., "gfx942", "gfx1100").
          Leave empty to use the default targets for the selected family.
        type: string
        default: ""
      test_plan:
        description: >-
          JSON test plan: which components to run, on which runners, at which
          tier. Built by build_tools/github_actions/fetch_test_configurations.py
          and normally produced by the setup job, so a manual dispatch has to
          supply one. Copy it from the "Configuring CI options" step of the
          setup job of the run whose artifacts are being tested.
        type: string
        default: '{"sanity":null,"components":[]}'
      release_type:
        description: 'Release type for the artifacts being tested.'
        type: choice
        options:
          - ci
          - dev
        default: ci
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
      build_variant:
        description: "Build variant (e.g., release, asan)."
        type: choice
        options:
          - release
          - asan
          - asan-debug
          - host-asan
          - host-asan-debug
        default: release
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically by the
          top-level orchestrator to link this run to its release lineage. Do not
          set it manually.
        type: string
        default: ""
  workflow_call:
    inputs:
      artifact_group:
        type: string
      artifact_run_id:
        type: string
        default: ""
      amdgpu_families:
        type: string
      amdgpu_targets:
        type: string
        default: ""
      test_plan:
        description: >-
          JSON test plan for this GPU family; see the workflow_dispatch input
          above. Callers pass the plan that configure_multi_arch_ci.py built
          for the family during setup.
        type: string
        default: '{"sanity":null,"components":[]}'
      release_type:
        type: string
        default: ci
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
      build_variant:
        description: "Build variant (e.g., release, asan)."
        type: string
        default: "release"
      quartz_tracking_id:
        type: string
        default: ""
  push:
    branches:
      - ADHOCBUILD

permissions:
  contents: read

run-name: Test Artifacts (${{ inputs.amdgpu_families }}, ${{ inputs.release_type }}, ${{ inputs.build_variant }})

jobs:
  notify_quartz_started:
    if: ${{ vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    name: "Quartz - started - test ROCm artifacts"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: "Quartz - started - test ROCm artifacts"
        uses: ROCm/Quartz/.github/actions/notify_quartz@2d3d15630651544b1469f71da25da9b73ffa8667 # notify_quartz/v1.1.3
        with:
          run_phase: started
          reporting_workflow: test_artifacts.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

  # Sanity must pass before the rest of the components run. The plan omits it
  # when its prerequisite stage was excluded or no runner was available.
  test_sanity_check:
    name: 'Test Sanity Check'
    if: ${{ fromJSON(inputs.test_plan).sanity }}
    uses: './.github/workflows/test_component.yml'
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      artifact_group: ${{ inputs.artifact_group }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      amdgpu_targets: ${{ inputs.amdgpu_targets }}
      platform: ${{ fromJSON(inputs.test_plan).platform }}
      test_runs_on: ${{ fromJSON(inputs.test_plan).sanity.test_runner }}
      component_key: ${{ fromJSON(inputs.test_plan).sanity.key }}
      job_name: ${{ fromJSON(inputs.test_plan).sanity.job_name }}
      test_type: ${{ fromJSON(inputs.test_plan).test_type }}
      timeout_minutes: ${{ fromJSON(inputs.test_plan).sanity.timeout_minutes }}
      total_shards: ${{ fromJSON(inputs.test_plan).sanity.total_shards }}
      shard_arr: ${{ toJSON(fromJSON(inputs.test_plan).sanity.shard_arr) }}
      container_image: ${{ fromJSON(inputs.test_plan).sanity.container_image }}
      container_options: ${{ fromJSON(inputs.test_plan).sanity.container_options || fromJSON(inputs.test_plan).container_options }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      build_variant: ${{ inputs.build_variant }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}

  test_components:
    name: 'Test ${{ matrix.component.job_name }}'
    needs: test_sanity_check
    # Run when sanity passed (or was not scheduled, e.g. its prerequisite stage
    # was excluded) and the plan has components to run.
    if: >-
      ${{
        !failure() &&
        !cancelled() &&
        fromJSON(inputs.test_plan).components[0]
      }}
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.test_plan).components }}
    uses: './.github/workflows/test_component.yml'
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      artifact_group: ${{ inputs.artifact_group }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      amdgpu_targets: ${{ inputs.amdgpu_targets }}
      platform: ${{ fromJSON(inputs.test_plan).platform }}
      # Already resolved per component by build_test_plan(), including CPU-only
      # and multi-GPU routing and the weighted draw across the family's pool.
      test_runs_on: ${{ matrix.component.test_runner }}
      component_key: ${{ matrix.component.key }}
      job_name: ${{ matrix.component.job_name }}
      test_type: ${{ fromJSON(inputs.test_plan).test_type }}
      timeout_minutes: ${{ matrix.component.timeout_minutes }}
      total_shards: ${{ matrix.component.total_shards }}
      shard_arr: ${{ toJSON(matrix.component.shard_arr) }}
      expect_failure: ${{ matrix.component.expect_failure == true }}
      linux_cpu_runner: ${{ matrix.component.linux_cpu_runner == true }}
      gpu_enable_pal: ${{ matrix.component.gpu_enable_pal }}
      container_image: ${{ matrix.component.container_image }}
      # Components declaring extra options carry their own string; the rest take
      # the family default for their runner kind.
      container_options: >-
        ${{
          matrix.component.container_options ||
          (matrix.component.linux_cpu_runner == true &&
            fromJSON(inputs.test_plan).container_options_cpu ||
            fromJSON(inputs.test_plan).container_options)
        }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      build_variant: ${{ inputs.build_variant }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}

  notify_quartz_completed:
    if: ${{ always() && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    needs: [test_sanity_check, test_components]
    name: "Quartz - completed - test ROCm artifacts"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: "Quartz - completed - test ROCm artifacts"
        uses: ROCm/Quartz/.github/actions/notify_quartz@2d3d15630651544b1469f71da25da9b73ffa8667 # notify_quartz/v1.1.3
        with:
          run_phase: completed
          reporting_workflow: test_artifacts.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_captured_outputs: ${{ toJSON(needs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
