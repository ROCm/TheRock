# This workflow validates that the GITHUB_TOKEN has the required permissions
# to query workflow runs via the GitHub Actions API.
#
# The stage reuse feature in setup_multi_arch.yml requires `actions: read`
# to query baseline workflow runs. This test catches permission issues at
# runtime.
#
# See: https://github.com/ROCm/TheRock/issues/7235

name: Test Workflow Permissions

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_workflow_permissions:
    name: Validate workflow permissions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate workflows have required permissions
        run: python .github/workflows/tests/test_workflow_permissions.py
