# This workflow validates that the GITHUB_TOKEN has the required permissions
# to query workflow runs via the GitHub Actions API.
#
# The stage reuse feature in setup_multi_arch.yml requires `actions: read`
# to query baseline workflow runs. This test catches permission issues at
# runtime.
#
# See: https://github.com/ROCm/TheRock/issues/7235

name: Test Workflow Permissions

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

# These permissions mirror what setup_multi_arch.yml callers need
permissions:
  contents: read
  actions: read

jobs:
  test_actions_read_permission:
    name: Test actions:read permission
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test GitHub API permissions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build_tools/github_actions/test_workflow_permissions.py
