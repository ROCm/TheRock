name: Test Code Coverage Component

on:
  workflow_call:
    inputs:
      generic_run_id:
        type: string
        default: ""
      baseline_repository:
        description: >-
          Repository owning generic_run_id (owner/repo), passed as
          --run-github-repo. Empty defaults to the current repository. The
          instrumented replacement always resolves against this coverage run's
          own repository.
        type: string
        default: ""
      code_coverage_run_id:
        description: >-
          Run id the instrumented stack was pushed under, passed as
          --code-coverage-run-id. Empty uses github.run_id.
        type: string
        default: ""
      artifact_group:
        type: string
      amdgpu_families:
        type: string
      amdgpu_targets:
        type: string
        default: ""
      test_runs_on:
        type: string
      platform:
        type: string
      component:
        type: string
      release_type:
        type: string
        default: ci
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
      build_variant:
        description: "Build variant (e.g., release, asan). Used to skip tests incompatible with certain builds."
        type: string
        default: "release"
      coverage_enabled:
        description: >-
          Collect llvm profraw files from the test run and upload them.
          Only meaningful against a coverage-instrumented build.
        type: boolean
        default: false
      coverage_artifact_prefix:
        description: >-
          Prefix for the uploaded profraw artifact name. Set per-project so one
          coverage run's projects keep their profiles apart.
        type: string
        default: "coverage-profraw"
      device_coverage:
        description: >-
          The project's kernels are instrumented too. Swaps its instrumented
          code objects into the installed kpack archives and keeps the
          device-side profiles instead of dropping them.
        type: boolean
        default: false
      default_container_image:
        type: string
        default: "ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98"


permissions:
  contents: read

jobs:
  test_component:
    name: >-
      Test ${{ fromJSON(inputs.component).job_name }}
      (shard ${{ matrix.shard }}/${{ fromJSON(inputs.component).total_shards }})
      (${{ inputs.amdgpu_families }})
      ${{ fromJSON(inputs.component).expect_failure == true && '(xfail)' || '' }}
    runs-on: ${{ inputs.test_runs_on }}
    continue-on-error: ${{ fromJSON(inputs.component).expect_failure == true }}
    timeout-minutes: 210
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    container:
      # If the component has specified an alternate image, honor that option.
      # Otherwise use the default image.
      # Callers must supply digest-pinned images; fetch_test_configurations.py pins overrides.
      image: >- # zizmor: ignore[unpinned-images]
        ${{ inputs.platform == 'linux' &&
            (fromJSON(inputs.component).container_image || inputs.default_container_image)
            || null
        }}
      # Container options come from fetch_test_configurations.py: base (ipc,
      # user, ulimit, seccomp), GPU (devices, groups), and job-specific options.
      options: ${{ fromJSON(inputs.component).container_options }}
    strategy:
      fail-fast: false
      matrix:
        # Shard array from fetch_test_configurations.py's total_shards.
        # The test executable shards on it (e.g. [1,2,3,4] = four shards).
        shard: ${{ fromJSON(inputs.component).shard_arr }}
    defaults:
      run:
        shell: bash
    env:
      GENERIC_RUN_ID: ${{ inputs.generic_run_id }}
      TEST_COMPONENT: ${{ fromJSON(inputs.component).job_name }}
      CODE_COVERAGE_RUN_ID: ${{ inputs.code_coverage_run_id || github.run_id }}
      OUTPUT_ARTIFACTS_DIR: "./build"
      THEROCK_BIN_DIR: "./build/bin"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      AMDGPU_TARGETS: ${{ inputs.amdgpu_targets }}
      ARTIFACT_GROUP: ${{ inputs.artifact_group }}
      BUILD_VARIANT: ${{ inputs.build_variant }}
    steps:
      - name: "Fetch 'build_tools' from repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          sparse-checkout: build_tools
          path: "prejob"

      - name: Pre-job cleanup processes on Windows
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . "${env:GITHUB_WORKSPACE}\prejob\build_tools\github_actions\cleanup_processes.ps1"

      - name: Pre-job cleanup GPU processes on Linux
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./prejob/build_tools/github_actions/cleanup_processes.sh

      - name: Checking repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install TheRock Code Coverage Build
        timeout-minutes: 15
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          FETCH_ARTIFACT_ARGS: ${{ fromJSON(inputs.component).fetch_artifact_args }}
          BASELINE_REPOSITORY: ${{ inputs.baseline_repository }}
          DEVICE_COVERAGE: ${{ inputs.device_coverage }}
        run: |
          pip3 install -r requirements-test.txt
          device_code_arg=()
          if [[ "${DEVICE_COVERAGE}" == "true" ]]; then
            device_code_arg=(--replace-device-code)
          fi
          # Baseline tree comes from generic_run_id. When empty (self-contained
          # dispatch), fall back to this run's own instrumented artifacts;
          # --replace then re-extracts them, leaving the whole stack instrumented.
          generic_run_id="${GENERIC_RUN_ID}"
          if [[ -z "${generic_run_id}" ]]; then
            generic_run_id="${CODE_COVERAGE_RUN_ID}"
          fi
          # Pass --run-github-repo only when set, so empty defaults to the
          # current repository. The generic baseline lives in a different repo
          # than this coverage run (rockrel for the PR check, rocm-libraries for
          # the nightly); the S3 bucket lookup 404s if that repo is not named.
          run_github_repo_arg=()
          if [[ -n "${BASELINE_REPOSITORY}" ]]; then
            run_github_repo_arg=(--run-github-repo="${BASELINE_REPOSITORY}")
          fi
          # FETCH_ARTIFACT_ARGS intentionally splits arguments supplied by fetch_test_configurations.py.
          python3 build_tools/install_rocm_code_coverage_build.py \
            --code-coverage-run-id="${CODE_COVERAGE_RUN_ID}" \
            --run-id="${generic_run_id}" \
            "${run_github_repo_arg[@]}" \
            --artifact-group="${AMDGPU_FAMILIES}" \
            --amdgpu-targets="${AMDGPU_TARGETS}" \
            --tests \
            --output-dir="${OUTPUT_ARTIFACTS_DIR}" \
            "--replace-${TEST_COMPONENT}" \
            "${device_code_arg[@]}" \
            ${FETCH_ARTIFACT_ARGS}

      # safe.directory must be set before Runner Health Status
      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Runner health status
        run: |
          python ./build_tools/health_status.py

      - name: Driver / GPU sanity check
        if: ${{ !fromJSON(inputs.component).linux_cpu_runner }}
        timeout-minutes: 3
        run: |
          python ./build_tools/print_driver_gpu_info.py

      - name: Setup Additional Requirements
        # First-element check skips cleanly when the list is empty ([]) or the
        # key is absent, without depending on how an empty list coerces to ''.
        if: ${{ fromJSON(inputs.component).additional_requirements_files[0] != '' }}
        env:
          REQUIREMENTS_FILES: ${{ join(fromJSON(inputs.component).additional_requirements_files, ',') }}
          # The script installs with uv, which otherwise wants a virtual
          # environment; this job installs into the setup-python interpreter.
          UV_SYSTEM_PYTHON: "1"
        run: |
          pip3 install uv
          python ./build_tools/install_additional_requirements.py \
            --requirements-files "${REQUIREMENTS_FILES}"

        # TODO(#3755): Clean this up after final sanitizer environment variable flags are determined
      - name: Enable sanitizer-specific test flags
        if: ${{ contains(inputs.artifact_group, 'asan') }}
        run: |
          echo "ASAN_OPTIONS=detect_odr_violation=0:quarantine_size_mb=600" >> $GITHUB_ENV
          echo "HSA_XNACK=1" >> $GITHUB_ENV
          echo "ASAN_SYMBOLIZER_PATH=${OUTPUT_ARTIFACTS_DIR}/llvm/bin/llvm-symbolizer" >> $GITHUB_ENV

      # Instrumented binaries write one profraw per process. %p (pid) and %m
      # (binary signature) keep files distinct so a forking/multi-lib shard
      # doesn't overwrite itself.
      - name: Prepare coverage profile directory
        if: ${{ inputs.coverage_enabled }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/coverage-report/profraw"
          echo "LLVM_PROFILE_FILE=${GITHUB_WORKSPACE}/coverage-report/profraw/${TEST_COMPONENT}-shard${SHARD_INDEX}-%p-%m.profraw" >> "${GITHUB_ENV}"

      # Limit threads from KUBE_CPU_REQUEST (Kubernetes-injected) to avoid
      # oversubscription. Done at runtime; container env isn't in GitHub's context.
      - name: Set thread limits
        run: |
          if [[ -n "${KUBE_CPU_REQUEST:-}" ]]; then
            CPU_COUNT="${KUBE_CPU_REQUEST%.*}"
            echo "OPENBLAS_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "OMP_NUM_THREADS=${CPU_COUNT}" >> $GITHUB_ENV
            echo "Thread limits set: OPENBLAS_NUM_THREADS=${CPU_COUNT}, OMP_NUM_THREADS=${CPU_COUNT} (from KUBE_CPU_REQUEST=${KUBE_CPU_REQUEST})"
          else
            echo "KUBE_CPU_REQUEST not set, thread limits not configured"
          fi

      - name: Test
        id: test
        timeout-minutes: ${{ fromJSON(inputs.component).timeout_minutes }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ fromJSON(inputs.component).total_shards }}
          TEST_TYPE: ${{ fromJSON(inputs.component).test_type }}
          TEST_COMPONENT: ${{ fromJSON(inputs.component).job_name }}
          # General CI debug mode. runner.debug == '1' when a job is re-run with
          # GitHub's "Enable debug logging" checkbox. Used to force turning debug
          # options on.
          THEROCK_CI_DEBUG: ${{ runner.debug == '1' && '1' || '0' }}
          # ROCM_KPACK_DEBUG turns on the kpack loader's per-test diagnostics.
          # Most components enable it (default "1"); a few opt out via their
          # test_matrix "rocm_kpack_debug": "0" to keep -V ctest logs readable.
          # test_runner.py forces this on when THEROCK_CI_DEBUG is set.
          ROCM_KPACK_DEBUG: ${{ fromJSON(inputs.component).rocm_kpack_debug || '1' }}
          # Windows hip-tests (PAL=1, ROCR=0) set this via matrix; other components
          # leave it empty. #3587
          # An empty GPU_ENABLE_PAL is misread as ROCr on Windows (atoi("")==0),
          # whose Windows memory path OOMs some tests (e.g. rocsparse bsr*0 graph_test).
          # Default unset components to the platform backend, mirroring the runtime fix
          # in ROCm/rocm-systems#8050 (Windows -> PAL, Linux -> ROCr).
          GPU_ENABLE_PAL: ${{ fromJSON(inputs.component).gpu_enable_pal || (inputs.platform == 'windows' && '1' || '0') }}
          RETRY_THIS_STEP: "true"
          RETRY_COUNT: "1"
          RETRY_DELAY: "7"
          STEP_TIMEOUT_MINUTES: ${{ fromJSON(inputs.component).timeout_minutes }}
          STEP_NAME: >-
            Test ${{ fromJSON(inputs.component).job_name }}
            (shard ${{ matrix.shard }}/${{ fromJSON(inputs.component).total_shards }})
            (${{ inputs.amdgpu_families }})
            ${{ fromJSON(inputs.component).expect_failure == true && '(xfail)' || '' }}
        # This input is intentionally a shell program from fetch_test_configurations.py.
        # Callers must be trusted to select code, as with repository/ref above.
        run: | # zizmor: ignore[template-injection]
          ${{ fromJSON(inputs.component).test_script }}

      # A device-side profile is named after its GPU target
      # (gfx942:sramecc+:xnack-.0.<name>.profraw). upload-artifact rejects the
      # colons and with them every other file in the upload. Under device
      # coverage the profiles are the point, so the colons go and the files
      # stay. Otherwise llvm-cov has no device objects to use them against, and
      # their presence means kernels were instrumented, which the build is
      # meant to prevent, so say so.
      - name: Rename or drop device-side profiles
        if: ${{ always() && inputs.coverage_enabled }}
        env:
          DEVICE_COVERAGE: ${{ inputs.device_coverage }}
        run: |
          shopt -s nullglob
          device_profiles=("${GITHUB_WORKSPACE}"/coverage-report/profraw/*:*.profraw)
          if [[ "${DEVICE_COVERAGE}" == "true" ]]; then
            for profile in "${device_profiles[@]}"; do
              name="${profile##*/}"
              mv -- "${profile}" "${profile%/*}/${name//:/_}"
            done
            if (( ${#device_profiles[@]} )); then
              echo "Kept ${#device_profiles[@]} device-side profile(s)"
            else
              echo "::warning::Device coverage is on but this shard wrote no device-side profile"
            fi
          elif (( ${#device_profiles[@]} )); then
            echo "::warning::Kernels were instrumented; dropping ${#device_profiles[@]} device-side profile(s): ${device_profiles[*]##*/}"
            rm -f -- "${device_profiles[@]}"
          fi

      # Upload even on test failure: partial coverage is useful and the
      # aggregation job tolerates missing shards.
      - name: Upload coverage profraw files
        if: ${{ always() && inputs.coverage_enabled }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            ${{ inputs.coverage_artifact_prefix }}-${{ fromJSON(inputs.component).job_name }}-shard${{ matrix.shard }}
          path: ${{ github.workspace }}/coverage-report/profraw/*.profraw
          if-no-files-found: warn
          retention-days: 3

      - name: Post-job cleanup GPU processes on Linux
        if: ${{ always() && runner.os == 'Linux' }}
        timeout-minutes: 5
        run: bash ./build_tools/github_actions/cleanup_processes.sh

      - name: Post-job cleanup processes on Windows
        if: ${{ always() && runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: powershell
        run: . "${env:GITHUB_WORKSPACE}\build_tools\github_actions\cleanup_processes.ps1"

      - name: Capture job summary
        id: summary
        if: always()
        run: python build_tools/github_actions/capture_job_summary.py
