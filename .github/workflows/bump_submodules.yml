name: Bump Submodule automation

on:
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Submodule to bump (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - rocm-systems
          - rocm-libraries
          - rocgdb
          - mesa-fork
  schedule:
    - cron: "0 */12 * * *" # Existing cadence: rocgdb and mesa-fork. UTC: 12AM/12PM; Eastern: 8PM/8AM; Pacific: 5PM/5AM.
    - cron: "0 7 * * *" # rocm-systems and rocm-libraries. UTC: 7AM; Eastern: 3AM; Pacific: 12AM.
    - cron: "0 16 * * *" # rocm-systems. UTC: 4PM; Eastern: 12PM; Pacific: 9AM.
    - cron: "0 19 * * *" # rocm-libraries. UTC: 7PM; Eastern: 3PM; Pacific: 12PM.
  push:
    branches:
      - main
    paths:
      - rocm-systems
      - rocm-libraries
      - debug-tools/rocgdb/source
      - third-party/sysdeps/common/mesa-fork

permissions:
  contents: read

jobs:
  bump-submodules:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write

    env:
      INPUT_SUBMODULE: ${{ github.event.inputs.submodule || 'all' }}

    steps:
      - name: Checkout ROCm/TheRock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bump automation pushes from temporary clones authenticated with GitHub App tokens.
          persist-credentials: false
          fetch-depth: 0

      - name: Select scheduled submodule
        id: schedule
        if: github.event_name == 'schedule'
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          submodules=()
          case "${EVENT_SCHEDULE}" in
            "0 */12 * * *") submodules+=("rocgdb" "mesa-fork") ;;
            "0 7 * * *") submodules+=("rocm-systems" "rocm-libraries") ;;
            "0 16 * * *") submodules+=("rocm-systems") ;;
            "0 19 * * *") submodules+=("rocm-libraries") ;;
          esac
          echo "submodules=${submodules[*]}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Generate GitHub App token rocm-systems
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: systems-token
        with:
          app-id: ${{ secrets.ROCM_SYSTEMS_APP_ID }}
          private-key: ${{ secrets.ROCM_SYSTEMS_APP_PRIVATE_KEY }}
          owner: "ROCm"
          # We will reuse the rocm-systems token for rocgdb and mesa-fork for now.
          repositories: "rocm-systems,rocgdb,mesa-fork,TheRock"

      - name: Generate GitHub App token rocm-libraries
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: librarian-token
        with:
          app-id: ${{ secrets.ROCM_LIBRARIES_APP_ID }}
          private-key: ${{ secrets.ROCM_LIBRARIES_APP_PRIVATE_KEY }}
          owner: "ROCm"
          repositories: "rocm-libraries,TheRock"

      - name: Install prerequisites
        run: |
          pip install requests

      # The script authenticates temporary clones and pushes with SYSTEMS_TOKEN or LIBRARIES_TOKEN
      # from the GitHub App token steps above; it does not use checkout credentials.
      - name: Run scheduled bump automation
        if: github.event_name == 'schedule' && steps.schedule.outputs.submodules != ''
        env:
          SCHEDULE_SUBMODULES: ${{ steps.schedule.outputs.submodules }}
          SYSTEMS_TOKEN: ${{ steps.systems-token.outputs.token }}
          LIBRARIES_TOKEN: ${{ steps.librarian-token.outputs.token }}
        run: |
          for submodule in ${SCHEDULE_SUBMODULES}; do
            python3 build_tools/github_actions/bump_automation.py \
              --event_type "schedule" \
              --submodule "${submodule}" \
              --systems_token "${SYSTEMS_TOKEN}" \
              --libraries_token "${LIBRARIES_TOKEN}" \
              --rocgdb_token "${SYSTEMS_TOKEN}" \
              --mesa_token "${SYSTEMS_TOKEN}"
          done

      # Temporary clones and pushes use SYSTEMS_TOKEN or LIBRARIES_TOKEN from the App token steps.
      - name: Run manually dispatched bump automation
        if: github.event_name == 'workflow_dispatch'
        env:
          SYSTEMS_TOKEN: ${{ steps.systems-token.outputs.token }}
          LIBRARIES_TOKEN: ${{ steps.librarian-token.outputs.token }}
        run: |
          python3 build_tools/github_actions/bump_automation.py \
            --event_type "schedule" \
            --submodule "${INPUT_SUBMODULE}" \
            --systems_token "${SYSTEMS_TOKEN}" \
            --libraries_token "${LIBRARIES_TOKEN}" \
            --rocgdb_token "${SYSTEMS_TOKEN}" \
            --mesa_token "${SYSTEMS_TOKEN}"

      # Temporary clones and pushes use SYSTEMS_TOKEN or LIBRARIES_TOKEN from the App token steps.
      - name: Run push automation
        if: github.event_name == 'push'
        env:
          SYSTEMS_TOKEN: ${{ steps.systems-token.outputs.token }}
          LIBRARIES_TOKEN: ${{ steps.librarian-token.outputs.token }}
        run: |
          python3 build_tools/github_actions/bump_automation.py \
            --event_type "push" \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --systems_token "${SYSTEMS_TOKEN}" \
            --libraries_token "${LIBRARIES_TOKEN}" \
            --rocgdb_token "${SYSTEMS_TOKEN}" \
            --mesa_token "${SYSTEMS_TOKEN}"

      - name: Post bump breadcrumbs to upstream PRs
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SYSTEMS_TOKEN: ${{ steps.systems-token.outputs.token }}
          LIBRARIES_TOKEN: ${{ steps.librarian-token.outputs.token }}
        run: |
          python3 build_tools/github_actions/post_bump_breadcrumbs.py \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --systems_token "${SYSTEMS_TOKEN}" \
            --libraries_token "${LIBRARIES_TOKEN}" \
            --rocgdb_token "${SYSTEMS_TOKEN}"
