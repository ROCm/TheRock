name: Targeted original device-link traces (01a19119)
run-name: HEAD original getri_z getf2_c device traces v2 (01a19119)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-device-traces:
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 240
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:d666e4613c1ca919bc7d1a31a4c368740b66c34b5c19ef95ba15cd31db7783fb
    env:
      CCACHE_DISABLE: '1'
      TEATIME_FORCE_INTERACTIVE: '0'
      PERF_PAIR_ID: device-trace-v2
      PERF_TRIAL_ORDER: original-control-and-trace-four-concurrent
    steps:
      - name: Checkout immutable trace assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: probe
      - name: Checkout frozen Rock CI HEAD source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
          path: source
      - name: Install dependencies and copy frozen joint probe assets
        working-directory: source
        run: |
          git config --global --add safe.directory "$PWD"
          pip install -r requirements.txt
          mkdir -p build_tools/perf_probe/records
          cp ../probe/build_tools/perf_probe/{command_trace.py,collect_build_perf.py,bootstrap-codeobj.patch} build_tools/perf_probe/
          cp ../probe/experiments/joint/{run_experiment.sh,phase_probes.py} build_tools/perf_probe/
          cp ../probe/experiments/joint/records/*.json build_tools/perf_probe/records/
          cp ../probe/experiments/compiler/{trace_getf2.py,rocsolver-specialized-shards.patch} build_tools/perf_probe/
          cp ../probe/experiments/device-trace-v2/{verify_probe.py,pair1-allocation-baseline.json} build_tools/perf_probe/
      - name: Prepare only prerequisite closure and original solver configuration
        working-directory: source
        run: bash build_tools/perf_probe/run_experiment.sh prepare
      - name: Verify original source and compare actual toolchain with pair1
        working-directory: source
        run: |
          python3 build_tools/perf_probe/phase_probes.py preflight --output perf-records/allocation-device-trace.json
          python3 build_tools/perf_probe/verify_probe.py before
      - name: Four original-source control and traced command replays
        working-directory: source
        run: |
          export THEROCK_PERF_COMMAND_DIR="$PWD/perf-commands-probes-configure"
          mkdir -p "$THEROCK_PERF_COMMAND_DIR"
          bash build_tools/perf_probe/run_experiment.sh probes
      - name: Require produced host and device-link trace events
        working-directory: source
        run: python3 build_tools/perf_probe/verify_probe.py after
      - name: Archive evidence without private object bytes
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,tarfile
          def keep(member):
              if member.name.startswith('perf-phase-probes/') and member.name.endswith('.o'): return None
              return member
          with tarfile.open('device-trace-v2.tar.gz','w:gz') as archive:
              for pattern in ('perf-*','build/logs'):
                  for path in pathlib.Path('source').glob(pattern):
                      archive.add(path,arcname=str(path.relative_to('source')),filter=keep)
          PY
      - name: Upload trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: device-trace-v2-01a19119
          path: device-trace-v2.tar.gz
          retention-days: 14
          compression-level: 0
