# Task-only diagnostic entrypoint; not intended as a product workflow change.
name: CK compilation diagnostic (01a193c1)
run-name: CK ${{ inputs.build_variant }} ${{ inputs.operation }} (01a193c1)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: diagnostic
        options: [diagnostic, benchmark, integration, consumer]
      integration_producer_run_id:
        type: string
        default: ''
        description: Existing integration build run for consumer-only validation
      baseline_benchmark_run_id:
        type: string
        default: ''
        description: Measured object producer if GPU validation used a separate run
      baseline_contract_run_id:
        type: string
        default: ''
        description: Successful paired benchmark/GPU run for archive integration comparison
      build_variant:
        type: choice
        default: asan-debug
        options: [asan-debug, release]
      baseline_run_id:
        type: string
        default: '41211496307'
        description: Matching compiler/runtime artifact run; release requires a normal baseline
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    if: inputs.operation != 'consumer'
    runs-on: ${{ inputs.operation != 'diagnostic' && 'aws-linux-scale-rocm-large' || 'aws-linux-scale-rocm-prod' }}
    timeout-minutes: 360
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:d666e4613c1ca919bc7d1a31a4c368740b66c34b5c19ef95ba15cd31db7783fb
    env:
      RELEASE_TYPE: ci
      BUILD_VARIANT: ${{ inputs.build_variant }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
      CCACHE_DISABLE: '1'
      TEATIME_FORCE_INTERACTIVE: '0'
      GH_TOKEN: ${{ github.token }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - name: Install and verify measurement tools before setup
        run: |
          yum install -y time
          /usr/bin/time -v true
      - name: Checkout frozen product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
          set-safe-directory: false
      - name: Checkout diagnostic assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .compile-hotspot-instrumentation
          persist-credentials: false
          set-safe-directory: false
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Configure CK from pinned dependencies
        if: inputs.operation != 'integration'
        run: python3 .compile-hotspot-instrumentation/build_tools/compile_hotspot/profile.py configure
      - name: Rebuild actual CK archive and MIOpen consumer
        if: inputs.operation == 'integration'
        run: python3 .compile-hotspot-instrumentation/build_tools/compile_hotspot/integration.py --variant "${BUILD_VARIANT}" --baseline-run-id "${BASELINE_RUN_ID}"
      - name: Package exact rebuilt libraries and archive contract
        if: inputs.operation == 'integration'
        run: tar -czf integration-bundle.tar.gz -C integration-bundle .
      - name: Upload rebuilt integration products
        if: inputs.operation == 'integration'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck-miopen-integration-${{ inputs.build_variant }}-${{ github.run_id }}
          path: integration-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Profile isolated object
        if: inputs.operation == 'diagnostic'
        run: python3 .compile-hotspot-instrumentation/build_tools/compile_hotspot/profile.py replay --mode profile
      - name: Publish compiler traces immediately
        if: always() && inputs.operation == 'diagnostic'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck-compile-profile-${{ inputs.build_variant }}-${{ github.run_id }}
          path: |
            compile-hotspot-evidence/
            !compile-hotspot-evidence/*.o
          if-no-files-found: error
          retention-days: 14
      - name: Replay isolated object without compiler instrumentation
        if: inputs.operation == 'diagnostic'
        run: python3 .compile-hotspot-instrumentation/build_tools/compile_hotspot/profile.py replay --mode uninstrumented
      - name: Run paired original and split object-group trials
        if: inputs.operation == 'benchmark'
        run: python3 .compile-hotspot-instrumentation/build_tools/compile_hotspot/benchmark.py run
      - name: Retain exact objects and headers for GPU contract validation
        if: always() && inputs.operation == 'benchmark'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck-compile-objects-${{ inputs.build_variant }}-${{ github.run_id }}
          path: |
            compile-hotspot-evidence/benchmarks/B2/
            compile-hotspot-evidence/benchmarks/C2/
            compile-hotspot-evidence/link-support/
            build/math-libs/composable_kernel/build/include/
            rocm-libraries/projects/composablekernel/include/
            rocm-libraries/projects/composablekernel/library/include/
          if-no-files-found: error
          retention-days: 14
      - name: Retain raw diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck-compile-diagnostic-${{ inputs.build_variant }}-${{ github.run_id }}
          path: |
            compile-hotspot-evidence/
            !compile-hotspot-evidence/*.o
            !compile-hotspot-evidence/**/*.o
            !compile-hotspot-evidence/**/*.dwo
            build/logs/
          if-no-files-found: error
          retention-days: 14

  gpu_contract:
    needs: diagnostic
    if: inputs.operation == 'benchmark'
    runs-on: linux-gfx950-1gpu-ccs-ossci-rocm
    timeout-minutes: 90
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:d666e4613c1ca919bc7d1a31a4c368740b66c34b5c19ef95ba15cd31db7783fb
      options: >-
        --user 0:0 --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined --group-add video
        --device /dev/kfd --device /dev/dri
        --group-add 993 --group-add 992 --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST
    env:
      RELEASE_TYPE: ci
      BUILD_VARIANT: ${{ inputs.build_variant }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
      GH_TOKEN: ${{ github.token }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - name: Checkout frozen product tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
          set-safe-directory: false
      - name: Checkout exact contract tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .compile-hotspot-instrumentation
          persist-credentials: false
          set-safe-directory: false
      - name: Fetch this run's exact benchmark objects
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ck-compile-objects-${{ inputs.build_variant }}-${{ github.run_id }}
          path: ck-objects
      - name: Fetch this run's matching provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ck-compile-diagnostic-${{ inputs.build_variant }}-${{ github.run_id }}
          path: ck-evidence
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Link and verify every affected F32 instance
        run: python3 .compile-hotspot-instrumentation/build_tools/compile_hotspot/gpu_contract.py
      - name: Retain GPU contracts and exact link provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck-gpu-contract-${{ inputs.build_variant }}-${{ github.run_id }}
          path: |
            ck-gpu-evidence/
            !ck-gpu-evidence/*.o
          if-no-files-found: error
          retention-days: 14

  consumer_contract:
    needs: diagnostic
    if: always() && inputs.baseline_contract_run_id != '' && ((inputs.operation == 'integration' && needs.diagnostic.result == 'success') || inputs.operation == 'consumer')
    runs-on: linux-gfx950-1gpu-ccs-ossci-rocm
    timeout-minutes: 180
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:d666e4613c1ca919bc7d1a31a4c368740b66c34b5c19ef95ba15cd31db7783fb
      options: >-
        --user 0:0 --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined --group-add video
        --device /dev/kfd --device /dev/dri
        --group-add 993 --group-add 992 --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST
    env:
      RELEASE_TYPE: ci
      BUILD_VARIANT: ${{ inputs.build_variant }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
      BASELINE_CONTRACT_RUN_ID: ${{ inputs.baseline_contract_run_id }}
      BASELINE_BENCHMARK_RUN_ID: ${{ inputs.baseline_benchmark_run_id || inputs.baseline_contract_run_id }}
      INTEGRATION_PRODUCER_RUN_ID: ${{ inputs.integration_producer_run_id || github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - name: Checkout frozen product tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
          set-safe-directory: false
      - name: Checkout exact integration tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .compile-hotspot-instrumentation
          persist-credentials: false
          set-safe-directory: false
      - name: Fetch this run's rebuilt integration products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ck-miopen-integration-${{ inputs.build_variant }}-${{ inputs.integration_producer_run_id || github.run_id }}
          run-id: ${{ inputs.integration_producer_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: integration-products
      - name: Fetch paired baseline GPU results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ck-gpu-contract-${{ inputs.build_variant }}-${{ inputs.baseline_contract_run_id }}
          run-id: ${{ inputs.baseline_contract_run_id }}
          github-token: ${{ github.token }}
          path: baseline-contract
      - name: Fetch paired benchmark provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ck-compile-diagnostic-${{ inputs.build_variant }}-${{ inputs.baseline_benchmark_run_id || inputs.baseline_contract_run_id }}
          run-id: ${{ inputs.baseline_benchmark_run_id || inputs.baseline_contract_run_id }}
          github-token: ${{ github.token }}
          path: baseline-protocol
      - name: Restore exact product modes and symlinks
        run: |
          mkdir integration-bundle
          tar -xzf integration-products/integration-bundle.tar.gz -C integration-bundle
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run archive contract and MIOpen quick standard and focused tests
        run: |
          python3 .compile-hotspot-instrumentation/build_tools/compile_hotspot/integration_gpu.py \
            --variant "${BUILD_VARIANT}" --baseline-run-id "${BASELINE_RUN_ID}" \
            --producer-run-id "${INTEGRATION_PRODUCER_RUN_ID}" \
            --baseline-contract-run-id "${BASELINE_CONTRACT_RUN_ID}" \
            --baseline-benchmark-run-id "${BASELINE_BENCHMARK_RUN_ID}" \
            --baseline-contract-log baseline-contract/baseline-numeric.log \
            --baseline-contract-provenance baseline-contract/provenance.json \
            --baseline-benchmark-protocol baseline-protocol/compile-hotspot-evidence/benchmark-protocol.json
      - name: Retain integration test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck-miopen-consumer-${{ inputs.build_variant }}-${{ github.run_id }}
          path: integration-gpu-evidence/
          if-no-files-found: error
          retention-days: 14
