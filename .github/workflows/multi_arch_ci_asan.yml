name: Same-allocation filter diagnostic only (01a19119)
run-name: Runtime filter control v2 ${{ inputs.diagnostic_id }} ${{ inputs.mode }} producer ${{ inputs.producer_run_id }} (01a19119)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [joint]
      producer_run_id:
        type: choice
        required: true
        options: ['41212843218']
      diagnostic_id:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  same_allocation_filter_diagnostic:
    uses: ./.github/workflows/perf_runtime_diagnostic_component.yml
    with:
      performance_mode: ${{ inputs.mode }}
      artifact_run_id: ${{ inputs.producer_run_id }}
      artifact_group: multi-arch-asan
      amdgpu_families: gfx950-dcgpu
      amdgpu_targets: gfx950:xnack+
      test_runs_on: linux-gfx950-1gpu-ccs-ossci-rocm
      platform: linux
      component: >-
        {"additional_requirements_files":[],"job_name":"rocsolver","fetch_artifact_args":"--solver --blas --tests","timeout_minutes":60,"test_script":"python build_tools/github_actions/test_executable_scripts/test_runner.py","platform":["linux"],"total_shards_dict":{"linux":3,"windows":2},"test_type":"quick","shard_arr":[1],"total_shards":1,"test_runner":"linux-gfx950-1gpu-ccs-ossci-rocm","container_options":"--user 0:0 --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576 --security-opt seccomp=unconfined --group-add video --device /dev/kfd --device /dev/dri --group-add 993 --group-add 992 --group-add 110 --env-file /etc/podinfo/gha-gpu-isolation-settings -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST"}
      release_type: ci
