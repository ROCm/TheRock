name: Targeted profiler DEB preservation repair (01a19119)
run-name: Profiler DEB-only ${{ inputs.mode }} producer ${{ inputs.producer_run_id }} (01a19119)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [baseline, joint]
      producer_run_id:
        type: choice
        required: true
        options: ['41211496307', '41212843218']
permissions:
  contents: read
  actions: read
jobs:
  profiler_deb:
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 120
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:a13e8370a2d1d33a910e47669cdf075dbe9554685e78592f22935ec7c7c35e39
    env:
      MODE: ${{ inputs.mode }}
      PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Install Git before checkout
        run: |
          sudo apt-get update
          sudo apt-get install -y git ca-certificates
      - name: Checkout frozen product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
      - name: Checkout immutable experiment assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .perf-instrumentation
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install unchanged packaging requirements
        run: |
          pip install pyelftools==0.33 boto3==1.39.15 jinja2==3.1.6 pyzstd==0.19.1
          sudo apt-get install -y llvm-20 rpm debhelper-compat build-essential dpkg-dev createrepo-c patchelf
      - name: Qualify original producer and fetch only required immutable inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .perf-instrumentation/build_tools/perf_packaging_repair/probe.py prepare
      - name: Record original profiler ELF text and full debug sections
        run: python .perf-instrumentation/build_tools/perf_packaging_repair/probe.py before
      - name: Build only profiler DEB using existing supported DWZ exclusion
        run: |
          python ./build_tools/packaging/linux/build_package.py \
            --dest-dir output/packages \
            --rocm-version '10.3.0~dev20261031' \
            --artifacts-dir output/artifacts \
            --pkg-type deb \
            --version-suffix "${PRODUCER_RUN_ID}" \
            --build-variant asan-debug \
            --target gfx950 \
            --pkg-names amdrocm-profiler-base
      - name: Verify original text and debug payload plus package metadata
        run: python .perf-instrumentation/build_tools/perf_packaging_repair/probe.py after
      - name: Retain evidence and package logs without publishing products
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: profiler-deb-repair-${{ inputs.mode }}-01a19119
          path: |
            .profiler-deb-evidence/*.json
            output/logs
          retention-days: 14
          compression-level: 1
