name: Targeted build performance evidence (01a19119)
run-name: HEAD rocSOLVER instrumented baseline (01a19119)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rocsolver-baseline:
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 180
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:d666e4613c1ca919bc7d1a31a4c368740b66c34b5c19ef95ba15cd31db7783fb
    env:
      CCACHE_DISABLE: '1'
      TEATIME_FORCE_INTERACTIVE: '0'
    steps:
      - name: Checkout instrumentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - name: Checkout pinned Rock CI HEAD sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
          path: source
      - name: Install build dependencies and instrumentation
        working-directory: source
        run: |
          git config --global --add safe.directory "$PWD"
          pip install -r requirements.txt
          mkdir -p build_tools/perf_probe
          cp ../probe/build_tools/perf_probe/* build_tools/perf_probe/
      - name: Instrumented prerequisites and rocSOLVER baseline
        working-directory: source
        run: bash build_tools/perf_probe/run_targeted.sh
      - name: Archive evidence only
        if: always()
        run: |
          python3 - <<'PYTHON'
          import pathlib, tarfile
          root = pathlib.Path('source')
          with tarfile.open('build-performance-evidence.tar.gz', 'w:gz') as archive:
              for pattern in ('perf-*', 'build/logs'):
                  for path in root.glob(pattern):
                      archive.add(path, arcname=str(path.relative_to(root)), recursive=True)
          PYTHON
      - name: Upload investigation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-rocsolver-performance-evidence-01a19119
          path: build-performance-evidence.tar.gz
          retention-days: 14
          compression-level: 0
