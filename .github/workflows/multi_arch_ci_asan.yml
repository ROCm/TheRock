name: Targeted joint candidate device-link traces v2 (01a19119)
run-name: HEAD joint candidate device traces v2 (01a19119)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-device-traces:
    runs-on: aws-linux-scale-rocm-large
    defaults:
      run:
        shell: bash
    timeout-minutes: 240
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:d666e4613c1ca919bc7d1a31a4c368740b66c34b5c19ef95ba15cd31db7783fb
    env:
      CCACHE_DISABLE: '1'
      TEATIME_FORCE_INTERACTIVE: '0'
      PERF_PAIR_ID: candidate-trace-v2
      PERF_TRIAL_ORDER: candidate-control-and-trace-six-concurrent
    steps:
      - name: Checkout immutable trace assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: probe
      - name: Checkout frozen Rock CI HEAD source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
          path: source
      - name: Install dependencies and copy frozen and candidate probe assets
        working-directory: source
        run: |
          git config --global --add safe.directory "$PWD"
          pip install -r requirements.txt
          mkdir -p build_tools/perf_probe/{records,candidate-records}
          cp ../probe/build_tools/perf_probe/{command_trace.py,collect_build_perf.py,bootstrap-codeobj.patch} build_tools/perf_probe/
          cp ../probe/experiments/joint/{run_experiment.sh,phase_probes.py} build_tools/perf_probe/
          cp ../probe/experiments/joint/records/*.json build_tools/perf_probe/records/
          cp ../probe/experiments/compiler/{trace_getf2.py,rocsolver-specialized-shards.patch} build_tools/perf_probe/
          cp ../probe/experiments/candidate-trace-v1/{candidate_trace.py,pair1-allocation-baseline.json,candidate-source-identity.json,reference-candidate-rocsolver-version.h,version-reference-qualification.json,candidate-record-source-manifest.json} build_tools/perf_probe/
          cp ../probe/experiments/candidate-trace-v1/records/*.json build_tools/perf_probe/candidate-records/
      - name: Prepare only the frozen original prerequisite closure
        working-directory: source
        run: bash build_tools/perf_probe/run_experiment.sh prepare
      - name: Apply exact joint patch and configure candidate without compiling whole solver
        working-directory: source
        run: |
          tools="$PWD/build_tools/perf_probe"
          export THEROCK_PERF_COMMAND_DIR="$PWD/perf-commands-candidate-configure"
          mkdir -p "$THEROCK_PERF_COMMAND_DIR"
          # Reuse only the exact frozen guards/functions before its phase switch.
          source <(sed '/^case /,$d' "$tools/run_experiment.sh")
          python3 "$tools/candidate_trace.py" apply
          configure_top candidate
          configure_solver
          python3 "$tools/phase_probes.py" preflight --output perf-records/allocation-candidate-traces.json
          python3 "$tools/candidate_trace.py" verify
          python3 "$tools/phase_probes.py" prime --output perf-records --label candidate-traces
      - name: Six targeted candidate control and traced command replays
        working-directory: source
        run: |
          python3 build_tools/perf_probe/collect_build_perf.py --output perf-candidate-phase-observer --build-dir build --interval 1 -- python3 build_tools/perf_probe/candidate_trace.py launch
      - name: Require actual candidate host and device-link traces
        working-directory: source
        run: python3 build_tools/perf_probe/candidate_trace.py after
      - name: Archive evidence without private object bytes
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,tarfile
          def keep(member):
              if member.name.startswith('perf-phase-probes/') and member.name.endswith('.o'): return None
              return member
          with tarfile.open('candidate-trace-v2.tar.gz','w:gz') as archive:
              for pattern in ('perf-*','build/logs'):
                  for path in pathlib.Path('source').glob(pattern):
                      archive.add(path,arcname=str(path.relative_to('source')),filter=keep)
          PY
      - name: Upload candidate trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-trace-v2-01a19119
          path: candidate-trace-v2.tar.gz
          retention-days: 14
          compression-level: 0
