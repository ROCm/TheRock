name: gfx950 allocation diagnostic (01a19119)
run-name: gfx950 read-only allocation diagnostic (01a19119)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-capacity:
    runs-on: linux-gfx950-1gpu-ccs-ossci-rocm
    timeout-minutes: 10
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:a13e8370a2d1d33a910e47669cdf075dbe9554685e78592f22935ec7c7c35e39
      # Exact Linux GPU base options from pinned fetch_test_configurations.py.
      options: >-
        --user 0:0 --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576
        --security-opt seccomp=unconfined --group-add video
        --device /dev/kfd --device /dev/dri
        --group-add 993 --group-add 992 --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST
    env:
      CAPACITY_PROBE_REQUESTED_IMAGE: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:a13e8370a2d1d33a910e47669cdf075dbe9554685e78592f22935ec7c7c35e39
    steps:
      - name: Checkout diagnostic tools
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe

      - name: Checkout frozen Rock CI source
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
          path: source

      - name: Read allocated hardware and visible constraints
        working-directory: source
        shell: bash
        run: >-
          python3 ../probe/experiments/gpu-capacity/probe.py
          --source-root "$PWD" --output ../gpu-capacity-output --try-rocminfo

      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gfx950-allocation-diagnostic-01a19119
          path: gpu-capacity-output
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
