# Isolated test-only workflow consuming the ten pinned DASan producer artifacts.
name: Multi-Arch CI ASAN
run-name: DASan selected artifact tests gfx950 (01a17bc3)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Inspect ${{ matrix.stage }} test payloads
    runs-on: aws-linux-scale-rocm-large
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        stage: [compiler-runtime, math-libs, runtime-tests, comm-libs, storage-libs, profiler-apps, media-libs, emulation, dctools-core, cv-libs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - name: Preflight requirements and disk
        run: |
          pip install PyYAML==6.0.3
          df -h .
      - name: Verify pinned packages and inspect installed test payloads
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ matrix.stage }}
        run: python ci/dasan-selected/preflight.py --stage "$STAGE"
      - name: Preserve preflight provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preflight-${{ matrix.stage }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
  plan:
    name: Select runnable full suites
    if: always()
    needs: preflight
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: preflight-*
          path: preflight-results
      - id: plan
        run: python3 ci/dasan-selected/plan.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: selected-test-plan
          path: |
            dispatch-matrix.json
            coverage-results.json
            ci/dasan-selected/producer-manifest.json
            ci/dasan-selected/coverage.json
          retention-days: 30
  test:
    name: ${{ matrix.id }} (${{ matrix.runner }})
    needs: plan
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.container_options }}
    defaults:
      run:
        shell: bash
    env:
      VENV_DIR: ${{ github.workspace }}/.venv
      OUTPUT_ARTIFACTS_DIR: ./build
      THEROCK_BIN_DIR: ./build/bin
      AMDGPU_FAMILIES: gfx950-dcgpu
      AMDGPU_TARGETS: gfx950
      ARTIFACT_GROUP: gfx950
      BUILD_VARIANT: release
      SANITIZER_MODE: dasan
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - name: Set up CI Python environment
        run: |
          pip install uv==0.13.5
          python build_tools/setup_venv.py "$VENV_DIR" --activate-in-future-github-actions-steps --use-uv
      - name: Install base test requirements
        run: uv pip install -r requirements-test.txt
      - name: Install exact selected artifacts
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT_ID: ${{ matrix.id }}
        run: python ci/dasan-selected/prepare_component.py "$COMPONENT_ID"
      - name: Install component test requirements
        env:
          REQUIREMENTS_FILES: ${{ join(matrix.additional_requirements_files, ',') }}
        run: |
          python build_tools/install_additional_requirements.py --requirements-files "$REQUIREMENTS_FILES"
          uv pip freeze > evidence/python-freeze.txt
      - name: Run full component suite
        env:
          COMPONENT_ID: ${{ matrix.id }}
        run: python ci/dasan-selected/run_component.py --component "$COMPONENT_ID" --matrix ci/dasan-selected/matrix.json
      - name: Preserve test logs and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dasan-${{ matrix.id }}
          path: |
            evidence/
            build/**/Testing/Temporary/*.log
            build/**/*.xml
            build/**/compile_commands.json
          retention-days: 30
          if-no-files-found: warn
  coverage:
    name: Full requested coverage accounting
    if: always()
    needs: [preflight, plan, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete payload coverage and passing test jobs
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MISSING: ${{ needs.plan.outputs.missing }}
        run: |
          echo "Preflight=$PREFLIGHT_RESULT Plan=$PLAN_RESULT Tests=$TEST_RESULT Missing=$MISSING"
          test "$PREFLIGHT_RESULT" = success
          test "$PLAN_RESULT" = success
          test "$MISSING" = 0
          test "$TEST_RESULT" = success
