name: Original artifact structure repair only (01a19119)
run-name: Structure-only ${{ inputs.mode }} producer ${{ inputs.producer_run_id }} (01a19119)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [baseline, joint]
      producer_run_id:
        type: choice
        required: true
        options: ['41211496307', '41212843218']
permissions:
  contents: read
  actions: read
jobs:
  test_artifact_structure:
    name: "Validate artifact structure"
    runs-on: aws-linux-scale-rocm-large
    container:
      # https://hub.docker.com/_/python/tags?name=3.12-slim
      image: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    env:
      ARTIFACT_GITHUB_REPO: ROCm/TheRock
      ARTIFACT_RUN_ID: "${{ inputs.producer_run_id }}"
      AMDGPU_FAMILIES: gfx950-dcgpu
      RELEASE_TYPE: ci
      PLATFORM: linux
      OUTPUT_ROOT: "${{ github.workspace }}"
      THEROCK_ARTIFACTS_DIR: ${{ github.workspace }}/.download_cache
    steps:
      - name: Install Git before any checkout (prevent REST fallback)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          git --version

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa

      - name: Checkout immutable experiment assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .perf-instrumentation

      - name: Install test requirements
        run: |
          pip install -r requirements-test.txt

      - name: Verify frozen source and record full-run context
        id: perf_context
        env:
          PERF_MODE: ${{ inputs.mode }}
          PERF_CONTEXT_JSON: ${{ toJSON(inputs) }}
          PERF_MATRIX_JSON: ${{ toJSON(matrix) }}
          PERF_REQUESTED_RUNNER: aws-linux-scale-rocm-large
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py preflight --label test_artifact_structure

      - name: Qualify original producer and preserve real stock failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .perf-instrumentation/build_tools/perf_repair/repair_guard.py

      - name: Fetch artifact archives (no extract)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ./build_tools/artifact_manager.py fetch \
            --run-id="${ARTIFACT_RUN_ID}" \
            --run-github-repo="${ARTIFACT_GITHUB_REPO}" \
            --stage=all \
            --amdgpu-families="${AMDGPU_FAMILIES}" \
            --platform="${PLATFORM}" \
            --output-dir="${OUTPUT_ROOT}" \
            --no-extract
          # NOTE: artifact_manager.py appends /.download_cache to --output-dir
          # in --no-extract mode, so pass OUTPUT_ROOT here so that
          # artifacts land in THEROCK_ARTIFACTS_DIR ($OUTPUT_ROOT/.download_cache).

      - name: Validate artifact structure
        run: |
          python -m pytest tests/test_artifact_structure.py \
            -v --log-cli-level=info --timeout=300
      - name: Record final full-run provenance
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py finalize

      - name: Retain full-run investigation evidence
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.perf_context.outputs.artifact_name }}
          path: .perf-full
          include-hidden-files: true
          retention-days: 14
          compression-level: 1

