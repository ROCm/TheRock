name: Full HEAD baseline or joint validation (01a19119)
run-name: Full HEAD ${{ inputs.mode }} validation (01a19119)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: baseline
        options: [baseline, joint]
permissions:
  contents: read
  actions: read
jobs:
  setup:
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      performance_mode: ${{ inputs.mode }}
      build_variant: asan-debug
      release_type: ci
      repository: ROCm/TheRock
      ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
      linux_amdgpu_families: gfx950
      windows_amdgpu_families: none
      pr_labels: ''
      stage_reuse_mode: 'off'
      build_stages: ''
      prebuilt_stages: ''
      baseline_run_id: ''
      build_python_packages: false
      build_pytorch: false
      build_jax: false
  linux_build_and_test:
    needs: setup
    uses: ./.github/workflows/multi_arch_ci_linux.yml
    with:
      performance_mode: ${{ inputs.mode }}
      performance_gpu_runner: linux-gfx950-1gpu-ccs-ossci-rocm
      release_type: ci
      repository: ROCm/TheRock
      ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
    permissions:
      contents: read
      actions: read
      id-token: write
  ci_asan_summary:
    if: always()
    needs: [setup, linux_build_and_test]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
      - name: Evaluate every full-workflow result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 build_tools/github_actions/workflow_summary.py --needs-json "${NEEDS_JSON}"

  extra_focused_numerics:
    needs: [setup, linux_build_and_test]
    uses: ./.github/workflows/full_focused_gpu.yml
    strategy:
      fail-fast: false
      matrix:
        family_info: ${{ fromJSON(needs.setup.outputs.linux_build_config).per_family_info }}
    with:
      performance_mode: ${{ inputs.mode }}
      artifact_group: ${{ fromJSON(needs.setup.outputs.linux_build_config).artifact_group }}
      amdgpu_families: ${{ matrix.family_info.amdgpu_family }}
      amdgpu_targets: ${{ matrix.family_info.amdgpu_targets }}
      test_runs_on: linux-gfx950-1gpu-ccs-ossci-rocm
      tests_enabled: true
      test_type: ${{ matrix.family_info.test_type || needs.setup.outputs.test_type }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      release_type: ci
      repository: ROCm/TheRock
      ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
      build_variant: asan-debug
  investigation_summary:
    if: always()
    needs: [ci_asan_summary, extra_focused_numerics]
    runs-on: ubuntu-26.04
    steps:
      - name: Require stock and additional investigation checks
        env:
          STOCK_RESULT: ${{ needs.ci_asan_summary.result }}
          FOCUSED_RESULT: ${{ needs.extra_focused_numerics.result }}
        run: test "$STOCK_RESULT" = success && test "$FOCUSED_RESULT" = success
