name: Controlled specialized solver compilation (01a19119)
run-name: HEAD solver joint candidate three controlled pairs (01a19119)
"on":
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solver-pair:
    runs-on: aws-linux-scale-rocm-large
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        include:
          - pair: 1
            first: baseline
            second: candidate
          - pair: 2
            first: candidate
            second: baseline
          - pair: 3
            first: baseline
            second: candidate
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:d666e4613c1ca919bc7d1a31a4c368740b66c34b5c19ef95ba15cd31db7783fb
    env:
      CCACHE_DISABLE: '1'
      TEATIME_FORCE_INTERACTIVE: '0'
      PERF_PAIR_ID: '${{ matrix.pair }}'
      PERF_TRIAL_ORDER: '${{ matrix.first }}-then-${{ matrix.second }}'
    steps:
      - name: Checkout instrumentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: probe
      - name: Checkout frozen Rock CI HEAD source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa
          persist-credentials: false
          path: source
      - name: Install dependencies and copy reviewed experiment assets
        working-directory: source
        run: |
          git config --global --add safe.directory "$PWD"
          pip install -r requirements.txt
          mkdir -p build_tools/perf_probe/records
          cp ../probe/build_tools/perf_probe/command_trace.py build_tools/perf_probe/
          cp ../probe/build_tools/perf_probe/collect_build_perf.py build_tools/perf_probe/
          cp ../probe/build_tools/perf_probe/bootstrap-codeobj.patch build_tools/perf_probe/
          cp ../probe/experiments/joint/run_experiment.sh build_tools/perf_probe/
          cp ../probe/experiments/joint/phase_probes.py build_tools/perf_probe/
          cp ../probe/experiments/joint/records/*.json build_tools/perf_probe/records/
          cp ../probe/experiments/compiler/trace_getf2.py build_tools/perf_probe/
          cp ../probe/experiments/compiler/rocsolver-specialized-shards.patch build_tools/perf_probe/
      - name: Prerequisites, fixture and early compiler/linker capability checks
        working-directory: source
        run: bash build_tools/perf_probe/run_experiment.sh prepare
      - name: First full cold-object solver trial (${{ matrix.first }})
        working-directory: source
        run: bash build_tools/perf_probe/run_experiment.sh '${{ matrix.first }}'
      - name: Second full cold-object solver trial (${{ matrix.second }})
        working-directory: source
        run: bash build_tools/perf_probe/run_experiment.sh '${{ matrix.second }}'
      - name: Compare installed outputs and public ELF contract
        working-directory: source
        run: bash build_tools/perf_probe/run_experiment.sh compare
      - name: Four concurrent isolated control/trace probes on restored original source
        if: matrix.pair == 1
        working-directory: source
        run: bash build_tools/perf_probe/run_experiment.sh probes
      - name: Archive evidence, excluding private object bytes
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path('source')
          def keep(member):
              if member.name.startswith('perf-phase-probes/') and member.name.endswith('.o'):
                  return None
              return member
          name = 'joint-solver-perf-' + os.environ['PERF_PAIR_ID'] + '.tar.gz'
          with tarfile.open(name, 'w:gz') as archive:
              for pattern in ('perf-*', 'build/logs'):
                  for path in root.glob(pattern):
                      archive.add(path, arcname=str(path.relative_to(root)), recursive=True, filter=keep)
          PY
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-solver-perf-pair-${{ matrix.pair }}-01a19119
          path: joint-solver-perf-${{ matrix.pair }}.tar.gz
          retention-days: 14
          compression-level: 0
