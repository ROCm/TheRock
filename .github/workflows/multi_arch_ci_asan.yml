# Notes on security:
#   * As this runs on lower trust `pull_request` events it forwards
#     no github secrets to child workflows.
#   * Some child workflows are shared by releases where `secrets: inherit` is
#     used to forward credentials for Quartz notifications.

name: Multi-Arch CI ASAN
run-name: ${{ inputs.dasan_validate_run_id && format('Validate DASan SDK from run {0}', inputs.dasan_validate_run_id) || inputs.dasan_full_stack && 'DASan full stack (gfx950, fresh)' || inputs.dasan_systems_update && 'DASan ROCr and RCCL update (gfx950)' || inputs.dasan_component_stage && format('DASan {0} (gfx950)', inputs.dasan_component_stage) || github.event.pull_request.title || github.workflow }}

on:
  # TODO: Enable postsubmit ASAN once we have capacity
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      dasan_validate_run_id:
        type: string
        description: "Validate only the existing complete SDK from this original build run; no rebuild"
        default: ""
      dasan_full_stack:
        type: boolean
        description: "Build and package the full gfx950 DASan stack with same-run dependencies"
        default: false
      dasan_systems_update:
        type: boolean
        description: "Rebuild DASan compiler/runtime and gfx950 comm-libs using math artifacts from dasan_dependencies_run_id"
        default: false
      enable_dasan:
        type: boolean
        description: "Run the experimental DASan compiler/runtime build and lit tests for gfx942 and gfx950"
        default: false
      dasan_math_libraries:
        type: boolean
        description: "Build gfx950 math libraries with DASan using the installation from baseline_run_id"
        default: false
      dasan_component_stage:
        type: string
        description: "Additional gfx950 DASan stage: emulation, runtime-tests, comm-libs, cv-libs, storage-libs, debug-tools, dctools-core, profiler-apps, media-libs, or hipdnn"
        default: ""
      dasan_dependencies_run_id:
        type: string
        description: "Optional successful DASan math run providing reusable dependency artifacts for a component stage"
        default: ""
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X"
        default: ""
      pr_labels:
        type: string
        description: "Comma-separated PR labels (e.g. ci:skip-pytorch,test:rocprim,test_filter:quick)."
        default: ""
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to reuse; required for prebuilt_stages or dasan_math_libraries"
  workflow_call:
    inputs:
      linux_amdgpu_families:
        type: string
        default: ""
      pr_labels:
        type: string
        default: ""
      prebuilt_stages:
        type: string
        default: ""
      baseline_run_id:
        type: string
        default: ""
  pull_request:
    types:
      - labeled
      - opened
      - synchronize

permissions:
  contents: read
  actions: read # Required for stage reuse feature to query workflow runs

concurrency:
  # See https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  #
  # Only allow one run at a time for 'pull_request' events.
  # Allow multiple runs for 'push' and 'workflow_dispatch'.
  #
  # `github.workflow`: each workflow gets its own concurrency group
  # `github.head_ref`: the branch name (only defined for pull_request events)
  # `github.run_id`  : fallback, unique for each run
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dasan_validate_existing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dasan_validate_run_id != '' }}
    uses: ./.github/workflows/multi_arch_ci_dasan_validate_existing.yml
    with:
      origin_run_id: ${{ inputs.dasan_validate_run_id }}

  dasan_stack:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dasan_validate_run_id && inputs.dasan_full_stack }}
    uses: ./.github/workflows/multi_arch_ci_dasan_stack.yml
    permissions:
      contents: read
      actions: read
      id-token: write

  dasan_systems:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dasan_validate_run_id && !inputs.dasan_full_stack && inputs.dasan_systems_update }}
    uses: ./.github/workflows/multi_arch_ci_dasan_systems.yml
    with:
      dependencies_run_id: ${{ inputs.dasan_dependencies_run_id }}
    permissions:
      contents: read
      actions: read
      id-token: write

  dasan_component:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dasan_validate_run_id && !inputs.dasan_full_stack && !inputs.dasan_systems_update && inputs.dasan_component_stage != '' }}
    uses: ./.github/workflows/multi_arch_ci_dasan_component.yml
    with:
      stage: ${{ inputs.dasan_component_stage }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
      dependencies_run_id: ${{ inputs.dasan_dependencies_run_id }}
    permissions:
      contents: read
      actions: read
      id-token: write

  dasan:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dasan_validate_run_id && !inputs.dasan_full_stack && !inputs.dasan_systems_update && inputs.dasan_component_stage == '' && (inputs.enable_dasan || inputs.dasan_math_libraries) }}
    uses: ./.github/workflows/multi_arch_ci_dasan.yml
    with:
      math_libraries: ${{ inputs.dasan_math_libraries }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
    permissions:
      contents: read
      actions: read
      id-token: write

  setup:
    if: ${{ !inputs.dasan_validate_run_id && !inputs.dasan_full_stack && !inputs.dasan_systems_update && !inputs.enable_dasan && !inputs.dasan_math_libraries && !inputs.dasan_component_stage }}
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "asan"
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || '' }}
      pr_labels: ${{ inputs.pr_labels || '' }}
      prebuilt_stages: ${{ inputs.prebuilt_stages || '' }}
      baseline_run_id: ${{ inputs.baseline_run_id || '' }}
      build_python_packages: false
      build_pytorch: false
      build_jax: false

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_ci_linux.yml
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
    permissions:
      contents: read
      id-token: write

  ci_asan_summary:
    name: CI ASAN Summary
    if: ${{ always() && !inputs.dasan_validate_run_id && !inputs.dasan_full_stack && !inputs.dasan_systems_update && !inputs.enable_dasan && !inputs.dasan_math_libraries && !inputs.dasan_component_stage }}
    needs:
      - setup
      - linux_build_and_test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json "${NEEDS_JSON}"
