# Multi-Arch CI Coverage - Linux
#
# Runs the coverage pipeline for a single project on a single GPU family:
#
#   build (instrumented) -> test (collect profraw) -> merge -> report
#
# The compiler-runtime stage is expected to have been built already in this run
# by the caller. This workflow rebuilds only the stage that owns the target
# project, so a coverage run costs roughly one extra library build per project
# rather than a full instrumented stack.
#
# `baseline_run_id` switches the test half to the nightly hybrid model: the
# install tree comes from a regular nightly run and only the project under test
# is overlaid from this run, keeping instrumented dependencies out of the
# report. Without it the run's own artifacts are tested as built, which is what
# PR coverage wants since it only instruments the project it rebuilt.

name: Multi-Arch CI Coverage - Linux

on:
  workflow_call:
    inputs:
      project_name:
        type: string
        description: "Coverage project key (e.g. hiprand)"
      build_enabled:
        type: boolean
        default: true
        description: >-
          Build the instrumented project. Set to false when the caller already
          built a full instrumented stack in this run (nightly coverage) and
          only the test and report halves are needed.
      coverage_flag:
        type: string
        description: "Per-project CMake coverage flag (e.g. HIPRAND_ENABLE_COVERAGE)"
      build_stage:
        type: string
        default: math-libs
        description: >-
          Per-arch build stage that produces the instrumented project. Coverage
          projects are library projects, so this is a per-arch stage (math-libs,
          comm-libs) and is built for a single GPU family at a time.
      stage_project:
        type: string
        description: "Project name passed to configure_stage.py --projects"
      test_component:
        type: string
        description: "Test matrix key for the project's tests"
      object_globs:
        type: string
        description: "Comma-separated globs matching the instrumented binaries"
      fetch_artifact_args:
        type: string
        default: ""
        description: "Extra install_rocm_from_artifacts.py args for the report job"
      baseline_run_id:
        type: string
        default: ""
        description: >-
          Regular nightly run to take non-instrumented dependencies from. Set
          by the nightly caller, which instruments the whole stack in its own
          run; the test jobs then install this run and overlay only the project
          under test. Empty tests this run's artifacts as built.
      baseline_release_type:
        type: string
        default: "nightly"
        description: >-
          Release channel baseline_run_id published to. Artifacts are bucketed
          by channel, so the baseline is read from its own channel rather than
          from this run's.
      artifact_names:
        type: string
        default: ""
        description: "Artifact names holding the instrumented project, for the hybrid fetch"
      artifact_relpaths:
        type: string
        default: ""
        description: "Subproject stage directories to overlay, for the hybrid fetch"
      codecov_flag:
        type: string
        default: ""
        description: "Codecov flag to file the report under"
      amdgpu_families:
        type: string
        description: "GPU family to build and test coverage for"
      extra_cmake_options:
        type: string
        default: ""
        description: "Additional CMake options for the instrumented build"
      rocm_package_version:
        type: string
      test_type:
        type: string
        default: quick
      release_type:
        type: string
        default: ci
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, propagated from the caller
          to link this run to its release lineage.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Only the stage that owns the target project is rebuilt. The compiler-runtime
  # it links against was published earlier in this same run by the caller, so the
  # stage's inbound artifact fetch picks it up by run id.
  build_coverage:
    name: Build Coverage (${{ inputs.project_name }})
    if: ${{ inputs.build_enabled }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    secrets: inherit
    with:
      stage_name: ${{ inputs.build_stage }}
      stage_display_name: "Stage - Coverage ${{ inputs.project_name }} (${{ inputs.amdgpu_families }})"
      timeout_minutes: 480 # 8 hours; instrumented builds are slower than normal
      amdgpu_family: ${{ inputs.amdgpu_families }}
      dist_amdgpu_families: ${{ inputs.amdgpu_families }}
      stage_projects: ${{ inputs.stage_project }}
      # KPACK artifact splitting is disabled so the instrumented device code
      # stays in the library that llvm-cov is pointed at.
      extra_cmake_options: >-
        -D${{ inputs.coverage_flag }}=ON
        -DTHEROCK_FLAG_KPACK_SPLIT_ARTIFACTS=OFF
        ${{ inputs.extra_cmake_options }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write

  configure_test_matrix:
    name: Configure Coverage Tests (${{ inputs.project_name }})
    needs: build_coverage
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.configure.outputs.components }}
      platform: ${{ steps.configure.outputs.platform }}
    steps:
      - name: Checking out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout CI config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
        continue-on-error: true

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Configuring coverage test options
        id: configure
        env:
          ARTIFACT_GROUP: multi-arch-coverage
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          TEST_TYPE: ${{ inputs.test_type }}
          TEST_LABELS: "[]"
          # Only the instrumented project was rebuilt, so only its tests can
          # contribute coverage.
          PROJECTS_TO_TEST: ${{ inputs.test_component }}
          CI_CONFIG_PATH: ci-config
          BUILD_VARIANT: coverage
        run: |
          python ./build_tools/github_actions/fetch_test_configurations.py \
            --platform=linux

  test_coverage:
    name: Test Coverage (${{ inputs.project_name }})
    needs: [build_coverage, configure_test_matrix]
    if: >-
      ${{
        !failure() && !cancelled() &&
        needs.configure_test_matrix.outputs.components != '' &&
        needs.configure_test_matrix.outputs.components != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        components: ${{ fromJSON(needs.configure_test_matrix.outputs.components || '[]') }}
    uses: ./.github/workflows/test_component.yml
    secrets: inherit
    with:
      artifact_group: multi-arch-coverage
      amdgpu_families: ${{ inputs.amdgpu_families }}
      test_runs_on: ${{ matrix.components.test_runner }}
      platform: ${{ needs.configure_test_matrix.outputs.platform }}
      component: ${{ toJSON(matrix.components) }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      build_variant: coverage
      coverage_enabled: true
      coverage_artifact_prefix: coverage-profraw-${{ inputs.project_name }}-${{ inputs.amdgpu_families }}
      coverage_baseline_run_id: ${{ inputs.baseline_run_id }}
      coverage_baseline_release_type: ${{ inputs.baseline_release_type }}
      coverage_artifact_names: ${{ inputs.artifact_names }}
      coverage_artifact_relpaths: ${{ inputs.artifact_relpaths }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}

  aggregate_coverage:
    name: Coverage Report (${{ inputs.project_name }})
    needs: [configure_test_matrix, test_coverage]
    # Runs even when some shards failed: a partial report is more useful than
    # none, and a failing test still exercises code.
    if: >-
      ${{
        !cancelled() &&
        needs.configure_test_matrix.result == 'success' &&
        needs.configure_test_matrix.outputs.components != '[]'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      OUTPUT_ARTIFACTS_DIR: ${{ github.workspace }}/build
      PROFRAW_DIR: ${{ github.workspace }}/coverage-profraw
      REPORT_DIR: ${{ github.workspace }}/coverage-report
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Checking out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Download profraw files from all shards
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-profraw-${{ inputs.project_name }}-${{ inputs.amdgpu_families }}-*
          path: ${{ env.PROFRAW_DIR }}
        continue-on-error: true

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Download instrumented artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          FETCH_ARTIFACT_ARGS: ${{ inputs.fetch_artifact_args }}
        run: |
          python ./build_tools/install_rocm_from_artifacts.py \
            --run-id=${{ github.run_id }} \
            --artifact-group=${{ inputs.amdgpu_families }} \
            --output-dir=${OUTPUT_ARTIFACTS_DIR} \
            ${FETCH_ARTIFACT_ARGS}

      - name: Merge profraw and generate lcov report
        run: |
          python ./build_tools/github_actions/merge_coverage_report.py \
            --profraw-dir="${PROFRAW_DIR}" \
            --rocm-dir="${OUTPUT_ARTIFACTS_DIR}" \
            --object-globs="${{ inputs.object_globs }}" \
            --profdata-output="${REPORT_DIR}/coverage.profdata" \
            --lcov-output="${REPORT_DIR}/coverage.info"

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ inputs.project_name }}-${{ inputs.amdgpu_families }}
          path: ${{ env.REPORT_DIR }}/coverage.info
          if-no-files-found: warn

      # Skipped rather than failed when the repository has no Codecov token,
      # so forks and first-time setups still get the lcov artifact above.
      - name: Upload report to Codecov
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.REPORT_DIR }}/coverage.info
          flags: ${{ inputs.codecov_flag || inputs.project_name }}
          name: ${{ inputs.project_name }}-${{ inputs.amdgpu_families }}
          fail_ci_if_error: false
