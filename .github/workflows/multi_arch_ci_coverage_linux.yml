# Multi-Arch CI Coverage - Linux
#
# Per-platform build + fanout layer. Builds one fully instrumented Linux stack
# covering every coverage-enabled project, then fans out to
# multi_arch_ci_coverage_report.yml once per project to test against that stack
# and report separately. Paying for a single large build rather than one build
# per project is what keeps the cost flat as more projects are onboarded.
#
# The stack is assembled by naming the stages coverage needs and calling the
# shared per-stage build workflow for each, rather than running the whole
# multi_arch_build_portable_linux.yml pipeline and filtering stages out of it.
#
# The shared coverage matrix and build configuration are computed once by the
# parent (multi_arch_ci_coverage.yml) and handed down as inputs, so that adding
# multi_arch_ci_coverage_windows.yml later duplicates none of that logic -- it
# only mirrors the build + fanout below with Windows runners.

name: Multi-Arch CI Coverage - Linux

on:
  workflow_call:
    inputs:
      coverage_matrix:
        type: string
        description: "JSON array of per-project coverage matrix entries produced by setup_coverage_matrix."
      dist_amdgpu_families:
        type: string
        description: "GPU families the instrumented stack is distributed for."
      families_matrix_json:
        type: string
        description: "JSON array of per-family build matrix entries for the math-libs stage."
      coverage_cmake_options:
        type: string
        description: "Extra CMake options enabling instrumentation for the selected projects."
      needs_math_libs:
        type: string
        description: "'true' when the selection requires the math-libs stage to be built."
      rocm_package_version:
        type: string
        description: "Computed ROCm package version stamped onto the instrumented build."
      baseline_run_id:
        type: string
        default: ""
        description: "Regular nightly run id supplying the non-instrumented dependencies. Empty tests this run's own instrumented stack end to end."
      baseline_release_type:
        type: string
        default: "nightly"
        description: "Release channel baseline_run_id published to; artifacts are bucketed by channel."
      baseline_repository:
        type: string
        default: ""
        description: "Repository owning baseline_run_id (owner/repo). Release nightlies come from ROCm/rockrel; empty means this repository."
      test_type:
        type: string
        default: "standard"
        description: "Test type to run against the instrumented build."
      release_type:
        type: string
        default: "ci"
        description: "Release channel this coverage run's own instrumented artifacts publish to."
      quartz_tracking_id:
        type: string
        default: ""
        description: >-
          Leave empty. Internal Quartz tracking id, propagated from the caller
          to link this run to a release lineage once the nightly dispatches
          coverage automatically.

permissions:
  contents: read

jobs:
  # Built first so that every later stage in this run has a compiler-runtime to
  # link against and to fetch as an inbound artifact.
  build_instrumented_compiler_runtime:
    name: Build Instrumented Compiler Runtime
    if: ${{ inputs.coverage_matrix != '[]' }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    secrets: inherit
    with:
      stage_name: compiler-runtime
      stage_display_name: "Stage - Coverage Compiler Runtime"
      timeout_minutes: 480 # 8 hours (compiler is big)
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      release_type: ci
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write

  # The whole stage is built, not just the onboarded projects: the test jobs
  # below need the complete dependency set, and phase 1 instruments every
  # onboarded project in one pass rather than per changed project.
  # `coverage_cmake_options` is the THEROCK_COVERAGE_*_ALL group option when the
  # selection covers a whole group, and the individual project flags otherwise;
  # everything not selected builds normally.
  build_instrumented_math_libs:
    name: Build Instrumented Math Libs
    needs: build_instrumented_compiler_runtime
    if: >-
      ${{
        !failure() && !cancelled() &&
        inputs.needs_math_libs == 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        family_info: ${{ fromJSON(inputs.families_matrix_json) }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    secrets: inherit
    with:
      stage_name: math-libs
      stage_display_name: "Stage - Coverage Math Libs (${{ matrix.family_info.amdgpu_family }})"
      timeout_minutes: 480 # 8 hours; instrumented builds are slower than normal
      amdgpu_family: ${{ matrix.family_info.amdgpu_family }}
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      extra_cmake_options: ${{ inputs.coverage_cmake_options }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      release_type: ci
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write

  # One test + report job per project. The instrumented stack built above is the
  # only thing taken from this run: each job installs `baseline_run_id` and then
  # replaces its own project, so a project's dependencies stay non-instrumented
  # even though the build instrumented all of them at once.
  coverage_report:
    name: Coverage::${{ matrix.coverage.project_name }} (${{ matrix.coverage.amdgpu_families }})
    # compiler-runtime is named explicitly rather than relied on through
    # math-libs: a selection that needs no math-libs build still tests against
    # binaries that stage produced.
    needs:
      [
        build_instrumented_compiler_runtime,
        build_instrumented_math_libs,
      ]
    # `!failure() && !cancelled()` alone would let this run when the parent's
    # matrix was empty, and fromJSON('') is a hard error, so the matrix has to
    # be checked explicitly.
    if: >-
      ${{
        !failure() && !cancelled() &&
        inputs.coverage_matrix != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        coverage: ${{ fromJSON(inputs.coverage_matrix) }}
    uses: ./.github/workflows/multi_arch_ci_coverage_report.yml
    secrets: inherit
    with:
      project_name: ${{ matrix.coverage.project_name }}
      test_component: ${{ matrix.coverage.test_component }}
      object_globs: ${{ matrix.coverage.object_globs }}
      fetch_artifact_args: ${{ matrix.coverage.fetch_artifact_args }}
      build_stage: ${{ matrix.coverage.build_stage }}
      codecov_flag: ${{ matrix.coverage.codecov_flag }}
      amdgpu_families: ${{ matrix.coverage.amdgpu_families }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
      baseline_repository: ${{ inputs.baseline_repository }}
      test_type: ${{ inputs.test_type || 'standard' }}
      release_type: ${{ inputs.release_type || 'ci' }}
    permissions:
      contents: read
      id-token: write
