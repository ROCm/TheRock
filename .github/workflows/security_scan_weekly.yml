#
# Trusted security scan: full-repo scan (scan_mode: all) with SARIF results
# uploaded to the Security tab. `security-events: write` is granted on the
# `uses:` job itself, not just the top-level `permissions:` block above it,
# since a `permissions:` block (wherever declared) implicitly zeroes out
# anything it doesn't list. See the PR-time counterpart
# (security_scan_pr.yml) for the human-readable, non-elevated variant.

name: Security scan (Weekly)

on:
  schedule:
    - cron: "0 10 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    permissions:
      contents: read
      security-events: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@3a1bd0da89771757df435817daae14d1635b7fdb # v1.0.1
    with:
      scan_mode: all
      report_formats: sarif
      bandit_config_path: build_tools/scan_tools/bandit.yml
      codeql_config_path: build_tools/scan_tools/codeql.yml
      gitleaks_config_path: build_tools/scan_tools/gitleaks.toml
      trivy_config_path: build_tools/scan_tools/trivy.yml
      zizmor_config_path: build_tools/scan_tools/zizmor.yml
