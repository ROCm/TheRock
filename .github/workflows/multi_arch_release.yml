# This workflow is the entry point for multi-arch releases.
#
# For manual dev releases, trigger via workflow_dispatch on TheRock.
# For scheduled nightly releases, rockrel will call this via workflow_call
# (TODO: pass required inputs through to setup job explicitly as needed).
#
# If we want per-platform status badges, independent retryability, or
# isolation from cross-platform runner queue issues, we can switch to
# dispatching each platform job via workflow_dispatch. That will also
# let us have this pre-trigger job freeze commits/versions so re-runs use
# consistent values, see https://github.com/ROCm/TheRock/issues/1236.

name: Multi-Arch Release

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Release type: "dev", "dev-bkc", "nightly", "nightly-bkc", or "prerelease".'
        type: string
        required: true
      prerelease_version:
        description: Prerelease version number such as '2'. This gets appended to the computed version after 'rc', like '7.10.0rc2'
        type: string
        default: ""
      # For workflow_call, default to empty and trust the calling workflow to be explicit or pass "all".
      linux_amdgpu_families:
        description: 'Comma-separated list of Linux GPU families. "all" = all, "none" or empty = skip.'
        type: string
        default: ""
      windows_amdgpu_families:
        description: 'Comma-separated list of Windows GPU families. "all" = all, "none" or empty = skip.'
        type: string
        default: ""
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      run_full_pytorch_tests:
        description: Run full PyTorch tests after scheduled nightly Linux PyTorch wheel builds complete.
        type: boolean
        default: false
      build_pytorch:
        description: "Build PyTorch wheels"
        type: boolean
        default: true
      build_jax:
        description: "Build JAX wheels"
        type: boolean
        default: true
      python_version:
        description: "Single Python version for wheel builds (empty for full matrix)"
        type: string
        default: ""
      resource_probe_targets:
        description: "JSON array of exact Linux stage or core release selectors to probe."
        type: string
        default: "[]"
      resource_probe_interval_seconds:
        description: "Resource probe sampling interval in seconds."
        type: number
        default: 5
      resource_probe_detail_profile:
        description: 'Resource probe detail: "basic", "process", or "diagnostic".'
        type: string
        default: "diagnostic"
      resource_probe_phases:
        description: "JSON array of allowlisted Linux release phases to probe."
        type: string
        default: '["dependency-install","fetch-inbound-artifacts","fetch-sources","configure","build-stage","build-tests","packaging-tests","artifact-push","log-upload","package-fetch","package-build","package-test","package-repository-build","package-upload","publish-release-buckets"]'
      windows_resource_probe_targets:
        description: "JSON array of exact Windows stage or packaging selectors to probe."
        type: string
        default: "[]"
      windows_resource_probe_interval_seconds:
        description: "Windows resource probe sampling interval in seconds."
        type: number
        default: 5
      windows_resource_probe_canary_mode:
        description: "Use Windows publication dry-run and disable Windows downstream dispatches for qualification."
        type: boolean
        default: false
      # Enable Quartz release-lineage tracking. When on, this run's id is
      # propagated to every triggered workflow as quartz_tracking_id, formatted
      # as "<github.run_id>;<release_type>". Tracking is currently only
      # meaningful for rockrel-initiated runs; enabling it for a manual TheRock
      # dispatch has no effect on Quartz tracking.
      enable_quartz_tracking:
        description: "Enable Quartz release-lineage tracking (off by default)."
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type; ordinary developer-triggered jobs should use "dev".'
        type: choice
        # Only dev-channel release types are exposed for manual dispatch in
        # TheRock. Nightly release types are supplied by rockrel.
        options:
          - dev
        default: dev
      prerelease_version:
        description: Prerelease version number such as '2'. This gets appended to the computed version after 'rc', like '7.10.0rc2'
        type: string
        default: ""
      # For workflow_dispatch, default to a single GPU family to limit CI load for most workflow runs.
      # Note: empty string will be converted to the default by github, so we need an explicit "none".
      linux_amdgpu_families:
        description: 'Comma-separated list of Linux GPU families. "all" = all, "none" = skip platform.'
        type: string
        default: "gfx94x"
      windows_amdgpu_families:
        description: 'Comma-separated list of Windows GPU families. "all" = all, "none" = skip platform.'
        type: string
        default: "gfx110x"
      run_full_pytorch_tests:
        description: Run full PyTorch tests after scheduled nightly Linux PyTorch wheel builds complete.
        type: boolean
        default: false
      build_pytorch:
        description: "Build PyTorch wheels"
        type: boolean
        default: false
      build_jax:
        description: "Build JAX wheels"
        type: boolean
        default: false
      python_version:
        description: "Single Python version for wheel builds (empty for full matrix)"
        type: string
        default: ""
      resource_probe_targets:
        description: >-
          JSON array of exact Linux stage or core release selectors, for example
          ["compiler-runtime", "math-libs:gfx94X-dcgpu", "release-tarballs:linux"].
        type: string
        default: "[]"
      windows_resource_probe_targets:
        description: "JSON array of exact Windows stage or packaging selectors to probe."
        type: string
        default: "[]"
      windows_resource_probe_canary_mode:
        description: "Pin Windows stages, disable ccache, dry-run final publication, and skip downstream dispatches."
        type: boolean
        default: false
      windows_resource_probe_canary_pair:
        description: "Optional A/B canary pair label (1, 2, or 3)."
        type: choice
        options: ['1', '2', '3']
        required: false
      windows_resource_probe_canary_variant:
        description: "Optional A/B canary variant label."
        type: choice
        options: [baseline, probed]
        required: false
      # Enable Quartz release-lineage tracking. When on, this run's id is
      # propagated to every triggered workflow as quartz_tracking_id, formatted
      # as "<github.run_id>;<release_type>". Tracking is currently only
      # meaningful for rockrel-initiated runs; enabling it for a manual TheRock
      # dispatch has no effect on Quartz tracking.
      enable_quartz_tracking:
        description: "Enable Quartz release-lineage tracking (off by default)."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # Required for stage reuse feature to query workflow runs

run-name: >-
  Multi-Arch Release (${{ inputs.release_type }})
  | Linux: ${{ inputs.linux_amdgpu_families || 'none' }}
  | Windows: ${{ inputs.windows_amdgpu_families || 'none' }}
  | Windows canary: ${{ inputs.windows_resource_probe_canary_pair || 'off' }}-${{ inputs.windows_resource_probe_canary_variant || 'off' }}

jobs:
  notify_quartz_start:
    if: ${{ !inputs.windows_resource_probe_canary_mode && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    name: "Quartz - started - release"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: "Quartz - started - release"
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: started
          reporting_workflow: multi_arch_release.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

  setup:
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "release"
      release_type: ${{ inputs.release_type }}
      prerelease_version: ${{ inputs.prerelease_version }}
      build_pytorch: ${{ inputs.build_pytorch }}
      build_jax: ${{ inputs.build_jax }}
      python_version: ${{ inputs.python_version }}
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref }}
      quartz_tracking_id: ${{ inputs.enable_quartz_tracking && format('{0};{1}', github.run_id, inputs.release_type) || '' }}
    secrets: inherit

  linux_release:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: ${{ needs.setup.outputs.linux_build_config != '' }}
    uses: ./.github/workflows/multi_arch_release_linux.yml
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ needs.setup.outputs.ref }}
      run_full_pytorch_tests: ${{ inputs.run_full_pytorch_tests }}
      build_pytorch: ${{ inputs.build_pytorch }}
      build_jax: ${{ inputs.build_jax }}
      python_version: ${{ inputs.python_version }}
      quartz_tracking_id: ${{ inputs.enable_quartz_tracking && format('{0};{1}', github.run_id, inputs.release_type) || '' }}
      resource_probe_targets: ${{ inputs.resource_probe_targets }}
      resource_probe_interval_seconds: ${{ inputs.resource_probe_interval_seconds || 5 }}
      resource_probe_detail_profile: ${{ inputs.resource_probe_detail_profile || 'diagnostic' }}
      resource_probe_phases: ${{ inputs.resource_probe_phases || '["dependency-install","fetch-inbound-artifacts","fetch-sources","configure","build-stage","build-tests","packaging-tests","artifact-push","log-upload","package-fetch","package-build","package-test","package-repository-build","package-upload","publish-release-buckets"]' }}
    permissions:
      contents: read
      actions: write  # Added permission to trigger workflows
      id-token: write  # Added permission for AWS S3 upload

  windows_release:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: ${{ needs.setup.outputs.windows_build_config != '' }}
    uses: ./.github/workflows/multi_arch_release_windows.yml
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.windows_build_config }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ needs.setup.outputs.ref }}
      build_pytorch: ${{ inputs.build_pytorch }}
      python_version: ${{ inputs.python_version }}
      quartz_tracking_id: ${{ inputs.enable_quartz_tracking && format('{0};{1}', github.run_id, inputs.release_type) || '' }}
      windows_resource_probe_targets: ${{ inputs.windows_resource_probe_targets || '[]' }}
      windows_resource_probe_interval_seconds: ${{ inputs.windows_resource_probe_interval_seconds || 5 }}
      resource_probe_detail_profile: ${{ inputs.resource_probe_detail_profile || 'diagnostic' }}
      resource_probe_phases: ${{ inputs.resource_probe_phases || '["dependency-install","fetch-inbound-artifacts","fetch-sources","configure","build-stage","build-tests","packaging-tests","artifact-push","log-upload","package-fetch","package-build","package-test","package-repository-build","package-upload","publish-release-buckets"]' }}
      resource_probe_canary_mode: ${{ inputs.windows_resource_probe_canary_mode || false }}
    permissions:
      contents: read
      actions: write  # Added permission to trigger workflows
      id-token: write  # Added permission for AWS S3 upload

  windows_canary_label_evidence:
    name: Windows canary label evidence
    needs: windows_release
    if: >-
      ${{ always() && inputs.windows_resource_probe_canary_mode &&
      inputs.windows_resource_probe_canary_pair != '' &&
      inputs.windows_resource_probe_canary_variant != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Write pair label
        env:
          PAIR_INDEX: ${{ inputs.windows_resource_probe_canary_pair }}
          VARIANT: ${{ inputs.windows_resource_probe_canary_variant }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.windows_release.result }}
        run: |
          mkdir -p evidence
          jq -n \
            --arg pair_index "${PAIR_INDEX}" \
            --arg variant "${VARIANT}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg run_id "${RUN_ID}" \
            --arg release_result "${RELEASE_RESULT}" \
            '{schema:"therock.windows_canary_label.v1",pair_index:$pair_index,variant:$variant,head_sha:$head_sha,run_id:$run_id,release_result:$release_result}' \
            > evidence/canary-label.json
      - name: Upload pair label
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-canary-label-pair-${{ inputs.windows_resource_probe_canary_pair }}-${{ inputs.windows_resource_probe_canary_variant }}-${{ github.run_attempt }}
          path: evidence/canary-label.json
          if-no-files-found: error
          retention-days: 14

  notify_quartz_completed:
    if: ${{ always() && !inputs.windows_resource_probe_canary_mode && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
    needs: [setup, linux_release, windows_release]
    name: "Quartz - completed - release"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: "Quartz - completed - release"
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: completed
          reporting_workflow: multi_arch_release.yml
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_captured_outputs: ${{ toJSON(needs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
