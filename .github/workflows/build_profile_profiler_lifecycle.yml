name: Targeted profiler lifecycle diagnostic
on:
  workflow_call:
permissions:
  contents: read
jobs:
  context:
    if: ${{ github.repository == 'ROCm/TheRock' && github.actor == 'sa-faizal' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python build_tools/profile_profiler_lifecycle.py context --output profiler-lifecycle/context.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: profiler-lifecycle-context
          path: profiler-lifecycle/
          if-no-files-found: error
          retention-days: 14
  lifecycle:
    needs: context
    uses: ./.github/workflows/test_component.yml
    with:
      profile_lifecycle_diagnostic: true
      artifact_run_id: "41271198901"
      artifact_group: multi-arch-release
      amdgpu_families: gfx94X-dcgpu
      amdgpu_targets: gfx942
      test_runs_on: linux-gfx942-1gpu-ccs-csp-ossci-rocm
      platform: linux
      release_type: ci
      build_variant: release
      ref: ${{ github.sha }}
      component: >-
        {"additional_requirements_files":["build/share/rocprofiler-sdk/tests/requirements.txt","build_tools/github_actions/test_executable_scripts/requirements-test-ninja.txt"],"job_name":"rocprofiler-sdk","fetch_artifact_args":"--tests","timeout_minutes":20,"test_script":"python build_tools/profile_profiler_lifecycle.py run","platform":["linux"],"container_options":"--user 0:0 --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576 --security-opt seccomp=unconfined --group-add video --device /dev/kfd --device /dev/dri --group-add 993 --group-add 992 --group-add 110 --env-file /etc/podinfo/gha-gpu-isolation-settings -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST --cap-add=SYS_PTRACE","total_shards_dict":{"linux":1},"container_image":"ghcr.io/rocm/no_rocm_image_ubuntu24_04_openmpi@sha256:64f8d6e3e6dfd46e2b1b9321b99aa72fd09140025638e27e5a0d50acb0e69e89","exclude_family":{"linux":["gfx125X-dcgpu"]},"test_type":"comprehensive","shard_arr":[1],"total_shards":1,"test_runner":"linux-gfx942-1gpu-ccs-csp-ossci-rocm"}
