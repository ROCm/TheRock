name: Test ROCm Wheels

on:
  workflow_dispatch:
    inputs:
      amdgpu_family:
        description: GPU family to test (e.g., gfx94X-dcgpu, gfx110X-all)
        required: true
        type: string
        default: "gfx94X-dcgpu"
      test_runs_on:
        description: Runner label to use. The selected runner should have a GPU supported by amdgpu_family
        required: true
        type: string
        default: "linux-gfx942-1gpu-ccs-csp-ossci-rocm"
      package_index_url:
        description: >-
          Full repo.amd.com aggregate Python package index URL for use with --index-url.
        type: string
        default: "https://nightly.repo.amd.com/rocm/whl-next/"
      package_find_links_url:
        description: Full Python package index URL for use with --find-links (usually instead of package_index_url)
        type: string
      python_version:
        required: true
        type: string
        default: "3.12"
      rocm_version:
        description: ROCm version to pip install (e.g. "7.10.0a20251124")
        required: true
        type: string
      kpack_split:
        description: "'true' if this is a kpack-split flat build."
        type: string
        default: "false"
      container_image_name:
        description: >-
          Short, human-readable label for the container image (e.g. 'ubuntu24.04',
          'ubi10', 'native'). Use 'native' (with an empty container_image_url) for
          native runners like Windows.
        type: string
        default: "ubuntu24.04"
      container_image_url:
        description: >-
          Container image reference (e.g. 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:...').
          Only applied when test_runs_on targets Linux. Leave empty to run directly
          on the runner (required for Windows and native Linux runners).
        type: string
        default: "ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:405945a40deaff9db90b9839c0f41d4cba4a383c1a7459b28627047bf6302a26"

  workflow_call:
    inputs:
      amdgpu_family:
        required: true
        type: string
      test_runs_on:
        required: true
        type: string
      package_index_url:
        description: >-
          Full Python package index URL for use with --index-url.
        type: string
      package_find_links_url:
        type: string
      python_version:
        required: true
        type: string
      rocm_version:
        required: true
        type: string
      container_image_name:
        description: >-
          Short, human-readable label for the container image (e.g. 'ubuntu24.04',
          'ubi10', 'native'). Callers must pass this explicitly so this workflow
          stays image-agnostic. Use 'native' (with an empty container_image_url)
          for native runners like Windows.
        required: true
        type: string
      container_image_url:
        description: >-
          Container image reference. Only applied when test_runs_on targets Linux.
          Pass an empty string to run directly on the runner (required for Windows
          and native Linux runners).
        required: true
        type: string
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""

permissions:
  contents: read

run-name: Test ROCm Wheels (${{ inputs.amdgpu_family }}, py${{ inputs.python_version }}, ${{ inputs.rocm_version }}, ${{ inputs.test_runs_on }})

jobs:
  test_wheels:
    name: Test ROCm wheels | ${{ inputs.amdgpu_family }} | py${{ inputs.python_version }} | ${{ inputs.container_image_name }}
    if: ${{ inputs.test_runs_on != '' }}
    runs-on: ${{ inputs.test_runs_on }}
    timeout-minutes: 30
    container:
      image: ${{ contains(inputs.test_runs_on, 'linux') && inputs.container_image_url != '' && inputs.container_image_url || null }}
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        --user 0:0 # Running as root, by recommendation of GitHub: https://docs.github.com/en/actions/reference/workflows-and-actions/dockerfile-support#user
    defaults:
      run:
        shell: bash
    env:
      # Use a venv path containing a space on Windows so that `rocm-sdk test`
      # exercises the space-in-path handling of the console-script trampolines
      # (users often install under paths like "C:\Users\First Last\..." or "C:\Program Files\...").
      # See https://github.com/ROCm/TheRock/issues/7075.
      VENV_DIR: ${{ contains(inputs.test_runs_on, 'windows') && format('{0}/.venv with spaces', github.workspace) || format('{0}/.venv', github.workspace) }}
      PROFILER_VENV_DIR: ${{ github.workspace }}/.venv-profiler
      ROCSHMEM4PY_VENV_DIR: ${{ github.workspace }}/.venv-rocshmem4py

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      # actions/setup-python only has prebuilt binaries for Ubuntu
      - name: Set up Python
        if: ${{ inputs.container_image_url == '' || contains(inputs.container_image_name, 'ubuntu') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Compute ROCm device extras
        id: device_extras
        run: |
          python build_tools/github_actions/expand_amdgpu_families.py \
            --amdgpu-families "${{ inputs.amdgpu_family }}" \
            --output-mode=device-extras

      # Key off install_libraries success (not test_libraries) so devel install/test still run
      - name: Install rocm[libraries]
        id: install_libraries
        run: |
          pkg="rocm[libraries]"
          if [ -n "${{ steps.device_extras.outputs.device_extras }}" ]; then
            pkg="${pkg%]},${{ steps.device_extras.outputs.device_extras }}]"
          fi
          python build_tools/setup_venv.py "${VENV_DIR}" \
            --packages "${pkg}==${{ inputs.rocm_version }}" \
            --index-url=${{ inputs.package_index_url }} \
            --find-links=${{ inputs.package_find_links_url }} \
            --activate-in-future-github-actions-steps

      - name: Show installed packages (libraries)
        if: ${{ !cancelled() && steps.install_libraries.outcome == 'success' }}
        run: |
          pip freeze

      - name: Test rocm[libraries]
        id: test_libraries
        if: ${{ !cancelled() && steps.install_libraries.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          rocm-sdk test

      - name: Install rocshmem4py from packages
        id: install_rocshmem4py
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.install_libraries.outcome == 'success' }}
        env:
          PACKAGE_FIND_LINKS_URL: ${{ inputs.package_find_links_url }}
          PACKAGE_INDEX_URL: ${{ inputs.package_index_url }}
        run: |
          # Keep this inline: repository/ref may select untrusted checkout code.
          # Use the provisioned pip to install into a clean, pip-less venv.
          python -m venv --clear --without-pip "${ROCSHMEM4PY_VENV_DIR}"

          pip_args=(--disable-pip-version-check --no-cache-dir --only-binary=:all: --pre rocshmem4py)
          if [[ -n "${PACKAGE_INDEX_URL}" ]]; then
            pip_args+=(--index-url "${PACKAGE_INDEX_URL}")
          else
            pip_args+=(--no-index)
          fi
          if [[ -n "${PACKAGE_FIND_LINKS_URL}" ]]; then
            pip_args+=(--find-links "${PACKAGE_FIND_LINKS_URL}")
          fi

          for attempt in {1..13}; do
            if python -m pip --python "${ROCSHMEM4PY_VENV_DIR}" \
              install "${pip_args[@]}"; then
              break
            fi
            if [[ "${attempt}" == 13 ]]; then
              exit 1
            fi
            sleep 15
          done

      - name: Test installed rocshmem4py wheel
        if: ${{ !cancelled() && steps.install_rocshmem4py.outcome == 'success' }}
        timeout-minutes: 5
        env:
          EXPECTED_ROCM_VERSION: ${{ inputs.rocm_version }}
          ROCSHMEM_HEAP_SIZE: 268435456
        run: |
          # Parse installed metadata with the provisioned pip environment.
          python - "${ROCSHMEM4PY_VENV_DIR}/bin/python" <<'PY'
          import os
          from importlib.metadata import distributions
          import subprocess
          import sys

          from pip._vendor.packaging.requirements import Requirement
          from pip._vendor.packaging.utils import canonicalize_name
          from pip._vendor.packaging.version import Version

          target_python = sys.argv[1]
          target_site_packages = subprocess.check_output(
              [
                  target_python,
                  "-c",
                  "import sysconfig; print(sysconfig.get_path('purelib'))",
              ],
              text=True,
          ).strip()
          installed = {
              canonicalize_name(dist.metadata["Name"]): dist
              for dist in distributions(path=[target_site_packages])
          }
          rocshmem4py_dist = installed["rocshmem4py"]
          core_dist = installed["rocm-sdk-core"]

          wheel_version = Version(rocshmem4py_dist.version)

          expected_rocm_version = Version(os.environ["EXPECTED_ROCM_VERSION"])
          identity = "devrocm" if expected_rocm_version.is_devrelease else "rocm"
          expected_local = Version(
              f"0+{identity}{str(expected_rocm_version).replace('+', '-')}"
          ).local
          assert wheel_version.local == expected_local
          assert Version(core_dist.version) == expected_rocm_version

          core_requirements = [
              requirement
              for requirement in map(Requirement, rocshmem4py_dist.requires or [])
              if canonicalize_name(requirement.name) == "rocm-sdk-core"
          ]
          assert len(core_requirements) == 1
          assert str(core_requirements[0].specifier) == (
              f"=={expected_rocm_version}"
          )
          PY

          "${ROCSHMEM4PY_VENV_DIR}/bin/python" - <<'PY'
          import _rocshmem4py
          import rocshmem4py

          assert rocshmem4py.__rocshmem_version__

          rocshmem4py.set_hip_device_from_env()
          unique_id = rocshmem4py.rocshmem_get_uniqueid()
          rocshmem4py.rocshmem_init_attr(0, 1, unique_id)
          try:
              buffer = rocshmem4py.rocshmem_create_buffer(4096)
              assert buffer.ptr > 0
              buffer.free()
          finally:
              rocshmem4py.hip_device_synchronize()
              rocshmem4py.rocshmem_barrier_all()
              rocshmem4py.rocshmem_finalize()
          PY

      - name: Install rocm[libraries,devel]
        id: install_devel
        if: ${{ !cancelled() && steps.install_libraries.outcome == 'success' }}
        run: |
          pkg="rocm[libraries,devel]"
          if [ -n "${{ steps.device_extras.outputs.device_extras }}" ]; then
            pkg="${pkg%]},${{ steps.device_extras.outputs.device_extras }}]"
          fi
          python build_tools/setup_venv.py "${VENV_DIR}" \
            --packages "${pkg}==${{ inputs.rocm_version }}" \
            --index-url=${{ inputs.package_index_url }} \
            --find-links=${{ inputs.package_find_links_url }}

      - name: Show installed packages (libraries,devel)
        if: ${{ !cancelled() && steps.install_devel.outcome == 'success' }}
        run: |
          pip freeze

      - name: Test rocm[libraries,devel]
        if: ${{ !cancelled() && steps.install_devel.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          rocm-sdk test

      # Install rocm[profiler] on its own into a fresh venv. Per
      # docs/packaging/python_packaging.md, rocm[profiler] alone must pull in
      # rocm-sdk-core and be sufficient to run the profiler tools - this step
      # validates that documented minimal install. rocm-profiler is a generic
      # (non-target-specific) package, so no device_extras are appended.
      - name: Install rocm[profiler]
        id: install_profiler
        # rocm[profiler] is not built on Windows, so skip the whole flow there
        # (the two dependent steps gate on this step's success).
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          python build_tools/setup_venv.py ${PROFILER_VENV_DIR} \
            --packages "rocm[profiler]==${{ inputs.rocm_version }}" \
            --index-url=${{ inputs.package_index_url }} \
            --find-links=${{ inputs.package_find_links_url }} \
            --activate-in-future-github-actions-steps

      - name: Show installed packages (profiler)
        if: ${{ !cancelled() && steps.install_profiler.outcome == 'success' }}
        run: |
          pip freeze

      - name: Test rocm[profiler]
        if: ${{ !cancelled() && steps.install_profiler.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          rocm-sdk test
