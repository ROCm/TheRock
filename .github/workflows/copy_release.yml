name: Stage ROCm 7.14 gfx942 and gfx950 stable packages in dev

on:
  workflow_dispatch:

permissions:
  contents: read

run-name: Stage ROCm 7.14 gfx942 and gfx950 stable packages in dev

jobs:
  copy_and_verify:
    name: Copy stable device extras and verify destreleases installs
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      SOURCE_ROOT: https://repo.amd.com/rocm/whl-multi-arch/
      DEV_INDEX: https://rocm.devreleases.amd.com/whl-multi-arch/
      ROCM_VERSION: 7.14.0
      TORCH_VERSION: 2.13.0+git46434d10.rocm7.14.0
      TORCH_GIT_SHA: 46434d1076df59c2e84698a757e4bb3811b144ab
      TRITON_VERSION: 3.8.0+git4cff872c.rocm7.14.0
      PIP_CACHE_DIR: /tmp/pip-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TODO: migrate to boto3 Python package instead of this native tool?
      - name: Install the AWS tool
        run: ./dockerfiles/install_awscli.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-dev

      - name: Copy exact ROCm gfx942 and gfx950 device extras to destreleases
        run: |
          echo "COPY_STARTED_EPOCH=$(date -u +%s)" >> "${GITHUB_ENV}"

          while IFS= read -r filename
          do
            local_path="/tmp/${filename}"
            curl --fail --location \
              --retry 5 --retry-all-errors \
              --output "${local_path}" \
              "${SOURCE_ROOT}${filename}"

            checksum="$(openssl dgst -sha256 -binary "${local_path}" | base64 -w0)"
            uploaded_checksum="$(aws s3api put-object \
              --bucket therock-dev-python \
              --key "v4/whl/${filename}" \
              --body "${local_path}" \
              --checksum-algorithm SHA256 \
              --checksum-sha256 "${checksum}" \
              --query ChecksumSHA256 --output text)"
            test "${checksum}" = "${uploaded_checksum}"
            echo "${filename}: sha256 ${checksum}"
            rm "${local_path}"
          done <<'EOF'
          rocm_sdk_device_gfx942-7.14.0-py3-none-linux_x86_64.whl
          rocm_sdk_device_gfx950-7.14.0-py3-none-linux_x86_64.whl
          EOF

      - name: Wait for complete destreleases index
        shell: python
        run: |
          import email.utils
          import os
          import time
          import urllib.request

          started = int(os.environ["COPY_STARTED_EPOCH"])
          expected = {
              "rocm": ("rocm-7.14.0.tar.gz", False),
              "rocm-bootstrap": (
                  "rocm_bootstrap-0.1.0-py3-none-any.whl",
                  False,
              ),
              "rocm-sdk-core": (
                  "rocm_sdk_core-7.14.0-py3-none-linux_x86_64.whl",
                  False,
              ),
              "rocm-sdk-devel": (
                  "rocm_sdk_devel-7.14.0-py3-none-linux_x86_64.whl",
                  False,
              ),
              "rocm-sdk-libraries": (
                  "rocm_sdk_libraries-7.14.0-py3-none-linux_x86_64.whl",
                  False,
              ),
              "rocm-sdk-device-gfx942": (
                  "rocm_sdk_device_gfx942-7.14.0-"
                  "py3-none-linux_x86_64.whl",
                  True,
              ),
              "rocm-sdk-device-gfx950": (
                  "rocm_sdk_device_gfx950-7.14.0-"
                  "py3-none-linux_x86_64.whl",
                  True,
              ),
              "torch": (
                  f"torch-{os.environ['TORCH_VERSION']}-"
                  "cp312-cp312-linux_x86_64.whl",
                  False,
              ),
              "amd-torch-device-gfx942": (
                  "amd_torch_device_gfx942-"
                  f"{os.environ['TORCH_VERSION']}-"
                  "cp312-cp312-linux_x86_64.whl",
                  False,
              ),
              "triton": (
                  f"triton-{os.environ['TRITON_VERSION']}-"
                  "cp312-cp312-linux_x86_64.whl",
                  False,
              ),
          }
          base = os.environ["DEV_INDEX"]
          for _ in range(60):
              missing = []
              for package, (filename, require_fresh) in expected.items():
                  try:
                      response = urllib.request.urlopen(
                          f"{base}{package}/index.html", timeout=30
                      )
                      page = response.read().decode()
                      modified = email.utils.parsedate_to_datetime(
                          response.headers["Last-Modified"]
                      ).timestamp()
                  except Exception:
                      missing.append(package)
                      continue
                  if filename not in page or (require_fresh and modified < started):
                      missing.append(package)
              if not missing:
                  print("Destreleases index contains gfx942 and gfx950 ROCm device extras")
                  break
              print(f"Waiting for index regeneration; missing: {missing}")
              time.sleep(10)
          else:
              raise RuntimeError("Destreleases index did not complete within ten minutes")

      - name: Verify destreleases gfx942 torch and gfx950 ROCm installs
        run: |
          python build_tools/setup_venv.py /tmp/pytorch-validation-gfx942 \
            --packages "torch[device-gfx942]==${TORCH_VERSION} rocm[devel,device-gfx942]==${ROCM_VERSION}" \
            --index-url="${DEV_INDEX}"
          /tmp/pytorch-validation-gfx942/bin/python - <<'PY'
          import importlib.metadata
          import os

          import torch

          assert torch.__version__ == os.environ["TORCH_VERSION"], torch.__version__
          assert torch.version.git_version == os.environ["TORCH_GIT_SHA"], (
              torch.version.git_version
          )
          assert importlib.metadata.version("rocm") == os.environ["ROCM_VERSION"]
          assert (
              importlib.metadata.version("rocm-sdk-device-gfx942")
              == os.environ["ROCM_VERSION"]
          )
          print("gfx942", torch.__version__, torch.version.git_version, torch.version.hip)
          PY

          # The 2.13 finder-fix rebuild published amd_torch_device_gfx942 only.
          # Confirm the gfx950 ROCm extra resolves from destreleases alone.
          python build_tools/setup_venv.py /tmp/rocm-validation-gfx950 \
            --packages "rocm[devel,device-gfx950]==${ROCM_VERSION}" \
            --index-url="${DEV_INDEX}"
          /tmp/rocm-validation-gfx950/bin/python - <<'PY'
          import importlib.metadata
          import os

          assert importlib.metadata.version("rocm") == os.environ["ROCM_VERSION"]
          assert (
              importlib.metadata.version("rocm-sdk-device-gfx950")
              == os.environ["ROCM_VERSION"]
          )
          print("gfx950", importlib.metadata.version("rocm-sdk-device-gfx950"))
          PY
