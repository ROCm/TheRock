name: Stage ROCm 10.0.0rc0 prerelease packages in dev

on:
  workflow_dispatch:

permissions:
  contents: read

run-name: Stage ROCm 10.0.0rc0 prerelease packages in dev

jobs:
  copy_and_verify:
    name: Copy prerelease packages and verify dev-only installs
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      SOURCE_ROOT: https://rocm.prereleases.amd.com/whl-multi-arch/
      DEV_INDEX: https://rocm.devreleases.amd.com/whl-multi-arch/
      ROCM_VERSION: 10.0.0rc0
      TORCH_VERSION: 2.13.0+gita0d443cc.rocm10.0.0rc0
      TORCH_GIT_SHA: a0d443cc9b9a8b280841b8f5cc8e1c50cb45e1ca
      PIP_CACHE_DIR: /tmp/pip-cache

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TODO: migrate to boto3 Python package instead of this native tool?
      - name: Install the AWS tool
        run: ./dockerfiles/install_awscli.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-dev

      - name: Copy exact ROCm package closure to dev
        run: |
          echo "COPY_STARTED_EPOCH=$(date -u +%s)" >> "${GITHUB_ENV}"

          while IFS= read -r filename
          do
            local_path="/tmp/${filename}"
            curl --fail --location \
              --retry 5 --retry-all-errors \
              --output "${local_path}" \
              "${SOURCE_ROOT}${filename}"

            checksum="$(openssl dgst -sha256 -binary "${local_path}" | base64 -w0)"
            uploaded_checksum="$(aws s3api put-object \
              --bucket therock-dev-python \
              --key "v4/whl/${filename}" \
              --body "${local_path}" \
              --checksum-algorithm SHA256 \
              --checksum-sha256 "${checksum}" \
              --query ChecksumSHA256 --output text)"
            test "${checksum}" = "${uploaded_checksum}"
            echo "${filename}: sha256 ${checksum}"
            rm "${local_path}"
          done <<'EOF'
          rocm-10.0.0rc0.tar.gz
          rocm_bootstrap-0.1.0-py3-none-any.whl
          rocm_sdk_core-10.0.0rc0-py3-none-linux_x86_64.whl
          rocm_sdk_devel-10.0.0rc0-py3-none-linux_x86_64.whl
          rocm_sdk_libraries-10.0.0rc0-py3-none-linux_x86_64.whl
          rocm_sdk_device_gfx942-10.0.0rc0-py3-none-linux_x86_64.whl
          rocm_sdk_device_gfx950-10.0.0rc0-py3-none-linux_x86_64.whl
          EOF

      - name: Wait for dev index regeneration
        shell: python
        run: |
          import email.utils
          import os
          import time
          import urllib.request

          started = int(os.environ["COPY_STARTED_EPOCH"])
          expected = {
              "rocm": "rocm-10.0.0rc0.tar.gz",
              "rocm-bootstrap": "rocm_bootstrap-0.1.0-py3-none-any.whl",
              "rocm-sdk-core": (
                  "rocm_sdk_core-10.0.0rc0-py3-none-linux_x86_64.whl"
              ),
              "rocm-sdk-devel": (
                  "rocm_sdk_devel-10.0.0rc0-py3-none-linux_x86_64.whl"
              ),
              "rocm-sdk-libraries": (
                  "rocm_sdk_libraries-10.0.0rc0-py3-none-linux_x86_64.whl"
              ),
              "rocm-sdk-device-gfx942": (
                  "rocm_sdk_device_gfx942-10.0.0rc0-"
                  "py3-none-linux_x86_64.whl"
              ),
              "rocm-sdk-device-gfx950": (
                  "rocm_sdk_device_gfx950-10.0.0rc0-"
                  "py3-none-linux_x86_64.whl"
              ),
          }
          base = os.environ["DEV_INDEX"]
          for _ in range(36):
              missing = []
              for package, filename in expected.items():
                  try:
                      response = urllib.request.urlopen(
                          f"{base}{package}/index.html", timeout=30
                      )
                      page = response.read().decode()
                      modified = email.utils.parsedate_to_datetime(
                          response.headers["Last-Modified"]
                      ).timestamp()
                  except Exception:
                      missing.append(package)
                      continue
                  if modified < started or filename not in page:
                      missing.append(package)
              if not missing:
                  print("Fresh dev indexes contain the ROCm package closure")
                  break
              print(f"Waiting for index regeneration; missing: {missing}")
              time.sleep(10)
          else:
              raise RuntimeError("Dev index did not regenerate within six minutes")

      - name: Verify dev-only package installations
        run: |
          for gfx in gfx942 gfx950
          do
            venv="/tmp/pytorch-validation-${gfx}"
            python build_tools/setup_venv.py "${venv}" \
              --packages "torch[device-${gfx}]==${TORCH_VERSION} rocm[devel,device-${gfx}]==${ROCM_VERSION}" \
              --index-url="${DEV_INDEX}"
            "${venv}/bin/python" - "${gfx}" <<'PY'
          import importlib.metadata
          import os
          import sys

          import torch

          gfx = sys.argv[1]
          assert torch.__version__ == os.environ["TORCH_VERSION"], torch.__version__
          assert torch.version.git_version == os.environ["TORCH_GIT_SHA"], (
              torch.version.git_version
          )
          assert importlib.metadata.version("rocm") == os.environ["ROCM_VERSION"]
          assert (
              importlib.metadata.version(f"rocm-sdk-device-{gfx}")
              == os.environ["ROCM_VERSION"]
          )
          print(gfx, torch.__version__, torch.version.git_version, torch.version.hip)
          PY
          done
