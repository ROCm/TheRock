name: Copy release to dev bucket

on:
  workflow_dispatch:
    inputs:
      rocm_version:
        description: >-
          ROCm version to copy from nightly.repo.amd.com into
          dev.repo.amd.com (e.g. 10.3.0a20261027)
        type: string
        required: true
      source_stream:
        description: Source repo.amd.com stream
        type: choice
        options:
          - nightly
          - rc
          - stable-staging
        default: nightly
      include_torch:
        description: Copy torch/apex/triton packages in addition to ROCm Core?
        type: boolean
        default: false
permissions:
  contents: read

run-name: >-
  Copy ${{ inputs.source_stream }} -> dev |
  rocm ${{ inputs.rocm_version }} |
  extras: ${{ inputs.include_torch && 'PyTorch' || 'none' }}

jobs:
  copy_python_packages:
    name: >-
      Copy ${{ inputs.source_stream }} -> dev |
      rocm ${{ inputs.rocm_version }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    env:
      # Destination is fixed to "dev" so developer-triggered PyTorch builds that
      # publish to https://dev.repo.amd.com/rocm/whl-next/ can resolve the same
      # rocm==VERSION pin they built against.
      DEST_STREAM: dev
      SOURCE_STREAM: ${{ inputs.source_stream }}
      ROCM_VERSION: ${{ inputs.rocm_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Configure AWS credentials for Core destination
        uses: ./.github/actions/configure_aws_product_publication_credentials
        with:
          release_type: dev
          product: core

      - name: Copy ROCm Core packages between streams
        run: |
          python build_tools/github_actions/copy_rocm_packages_between_streams.py \
            --rocm-version "${ROCM_VERSION}" \
            --source-stream "${SOURCE_STREAM}" \
            --dest-stream "${DEST_STREAM}" \
            --products core

      - name: Configure AWS credentials for PyTorch destination
        if: ${{ inputs.include_torch }}
        uses: ./.github/actions/configure_aws_product_publication_credentials
        with:
          release_type: dev
          product: pytorch

      - name: Copy torch packages between streams
        if: ${{ inputs.include_torch }}
        run: |
          python build_tools/github_actions/copy_rocm_packages_between_streams.py \
            --rocm-version "${ROCM_VERSION}" \
            --source-stream "${SOURCE_STREAM}" \
            --dest-stream "${DEST_STREAM}" \
            --products pytorch
