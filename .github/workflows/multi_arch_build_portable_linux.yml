name: Multi-Arch Build (Linux)
'on':
  workflow_call:
    inputs:
      artifact_group:
        type: string
      matrix_per_family_json:
        type: string
        description: JSON array of {amdgpu_family, test-runs-on} objects for per-arch
          stages
      math_libs_matrix_per_family_json:
        type: string
        default: ''
        description: Optional math-only family matrix; empty retains every original
          family
      dist_amdgpu_families:
        type: string
        description: Semicolon-separated list of all GPU families for dist targets
      build_variant_label:
        type: string
      build_variant_cmake_preset:
        type: string
      build_variant_suffix:
        type: string
      rocm_package_version:
        type: string
      prebuilt_stages:
        type: string
        default: ''
        description: Comma-separated build stages to skip (artifacts already copied
          by the orchestrator)
      rebuild_artifacts:
        type: string
        default: ''
        description: Comma-separated artifact names to build (granular reuse). Empty
          = build all artifacts in stage.
      skip_stages:
        type: string
        default: ''
        description: Comma-separated build stages to drop from the graph entirely.
          Unlike prebuilt_stages, no artifacts exist for these stages afterwards.
      build_runs_on_large:
        type: string
        default: aws-linux-scale-rocm-prod
        description: Build runner label for CPU-intensive stages (selected by configure
          script with weighted distribution)
      build_runs_on_small:
        type: string
        default: aws-linux-scale-rocm-small
        description: Build runner label for low-CPU stages (storage-libs, media-libs,
          dctools-core, debug-tools, profiler-apps, cv-libs, emulation)
      build_runs_on_medium:
        type: string
        default: aws-linux-scale-rocm-medium
        description: Build runner label for medium-CPU stages (runtime-tests)
      release_type:
        description: Release type used for artifact storage and package versioning.
        type: string
        default: ci
      repository:
        description: Repository to checkout. Defaults to github.repository.
        type: string
        default: ''
      ref:
        description: Branch, tag, or SHA to checkout. Defaults to the triggering ref.
        type: string
        default: ''
      external_repo_config:
        description: JSON config for external repo checkout (repository, ref, checkout_path,
          source_package, fetch_sources_args)
        type: string
        default: ''
      quartz_tracking_id:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  notify_quartz_start:
    if: ${{ false }}
    name: Quartz - started - build ROCm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
    - name: Quartz - started - build ROCm
      uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f
      with:
        run_phase: started
        reporting_workflow: multi_arch_build_portable_linux.yml
        workflow_inputs: ${{ toJSON(inputs) }}
        gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
        gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
  compiler-runtime:
    if: ${{ !cancelled() && !failure() && !contains(inputs.prebuilt_stages, 'compiler-runtime')
      && !contains(inputs.skip_stages, 'compiler-runtime') }}
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: compiler-runtime
      stage_display_name: Stage - Compiler Runtime
      timeout_minutes: 480
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_large }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  emulation:
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(inputs.prebuilt_stages,\
      \ 'emulation') &&\n  !contains(inputs.skip_stages, 'emulation')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: emulation
      stage_display_name: Stage - Emulation
      timeout_minutes: 240
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_small }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  runtime-tests:
    needs: compiler-runtime
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'runtime-tests') &&\n  !contains(inputs.skip_stages,\
      \ 'runtime-tests')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: runtime-tests
      stage_display_name: Stage - Runtime Tests
      timeout_minutes: 120
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_medium }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  wsl-rocdxg:
    needs: compiler-runtime
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'wsl-rocdxg') &&\n  !contains(inputs.skip_stages,\
      \ 'wsl-rocdxg')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: wsl-rocdxg
      stage_display_name: Stage - WSL ROCDXG
      timeout_minutes: 120
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  math-libs:
    needs: compiler-runtime
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'math-libs') &&\n  !contains(inputs.skip_stages,\
      \ 'math-libs')\n}}"
    strategy:
      fail-fast: false
      matrix:
        family_info: ${{ fromJSON(inputs.math_libs_matrix_per_family_json || inputs.matrix_per_family_json)
          }}
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: math-libs
      stage_display_name: Stage - Math Libs (${{ matrix.family_info.amdgpu_family
        }})
      timeout_minutes: 480
      amdgpu_family: ${{ matrix.family_info.amdgpu_family }}
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_large }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      rebuild_artifacts: ${{ inputs.rebuild_artifacts }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  comm-libs:
    needs:
    - compiler-runtime
    - emulation
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'comm-libs') &&\n  !contains(inputs.skip_stages,\
      \ 'comm-libs')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: comm-libs
      stage_display_name: Stage - Comm Libs
      timeout_minutes: 240
      amdgpu_family: ''
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_large }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  storage-libs:
    needs: compiler-runtime
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'storage-libs') &&\n  !contains(inputs.skip_stages,\
      \ 'storage-libs')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: storage-libs
      stage_display_name: Stage - Storage Libs
      timeout_minutes: 240
      amdgpu_family: ''
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_small }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  debug-tools:
    needs: compiler-runtime
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'debug-tools') &&\n  !contains(inputs.skip_stages,\
      \ 'debug-tools')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: debug-tools
      stage_display_name: Stage - Debug Tools
      timeout_minutes: 180
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_small }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  dctools-core:
    needs: compiler-runtime
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'dctools-core') &&\n  !contains(inputs.skip_stages,\
      \ 'dctools-core')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: dctools-core
      stage_display_name: Stage - DC Tools Core
      timeout_minutes: 120
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_small }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  profiler-apps:
    needs: storage-libs
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'profiler-apps') &&\n  !contains(inputs.skip_stages,\
      \ 'profiler-apps')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: profiler-apps
      stage_display_name: Stage - Profiler Apps
      timeout_minutes: 180
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_small }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  cv-libs:
    needs: compiler-runtime
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'cv-libs') &&\n  !contains(inputs.skip_stages,\
      \ 'cv-libs')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: cv-libs
      stage_display_name: Stage - CV Libs
      timeout_minutes: 180
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_small }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  media-libs:
    needs: compiler-runtime
    if: "${{\n  !cancelled() && !failure() &&\n  !contains(needs.*.result, 'cancelled')\
      \ &&\n  !contains(inputs.prebuilt_stages, 'media-libs') &&\n  !contains(inputs.skip_stages,\
      \ 'media-libs')\n}}"
    uses: ./.github/workflows/proposal4-stage-stub.yml
    with:
      stage_name: media-libs
      stage_display_name: Stage - Media Libs
      timeout_minutes: 180
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_runs_on: ${{ inputs.build_runs_on_small }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      external_repo_config: ${{ inputs.external_repo_config }}
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write
  libraries_baseline_ready:
    name: Libraries Baseline Ready
    needs:
    - runtime-tests
    - comm-libs
    - storage-libs
    - debug-tools
    - dctools-core
    - profiler-apps
    - cv-libs
    - media-libs
    - wsl-rocdxg
    runs-on: ubuntu-24.04
    steps:
    - name: Report reused stage results
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: echo "${NEEDS_JSON}"
  notify_quartz_completed:
    if: ${{ false }}
    needs:
    - compiler-runtime
    - emulation
    - runtime-tests
    - wsl-rocdxg
    - math-libs
    - comm-libs
    - storage-libs
    - debug-tools
    - dctools-core
    - profiler-apps
    - media-libs
    name: Quartz - completed - build ROCm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
    - name: Quartz - completed - build ROCm
      uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f
      with:
        run_phase: completed
        reporting_workflow: multi_arch_build_portable_linux.yml
        workflow_inputs: ${{ toJSON(inputs) }}
        workflow_captured_outputs: ${{ toJSON(needs) }}
        gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
        gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
