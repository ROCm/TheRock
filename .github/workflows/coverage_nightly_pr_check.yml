# TEMPORARY. Delete this file and the workflow_call trigger it relies on before
# merging the coverage PR.
#
# multi_arch_ci_coverage_linux.yml runs by hand, but workflow_dispatch only
# appears once the file is on the default branch -- so it can't run from a
# branch or show in a PR's checks, leaving phase 1 unable to demonstrate itself.
#
# A caller has no such restriction: paths under ./.github/workflows resolve
# against the caller's commit, so this runs the branch's copy and its jobs
# report as checks on this PR.
#
# Scaffolding, not design. Presubmit coverage is what phase 1 rejects: each run
# is a multi-hour instrumented build plus full test suite, which is why coverage
# is a separate manual workflow. Leaving this in charges that cost to every PR.

name: Coverage Nightly PR Check

on:
  pull_request:
    # Narrow on purpose: each run is a multi-hour build, so only files carrying
    # coverage logic are worth one.
    paths:
      - ".github/workflows/coverage_nightly_pr_check.yml"
      - ".github/workflows/multi_arch_ci_coverage_linux.yml"
      - ".github/workflows/multi_arch_ci_coverage_report.yml"
      - ".github/workflows/test_code_coverage_component.yml"
      - "build_tools/github_actions/configure_coverage_ci.py"
      - "build_tools/github_actions/merge_coverage_report.py"
      - "build_tools/install_rocm_code_coverage_build.py"
      - "cmake/therock_subproject.cmake"
      - "CMakeLists.txt"

concurrency:
  # A later push supersedes this run: queueing multi-hour builds to report on
  # already-replaced code just occupies nodes the rest of CI needs.
  group: coverage-nightly-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    uses: ./.github/workflows/multi_arch_ci_coverage_linux.yml
    secrets: inherit
    # A called workflow can't hold more than its caller, so grant these here too:
    # id-token for the AWS role the artifact fetches assume, actions:read for the
    # baseline run lookup.
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      # Pinned, not resolved, so a change in the report means a change in this branch.
      #
      # ROCm/rockrel run 34068476531, "Multi-Arch Release (nightly)" on main,
      # 2026-09-07, succeeded. A real nightly, not a CI run, since that's what a
      # dispatched coverage run gets in practice.
      #
      # A rockrel run is safe here. Its artifacts embed their build workspace
      # (/__w/rockrel/rockrel), which breaks consumers that configure CMake
      # against them -- but this workflow never does: it builds the instrumented
      # stack from source and only installs the baseline on the test runner,
      # where prebuilt binaries run and no package config is read.
      #
      # Verified before pinning that this run publishes artifacts for every
      # selected project: blas, fft, hipdnn, rand, solver, sparse. Not all are
      # per-target (hipdnn and solver's tests are generic), so checking only for
      # _gfx942 understates what's there.
      baseline_run_id: "34068476531"
      # The bucket lookup queries the run via the GitHub API, so it needs the
      # owning repo; ROCm/TheRock 404s for a rockrel id.
      baseline_repository: "ROCm/rockrel"
      # That run published to therock-nightly-artifacts (the default); naming it
      # keeps the pin and channel together.
      baseline_release_type: "nightly"
      amdgpu_families: "gfx94X-dcgpu"
      # Every rocm-libraries project that builds a shared library. Run
      # 34135220913 proved the path end to end on hipRAND (build, install,
      # overlay, tests, 77% report) once libclang_rt.profile_rocm.a's own deps
      # (-ldl, -lpthread) were added to the link line. Run 34164420766 then built
      # all twelve green and reported six; the six failures are what the host-only
      # scoping, timeout floor and two registry corrections in this branch fix.
      #
      # Named explicitly, not rocm_libraries_all, to leave out the four
      # header-only projects (hipCUB, rocPRIM, rocThrust, rocWMMA): they have no
      # library to instrument, report against instrumented test binaries, and hit
      # the linkonce_odr case the overlay can't isolate. Worth doing separately.
      #
      # rccl and rocshmem aren't selectable: they live in comm-libs, which has no
      # build job here. Both are also blocked upstream -- rccl's CMake refuses
      # coverage outside Debug, and rocshmem fails on coverage + HIP RDC.
      #
      # hipBLASLt and hipTensor are absent because neither instrumented build
      # links (see blocked_reason in configure_coverage_ci.py). hipTensor was
      # still listed for run 34201973090, which found its failure: the registry
      # corrections instrumented it for the first time, and a stage builds as a
      # unit, so its link error failed math-libs and skipped all twelve reports.
      projects_to_test: >-
        hipblas,hipdnn,hipfft,hiprand,hipsolver,
        hipsparselt,rocblas,rocfft,rocrand,rocsolver,rocsparse
      test_type: "standard"
