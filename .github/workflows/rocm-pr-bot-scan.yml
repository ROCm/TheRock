#
# Caller workflow: triggers the centralized ROCm PR Bot hosted in
# ROCm/TheRock-PR-Bot.
# Refs:
#   https://github.com/ROCm/TheRock-PR-Bot/tree/main/docs/ROCM_PR_BOT_FAQ.md
name: ROCm PR Bot Scan

on:
  # SECURITY: pull_request_target runs in the BASE-repo context, so secrets and
  # a write token are available even for PRs opened from FORKS.
  #
  # This is SAFE here ONLY because this workflow:
  #   • NEVER checks out or executes PR head code (see checkout step below),
  #   • runs the TRUSTED policy_check.py / policy.yml from the base branch, and
  #   • reads all PR data via the GitHub API.
  # Do NOT add build/test/install steps that run PR-provided code, and do NOT
  # change the checkout to the PR head — that would create a "pwn request".
  # Refs:
  #   https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target
  #   https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Re-run when the required check workflow finishes so the results table flips
  # from Pending to PASS/FAIL — without the bot ever waiting or polling. We use
  # `workflow_run` (NOT `check_run`): GitHub deliberately suppresses `check_run`
  # re-triggers for checks created by Actions' GITHUB_TOKEN (recursion guard),
  # so the table would otherwise stay pending until a human pushes/edits the PR.
  # `workflow_run` is not suppressed and runs in the base-repo context with
  # secrets. The watched name must match the pre-commit workflow's `name:`.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["pre-commit"]
    types: [completed]

# Caller must grant what the reusable workflow needs (callee cannot exceed it).
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: rocm-pr-bot-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  rocm-pr-bot:
    # On workflow_run, only refresh for pre-commit runs tied to a PR. Push-to-
    # main pre-commit runs have no PR; the bot resolves the PR from the head SHA
    # and exits cleanly when none exists, so this just avoids a no-op job.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    uses: ROCm/TheRock-PR-Bot/.github/workflows/rocm-pr-bot.yml@32048e50b56623a5e411f22e25533575a8422262
    secrets:
      ROCM_PR_BOT_APPID: ${{ secrets.ROCM_PR_BOT_APPID }}
      ROCM_PRBOT_KEY: ${{ secrets.ROCM_PRBOT_KEY }}
