# Reusable Workflow: Build Stage Artifacts
#
# This workflow builds TheRock stage artifacts for all stages.
# Handles both generic stages (compiler-runtime, profiler-apps, etc.) and
# per-arch stages (math-libs, comm-libs) using conditional logic.
#
# Artifacts flow between stages via S3 using the artifact_manager.py tool.
#
# TODO: When kpack splitting is permanently enabled, change fetch commands to use
# --generic-only instead of --amdgpu-families for efficiency. Subsequent build
# stages only need generic (host) artifacts; device-specific kpacks are not
# needed until final packaging.

name: Build Stage Artifacts

on:
  workflow_call:
    inputs:
      stage_name:
        type: string
        required: true
        description: "Stage name (e.g., compiler-runtime, math-libs)"
      stage_display_name:
        type: string
        required: true
        description: "Human-readable display name for the job"
      timeout_minutes:
        type: number
        required: true
        description: "Job timeout in minutes"
      amdgpu_family:
        type: string
        required: false
        default: ""
        description: "GPU family for per-arch stages (empty for generic stages)"
      dist_amdgpu_families:
        type: string
        required: true
        description: "Semicolon-separated list of all GPU families for dist targets"
      rocm_package_version:
        type: string
        required: true
        description: "ROCm package version string"
      build_variant_cmake_preset:
        type: string
        required: false
        default: ""
        description: "CMake preset name for this build variant (optional)"
      release_type:
        description: 'Release type; controls artifact bucket and IAM role'
        type: string
        default: ci
      build_runs_on:
        description: "Build runner label (selected by configure script with weighted distribution)"
        type: string
        default: "aws-linux-scale-rocm-prod"
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      external_repo_config:
        description: "JSON config for external repo checkout (generated by detect_external_repo_config.py)"
        type: string
        default: ""
      rebuild_artifacts:
        description: "Comma-separated artifact names to build (granular reuse). Empty = build all artifacts in stage."
        type: string
        default: ""
      quartz_tracking_id:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build_stage:
    name: ${{ inputs.stage_display_name }}
    runs-on: ${{ inputs.build_runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    permissions:
      contents: read
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb # 2026-08-18
    env:
      QUARTZ_REPORTING_WORKFLOW: multi_arch_build_portable_linux_artifacts.yml
      QUARTZ_WORKFLOW_POSTFIX: "- build ROCm artifacts"
      DIST_AMDGPU_FAMILIES: ${{ inputs.dist_amdgpu_families }}
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_family }}
      ROCM_PACKAGE_VERSION: ${{ inputs.rocm_package_version }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      REBUILD_ARTIFACTS: ${{ inputs.rebuild_artifacts }}
      STAGE_NAME: ${{ inputs.stage_name }}
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      TEATIME_FORCE_INTERACTIVE: 0
      EXTERNAL_FETCH_SOURCES_ARGS: ${{ inputs.external_repo_config != '' && fromJSON(inputs.external_repo_config).fetch_sources_args || '' }}
      EXTERNAL_REPO_CONFIG: ${{ inputs.external_repo_config }}
      BUILD_DIR: build
      CACHE_DIR: ${{ github.workspace }}/.container-cache

    steps:
      - name: "Quartz - started ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        env:
          STEP_NAME: "Quartz - started"
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: started
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

      - name: Checkout Repository
        timeout-minutes: 10
        env:
          STEP_NAME: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Record job start time
        env:
          STEP_NAME: Record job start time
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout external repository
        if: ${{ inputs.external_repo_config != '' }}
        timeout-minutes: 10
        env:
          STEP_NAME: Checkout external repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ fromJSON(inputs.external_repo_config).repository }}
          ref: ${{ fromJSON(inputs.external_repo_config).ref }}
          path: ${{ fromJSON(inputs.external_repo_config).checkout_path }}

      - name: Install python deps
        env:
          STEP_NAME: Install python deps
        run: pip install -r requirements.txt

      - name: Adjust git config
        env:
          STEP_NAME: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        env:
          STEP_NAME: Setup ccache
        run: |
          ./build_tools/setup_ccache.py \
            --release-type "${RELEASE_TYPE}" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        env:
          STEP_NAME: Runner health status
        run: |
          ./build_tools/health_status.py

      # Note: no AWS credentials should be needed here since our CI buckets
      # all currently have public read access.
      - name: Fetch inbound artifacts
        env:
          STEP_NAME: Fetch inbound artifacts
        run: |
          python build_tools/artifact_manager.py fetch \
            --run-id=${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --amdgpu-families="${AMDGPU_FAMILIES}" \
            --output-dir="${BUILD_DIR}" \
            --bootstrap

      - name: Fetch sources
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_NAME: Fetch sources
        run: |
          gh auth setup-git --hostname github.com
          ./build_tools/fetch_sources.py --stage ${STAGE_NAME} --jobs 12 --depth 1 ${EXTERNAL_FETCH_SOURCES_ARGS}

      - name: Get stage configuration
        id: stage_config
        env:
          STEP_NAME: Get stage configuration
        run: |
          python build_tools/configure_stage.py \
            --stage="${STAGE_NAME}" \
            --artifacts="${REBUILD_ARTIFACTS}" \
            --amdgpu-families="${AMDGPU_FAMILIES}" \
            --dist-amdgpu-families="${DIST_AMDGPU_FAMILIES}" \
            --manylinux \
            --gha-output

      - name: Install stage python deps
        if: ${{ steps.stage_config.outputs.pip_install_cmd }}
        # configure_stage.py emits argument fragments from repository build configuration.
        # Trust that configuration as executable build input; multiple arguments are intentional.
        env:
          STEP_NAME: Install stage python deps
        run: | # zizmor: ignore[template-injection]
          pip install ${{ steps.stage_config.outputs.pip_install_cmd }}

      - name: Configure
        # configure_stage.py emits argument fragments from repository build configuration.
        # Trust that configuration and the caller-provided preset/external repo options
        # as executable build inputs; their shell quoting and multiple arguments are intentional.
        env:
          STEP_NAME: Configure
        run: | # zizmor: ignore[template-injection]
          SUBPROJECT_TEST_JOBS="$(( $(nproc) / 2 ))"
          if ((SUBPROJECT_TEST_JOBS > 16)); then
            SUBPROJECT_TEST_JOBS=16
          fi
          cmake -B "${BUILD_DIR}" -S . -GNinja \
            -DTHEROCK_PACKAGE_VERSION="${ROCM_PACKAGE_VERSION}" \
            -DTHEROCK_ROCJITSU_TEST_JOBS="${SUBPROJECT_TEST_JOBS}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ inputs.build_variant_cmake_preset && format('--preset={0}', inputs.build_variant_cmake_preset) }} \
            ${{ inputs.external_repo_config != '' && format('-DTHEROCK_{0}_SOURCE_DIR={1}', fromJSON(inputs.external_repo_config).source_package, fromJSON(inputs.external_repo_config).checkout_path) || '' }} \
            ${{ inputs.external_repo_config != '' && fromJSON(inputs.external_repo_config).extra_cmake_options || '' }} \
            ${{ steps.stage_config.outputs.cmake_args }}

      - name: Build stage
        env:
          STEP_NAME: Build stage
        run: |
          echo "BUILD_STEP_START=$(date +%s)" >> $GITHUB_ENV
          cmake --build "${BUILD_DIR}" --target stage-${STAGE_NAME} therock-artifacts -- -k 0

      - name: Generate failed log summaries
        if: ${{ !cancelled() }}
        env:
          STEP_NAME: Generate failed log summaries
        run: |
          python3 build_tools/github_actions/detect_failed_logs.py

      - name: Run build tests (Comgr, blocking)
        if: ${{ !cancelled() && inputs.stage_name == 'compiler-runtime' }}
        env:
          TEATIME_FORCE_INTERACTIVE: 1
          STEP_NAME: Run build tests (Comgr, blocking)
        run: |
          cmake --build "${BUILD_DIR}" --target build-test-amd-comgr -- -k 0

      # Rocjitsu and mirage build tests report failures without gating CI.
      - name: Run build tests (emulation, non-blocking)
        if: ${{ !cancelled() && inputs.stage_name == 'emulation' }}
        continue-on-error: true
        env:
          TEATIME_FORCE_INTERACTIVE: 1
          STEP_NAME: Run build tests (emulation, non-blocking)
        run: |
          cmake --build "${BUILD_DIR}" --target therock-build-tests -- -k 0

      - name: Report
        if: ${{ !cancelled() }}
        env:
          STEP_NAME: Report
        run: |
          echo "CCache Stats:"
          ccache -s -v
          echo "Artifacts:"
          ls -lh "${BUILD_DIR}"/artifacts/*.tar.xz 2>/dev/null || echo "No artifacts found"

      - name: Test Packaging
        env:
          STEP_NAME: Test Packaging
        run: |
          ctest --test-dir ${BUILD_DIR} --output-on-failure

      - name: Configure AWS credentials for artifact uploads
        if: ${{ always() }}
        env:
          STEP_NAME: Configure AWS credentials for artifact uploads
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ${{ inputs.release_type }}

      # TODO(#3336): Attempt upload `always()`?
      #   * If some part of the build failed, partial artifacts may be useful for debugging.
      #   * This script fails if `build_dir / "artifacts"` does not exist. That's useful
      #     if the build succeeded but did not produce artifacts. That's _not_ useful
      #     if the workflow failed or was cancelled before the build even started though.
      - name: Push stage artifacts
        env:
          STEP_NAME: Push stage artifacts
        run: |
          python build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}"

      - name: Upload stage logs
        if: ${{ always() }}
        env:
          STEP_NAME: Upload stage logs
        run: |
          python build_tools/github_actions/post_stage_upload.py \
            --run-id=${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}" \
            --amdgpu-family="${AMDGPU_FAMILIES}"

      - name: Capture job summary
        id: summary
        if: always()
        env:
          STEP_NAME: Capture job summary
        run: python build_tools/github_actions/capture_job_summary.py

      - name: Emit trace span
        if: always()
        continue-on-error: true
        env:
          OTLP_ENDPOINT: alloy-customer-dev.observability.svc.cluster.local:4317
          STEP_NAME: Emit trace span
        run: |
          CCACHE_HITS=$(ccache -s 2>/dev/null | grep -E "^\s+Hits:" | head -1 | awk '{print $2}')
          CCACHE_MISSES=$(ccache -s 2>/dev/null | grep -E "^\s+Misses:" | head -1 | awk '{print $2}')
          CCACHE_HITS="${CCACHE_HITS:-0}"
          CCACHE_MISSES="${CCACHE_MISSES:-0}"
          python3 -m venv /tmp/otel-venv
          /tmp/otel-venv/bin/pip install -q opentelemetry-sdk opentelemetry-exporter-otlp-proto-grpc
          /tmp/otel-venv/bin/python3 build_tools/github_actions/emit-stage-trace.py \
            --stage        "${STAGE_NAME}" \
            --arch         "${AMDGPU_FAMILIES:-${DIST_AMDGPU_FAMILIES}}" \
            --run-id       "${{ github.run_id }}" \
            --repository   "${{ github.repository }}" \
            --start-time   "${JOB_START}" \
            --build-dir    "${BUILD_DIR}" \
            --build-start  "${BUILD_STEP_START}" \
            --status       "${{ job.status }}" \
            --ccache-hits  "${CCACHE_HITS}" \
            --ccache-misses "${CCACHE_MISSES}"

      - name: "Quartz - completed ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ always() && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        env:
          STEP_NAME: "Quartz - completed"
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: completed
          run_conclusion: ${{ job.status }}
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_step_outputs: ${{ toJSON(steps) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
