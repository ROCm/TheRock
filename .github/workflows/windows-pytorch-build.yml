# Build-only Windows PyTorch (ROCm) wheel workflow (bring-up draft).
#
# Derived from ROCm/TheRock .github/workflows/multi_arch_build_windows_pytorch_wheels.yml
# (read from the default branch on 2026-10-21). Differences from that file:
#   - Build job only: no test jobs, no Quartz notifications, no kpack split,
#     no S3 publish, no AWS credential steps.
#   - TheRock is checked out into ./TheRock at a chosen ref, because this
#     workflow lives in a different repository than TheRock's scripts.
#   - sccache is off (it needs AWS roles that only TheRock's account has).
#   - The wheels are uploaded as a GitHub Actions artifact instead of S3.
#   - A push trigger limited to the bring-up branch and to this file, so the
#     workflow can run from a non-default branch. On push there are no inputs,
#     so every input below has a fallback in the expressions ("inputs.x || default").

name: Windows PyTorch ROCm build and test

on:
  push:
    branches:
      - users/windows-pytorch-build
    paths:
      - .github/workflows/windows-pytorch-build.yml
  workflow_dispatch:
    inputs:
      amdgpu_families:
        description: >-
          Semicolon-separated AMD GPU families to build for (for example
          'gfx120X-all'). Expanded to gfx targets by TheRock's
          expand_amdgpu_families.py. Default: gfx120X-all.
        type: string
        default: "gfx120X-all"
      python_version:
        description: Python version to build wheels for. Default 3.12 (used by TheRock's own dispatched Windows builds that succeeded).
        type: string
        default: "3.12"
      pytorch_git_ref:
        description: PyTorch ref to check out ("nightly" or a release branch such as "release/2.13"). Default nightly.
        type: string
        default: "nightly"
      pytorch_gitrepo_origin:
        description: >-
          Optional PyTorch git origin override (for example a fork URL). Empty
          means ROCm/pytorch for stable refs; it is not used for the "nightly" ref.
        type: string
        default: ""
      rocm_version:
        description: >-
          ROCm package version to install and build against. Must exist on the
          index below. Default 10.2.0a20261012 (the version a successful TheRock
          Windows nightly build of 2026-10-15 used).
        type: string
        default: "10.2.0a20261012"
      rocm_package_index_url:
        description: pip --index-url for ROCm packages (PEP 503 index).
        type: string
        default: "https://nightly.repo.amd.com/rocm/whl-next"
      release_type:
        description: Release type string passed to build_prod_wheels.py. TheRock's own dispatched Windows builds use "dev".
        type: string
        default: "dev"
      therock_ref:
        description: Branch, tag or SHA of ROCm/TheRock that provides the build scripts.
        type: string
        default: "main"
      build_runs_on:
        description: Build runner label.
        type: string
        default: "aws-windows-scale-rocm-prod-mix"
      run_tests:
        description: Also run the PyTorch tests on a GPU runner after the build (the test runners are scarce; leave off unless needed).
        type: boolean
        default: false
      test_runs_on:
        description: Test runner label (GPU). Must match the GPU family built. Default windows-gfx120X-gpu-rocm.
        type: string
        default: "windows-gfx120X-gpu-rocm"
      prebuilt_run_id:
        description: >-
          Skip the build and test the wheels uploaded by this earlier run of this
          workflow (its run ID). On a push, put [prebuilt:<run id>] in the commit
          message instead. Artifacts expire after 14 days.
        type: string
        default: ""

run-name: >-
  Windows PyTorch ROCm build (${{ inputs.amdgpu_families || 'gfx120X-all' }},
  py ${{ inputs.python_version || '3.12' }}, torch ${{ inputs.pytorch_git_ref || 'nightly' }})

# A new push to the branch cancels the previous run, so a shared runner is not
# kept busy by superseded runs.
concurrency:
  group: windows-pytorch-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build_pytorch_wheels:
    if: ${{ !inputs.prebuilt_run_id && !contains(github.event.head_commit.message, '[prebuilt:') }}
    name: Build | py ${{ inputs.python_version || '3.12' }} | torch ${{ inputs.pytorch_git_ref || 'nightly' }}
    # Same expression as TheRock: the runner label is only used for repositories
    # owned by the ROCm organization; anything else falls back to a GitHub-hosted runner.
    runs-on: ${{ github.repository_owner == 'ROCm' && (inputs.build_runs_on || 'aws-windows-scale-rocm-prod-mix') || 'windows-2022' }}
    timeout-minutes: 240
    env:
      PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
      PYTORCH_GITREPO_ORIGIN: ${{ inputs.pytorch_gitrepo_origin || '' }}
      PYTORCH_GIT_REF: ${{ inputs.pytorch_git_ref || 'nightly' }}
      ROCM_VERSION: ${{ inputs.rocm_version || '10.2.0a20261012' }}
      ROCM_INDEX_URL: ${{ inputs.rocm_package_index_url || 'https://nightly.repo.amd.com/rocm/whl-next' }}
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families || 'gfx120X-all' }}
      BUILD_RELEASE_TYPE: ${{ inputs.release_type || 'dev' }}
      CHECKOUT_ROOT: B:/src
      # Note the \ here instead of /. This should be used from 'cmd' not 'bash'!
      PACKAGE_DIST_DIR: ${{ github.workspace }}\output\packages\dist
      optional_build_prod_arguments: ""
    defaults:
      run:
        # Mixed uses of 'bash' (this default) and 'cmd' below, as in TheRock's workflow.
        shell: bash
    steps:
      - name: Checkout TheRock (build scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: ${{ inputs.therock_ref || 'main' }}
          path: TheRock

      - name: Configure Git Identity
        run: |
          git config --global user.name "ci-bringup"
          git config --global user.email "ci-bringup@users.noreply.github.com"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Select Python version
        working-directory: TheRock
        run: |
          python build_tools/github_actions/python_to_cp_version.py \
            --python-version "${PYTHON_VERSION}"

      # Runner-specific: this is the package-source setup used on AMD's Windows
      # runners in TheRock's workflow (internal Nexus mirror). It will not work
      # on a GitHub-hosted runner.
      - name: Install requirements
        run: |
          choco source disable -n=chocolatey
          choco source add -n=internal -s http://nexus-service.nexus-ns.svc.cluster.local:8081/repository/choco-group/ --priority=1
          if command -v ninja >/dev/null 2>&1; then
            printf '%s\n' "ninja already installed: $(ninja --version)"
          else
            choco install --no-progress -y ninja --version 1.13.2
          fi

      # Build a fixed version of libuv from source, no matter the pytorch ref.
      # gloo requires >= 1.26; v1.47.0 matches upstream's source build.
      # This keeps USE_DISTRIBUTED on (without libuv PyTorch turns it off, as in the local builds).
      - name: Build libuv from source for GLOO
        run: |
          git clone https://github.com/libuv/libuv.git -b v1.47.0 --depth 1
          cmake -S libuv -B libuv/build -DBUILD_TESTING=OFF
          cmake --build libuv/build --config Release
          cmake --install libuv/build --prefix "${{ github.workspace }}/libuv-install"
          echo "libuv_ROOT=${{ github.workspace }}/libuv-install" >> $GITHUB_ENV

      # After other installs, so MSVC gets priority in the PATH.
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install python deps for CI
        working-directory: TheRock
        run: |
          pip install -r external-builds/pytorch/requirements-ci.txt

      - name: Checkout PyTorch source repos (nightly)
        if: ${{ env.PYTORCH_GIT_REF == 'nightly' }}
        working-directory: TheRock
        timeout-minutes: 30
        run: |
          git config --global core.longpaths true
          python ./external-builds/pytorch/pytorch_torch_repo.py checkout \
            --checkout-dir ${{ env.CHECKOUT_ROOT }}/pytorch \
            --repo-hashtag nightly \
            --no-commit-hipify
          python ./external-builds/pytorch/pytorch_audio_repo.py checkout \
            --checkout-dir ${{ env.CHECKOUT_ROOT }}/pytorch_audio \
            --repo-hashtag nightly \
            --no-commit-hipify
          python ./external-builds/pytorch/pytorch_vision_repo.py checkout \
            --checkout-dir ${{ env.CHECKOUT_ROOT }}/pytorch_vision \
            --repo-hashtag nightly \
            --no-commit-hipify

      - name: Checkout PyTorch source repos (stable)
        if: ${{ env.PYTORCH_GIT_REF != 'nightly' }}
        working-directory: TheRock
        timeout-minutes: 30
        run: |
          git config --global core.longpaths true
          pytorch_origin="${PYTORCH_GITREPO_ORIGIN}"
          if [ -z "${pytorch_origin}" ]; then
            pytorch_origin="https://github.com/ROCm/pytorch.git"
          fi
          python ./external-builds/pytorch/pytorch_torch_repo.py checkout \
            --checkout-dir ${{ env.CHECKOUT_ROOT }}/pytorch \
            --gitrepo-origin "${pytorch_origin}" \
            --repo-hashtag "${PYTORCH_GIT_REF}" \
            --no-commit-hipify
          python ./external-builds/pytorch/pytorch_audio_repo.py checkout \
            --checkout-dir ${{ env.CHECKOUT_ROOT }}/pytorch_audio \
            --torch-dir ${{ env.CHECKOUT_ROOT }}/pytorch \
            --require-related-commit \
            --no-commit-hipify
          python ./external-builds/pytorch/pytorch_vision_repo.py checkout \
            --checkout-dir ${{ env.CHECKOUT_ROOT }}/pytorch_vision \
            --torch-dir ${{ env.CHECKOUT_ROOT }}/pytorch \
            --require-related-commit \
            --no-commit-hipify

      # determine_version.py sets optional_build_prod_arguments in GITHUB_ENV
      # (--rocm-sdk-version ==<rocm_version>, --version-suffix).
      - name: Determine optional arguments passed to `build_prod_wheels.py`
        working-directory: TheRock
        run: |
          python build_tools/github_actions/determine_version.py \
            --rocm-version "${ROCM_VERSION}"

      - name: Expand amdgpu families to gfx targets
        id: expand
        working-directory: TheRock
        run: |
          targets=$(python build_tools/github_actions/expand_amdgpu_families.py \
            --amdgpu-families "${AMDGPU_FAMILIES}")
          echo "Expanded families '${AMDGPU_FAMILIES}' -> '${targets}'"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

      # Using 'cmd' here is load bearing (TheRock issue 827: configuration
      # problems when run under bash). No compiler cache flag in this workflow.
      - name: Build PyTorch wheels
        shell: cmd
        working-directory: TheRock
        env:
          ROCM_FIND_LINKS: ""
          AMDGPU_TARGETS: ${{ steps.expand.outputs.targets }}
        run: |
          setlocal EnableDelayedExpansion
          echo "Building PyTorch wheels for !AMDGPU_FAMILIES!"
          python ./external-builds/pytorch/build_prod_wheels.py ^
            build ^
            --install-rocm ^
            --index-url="!ROCM_INDEX_URL!" ^
            --find-links="!ROCM_FIND_LINKS!" ^
            --root-checkout-dir ${{ env.CHECKOUT_ROOT }} ^
            --clean ^
            --output-dir "!PACKAGE_DIST_DIR!" ^
            --release-type="!BUILD_RELEASE_TYPE!" ^
            --pytorch-git-ref="!PYTORCH_GIT_REF!" ^
            --pytorch-rocm-arch "!AMDGPU_TARGETS!" ^
            ${{ env.optional_build_prod_arguments }}

      - name: Sanity check wheel
        shell: cmd
        working-directory: TheRock
        run: |
          python external-builds/pytorch/sanity_check_wheel.py "%PACKAGE_DIST_DIR%"

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytorch-windows-wheels-py${{ env.PYTHON_VERSION }}
          path: ${{ env.PACKAGE_DIST_DIR }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Test job (draft). Runs the same six suites as TheRock's Windows test jobs,
  # on a GPU runner, using the wheel built by the job above.
  #
  # Differences from TheRock's test_pytorch_wheels.yml:
  #   - The wheel comes from this run's GitHub artifact, not from a package index
  #     (TheRock publishes to S3; this workflow has no AWS credentials).
  #   - The fat torch wheel is not kpack-split here, so the GPU kernels come from
  #     the rocm[device-...] extra at the same ROCm version, as in the local builds.
  #   - No Quartz notifications.
  # The test job only starts when the run was dispatched with run_tests = true, or
  # when the commit message of a push contains "[run-tests]". It never runs on an
  # ordinary push, because the GPU runners are scarce.
  # ---------------------------------------------------------------------------
  test_pytorch_wheels:
    name: Test PyTorch | ${{ inputs.amdgpu_families || 'gfx120X-all' }}
    needs: build_pytorch_wheels
    # always(): the build job may be skipped (prebuilt run), and a skipped need would otherwise skip this job.
    if: ${{ always() && (needs.build_pytorch_wheels.result == 'success' || needs.build_pytorch_wheels.result == 'skipped') && (inputs.run_tests == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-tests]'))) }}
    runs-on: ${{ inputs.test_runs_on || 'windows-gfx120X-gpu-rocm' }}
    timeout-minutes: 180
    env:
      PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
      PYTORCH_GIT_REF: ${{ inputs.pytorch_git_ref || 'nightly' }}
      ROCM_VERSION: ${{ inputs.rocm_version || '10.2.0a20261012' }}
      ROCM_INDEX_URL: ${{ inputs.rocm_package_index_url || 'https://nightly.repo.amd.com/rocm/whl-next' }}
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families || 'gfx120X-all' }}
      # Pin OpenBLAS threads to 1 for deterministic reductions (as in TheRock's test workflow).
      OPENBLAS_NUM_THREADS: "1"
      PYTORCH_NUM_PYTEST_RERUNS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout TheRock (test scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: ${{ inputs.therock_ref || 'main' }}
          path: TheRock

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Decide which run's wheels to test, and pick a venv location that is unique to
      # this run. The test runners are persistent machines: a fixed "<workspace>/.venv"
      # left over from an earlier job (without pip) made the first test attempt fail.
      - name: Resolve wheel source and venv location
        id: source
        env:
          PREBUILT_INPUT: ${{ inputs.prebuilt_run_id || '' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          RUN_ID="${GITHUB_RUN_ID}"
          if [ -n "${PREBUILT_INPUT}" ]; then
            RUN_ID="${PREBUILT_INPUT}"
          elif [[ "${COMMIT_MESSAGE}" =~ \[prebuilt:([0-9]+)\] ]]; then
            RUN_ID="${BASH_REMATCH[1]}"
          fi
          echo "Using wheels from run ${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "VENV_DIR=${RUNNER_TEMP}/venv-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pytorch-windows-wheels-py${{ env.PYTHON_VERSION }}
          path: wheels
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      # Multi-arch packages use pip extras (rocm[device-gfx...]) to select the
      # GPU-specific kernels. Expand the family to the extras string.
      - name: Expand GPU family to device extras
        id: expand
        working-directory: TheRock
        run: |
          python build_tools/github_actions/expand_amdgpu_families.py \
            --amdgpu-families "${AMDGPU_FAMILIES}" \
            --output-mode=device-extras

      - name: Set git options
        run: |
          git config --global --add safe.directory $PWD
          git config --global core.longpaths true

      - name: Set up virtual environment
        timeout-minutes: 15
        env:
          DEVICE_EXTRAS: ${{ steps.expand.outputs.device_extras }}
        run: |
          ls -l wheels
          TORCH_WHEEL="$(ls wheels/torch-*.whl | head -n 1)"
          echo "Installing ${TORCH_WHEEL} and rocm[${DEVICE_EXTRAS}]==${ROCM_VERSION}"
          python TheRock/build_tools/setup_venv.py "${VENV_DIR}" \
            --clean \
            --packages "${TORCH_WHEEL} rocm[${DEVICE_EXTRAS}]==${ROCM_VERSION}" \
            --extra-index-url="${ROCM_INDEX_URL}" \
            --activate-in-future-github-actions-steps

      # Check out the same PyTorch commit the wheel was built from, for the test files.
      - name: Checkout PyTorch test sources
        timeout-minutes: 30
        working-directory: TheRock
        run: |
          if [ "${PYTORCH_GIT_REF}" = "nightly" ]; then
            ORIGIN="https://github.com/pytorch/pytorch.git"
          else
            ORIGIN="https://github.com/ROCm/pytorch.git"
          fi
          TORCH_SHA=$(python -c "import torch; print(torch.version.git_version)")
          echo "Pinning pytorch test source to wheel commit: ${TORCH_SHA}"
          python external-builds/pytorch/pytorch_torch_repo.py checkout \
            --gitrepo-origin "${ORIGIN}" \
            --repo-hashtag "${TORCH_SHA}" \
            --no-hipify \
            --no-submodules

      - name: Install test requirements
        working-directory: TheRock
        run: |
          python -m pip install -r external-builds/pytorch/requirements-test.txt
          python -m pip install -r external-builds/pytorch/pytorch/.ci/docker/requirements-ci.txt
          pip freeze

      - name: Driver / GPU sanity check
        timeout-minutes: 3
        working-directory: TheRock
        run: |
          python ./build_tools/print_driver_gpu_info.py

      - name: Run rocm-sdk sanity tests
        timeout-minutes: 5
        run: |
          rocm-sdk test

      - name: Run PyTorch smoketests
        timeout-minutes: 10
        working-directory: TheRock
        run: |
          python ./external-builds/pytorch/run_pytorch_smoke_tests.py -- \
            --log-cli-level=INFO \
            -v

      # Same command and suite list as TheRock's Windows test jobs (test_nn is
      # excluded on Windows by PyTorch's own blocklist). Add --shard N --num-shards M
      # (or SHARD_NUMBER / NUM_TEST_SHARDS) if a run needs to be split to stay
      # under the 3 hour limit.
      - name: Run PyTorch tests
        timeout-minutes: 120
        working-directory: TheRock
        run: |
          python ./external-builds/pytorch/run_pytorch_tests_full.py \
            --test-config default \
            --device-query unique \
            --gpu-policy single \
            --include \
              test_nn \
              test_torch \
              test_cuda \
              test_unary_ufuncs \
              test_binary_ufuncs \
              test_autograd \
            -- \
            --continue-on-collection-errors

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ inputs.amdgpu_families || 'gfx120X-all' }}
          path: TheRock/external-builds/pytorch/pytorch/test/test-reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove the venv
        if: always()
        run: |
          rm -rf "${VENV_DIR}" || true
