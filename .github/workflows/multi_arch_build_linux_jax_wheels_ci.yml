# Reusable single-build workflow for the Linux JAX wheel CI flow.
#
# This workflow is called once per CI matrix cell from multi_arch_ci_linux.yml.
#
# Built shape:
#   - One manylinux JAX wheel build for one python_version and jax_ref matrix cell.
#   - Installs ROCm packages from the run-scoped CI find-links URL.
#   - Uploads the resulting wheels to run-scoped CI Python artifacts.
#   - Tests those wheels when test_amdgpu_family names a family to test on.

name: Multi-Arch Build Linux JAX Wheels (CI)

on:
  workflow_call:
    inputs:
      artifact_group:
        description: "Artifact group for CI artifact upload."
        type: string
        required: true
      python_version:
        type: string
        default: "3.12"
      jax_repository:
        description: "Repository containing the JAX release branch."
        type: string
        required: true
      gfx_arch:
        description: "ROCm device package selector used for the manylinux build (e.g. device-gfx942, device-gfx950, or device-all)."
        type: string
        required: false
        default: ""
      jax_ref:
        description: "JAX ref to build from jax_repository."
        type: string
        required: true
      rocm_jax_ref:
        description: "ROCm/rocm-jax ref holding the manylinux Dockerfile. Empty uses jax_ref, which release tags share across both repositories."
        type: string
        default: ""
      wheel_type:
        description: "How the plugin wheel is versioned: release stamps the ref's own version; nightly stamps the newest published JAX nightly for that base version, so the test job can install jax/jaxlib to match (for refs without a PyPI release, such as jax-ml/jax@main)."
        type: string
        default: "release"
      rocm_version:
        description: "ROCm package version to install and build against."
        type: string
        required: true
      rocm_package_find_links_url:
        description: "URL for pip --find-links to install ROCm packages for the JAX manylinux build."
        type: string
        default: ""
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      test_amdgpu_family:
        description: "GPU family to run the JAX tests on. Empty builds the wheels without testing them."
        type: string
        default: ""
      test_size:
        description: >-
          "small" is the PR-sized selection on one GPU, "medium" is the whole
          single-GPU suite nightly plus the multi-accelerator tests and two
          end-to-end workloads one day a week, and "large" is all of that every
          time, with the whole end-to-end set.
        type: string
        default: "small"
    outputs:
      package_find_links_url:
        description: "pip --find-links URL for CI-uploaded JAX wheels."
        value: ${{ jobs.build_jax_wheels.outputs.package_find_links_url }}
      jax_version:
        value: ${{ jobs.build_jax_wheels.outputs.jax_version }}
      jaxlib_version:
        value: ${{ jobs.build_jax_wheels.outputs.jaxlib_version }}
      jax_plugin_version:
        value: ${{ jobs.build_jax_wheels.outputs.jax_plugin_version }}
      jax_pjrt_version:
        value: ${{ jobs.build_jax_wheels.outputs.jax_pjrt_version }}
  workflow_dispatch:
    inputs:
      artifact_group:
        description: "Artifact group for CI artifact upload."
        type: string
        required: true
      python_version:
        type: string
        default: "3.12"
      jax_repository:
        description: "GitHub repository in owner/repo format containing the JAX release branch."
        type: string
        default: "ROCm/jax"
      gfx_arch:
        description: "ROCm device package selector used for the manylinux build (e.g. device-gfx942, device-gfx950, or device-all)."
        type: string
        required: false
        default: ""
      jax_ref:
        description: "JAX ref to build from jax_repository (e.g. rocm-jaxlib-v0.11.2)."
        type: string
        required: true
      rocm_jax_ref:
        description: "ROCm/rocm-jax ref holding the manylinux Dockerfile. Empty uses jax_ref, which release tags share across both repositories."
        type: string
        default: ""
      wheel_type:
        description: "release versions the plugin as the ref itself; nightly versions it as the newest published JAX nightly (for refs with no PyPI release, such as jax-ml/jax@main)."
        type: choice
        options:
          - release
          - nightly
        default: release
      rocm_version:
        description: "ROCm package version to install and build against."
        type: string
        required: true
      rocm_package_find_links_url:
        description: "URL for pip --find-links to install ROCm packages for the JAX manylinux build."
        type: string
        default: ""
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      test_amdgpu_family:
        description: "GPU family to run the JAX tests on. Empty builds the wheels without testing them."
        type: string
        default: ""
      test_size:
        description: "How much to run; medium and large also take a multi-GPU runner."
        type: choice
        options:
          - small
          - medium
          - large
        default: small
run-name: Build Multi-Arch Linux JAX Wheels CI (${{ inputs.artifact_group }}, ${{ inputs.rocm_version }}, py${{ inputs.python_version }}, ${{ inputs.jax_ref }})
permissions:
  contents: read
  id-token: write

jobs:
  build_jax_wheels:
    name: Build JAX | ${{ inputs.artifact_group }} | jax ${{ inputs.jax_ref }} | py ${{ inputs.python_version }}
    runs-on: ${{ github.repository_owner == 'ROCm' && 'azure-linux-scale-rocm' || 'ubuntu-24.04' }}
    outputs:
      package_find_links_url: ${{ steps.upload_jax_wheels.outputs.package_find_links_url }}
      jax_version: ${{ steps.write_jax_versions.outputs.jax_version }}
      jaxlib_version: ${{ steps.write_jax_versions.outputs.jaxlib_version }}
      jax_plugin_version: ${{ steps.write_jax_versions.outputs.jax_plugin_version }}
      jax_pjrt_version: ${{ steps.write_jax_versions.outputs.jax_pjrt_version }}
    env:
      ARTIFACT_GROUP: ${{ inputs.artifact_group }}
      ROCM_VERSION: ${{ inputs.rocm_version }}
      RELEASE_TYPE: ci
      MANYLINUX_IMAGE_TAG: therock-jax-manylinux:${{ inputs.jax_ref }}-${{ inputs.python_version }}
      PACKAGE_DIST_DIR: ${{ github.workspace }}/jax-source/dist

    steps:
      - name: Checkout TheRock
        timeout-minutes: 15
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout rocm-jax
        timeout-minutes: 15
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: rocm-jax
          repository: ROCm/rocm-jax
          ref: ${{ inputs.rocm_jax_ref || inputs.jax_ref }}

      - name: Checkout JAX
        id: checkout_jax
        timeout-minutes: 15
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: jax-source
          repository: ${{ inputs.jax_repository }}
          ref: ${{ inputs.jax_ref }}


      - name: Configure Git Identity
        run: |
          git config --global user.name "therockbot"
          git config --global user.email "therockbot@amd.com"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install python deps for CI
        run: |
          pip install -r external-builds/jax/requirements-jax.txt

      - name: Build manylinux image
        working-directory: jax-source
        env:
          THEROCK_VERSION: ""
          GFX_ARCH: ${{ inputs.gfx_arch }}
          ROCM_PACKAGE_FIND_LINKS_URL: ${{ inputs.rocm_package_find_links_url }}
        run: |
          cp ../rocm-jax/docker/manylinux/Dockerfile.jax-manylinux_2_28-therock \
            Dockerfile.jax-manylinux_2_28-therock

          # TODO(#6388): Replace this per-run rocm-jax Dockerfile build with a
          # frozen/prebuilt CI image and refine when JAX CI should run.
          docker build \
            -t "${MANYLINUX_IMAGE_TAG}" \
            --file=Dockerfile.jax-manylinux_2_28-therock \
            --build-arg=THEROCK_INDEX_URL="${ROCM_PACKAGE_FIND_LINKS_URL}" \
            --build-arg=THEROCK_VERSION="${THEROCK_VERSION}" \
            --build-arg=GFX_ARCH="${GFX_ARCH}" \
            --progress=plain \
            .

      - name: Determine wheel version suffix
        run: |
          python build_tools/github_actions/determine_version.py \
            --rocm-version "${ROCM_VERSION}"


      - name: Check wheel_type
        if: ${{ !contains(fromJSON('["release", "nightly"]'), inputs.wheel_type) }}
        run: |
          echo "::error::Unknown wheel_type '${{ inputs.wheel_type }}'; expected release or nightly"
          exit 1

      # A ref with no jax/jaxlib release on PyPI (upstream main) is versioned as
      # the newest published JAX nightly for its base version, so the test job
      # can install a jax/jaxlib of exactly the version the plugin reports.
      - name: Resolve JAX nightly version
        id: resolve_jax_nightly_version
        if: ${{ inputs.wheel_type == 'nightly' }}
        run: |
          python build_tools/github_actions/resolve_jax_nightly_version.py \
            --jax-source-dir jax-source \
            --python-version "${{ inputs.python_version }}"

      - name: Build JAX Wheels in manylinux container
        working-directory: jax-source
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
          JAX_COMMIT: ${{ steps.checkout_jax.outputs.commit }}
          # A nightly stays a "release" build carrying the date in its suffix,
          # giving 0.11.2.dev20260914+rocm7.14.0a20260914. XLA's own "nightly"
          # type drops the ROCm suffix, and its "custom" type emits one "+"
          # where build.py's copy glob writes two, so neither finds the wheel.
          WHEEL_VERSION_DATE: ${{ inputs.wheel_type == 'nightly' && format('.dev{0}', steps.resolve_jax_nightly_version.outputs.build_date) || '' }}
        run: |
          docker run --rm \
            --user root \
            --env JAX_COMMIT \
            --env ROCM_VERSION="${ROCM_VERSION}" \
            --env PYTHON_VERSION="${PYTHON_VERSION}" \
            --env ML_WHEEL_VERSION_SUFFIX="${WHEEL_VERSION_DATE}${version_suffix}" \
            --env PACKAGE_DIST_DIR="/workspace/jax-source/dist" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/jax-source \
            "${MANYLINUX_IMAGE_TAG}" \
            bash -lc '
              ROCM_ROOT="$(rocm-sdk path --root)"
              python build/build.py build \
                --wheels=jax-rocm-plugin,jax-rocm-pjrt \
                --python_version="${PYTHON_VERSION}" \
                --bazel_startup_options=--bazelrc=build/rocm/rocm.bazelrc \
                --bazel_options=--config=rocm_release_wheel \
                --bazel_options=--repo_env=ROCM_PATH="${ROCM_ROOT}" \
                --bazel_options=--repo_env=ML_WHEEL_TYPE=release \
                --bazel_options=--repo_env=ML_WHEEL_VERSION_SUFFIX="${ML_WHEEL_VERSION_SUFFIX}" \
                --bazel_options=--//jaxlib/tools:jaxlib_git_hash="${JAX_COMMIT}" \
                --verbose \
                --detailed_timestamped_log \
                --output_path="$(pwd)/dist"
            '

      - name: Extract JAX versions from built wheels
        id: write_jax_versions
        run: |
          python3 ./build_tools/github_actions/write_jax_versions.py \
            --dist-dir "${PACKAGE_DIST_DIR}"

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ci

      - name: Upload JAX wheels to CI artifacts
        id: upload_jax_wheels
        run: |
          python build_tools/github_actions/upload_python_packages.py \
            --input-packages-dir="${PACKAGE_DIST_DIR}" \
            --artifact-group="${ARTIFACT_GROUP}" \
            --run-id="${{ github.run_id }}" \
            --multiarch


  configure_jax_tests:
    name: Configure JAX Tests
    if: ${{ inputs.test_amdgpu_family != '' }}
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.configure.outputs.enabled }}
      matrix: ${{ steps.configure.outputs.matrix }}
    env:
      TEST_AMDGPU_FAMILY: ${{ inputs.test_amdgpu_family }}
      TEST_SIZE: ${{ inputs.test_size }}

    steps:
      - name: Checking out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          # No github.ref_name fallback: on a pull request that is a merge ref
          # rather than a branch, and checkout cannot fetch it.
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout CI config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          persist-credentials: false
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
        continue-on-error: true

      - name: Configure JAX test matrix
        id: configure
        env:
          CI_CONFIG_PATH: ci-config
        run: |
          python ./build_tools/github_actions/configure_jax_test_matrix.py \
            --target "${TEST_AMDGPU_FAMILY}" \
            --platform linux \
            --test-size "${TEST_SIZE}"

  test_jax_wheels:
    if: ${{ needs.configure_jax_tests.outputs.enabled == 'true' }}
    needs: [build_jax_wheels, configure_jax_tests]
    name: Test | ${{ inputs.test_amdgpu_family }} | ${{ inputs.test_size }} | ${{ matrix.test_subset }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure_jax_tests.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/test_multi_arch_linux_jax_wheels.yml
    with:
      test_amdgpu_family: ${{ inputs.test_amdgpu_family }}
      # CI publishes the wheels it built to a run-scoped page rather than to a
      # package index, so they install with --find-links.
      wheel_find_links_url: ${{ needs.build_jax_wheels.outputs.package_find_links_url }}
      rocm_version: ${{ inputs.rocm_version }}
      rocm_package_find_links_url: ${{ inputs.rocm_package_find_links_url }}
      release_type: ci
      test_size: ${{ inputs.test_size }}
      python_version: ${{ inputs.python_version }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref }}
      jax_ref: ${{ inputs.jax_ref }}
      jax_repository: ${{ inputs.jax_repository }}
      rocm_jax_ref: ${{ inputs.rocm_jax_ref }}
      jax_version: ${{ needs.build_jax_wheels.outputs.jax_version }}
      jaxlib_version: ${{ needs.build_jax_wheels.outputs.jaxlib_version }}
      jax_plugin_version: ${{ needs.build_jax_wheels.outputs.jax_plugin_version }}
      jax_pjrt_version: ${{ needs.build_jax_wheels.outputs.jax_pjrt_version }}
      test_runs_on: ${{ matrix.test_runs_on }}
      test_subset: ${{ matrix.test_subset }}
      test_timeout_minutes: ${{ matrix.test_timeout_minutes }}
      test_list: ${{ matrix.test_list }}
