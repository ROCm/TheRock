# Regenerates the consumer graph from a full-tree configure and fails if it
# differs from the committed test_tools/therock_consumer_graph.json. Runs only
# when graph-affecting files change, so the configure cost stays off the per-PR
# path (see RFC0013 "CI integration").
#
# The same configure is used to check that real ADDITIONAL_SOURCE_INPUTS
# declarations reach fingerprints (cmake/tests/therock_source_inputs_real_tree_test.py).

name: Consumer Graph Drift Check

on:
  pull_request:
    paths:
      - "**/CMakeLists.txt"
      - "cmake/therock_emit_consumer_graph.cmake"
      - "cmake/therock_subproject.cmake"
      - "test_tools/therock_consumer_graph.json"
      - ".github/workflows/test_consumer_graph_drift.yml"
      - "cmake/tests/therock_source_inputs_real_tree_test.py"

permissions:
  contents: read

jobs:
  consumer_graph_drift:
    name: "Consumer graph drift check"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout TheRock
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setting up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch submodules with fetch_sources.py
        # All subproject sources must be present for the graph to be complete.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python3 ./build_tools/fetch_sources.py --jobs 12 --depth 1

      - name: Configure (emits the consumer graph)
        # Configure only, no build. gfx94X-dcgpu enables every subproject; some
        # (hipSPARSELt, rocprofiler-compute) are excluded on gfx110X, which would
        # drop their edges.
        run: |
          cmake -B build -S . -GNinja \
            -DTHEROCK_ENABLE_ALL=ON \
            -DTHEROCK_AMDGPU_FAMILIES=gfx94X-dcgpu

      - name: Check committed consumer graph is up to date
        run: python3 ./build_tools/github_actions/check_consumer_graph_drift.py --check

      - name: Check real source inputs reach fingerprints
        # Commits a file inside a few declared inputs, reconfigures, and checks
        # that the consuming artifacts' fingerprints change. Runs even if the
        # graph check failed, so both results are reported. requirements-test.txt
        # pins packages differently from requirements.txt, so it is installed
        # only here, after the steps that need requirements.txt.
        if: ${{ !cancelled() }}
        run: |
          pip install -r requirements-test.txt
          python3 -m pytest -m manual cmake/tests/therock_source_inputs_real_tree_test.py -v
