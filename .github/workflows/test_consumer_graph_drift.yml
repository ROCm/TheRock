# Regenerates the consumer graph from a full-tree configure and fails if it
# differs from the committed test_tools/therock_consumer_graph.json. Runs only
# when graph-affecting files change, so the configure cost stays off the per-PR
# path (see RFC0013 "CI integration").

name: Consumer Graph Drift Check

on:
  pull_request:
    paths:
      - "**/CMakeLists.txt"
      - "cmake/therock_emit_consumer_graph.cmake"
      - "cmake/therock_subproject.cmake"
      - "test_tools/therock_consumer_graph.json"
      - ".github/workflows/test_consumer_graph_drift.yml"

permissions:
  contents: read

jobs:
  consumer_graph_drift:
    name: "Consumer graph drift check"
    runs-on: ubuntu-24.04
    steps:
      - name: Checking out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Adjust git config
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Fetch sources
        # All subproject sources must be present for the graph to be complete.
        run: python3 ./build_tools/fetch_sources.py --jobs 12 --depth 1

      - name: Configure (emits the consumer graph)
        # Configure only, no build. gfx94X-dcgpu enables every subproject; some
        # (hipSPARSELt, rocprofiler-compute) are excluded on gfx110X, which would
        # drop their edges.
        run: |
          cmake -B build -S . -GNinja \
            -DTHEROCK_ENABLE_ALL=ON \
            -DTHEROCK_AMDGPU_FAMILIES=gfx94X-dcgpu

      - name: Check committed consumer graph is up to date
        run: python3 ./build_tools/github_actions/check_consumer_graph_drift.py --check
