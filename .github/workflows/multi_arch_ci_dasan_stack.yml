name: Experimental DASan full stack

on:
  workflow_call:

permissions:
  contents: read
  actions: read
  id-token: write

# No secrets are forwarded; standard stage uploads use OIDC. Each stage fetches
# inbound artifacts only from github.run_id, without prior-run artifact reuse.
jobs:
  compiler_runtime:
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: compiler-runtime
      stage_display_name: Stage - Compiler Runtime
      timeout_minutes: 480
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  # DASan emulation waits for the compiler/runtime built in this run.
  emulation:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: emulation
      stage_display_name: Stage - Emulation
      timeout_minutes: 240
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  runtime_tests:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: runtime-tests
      stage_display_name: Stage - Runtime Tests
      timeout_minutes: 120
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  math_libs:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: math-libs
      stage_display_name: Stage - Math Libs (gfx950)
      timeout_minutes: 480
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  comm_libs:
    needs:
    - compiler_runtime
    - emulation
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: comm-libs
      stage_display_name: Stage - Comm Libs
      timeout_minutes: 240
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  storage_libs:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: storage-libs
      stage_display_name: Stage - Storage Libs
      timeout_minutes: 240
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  debug_tools:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: debug-tools
      stage_display_name: Stage - Debug Tools
      timeout_minutes: 180
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  dctools_core:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: dctools-core
      stage_display_name: Stage - DC Tools Core
      timeout_minutes: 120
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  profiler_apps:
    needs:
    - storage_libs
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: profiler-apps
      stage_display_name: Stage - Profiler Apps
      timeout_minutes: 180
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  cv_libs:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: cv-libs
      stage_display_name: Stage - CV Libs
      timeout_minutes: 180
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  media_libs:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: media-libs
      stage_display_name: Stage - Media Libs
      timeout_minutes: 180
      amdgpu_family: gfx950-dcgpu
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-dasan
      build_runs_on: aws-linux-scale-rocm-large
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  # This platform bridge has no device code. Preserve the dedicated WSL
  # runner group and use its standard unsanitized package preset.
  wsl_rocdxg:
    needs:
    - compiler_runtime
    uses: ./.github/workflows/multi_arch_build_wsl_rocdxg_artifacts.yml
    with:
      stage_name: wsl-rocdxg
      stage_display_name: Stage - WSL ROCDXG
      timeout_minutes: 120
      dist_amdgpu_families: gfx950-dcgpu
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      build_variant_cmake_preset: linux-release-package
      release_type: ci
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  package:
    needs:
    - compiler_runtime
    - emulation
    - runtime_tests
    - math_libs
    - comm_libs
    - storage_libs
    - debug_tools
    - dctools_core
    - profiler_apps
    - cv_libs
    - media_libs
    - wsl_rocdxg
    uses: ./.github/workflows/multi_arch_ci_dasan_package.yml
    with:
      rocm_package_version: ${{ format('8.0.0.dev0+dasan.{0}', github.run_id) }}
      amdgpu_family: gfx950-dcgpu
      repository: ROCm/TheRock
      ref: ${{ github.sha }}
  validate_download:
    needs: package
    uses: ./.github/workflows/multi_arch_ci_dasan_validate.yml
