name: Build Multi-Arch Tarballs

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Run ID to fetch artifacts from (defaults to current run)"
        type: string
        default: ""
      artifact_github_repo:
        description: "GitHub repository for artifact_run_id"
        type: string
        default: ROCm/TheRock
      dist_amdgpu_families:
        description: "Semicolon-separated list of GPU families (e.g. 'gfx94X-dcgpu;gfx110X-all')"
        type: string
      platform:
        type: choice
        description: "Platform to fetch artifacts for"
        options:
          - linux
          - windows
        default: "linux"
      package_version:
        description: "ROCm package version string (e.g. '7.13.0.dev0+abc123')"
        type: string
      release_type:
        description: 'Release type: "ci" or "dev"'
        type: choice
        options:
          - ci
          - dev
        default: ci
      include_test_tarballs:
        description: "Also build -tests tarballs that include test artifacts"
        type: boolean
        default: true
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically by the
          top-level orchestrator to link this run to its release lineage. Do not
          set it manually.
        type: string
        default: ""
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      artifact_github_repo:
        type: string
        default: ""
      dist_amdgpu_families:
        type: string
        required: true
      platform:
        type: string
        default: "linux"
      package_version:
        type: string
        required: true
      release_type:
        type: string
        default: ci
      include_test_tarballs:
        type: boolean
        default: true
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      quartz_tracking_id:
        type: string
        default: ""
      enable_resource_probe:
        description: "Collect privacy-safe resource telemetry for tarball packaging phases."
        type: boolean
        default: false
      resource_probe_interval_seconds:
        description: "Resource probe sampling interval in seconds."
        type: number
        default: 5
      resource_probe_detail_profile:
        description: "Probe detail profile: basic, process, or diagnostic."
        type: string
        default: basic
      resource_probe_phases:
        description: "JSON array of exact allowlisted packaging phases to probe."
        type: string
        default: '["dependency-install","package-build","package-upload"]'
      resource_probe_canary_mode:
        description: "Emit an artifact-equivalence manifest for A/B qualification."
        type: boolean
        default: false
    outputs:
      tarball_urls:
        description: Tarball URLs keyed by family
        value: ${{ jobs.build_tarballs.outputs.tarball_urls }}

permissions:
  contents: read

run-name: Build Multi-Arch Tarballs (${{ inputs.dist_amdgpu_families }}, ${{ inputs.platform }})

jobs:
  build_tarballs:
    name: Build Tarballs
    runs-on: ${{ github.repository_owner == 'ROCm' && 'aws-linux-scale-rocm-prod' || 'ubuntu-24.04' }}
    container:
      image: python:3.12-slim
    permissions:
      id-token: write
    outputs:
      tarball_urls: ${{ steps.upload.outputs.tarball_urls }}
    env:
      QUARTZ_REPORTING_WORKFLOW: multi_arch_build_tarballs.yml
      QUARTZ_WORKFLOW_POSTFIX: "- build tarballs"
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      RELEASE_TYPE: ${{ inputs.release_type }}
      ENABLE_RESOURCE_PROBE: ${{ inputs.enable_resource_probe || false }}
      RESOURCE_PROBE_INTERVAL_SECONDS: ${{ inputs.resource_probe_interval_seconds || 5 }}
      RESOURCE_PROBE_DETAIL_PROFILE: ${{ inputs.resource_probe_detail_profile || 'basic' }}
      RESOURCE_PROBE_PHASES: ${{ inputs.resource_probe_phases || '["dependency-install","package-build","package-upload"]' }}
      RESOURCE_PROBE_OUTPUT_DIR: ${{ github.workspace }}/resource-probe

    steps:
      - name: "Quartz - started ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ !inputs.resource_probe_canary_mode && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: started
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Install Python requirements
        run: |
          python build_tools/run_resource_probe_phase.py \
            --enabled "${ENABLE_RESOURCE_PROBE}" \
            --selected-phases "${RESOURCE_PROBE_PHASES}" \
            --phase dependency-install \
            --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" \
            --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" \
            --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" \
            --storage-path "${GITHUB_WORKSPACE}" \
            -- pip install -r requirements.txt

      - name: Build tarballs
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "${{ inputs.include_test_tarballs }}" == "true" ]]; then
            EXTRA_ARGS+=(--include-test-tarballs)
          fi

          python build_tools/run_resource_probe_phase.py \
            --enabled "${ENABLE_RESOURCE_PROBE}" \
            --selected-phases "${RESOURCE_PROBE_PHASES}" \
            --phase package-build \
            --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" \
            --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" \
            --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" \
            --storage-path "${GITHUB_WORKSPACE}" \
            -- python build_tools/packaging/archives/build_tarballs.py \
            --run-id="${{ env.ARTIFACT_RUN_ID }}" \
            --run-github-repo="${{ inputs.artifact_github_repo }}" \
            --dist-amdgpu-families="${{ inputs.dist_amdgpu_families }}" \
            --platform="${{ inputs.platform }}" \
            --package-version="${{ inputs.package_version }}" \
            --output-dir="${{ github.workspace }}/tarballs" \
            "${EXTRA_ARGS[@]}"

      - name: Configure AWS Credentials
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ${{ inputs.release_type }}

      - name: Generate canary tarball manifest
        if: ${{ inputs.resource_probe_canary_mode }}
        run: |
          python build_tools/artifact_equivalence_manifest.py \
            --artifact-dir "${{ github.workspace }}/tarballs" \
            --output "${{ github.workspace }}/canary-evidence/tarballs/artifact-manifest.json"

      - name: Upload canary tarball manifest
        if: ${{ always() && inputs.resource_probe_canary_mode }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-canary-manifest-tarballs-${{ github.run_attempt }}
          path: ${{ github.workspace }}/canary-evidence/tarballs/artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload tarballs
        id: upload
        run: |
          python build_tools/run_resource_probe_phase.py \
            --enabled "${ENABLE_RESOURCE_PROBE}" \
            --selected-phases "${RESOURCE_PROBE_PHASES}" \
            --phase package-upload \
            --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" \
            --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" \
            --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" \
            --storage-path "${GITHUB_WORKSPACE}" \
            -- python build_tools/github_actions/upload_tarballs.py \
            --input-tarballs-dir="${{ github.workspace }}/tarballs" \
            --run-id="${{ github.run_id }}" \
            --platform="${{ inputs.platform }}" \
            --release-type="${{ inputs.release_type }}"

      - name: Upload resource telemetry
        if: ${{ always() && inputs.enable_resource_probe }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-probe-tarballs-${{ inputs.platform }}-${{ github.run_attempt }}
          path: ${{ env.RESOURCE_PROBE_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: "Quartz - completed ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ always() && !inputs.resource_probe_canary_mode && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: completed
          run_conclusion: ${{ job.status }}
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_step_outputs: ${{ toJSON(steps) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
