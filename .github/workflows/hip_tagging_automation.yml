name: Hip tagging automation

on:
  push:
    branches:
      - main
    paths:
        - rocm-systems

permissions:
  contents: read

jobs:
  tag-rocm-systems:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout ROCm/TheRock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are created through the API with a separate GitHub App token.
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.ROCM_SYSTEMS_APP_ID }}
          private-key: ${{ secrets.ROCM_SYSTEMS_APP_PRIVATE_KEY }}
          owner: "ROCm"
          repositories: "rocm-systems"
          permission-contents: write # Create and verify HIP version tags.

      - name: Install dependencies
        run: |
          pip install PyGithub

      # The script creates tags through the API using TAGGING_TOKEN from "Generate GitHub App token".
      - name: Run tagging script
        env:
          TAGGING_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          python build_tools/github_actions/hip_tagging_helper.py \
            --repo "${{ github.repository }}" \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}" \
            --pat "${TAGGING_TOKEN}"
