# Dispatch-only test harness for the fingerprint artifact cache against the
# shared ClickHouse index. No GPU build, non-gating: it shows the loop so you
# can watch uploads, cache hits/misses, and per-stage skip decisions.
#
# One run: a "cold" plan reports what the shared cache already covers, this run
# publishes its units, a "warm" plan shows those stages now skip, and a final
# plan simulates one subproject changing so you can see a partial miss.
# Re-dispatch WITHOUT reset to prove cross-run reuse (the cold plan already hits
# what a prior run published).
#
# Requires repository secrets: CLICKHOUSE_URL (https://<host>:8443),
# CLICKHOUSE_USER, CLICKHOUSE_PASSWORD.

name: Fingerprint Cache CI Demo

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Truncate the shared cache first (show a cold start)"
        type: boolean
        default: false
      changed:
        description: "Artifact identity to mark 'changed' in the last plan (see a miss)"
        type: string
        default: "blas_lib_gfx94X-dcgpu"

permissions:
  contents: read

jobs:
  fingerprint-cache-demo:
    runs-on: ubuntu-latest
    env:
      CLICKHOUSE_URL: ${{ secrets.CLICKHOUSE_URL }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
    defaults:
      run:
        working-directory: build_tools/github_actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight - ClickHouse connectivity
        run: python -m artifact_cache.ci_cache ping

      - name: Reset shared cache (optional)
        if: ${{ inputs.reset }}
        run: python -m artifact_cache.ci_cache reset

      - name: Plan (cold) - what the shared cache already covers
        run: python -m artifact_cache.ci_cache plan --synthetic

      - name: Publish this build's fingerprints
        run: python -m artifact_cache.ci_cache publish --synthetic

      - name: Plan (warm) - stages now served from the cache
        run: python -m artifact_cache.ci_cache plan --synthetic

      - name: Plan (changed) - one subproject changed, watch it miss
        run: python -m artifact_cache.ci_cache plan --synthetic --changed "${{ inputs.changed }}"
