name: Validate downloaded DASan stack

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Download and validate DASan SDK (gfx950)
    runs-on: linux-gfx950-8gpu-ccs-ossci-rocm
    timeout-minutes: 90
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --user 0:0 --ulimit memlock=-1:-1 --ulimit nofile=1048576:1048576
        --ipc=host --security-opt seccomp=unconfined --group-add video
        --device /dev/kfd --device /dev/dri
        --group-add 993 --group-add 992 --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES -e KUBE_CPU_REQUEST
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout validation tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download full SDK delivery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dasan-stack-sdk-gfx950
          path: delivery
      - name: Download unchanged compiler test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dasan-stack-lit-bundle
          path: lit-bundle
      - name: Verify downloaded archive checksums
        working-directory: delivery
        run: sha256sum --check SHA256SUMS
      - name: Extract complete installation including tests
        run: |
          archives=(delivery/*-tests-*.tar.gz)
          test "${#archives[@]}" -eq 1
          mkdir sdk
          tar -xzf "${archives[0]}" -C sdk
      - name: Run all 27 unchanged DASan tests on downloaded SDK
        run: |
          export LD_LIBRARY_PATH="$PWD/sdk/lib:$PWD/sdk/lib/llvm/lib:$PWD/sdk/lib/rocm_sysdeps/lib"
          runtime="$(sdk/lib/llvm/bin/clang -print-file-name=libclang_rt.dasan.so)"
          test -f "${runtime}"
          export LD_LIBRARY_PATH="$(dirname "${runtime}"):${LD_LIBRARY_PATH}"
          python3 test_tools/dasan_stack_validate.py --rocm-path sdk \
            --bundle lit-bundle --output-dir validation
      - name: Upload downloaded-SDK validation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dasan-stack-download-validation-gfx950
          path: validation/
          if-no-files-found: warn
          retention-days: 30
