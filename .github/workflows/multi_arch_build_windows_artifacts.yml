# Reusable Workflow: Build Stage Artifacts
#
# This workflow builds TheRock stage artifacts for all stages.
# Handles both generic stages (compiler-runtime, etc.) and
# per-arch stages (math-libs) using conditional logic.
#
# Artifacts flow between stages via S3 using the artifact_manager.py tool.
#
# TODO: When kpack splitting is permanently enabled, change fetch commands to use
# --generic-only instead of --amdgpu-families for efficiency. Subsequent build
# stages only need generic (host) artifacts; device-specific kpacks are not
# needed until final packaging.

name: Build Stage Artifacts

on:
  workflow_call:
    inputs:
      stage_name:
        type: string
        required: true
        description: "Stage name (e.g., compiler-runtime, math-libs)"
      stage_display_name:
        type: string
        required: true
        description: "Human-readable display name for the job"
      timeout_minutes:
        type: number
        required: true
        description: "Job timeout in minutes"
      amdgpu_family:
        type: string
        required: false
        default: ""
        description: "GPU family for per-arch stages (empty for generic stages)"
      dist_amdgpu_families:
        type: string
        required: true
        description: "Semicolon-separated list of all GPU families for dist targets"
      build_variant_cmake_preset:
        type: string
      rocm_package_version:
        type: string
        required: true
        description: "ROCm package version string"
      release_type:
        description: 'Release type; controls artifact bucket and IAM role'
        type: string
        default: ci
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
      build_runs_on:
        description: "Build runner label (selected by configure script with weighted distribution)"
        type: string
        default: "azure-windows-scale-rocm"
      external_repo_config:
        description: "JSON config for external repo checkout (generated by detect_external_repo_config.py)"
        type: string
        default: ""
      rebuild_artifacts:
        description: "Comma-separated artifact names to build (granular reuse). Empty = build all artifacts in stage."
        type: string
        default: ""
      quartz_tracking_id:
        type: string
        default: ""
      enable_resource_probe:
        description: "Collect privacy-safe Windows resource telemetry for the build command."
        type: boolean
        default: false
      resource_probe_interval_seconds:
        description: "Resource probe sampling interval in seconds."
        type: number
        default: 5
      resource_probe_detail_profile:
        description: "Telemetry detail: basic, process, or diagnostic (capability-gated PDH)."
        type: string
        default: process
      resource_probe_canary_mode:
        description: "Generate artifact-equivalence evidence without changing normal runs."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_stage:
    name: ${{ inputs.stage_display_name }}
    runs-on: ${{ inputs.build_runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      QUARTZ_REPORTING_WORKFLOW: multi_arch_build_windows_artifacts.yml
      QUARTZ_WORKFLOW_POSTFIX: "- build ROCm artifacts"
      STAGE_NAME: ${{ inputs.stage_name }}
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_family }}
      BUILD_DIR: B:\build
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      CCACHE_DISABLE: ${{ inputs.resource_probe_canary_mode && '1' || '0' }}
      CACHE_DIR: ${{ github.workspace }}/.cache
      TEATIME_FORCE_INTERACTIVE: 0
      RELEASE_TYPE: ${{ inputs.release_type }}
      EXTERNAL_FETCH_SOURCES_ARGS: ${{ inputs.external_repo_config != '' && fromJSON(inputs.external_repo_config).fetch_sources_args || '' }}
      EXTERNAL_REPO_CONFIG: ${{ inputs.external_repo_config }}
      ENABLE_RESOURCE_PROBE: ${{ inputs.enable_resource_probe }}
      RESOURCE_PROBE_INTERVAL_SECONDS: ${{ inputs.resource_probe_interval_seconds }}
      RESOURCE_PROBE_DETAIL_PROFILE: ${{ inputs.resource_probe_detail_profile }}
      RESOURCE_PROBE_OUTPUT_DIR: B:/resource-probe

    steps:
      - name: "Quartz - started ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ !inputs.resource_probe_canary_mode && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: started
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

      # Enable git longpaths before checkout (needed for external repos with long paths)
      - name: Enable git longpaths
        if: ${{ inputs.external_repo_config != '' }}
        run: git config --system core.longpaths true

      - name: Checkout Repository
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout external repository
        if: ${{ inputs.external_repo_config != '' }}
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(inputs.external_repo_config).repository }}
          ref: ${{ fromJSON(inputs.external_repo_config).ref }}
          path: ${{ fromJSON(inputs.external_repo_config).checkout_path }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install python deps
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-bootstrap-python-deps --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" pip install -r requirements.txt

      - name: Install requirements
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-system-dependencies --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" bash -eo pipefail -c '
            choco source disable -n=chocolatey
            choco source add -n=internal -s http://nexus-service.nexus-ns.svc.cluster.local:8081/repository/choco-group/ --priority=1
            choco install --no-progress -y ccache
            # ninja pinned due to a bug in the 1.13.0 release:
            # https://github.com/ninja-build/ninja/issues/2616
            choco install --no-progress -y ninja --version 1.12.1
            choco install --no-progress -y strawberryperl
            if [[ "${STAGE_NAME}" == "media-libs" ]]; then
              choco install --no-progress -y winflexbison3
            fi
          '
          echo "$PATH;C:\Strawberry\c\bin" >> $GITHUB_PATH

      - uses: iterative/setup-dvc@6c05772f52d19792ed73aedb6c2bf65ec92adebb # v3.0.0
        with:
          version: '3.62.0'

      # After other installs, so MSVC gets priority in the PATH.
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Adjust git config
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          git config fetch.parallel 10

      - name: Runner health status
        run: |
          python build_tools/health_status.py

      - name: Setup ccache
        run: |
          python ./build_tools/setup_ccache.py \
            --release-type "${{ inputs.release_type }}" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache" \
            --log-dir "${BUILD_DIR}/logs/ccache"

      # Note: no AWS credentials should be needed here since our CI buckets
      # all currently have public read access.
      - name: Fetch inbound artifacts
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-fetch-inbound-artifacts --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" python build_tools/artifact_manager.py fetch \
            --run-id="${{ github.run_id }}" \
            --stage="${STAGE_NAME}" \
            --amdgpu-families="${{ inputs.amdgpu_family }}" \
            --output-dir="${BUILD_DIR}" \
            --bootstrap

      - name: Fetch sources
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-fetch-sources --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" python build_tools/fetch_sources.py --stage ${STAGE_NAME} --jobs 12 --depth 1 ${EXTERNAL_FETCH_SOURCES_ARGS}

      - name: Get stage configuration
        id: stage_config
        run: |
          python build_tools/configure_stage.py \
            --stage=${STAGE_NAME} \
            --artifacts="${{ inputs.rebuild_artifacts }}" \
            --amdgpu-families="${{ inputs.amdgpu_family }}" \
            --dist-amdgpu-families="${{ inputs.dist_amdgpu_families }}" \
            --gha-output

      - name: Install stage python deps
        if: ${{ steps.stage_config.outputs.pip_install_cmd }}
        env:
          STAGE_PIP_INSTALL_CMD: ${{ steps.stage_config.outputs.pip_install_cmd }}
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-stage-python-deps --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          read -ra PIP_ARGS <<< "${STAGE_PIP_INSTALL_CMD}"
          "${PROBE[@]}" pip install "${PIP_ARGS[@]}"

      - name: Configure
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-configure --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" cmake -B "${BUILD_DIR}" -S . -GNinja \
            --preset=${{ inputs.build_variant_cmake_preset }} \
            -DTHEROCK_PACKAGE_VERSION=${{ inputs.rocm_package_version }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ inputs.external_repo_config != '' && format('-DTHEROCK_{0}_SOURCE_DIR={1}', fromJSON(inputs.external_repo_config).source_package, fromJSON(inputs.external_repo_config).checkout_path) || '' }} \
            ${{ inputs.external_repo_config != '' && fromJSON(inputs.external_repo_config).extra_cmake_options || '' }} \
            ${{ steps.stage_config.outputs.cmake_args }}

      - name: Build stage
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(
              python build_tools/windows_resource_probe.py
              --phase "windows-stage-${STAGE_NAME}"
              --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}"
              --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}"
              --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}"
              --storage-path "${BUILD_DIR}"
              --
            )
          fi
          "${PROBE[@]}" cmake --build "${BUILD_DIR}" --target stage-${STAGE_NAME} therock-artifacts -- -k 0

      - name: Run build tests (Comgr, blocking)
        if: ${{ !cancelled() && inputs.stage_name == 'compiler-runtime' }}
        env:
          TEATIME_FORCE_INTERACTIVE: 1
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-build-tests --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" cmake --build "${BUILD_DIR}" --target therock-build-tests -- -k 0

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "CCache Stats:"
          ccache -s -v
          echo "Artifacts:"
          ls -lh "${BUILD_DIR}"/artifacts/*.tar.xz 2>/dev/null || echo "No artifacts found"

      - name: Test Packaging
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-packaging-tests --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" ctest --test-dir ${BUILD_DIR} --output-on-failure

      - name: Generate canary artifact manifest
        if: ${{ inputs.resource_probe_canary_mode }}
        run: |
          python build_tools/artifact_equivalence_manifest.py \
            --artifact-dir "${BUILD_DIR}/artifacts" \
            --output "${RESOURCE_PROBE_OUTPUT_DIR}/artifact-manifest.json"

      - name: Upload canary artifact manifest
        if: ${{ always() && inputs.resource_probe_canary_mode }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-canary-manifest-stage-${{ inputs.stage_name }}-${{ inputs.amdgpu_family || 'generic' }}-${{ github.run_attempt }}
          path: B:\resource-probe\artifact-manifest.json
          if-no-files-found: error

      - name: Configure AWS credentials for artifact uploads
        if: ${{ always() }}
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ${{ inputs.release_type }}

      # TODO(#3336): Attempt upload `always()`?
      #   * If some part of the build failed, partial artifacts may be useful for debugging.
      #   * This script fails if `build_dir / "artifacts"` does not exist. That's useful
      #     if the build succeeded but did not produce artifacts. That's _not_ useful
      #     if the workflow failed or was cancelled before the build even started though.
      - name: Push stage artifacts
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-artifact-push --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" python build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}"

      - name: Upload stage logs
        if: ${{ always() }}
        run: |
          PROBE=()
          if [[ "${ENABLE_RESOURCE_PROBE}" == "true" ]]; then
            PROBE=(python build_tools/windows_resource_probe.py --phase windows-log-upload --detail-profile "${RESOURCE_PROBE_DETAIL_PROFILE}" --interval-seconds "${RESOURCE_PROBE_INTERVAL_SECONDS}" --output-dir "${RESOURCE_PROBE_OUTPUT_DIR}" --storage-path "${BUILD_DIR}" --)
          fi
          "${PROBE[@]}" python build_tools/github_actions/post_stage_upload.py \
            --run-id=${{ github.run_id }} \
            --stage="${STAGE_NAME}" \
            --build-dir="${BUILD_DIR}" \
            --amdgpu-family="${AMDGPU_FAMILIES}"

      - name: Upload resource telemetry
        if: ${{ always() && inputs.enable_resource_probe }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-resource-probe-${{ inputs.stage_name }}-${{ inputs.amdgpu_family || 'generic' }}-${{ github.run_attempt }}
          path: B:\resource-probe
          if-no-files-found: warn

      - name: Capture job summary
        id: summary
        if: always()
        run: python build_tools/github_actions/capture_job_summary.py

      - name: "Quartz - completed ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ always() && !inputs.resource_probe_canary_mode && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: completed
          run_conclusion: ${{ job.status }}
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_step_outputs: ${{ toJSON(steps) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
