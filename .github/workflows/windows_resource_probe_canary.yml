name: Windows Resource Probe Canary

run-name: >-
  Windows telemetry A/B pair ${{ inputs.pair_index }} — ${{ inputs.variant }}
  @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      pair_index:
        description: "Pair number. Required order is AB for pairs 1/3 and BA for pair 2."
        type: choice
        options: ['1', '2', '3']
        required: true
      variant:
        description: "A=baseline, B=probed. Use the same commit for all six runs."
        type: choice
        options: [baseline, probed]
        required: true
      windows_amdgpu_families:
        description: "Windows families; all exercises every configured target on azure-windows-scale-rocm."
        type: string
        default: all
      interval_seconds:
        description: "Sampling interval for probed runs."
        type: number
        default: 5

permissions:
  contents: read
  actions: read

jobs:
  release_canary:
    # Each dispatch is a separate run_id, preventing stage-artifact key
    # collisions. Canary mode makes publication a dry-run and disables all
    # downstream workflow dispatches.
    uses: ./.github/workflows/multi_arch_release.yml
    secrets: inherit
    with:
      release_type: dev
      linux_amdgpu_families: none
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families }}
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      build_pytorch: false
      build_jax: false
      resource_probe_detail_profile: diagnostic
      windows_resource_probe_interval_seconds: ${{ inputs.interval_seconds }}
      windows_resource_probe_canary_mode: true
      windows_resource_probe_targets: >-
        ${{ inputs.variant == 'probed' &&
        '["compiler-runtime","runtime-tests","math-libs:*","debug-tools","media-libs","release-tarballs:windows","python-packages:dependencies","python-packages:fetch","python-packages:build","python-packages:upload","release-publish:windows"]'
        || '[]' }}
    permissions:
      contents: read
      actions: write
      id-token: write

  label_evidence:
    needs: release_canary
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Write pair label
        env:
          PAIR_INDEX: ${{ inputs.pair_index }}
          VARIANT: ${{ inputs.variant }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release_canary.result }}
        run: |
          mkdir -p evidence
          jq -n \
            --arg pair_index "${PAIR_INDEX}" \
            --arg variant "${VARIANT}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg run_id "${RUN_ID}" \
            --arg release_result "${RELEASE_RESULT}" \
            '{schema:"therock.windows_canary_label.v1",pair_index:$pair_index,variant:$variant,head_sha:$head_sha,run_id:$run_id,release_result:$release_result}' \
            > evidence/canary-label.json
      - name: Upload pair label
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-canary-label-pair-${{ inputs.pair_index }}-${{ inputs.variant }}-${{ github.run_attempt }}
          path: evidence/canary-label.json
          if-no-files-found: error
