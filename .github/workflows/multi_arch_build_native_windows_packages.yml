# Builds Windows MSI installer packages from TheRock artifact tarballs.
#
# Standalone build workflow, decoupled from CI and release so its MSI outputs
# can be consumed by an arbitrary downstream run and so the `ci` and `release`
# workflows can call it as they wish.

name: Build Multi-Arch Native Windows Packages

on:
  workflow_dispatch:
    inputs:
      artifact_github_repo:
        description: "GitHub repository for artifact_run_id"
        type: string
        default: ROCm/TheRock
      artifact_run_id:
        description: "Run id whose published Windows artifacts to package into MSIs"
        type: string
        required: true
      packages:
        description: "Packages to build, as a comma-separated list (e.g. 'runtime,core')."
        type: string
        default: runtime
      rocm_version:
        description: "ROCm version to stamp on the MSI (e.g. '7.15.0')."
        type: string
        required: true
      release_type:
        description: "Release type for the destination artifacts bucket. Developer-triggered runs should use the default."
        type: string
        default: ci
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
        default: ""
  workflow_call:
    inputs:
      artifact_github_repo:
        type: string
        default: ROCm/TheRock
      artifact_run_id:
        type: string
        required: true
      packages:
        type: string
        default: runtime
      rocm_version:
        type: string
        required: true
      release_type:
        type: string
        default: ci
      repository:
        type: string
        default: ""
      ref:
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

run-name: Build Windows MSI packages (${{ inputs.packages }}, ${{ inputs.rocm_version }}${{ inputs.release_type && format(', {0}', inputs.release_type) || '' }})

jobs:
  build:
    name: Build MSI
    # The build is short and cheap, so use a GitHub-hosted runner rather than a
    # self-hosted scale-set.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_GITHUB_REPO: ${{ inputs.artifact_github_repo }}
      PACKAGE_VERSION: ${{ inputs.rocm_version }}
      PACKAGES: ${{ inputs.packages }}
      MSI_DIR: ${{ github.workspace }}/msi-output
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python requirements
        run: pip install -r requirements.txt

      # Pin to WiX v4: v5+ compiles the same schema but v7 gates every command
      # behind the OSMF EULA (error WIX7015), which would fail unattended CI.
      - name: Install WiX Toolset v4
        run: dotnet tool install --global wix --version "4.*"

      # The generator installs two driver-supplied System32 DLLs (amdhip64_6.dll,
      # amd_comgr_2.dll) that are DVC-tracked under
      # rocm-systems/shared/amdgpu-windows-interop/legacy/ rather than committed
      # to git, and fails if they are missing. Initialize the rocm-systems
      # submodule at this checkout's pinned commit and materialize its DVC files.
      - name: Fetch rocm-systems DVC files
        timeout-minutes: 10
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 rocm-systems
          python build_tools/fetch_dvc_artifacts.py pull rocm-systems

      - name: Generate WiX source and build MSI
        run: |
          # Generate one .wxs per requested package straight into MSI_DIR; the
          # generator names each file <output_stem>.wxs, so the workflow needs no
          # knowledge of the package-to-filename mapping.
          python build_tools/packaging/windows/generate_msi_wxs.py \
            --packages "${PACKAGES}" \
            --run-id "${ARTIFACT_RUN_ID}" \
            --run-github-repo "${ARTIFACT_GITHUB_REPO}" \
            --package-version "${PACKAGE_VERSION}" \
            --output-dir "${MSI_DIR}"

          # Compile every generated .wxs into a matching .msi alongside it.
          shopt -s nullglob
          for wxs in "${MSI_DIR}"/*.wxs; do
            wix build "${wxs}" -arch x64 -o "${wxs%.wxs}.msi"
          done

      # The S3 upload requires OIDC credentials whose IAM role trust is scoped
      # to ROCm/TheRock, so it is skipped on forks (where it would fail). Forks
      # still exercise the full generate + wix build path above, which is the
      # part under test; only the artifacts-bucket upload is ROCm-only.
      - name: Configure AWS Credentials
        if: ${{ github.repository_owner == 'ROCm' }}
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ${{ inputs.release_type }}

      # Upload to the current run's artifacts-bucket prefix
      # ({run_id}-windows/packages/msi/) so a downstream publish or test
      # workflow can consume this run's MSIs.
      - name: Upload MSI to artifacts bucket
        if: ${{ github.repository_owner == 'ROCm' }}
        run: |
          python build_tools/packaging/windows/upload_package_repo.py \
            --run-id "${{ github.run_id }}" \
            --package-dir "${MSI_DIR}"
