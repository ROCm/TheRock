name: Proposal 4 Downstream Matrix Graph Proof
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  linux:
    uses: ./.github/workflows/multi_arch_build_portable_linux.yml
    with:
      matrix_per_family_json: '[{"amdgpu_family": "gfx90a", "test-runs-on": "diagnostic-no-gpu"},
        {"amdgpu_family": "gfx94x", "test-runs-on": "diagnostic-no-gpu"}, {"amdgpu_family":
        "gfx110x", "test-runs-on": "diagnostic-no-gpu"}]'
      math_libs_matrix_per_family_json: '[{"amdgpu_family": "gfx94x", "test-runs-on":
        "diagnostic-no-gpu"}]'
      dist_amdgpu_families: gfx90a;gfx94x;gfx110x
      rocm_package_version: 0.0.0-diagnostic
      build_variant_cmake_preset: diagnostic-no-cmake
      quartz_tracking_id: ''
      release_type: ci
  windows:
    uses: ./.github/workflows/multi_arch_build_windows.yml
    with:
      matrix_per_family_json: '[{"amdgpu_family": "gfx90a", "test-runs-on": "diagnostic-no-gpu"},
        {"amdgpu_family": "gfx110x", "test-runs-on": "diagnostic-no-gpu"}, {"amdgpu_family":
        "gfx1151", "test-runs-on": "diagnostic-no-gpu"}]'
      math_libs_matrix_per_family_json: '[{"amdgpu_family": "gfx110x", "test-runs-on":
        "diagnostic-no-gpu"}]'
      dist_amdgpu_families: gfx90a;gfx110x;gfx1151
      rocm_package_version: 0.0.0-diagnostic
      build_variant_cmake_preset: diagnostic-no-cmake
      quartz_tracking_id: ''
      release_type: ci
  retained_consumer_gate:
    needs:
    - linux
    - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - name: Require both retained graph branches to succeed
      env:
        RESULTS_JSON: ${{ toJSON(needs) }}
      run: 'python3 - <<''PY''

        import json,os

        x=json.loads(os.environ["RESULTS_JSON"])

        assert all(v["result"]=="success" for v in x.values()),x

        print("PROPOSAL4_RETAINED_GRAPH_GATE="+json.dumps(x,sort_keys=True))

        PY

        '
