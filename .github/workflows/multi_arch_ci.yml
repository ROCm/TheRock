# Notes on security:
#   * As this runs on lower trust `pull_request` events it forwards
#     no github secrets to child workflows.
#   * Some child workflows are shared by releases where `secrets: inherit` is
#     used to forward credentials for Quartz notifications.

name: Multi-Arch CI

on:
  push:
    branches:
      - main
      - multi_arch/**
      - release/therock-*
  workflow_dispatch:
    inputs:
      profile_consumer_source_probe:
        type: boolean
        default: false
        description: 'Source-only actual consumer context probe; no SDK/build/test or performance claim.'
      profile_consumer_expected_sha:
        type: string
        default: ''
        description: 'Full frozen probe commit SHA; required only for source probe mode.'
      profile_native_fixture_only:
        type: boolean
        default: false
        description: 'Run only the bounded native Debian functional fixture; never a performance baseline.'
      profile_normal_validation:
        type: boolean
        default: false
        description: 'Controlled normal Linux gfx94x+gfx103x comparison; product selection defaults to none.'
      profile_normal_case:
        type: choice
        default: baseline
        options: [baseline, candidate]
        description: 'Baseline/candidate variant; common controls plus documented RTC runtime, COMM default and ELF source differences.'
      profile_normal_product:
        type: choice
        default: none
        options: [none, rocfft-private-batch, leading-build-stack]
        description: 'Default none; rocFFT-only or leading stack of owned RTC batching, native link width and bounded ELF probing.'
      profile_normal_cache_regime:
        type: choice
        default: ci-readonly
        options: [ci-readonly, private-cold]
        description: 'Use identical regime in both arms; remote read-only is warm/mixed only if actual keys/hits establish it.'
      # --- Build targets ---
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X (empty = skip linux)"
        default: ""
      windows_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Windows GPU families to build and test. ex: gfx94X, gfx120X (empty = skip windows)"
        default: ""
      # --- CI labels ---
      pr_labels:
        type: string
        description: "Comma-separated PR labels (e.g. ci:skip-pytorch,test:rocprim,test_filter:quick)."
        default: ""
      # --- Build control ---
      build_stages:
        type: string
        default: ""
        description: "Comma-separated allowlist of build stages (empty = build all). Stages outside this list are skipped entirely."
      build_python_packages:
        type: boolean
        default: true
        description: "Build ROCm Python packages"
      build_pytorch:
        type: boolean
        default: true
        description: "Build PyTorch wheels"
      build_jax:
        type: boolean
        default: true
        description: "Build JAX wheels"
      build_native_linux:
        type: boolean
        default: true
        description: "Build native Linux packages and run install tests"
      build_native_windows:
        type: boolean
        default: true
        description: "Build native Windows packages (MSI)"
      # --- Artifact reuse ---
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"
      stage_reuse_mode:
        type: choice
        default: "dry-run"
        options:
          - "off"
          - "dry-run"
          - "reuse-stage"
        # off disables all artifact reuse and ignores explicit prebuilt stages and
        # baseline inputs. dry-run reports automatic reuse opportunities without
        # applying them. reuse-stage applies automatic reuse.
        description: "off (disable reuse) | dry-run (report only) | reuse-stage (auto-reuse unaffected stages)"
      stage_reuse_max_age_hours:
        type: string
        default: "72"
        description: "Automatic stage reuse: reject baseline runs older than this many hours"
      stage_reuse_commit_history:
        type: string
        default: "50"
        description: "Automatic stage reuse: number of recent branch commits to fetch for ancestry"
      changed_projects:
        type: string
        default: ""
        description: >-
          Comma-separated list of changed project paths (e.g., 'projects/rocprim').
          Mapped to artifacts via BUILD_TOPOLOGY.toml source_paths for granular
          reuse and test filtering (empty = run all tests).
  workflow_call:
    inputs:
      linux_amdgpu_families:
        type: string
        default: ""
      windows_amdgpu_families:
        type: string
        default: ""
      pr_labels:
        type: string
        default: ""
      build_stages:
        type: string
        default: ""
      build_python_packages:
        type: boolean
        default: true
      build_pytorch:
        type: boolean
        default: true
      build_jax:
        type: boolean
        default: true
      build_native_linux:
        type: boolean
        default: true
      build_native_windows:
        type: boolean
        default: true
      prebuilt_stages:
        type: string
        default: ""
      baseline_run_id:
        type: string
        default: ""
      stage_reuse_mode:
        type: string
        default: "dry-run"
      stage_reuse_max_age_hours:
        type: string
        default: "72"
      stage_reuse_commit_history:
        type: string
        default: "50"
      changed_projects:
        type: string
        default: ""
  pull_request:
    types:
      - labeled
      - opened
      - synchronize

permissions:
  contents: read
  actions: read # Required for stage reuse feature to query workflow runs

concurrency:
  # See https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  #
  # Only allow one run at a time for 'pull_request' events.
  # Allow multiple runs for 'push' and 'workflow_dispatch'.
  #
  # `github.workflow`: each workflow gets its own concurrency group
  # `github.head_ref`: the branch name (only defined for pull_request events)
  # `github.run_id`  : fallback, unique for each run
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    if: ${{ !inputs.profile_native_fixture_only && !inputs.profile_consumer_source_probe }}
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "release"
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || '' }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families || '' }}
      pr_labels: ${{ inputs.pr_labels || '' }}
      prebuilt_stages: ${{ inputs.prebuilt_stages || '' }}
      baseline_run_id: ${{ inputs.baseline_run_id || '' }}
      stage_reuse_mode: ${{ inputs.stage_reuse_mode || 'dry-run' }}
      stage_reuse_max_age_hours: ${{ inputs.stage_reuse_max_age_hours || '72' }}
      stage_reuse_commit_history: ${{ inputs.stage_reuse_commit_history || '50' }}
      build_python_packages: ${{ github.event_name != 'workflow_dispatch' || inputs.build_python_packages }}
      build_pytorch: ${{ github.event_name != 'workflow_dispatch' || inputs.build_pytorch }}
      build_jax: ${{ github.event_name != 'workflow_dispatch' || inputs.build_jax }}
      build_native_linux: ${{ github.event_name != 'workflow_dispatch' || inputs.build_native_linux }}
      build_native_windows: ${{ github.event_name != 'workflow_dispatch' || inputs.build_native_windows }}
      build_stages: ${{ inputs.build_stages || '' }}

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_ci_linux.yml
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      changed_projects: ${{ inputs.changed_projects || '' }}
    permissions:
      contents: read
      id-token: write

  windows_build_and_test:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.windows_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_ci_windows.yml
    with:
      build_config: ${{ needs.setup.outputs.windows_build_config }}
      test_labels: ${{ needs.setup.outputs.windows_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_msi_package_version: ${{ needs.setup.outputs.rocm_msi_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      changed_projects: ${{ inputs.changed_projects || '' }}
    permissions:
      contents: read
      id-token: write

  manifest_diff:
    name: Manifest Diff
    # Refs are auto-derived from push / pull_request events only.
    # For manual runs, dispatch manifest-diff.yml directly with explicit refs.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/manifest-diff.yml
    permissions:
      contents: read
      id-token: write

  ci_summary:
    name: CI Summary
    if: ${{ always() && !inputs.profile_native_fixture_only && !inputs.profile_consumer_source_probe }}
    needs:
      - setup
      - linux_build_and_test
      - windows_build_and_test
      - manifest_diff
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json "${NEEDS_JSON}"

  native_fixture_probe:
    name: Native Debian functional fixture only
    if: ${{ github.repository == 'ROCm/TheRock' && github.event_name == 'workflow_dispatch' && inputs.profile_native_fixture_only && !inputs.profile_consumer_source_probe }}
    runs-on: aws-linux-scale-rocm-small
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:a13e8370a2d1d33a910e47669cdf075dbe9554685e78592f22935ec7c7c35e39
    defaults:
      run:
        shell: bash
    steps:
      - name: Checking out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require isolated functional fixture context
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          branch = "users/sa-faizal/build-profile-41147801272-normal-validation-fakeroot"
          expected = {
              "GITHUB_ACTIONS": "true", "GITHUB_REPOSITORY": "ROCm/TheRock",
              "GITHUB_ACTOR": "sa-faizal", "GITHUB_EVENT_NAME": "workflow_dispatch",
              "GITHUB_REF": "refs/heads/" + branch,
              "GITHUB_WORKFLOW_REF": "ROCm/TheRock/.github/workflows/multi_arch_ci.yml@refs/heads/" + branch,
          }
          if any(os.environ.get(key) != value for key, value in expected.items()):
              raise SystemExit("Functional fixture repository/actor/event/ref guard failed")
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source != os.environ.get("GITHUB_SHA") or os.geteuid() == 0 or not __debug__:
              raise SystemExit("Functional fixture requires exact checkout and non-root context with assertions enabled")
          inputs = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["inputs"]
          enabled = inputs.get("profile_native_fixture_only")
          normal = inputs.get("profile_normal_validation", "false")
          if not (enabled is True or enabled == "true") or not (normal is False or normal == "false"):
              raise SystemExit("Functional fixture must be explicit and cannot be a normal baseline")
          output = Path("output/normal-validation")
          output.mkdir(parents=True, exist_ok=True)
          (output / "native-fixture-scope.json").write_text(json.dumps({"source_sha": source, "uid": os.geteuid(), "fixture_only": True, "normal_performance_validation": False, "context": expected}, indent=2) + "\n")
          PY
      - name: Install Python requirements
        run: |
          pip install pyelftools==0.33 boto3==1.39.15 jinja2==3.1.6 pyzstd==0.19.1
      - name: Install System requirements
        run: |
          # Install the needed tools for creating rpm / deb packages
          # Also install tools for creating repo files
          sudo apt-get update
          sudo apt-get install -y llvm-20
          sudo apt-get install -y rpm debhelper-compat build-essential
          sudo apt-get install -y dpkg-dev createrepo-c
          sudo apt-get install -y patchelf
      - name: Require HIPIFY Debian symlink preservation
        run: python build_tools/packaging/linux/hipify_deb_fixture.py --output output/normal-validation/hipify-dh-perl-fixture.json
      - name: Retain functional fixture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: normal-native-fixture-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: output/normal-validation/

  consumer_source_probe:
    name: Consumer source provenance only
    if: ${{ inputs.profile_consumer_source_probe }}
    uses: ./.github/workflows/normal_consumer_source_probe.yml
    permissions:
      contents: read
    with:
      expected_sha: ${{ inputs.profile_consumer_expected_sha }}
