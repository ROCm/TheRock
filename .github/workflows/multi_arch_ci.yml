# Notes on security:
#   * As this runs on lower trust `pull_request` events it forwards
#     no github secrets to child workflows.
#   * Some child workflows are shared by releases where `secrets: inherit` is
#     used to forward credentials for Quartz notifications.

name: Multi-Arch CI

on:
  push:
    branches:
      - main
      - multi_arch/**
      - release/therock-*
  workflow_dispatch:
    inputs:
      profile_package_scan:
        type: boolean
        default: false
        description: "Run only the read-only ELF scan diagnostic on historical artifacts; skip builds and tests"
      profile_package_preprocess:
        type: boolean
        default: false
        description: "Compare actual RPATH preprocessing on pristine-derived copies (ABBA); skip builds and tests"
      # --- Build targets ---
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X (empty = skip linux)"
        default: ""
      windows_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Windows GPU families to build and test. ex: gfx94X, gfx120X (empty = skip windows)"
        default: ""
      # --- CI labels ---
      pr_labels:
        type: string
        description: "Comma-separated PR labels (e.g. ci:skip-pytorch,test:rocprim,test_filter:quick)."
        default: ""
      # --- Build control ---
      build_stages:
        type: string
        default: ""
        description: "Comma-separated allowlist of build stages (empty = build all). Stages outside this list are skipped entirely."
      build_python_packages:
        type: boolean
        default: true
        description: "Build ROCm Python packages"
      build_pytorch:
        type: boolean
        default: true
        description: "Build PyTorch wheels"
      build_jax:
        type: boolean
        default: true
        description: "Build JAX wheels"
      build_native_linux:
        type: boolean
        default: true
        description: "Build native Linux packages and run install tests"
      build_native_windows:
        type: boolean
        default: true
        description: "Build native Windows packages (MSI)"
      # --- Artifact reuse ---
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip (or 'all' for all stages); artifacts are copied from baseline_run_id instead"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; required when prebuilt_stages is set"
      stage_reuse_mode:
        type: choice
        default: "dry-run"
        options:
          - "off"
          - "dry-run"
          - "reuse-stage"
        # off disables all artifact reuse and ignores explicit prebuilt stages and
        # baseline inputs. dry-run reports automatic reuse opportunities without
        # applying them. reuse-stage applies automatic reuse.
        description: "off (disable reuse) | dry-run (report only) | reuse-stage (auto-reuse unaffected stages)"
      stage_reuse_max_age_hours:
        type: string
        default: "72"
        description: "Automatic stage reuse: reject baseline runs older than this many hours"
      stage_reuse_commit_history:
        type: string
        default: "50"
        description: "Automatic stage reuse: number of recent branch commits to fetch for ancestry"
      changed_projects:
        type: string
        default: ""
        description: >-
          Comma-separated list of changed project paths (e.g., 'projects/rocprim').
          Mapped to artifacts via BUILD_TOPOLOGY.toml source_paths for granular
          reuse and test filtering (empty = run all tests).
  workflow_call:
    inputs:
      profile_package_scan:
        type: boolean
        default: false
      profile_package_preprocess:
        type: boolean
        default: false
      linux_amdgpu_families:
        type: string
        default: ""
      windows_amdgpu_families:
        type: string
        default: ""
      pr_labels:
        type: string
        default: ""
      build_stages:
        type: string
        default: ""
      build_python_packages:
        type: boolean
        default: true
      build_pytorch:
        type: boolean
        default: true
      build_jax:
        type: boolean
        default: true
      build_native_linux:
        type: boolean
        default: true
      build_native_windows:
        type: boolean
        default: true
      prebuilt_stages:
        type: string
        default: ""
      baseline_run_id:
        type: string
        default: ""
      stage_reuse_mode:
        type: string
        default: "dry-run"
      stage_reuse_max_age_hours:
        type: string
        default: "72"
      stage_reuse_commit_history:
        type: string
        default: "50"
      changed_projects:
        type: string
        default: ""
  pull_request:
    types:
      - labeled
      - opened
      - synchronize

permissions:
  contents: read
  actions: read # Required for stage reuse feature to query workflow runs

concurrency:
  # See https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  #
  # Only allow one run at a time for 'pull_request' events.
  # Allow multiple runs for 'push' and 'workflow_dispatch'.
  #
  # `github.workflow`: each workflow gets its own concurrency group
  # `github.head_ref`: the branch name (only defined for pull_request events)
  # `github.run_id`  : fallback, unique for each run
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    if: ${{ !inputs.profile_package_scan && !inputs.profile_package_preprocess }}
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: "release"
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || '' }}
      windows_amdgpu_families: ${{ inputs.windows_amdgpu_families || '' }}
      pr_labels: ${{ inputs.pr_labels || '' }}
      prebuilt_stages: ${{ inputs.prebuilt_stages || '' }}
      baseline_run_id: ${{ inputs.baseline_run_id || '' }}
      stage_reuse_mode: ${{ inputs.stage_reuse_mode || 'dry-run' }}
      stage_reuse_max_age_hours: ${{ inputs.stage_reuse_max_age_hours || '72' }}
      stage_reuse_commit_history: ${{ inputs.stage_reuse_commit_history || '50' }}
      build_python_packages: ${{ github.event_name != 'workflow_dispatch' || inputs.build_python_packages }}
      build_pytorch: ${{ github.event_name != 'workflow_dispatch' || inputs.build_pytorch }}
      build_jax: ${{ github.event_name != 'workflow_dispatch' || inputs.build_jax }}
      build_native_linux: ${{ github.event_name != 'workflow_dispatch' || inputs.build_native_linux }}
      build_native_windows: ${{ github.event_name != 'workflow_dispatch' || inputs.build_native_windows }}
      build_stages: ${{ inputs.build_stages || '' }}

  profile_package_scan:
    name: ${{ inputs.profile_package_preprocess && 'Actual package preprocessing comparison' || 'Read-only package ELF scan diagnostic' }}
    if: ${{ (inputs.profile_package_scan || inputs.profile_package_preprocess) && github.repository == 'ROCm/TheRock' }}
    runs-on: aws-linux-scale-rocm-small
    timeout-minutes: 240
    permissions:
      contents: read
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:a13e8370a2d1d33a910e47669cdf075dbe9554685e78592f22935ec7c7c35e39
    steps:
      - name: Check out triggering diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install diagnostic requirements
        run: pip install boto3==1.39.15 pyzstd==0.19.1 psutil==7.1.3
      - name: Install actual preprocessing tools
        if: ${{ inputs.profile_package_preprocess }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils patchelf zstd
      - name: Preflight owned directory metadata before fetching inputs
        if: ${{ inputs.profile_package_preprocess }}
        run: |
          python - <<'PY'
          import json, os, stat, subprocess, tempfile
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          output = workspace / 'output/scan-diagnostics'
          output.mkdir(parents=True, exist_ok=True)
          result = dict(euid=os.geteuid(), egid=os.getegid(), groups=os.getgroups())
          try:
              with tempfile.TemporaryDirectory(prefix='.preprocess-mode-probe-', dir=workspace) as temporary:
                  probe = Path(temporary) / 'directory'
                  probe.mkdir()
                  assert probe.resolve() == probe and workspace in probe.parents
                  assert probe.stat().st_uid == os.geteuid()
                  result['inherited_gid'] = probe.stat().st_gid
                  command = ['/usr/bin/sudo', '-n', '--', '/usr/bin/chmod', '2755', '--', str(probe)]
                  result['command'] = command
                  subprocess.run(command, check=True)
                  result['restored_mode'] = stat.S_IMODE(probe.stat().st_mode)
                  assert result['restored_mode'] == 0o2755
                  result['status'] = 'passed'
          except Exception as error:
              result.update(status='failed', error=str(error))
              raise
          finally:
              (output / 'permissions-preflight.json').write_text(json.dumps(result, indent=2))
          PY
      - name: Fetch read-only historical inputs
        env:
          # Selects the existing public input bucket only for this fetch step.
          RELEASE_TYPE: nightly
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python -c "import sys; sys.path.insert(0, 'build_tools'); from _therock_utils.workflow_outputs import WorkflowOutputRoot; root = WorkflowOutputRoot.from_workflow_run(run_id='41147801272', platform='linux', github_repository='ROCm/rockrel'); assert root.bucket == 'therock-nightly-artifacts' and root.prefix == '41147801272-linux', root; print(root.root().s3_uri)"
          python build_tools/artifact_manager.py fetch \
            --run-id=41147801272 \
            --run-github-repo=ROCm/rockrel \
            --stage=all \
            --amdgpu-families='gfx94X-dcgpu;gfx110X-all;gfx1151;gfx120X-all;gfx125X-dcgpu;gfx90a;gfx950-dcgpu;gfx900;gfx90c;gfx906;gfx908;gfx101X-dgpu;gfx103X-all;gfx1150;gfx1152;gfx1153;gfx117X-all' \
            --expand-family-to-targets \
            --output-dir=output
      - name: Record ownership of this run's fetched preprocessing input
        if: ${{ inputs.profile_package_preprocess }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('output/artifacts').resolve()
          receipt = Path('output/scan-diagnostics/input-ownership.json')
          receipt.parent.mkdir(parents=True, exist_ok=True)
          receipt.write_text(json.dumps(dict(repository=os.environ['GITHUB_REPOSITORY'], run_id=os.environ['GITHUB_RUN_ID'], sha=os.environ['GITHUB_SHA'], root=str(root))))
          PY
      - name: Compare read-only ELF scans in repeated ABBA order
        if: ${{ !inputs.profile_package_preprocess }}
        run: |
          python build_tools/profile_build.py \
            --output output/scan-diagnostics/profile -- \
            python build_tools/packaging/linux/benchmark_elf_scan.py \
              --root output/artifacts \
              --output output/scan-diagnostics/scan \
              --blocks 3
      - name: Compare actual preprocessing on independently reset copies
        if: ${{ inputs.profile_package_preprocess }}
        run: |
          python build_tools/packaging/linux/benchmark_package_preprocess.py \
            --root output/artifacts \
            --output output/scan-diagnostics/preprocess \
            --snapshot-reset \
            --input-ownership-file output/scan-diagnostics/input-ownership.json \
            --max-wall-seconds 12600
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ inputs.profile_package_preprocess && 'preprocess' || 'scan' }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/scan-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_ci_linux.yml
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_deb_package_version: ${{ needs.setup.outputs.rocm_deb_package_version }}
      rocm_rpm_package_version: ${{ needs.setup.outputs.rocm_rpm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      changed_projects: ${{ inputs.changed_projects || '' }}
    permissions:
      contents: read
      id-token: write

  windows_build_and_test:
    name: Windows::${{ fromJSON(needs.setup.outputs.windows_build_config || '{}').build_variant_label || 'skip' }}
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.windows_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_ci_windows.yml
    with:
      build_config: ${{ needs.setup.outputs.windows_build_config }}
      test_labels: ${{ needs.setup.outputs.windows_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      rocm_msi_package_version: ${{ needs.setup.outputs.rocm_msi_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      changed_projects: ${{ inputs.changed_projects || '' }}
    permissions:
      contents: read
      id-token: write

  manifest_diff:
    name: Manifest Diff
    # Refs are auto-derived from push / pull_request events only.
    # For manual runs, dispatch manifest-diff.yml directly with explicit refs.
    if: ${{ !inputs.profile_package_scan && !inputs.profile_package_preprocess && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    uses: ./.github/workflows/manifest-diff.yml
    permissions:
      contents: read
      id-token: write

  ci_summary:
    name: CI Summary
    if: always()
    needs:
      - setup
      - linux_build_and_test
      - windows_build_and_test
      - manifest_diff
      - profile_package_scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json "${NEEDS_JSON}"
