name: Proposal 3 Configuration Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source_sha:
          - a5f5ad0c079de9b2417585cbb0869af474c26b09
          - c01e3a3f3f67966dd35612cf363b49964f33cd47
    steps:
      - name: Checkout isolated evaluation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Checkout pinned CI source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ROCm/TheRock
          ref: ${{ matrix.source_sha }}
          path: _pinned_source
      - name: Install selector dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Execute real selection and test policy functions
        run: >-
          python3 .github/proposal3-evaluation/postsubmit_probe.py
          --source _pinned_source
          --sha '${{ matrix.source_sha }}'
          --output proof.json
      - name: Save configuration proof in job summary
        if: always()
        run: |
          if [ -f proof.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat proof.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
