# TEMPORARY. Delete this file before merging.
#
# The device coverage PR check's second half: the projects whose instrumented
# build is likeliest to fail, in a run of their own. One instrumented project
# that does not build stops the stage pushing artifacts, which would skip every
# other project's tests in coverage_device_pr_check.yml along with it. Same
# self-contained setup as that check.

name: Device Coverage PR Check (phase 2)

on:
  pull_request:
    paths:
      - ".github/workflows/coverage_device_pr_check_phase2.yml"
      - ".github/workflows/multi_arch_ci_coverage_linux.yml"
      - ".github/workflows/multi_arch_ci_coverage_report.yml"
      - ".github/workflows/test_code_coverage_component.yml"
      - "build_tools/_therock_utils/kpack_archive.py"
      - "build_tools/github_actions/configure_coverage_ci.py"
      - "build_tools/github_actions/merge_coverage_report.py"
      - "build_tools/install_rocm_code_coverage_build.py"
      - "cmake/coverage/**"
      - "cmake/therock_coverage_device.cmake"
      - "cmake/therock_subproject.cmake"
      - "CMakeLists.txt"

concurrency:
  group: device-coverage-pr-check-phase2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Device Coverage (phase 2)
    uses: ./.github/workflows/multi_arch_ci_coverage_linux.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      # hipblaslt and hiptensor are blocked in the registry; naming them is
      # how a block gets retested.
      projects_to_test: "hipblaslt,hiptensor,miopen,rpp"
      amdgpu_families: "gfx94X-dcgpu"
      baseline_release_type: "ci"
      test_type: "standard"
