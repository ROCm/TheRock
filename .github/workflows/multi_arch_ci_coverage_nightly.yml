# Multi-Arch CI Coverage - Nightly
#
# Builds one fully instrumented stack covering every coverage-enabled project,
# then runs each project's tests against it and reports separately. Paying for a
# single large build rather than one build per project is what keeps the cost
# flat as more projects are onboarded.
#
# The stack is assembled by naming the stages coverage needs and calling the
# shared per-stage build workflow for each, rather than running the whole
# multi_arch_build_portable_linux.yml pipeline and filtering stages out of it.
#
# RFC0014 phase 1 runs every enabled component on one default architecture
# (gfx942, i.e. the gfx94X-dcgpu family). Change-based selection and
# multi-architecture expansion come later.
#
# The run is self-contained. It builds every stage it needs and instruments only
# the projects named by `projects_to_test`, so everything those projects depend
# on is built normally in the same run and its artifacts are already the stack
# to test against. There is no second run id to coordinate and no baseline to
# mix in.
#
# Scheduling is manual for now: dispatch this workflow by hand. There is no cron
# here, and the regular nightly does not know about this workflow, so coverage
# has a run id of its own -- a failure here leaves the nightly's status alone,
# and the nightly's unstable test jobs do not hold coverage up.

name: Multi-Arch CI Coverage Nightly

on:
  workflow_dispatch:
    inputs:
      projects_to_test:
        type: string
        description: "Comma-separated coverage projects (e.g. hiprand); case-insensitive. Group aliases: rocm_libraries_all, rocm_systems_all, all (combinable with explicit names). Empty = all coverage-enabled projects."
        default: ""
      amdgpu_families:
        type: string
        description: "Comma-separated GPU families to collect coverage on. Phase 1 uses the single default architecture."
        default: "gfx94X-dcgpu"
      coverage_config_source:
        type: string
        description: "Repository and ref holding the per-project coverage metadata."
        default: "ROCm/rocm-libraries@main"
      test_type:
        type: string
        description: "Test type to run against the instrumented build."
        default: "standard"
      quartz_tracking_id:
        type: string
        description: >-
          Leave empty. Internal Quartz tracking id, used to link this run to a
          release lineage once the nightly dispatches coverage automatically.
        default: ""

  # TEMPORARY, paired with coverage_nightly_pr_check.yml. A workflow_dispatch
  # is only offered once the file is on the default branch, so this workflow
  # cannot be run from a branch and cannot be shown in a PR's checks. A caller
  # is not subject to that, so the check workflow runs this branch's copy.
  # Actions does not expand YAML anchors, so the inputs are repeated verbatim.
  # Remove this trigger with the check workflow once the run has gone green.
  workflow_call:
    inputs:
      projects_to_test:
        type: string
        description: "Comma-separated coverage projects (e.g. hiprand); case-insensitive. Group aliases: rocm_libraries_all, rocm_systems_all, all (combinable with explicit names). Empty = all coverage-enabled projects."
        default: ""
      amdgpu_families:
        type: string
        description: "Comma-separated GPU families to collect coverage on. Phase 1 uses the single default architecture."
        default: "gfx94X-dcgpu"
      coverage_config_source:
        type: string
        description: "Repository and ref holding the per-project coverage metadata."
        default: "ROCm/rocm-libraries@main"
      test_type:
        type: string
        description: "Test type to run against the instrumented build."
        default: "standard"
      quartz_tracking_id:
        type: string
        description: >-
          Leave empty. Internal Quartz tracking id, used to link this run to a
          release lineage once the nightly dispatches coverage automatically.
        default: ""

permissions:
  contents: read

# Which projects a run measured is the thing people look for afterwards, so put
# it in the title rather than making them open the setup job's log.
run-name: >-
  Multi-Arch CI Coverage Nightly
  | ${{ inputs.projects_to_test || 'all onboarded projects' }}
  | ${{ inputs.amdgpu_families || 'gfx94X-dcgpu' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  setup_coverage_matrix:
    name: Setup Coverage Matrix
    runs-on: ubuntu-24.04
    outputs:
      coverage_matrix: ${{ steps.matrix.outputs.coverage_matrix }}
      dist_amdgpu_families: ${{ steps.matrix.outputs.dist_amdgpu_families }}
      families_matrix_json: ${{ steps.matrix.outputs.families_matrix_json }}
      coverage_cmake_options: ${{ steps.matrix.outputs.coverage_cmake_options }}
      generic_stages_json: ${{ steps.matrix.outputs.generic_stages_json }}
      needs_math_libs: ${{ steps.matrix.outputs.needs_math_libs }}
      rocm_package_version: ${{ steps.rocm_package_version.outputs.rocm_package_version }}
    steps:
      - name: Checking out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Generate coverage matrix
        id: matrix
        env:
          PROJECTS_TO_TEST: ${{ inputs.projects_to_test || '' }}
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families || 'gfx94X-dcgpu' }}
          COVERAGE_CONFIG_SOURCE: ${{ inputs.coverage_config_source || 'ROCm/rocm-libraries@main' }}
        run: python ./build_tools/github_actions/configure_coverage_ci.py

      - name: Compute package version
        id: rocm_package_version
        run: |
          python ./build_tools/compute_rocm_package_version.py \
            --release-type=ci \
            --override-git-sha=${{ steps.checkout.outputs.commit }}

  # Built first and unconditionally: every other stage takes its inbound
  # artifacts from this one, so no selection can skip it. It also receives the
  # coverage flags, because rocm-systems projects such as rocprofiler-sdk and
  # amdsmi are built here rather than in a stage of their own.
  build_instrumented_compiler_runtime:
    name: Build Instrumented Compiler Runtime
    needs: setup_coverage_matrix
    if: ${{ needs.setup_coverage_matrix.outputs.coverage_matrix != '[]' }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    secrets: inherit
    with:
      stage_name: compiler-runtime
      stage_display_name: "Stage - Coverage Compiler Runtime"
      timeout_minutes: 480 # 8 hours (compiler is big)
      dist_amdgpu_families: ${{ needs.setup_coverage_matrix.outputs.dist_amdgpu_families }}
      extra_cmake_options: >-
        ${{ needs.setup_coverage_matrix.outputs.coverage_cmake_options }}
        -DTHEROCK_FLAG_KPACK_SPLIT_ARTIFACTS=OFF
      rocm_package_version: ${{ needs.setup_coverage_matrix.outputs.rocm_package_version }}
      release_type: ci
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write

  # The build-once stages the selection needs, other than compiler-runtime.
  # Empty for a selection confined to math-libs, which is why the matrix is
  # guarded: fromJSON('[]') produces a job with no combinations.
  build_instrumented_generic_stages:
    name: Build Instrumented Stages
    needs: [setup_coverage_matrix, build_instrumented_compiler_runtime]
    if: >-
      ${{
        !failure() && !cancelled() &&
        needs.setup_coverage_matrix.outputs.generic_stages_json != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        stage_info: ${{ fromJSON(needs.setup_coverage_matrix.outputs.generic_stages_json) }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    secrets: inherit
    with:
      stage_name: ${{ matrix.stage_info.stage_name }}
      stage_display_name: ${{ matrix.stage_info.stage_display_name }}
      timeout_minutes: 480 # 8 hours; instrumented builds are slower than normal
      dist_amdgpu_families: ${{ needs.setup_coverage_matrix.outputs.dist_amdgpu_families }}
      extra_cmake_options: >-
        ${{ needs.setup_coverage_matrix.outputs.coverage_cmake_options }}
        -DTHEROCK_FLAG_KPACK_SPLIT_ARTIFACTS=OFF
      rocm_package_version: ${{ needs.setup_coverage_matrix.outputs.rocm_package_version }}
      release_type: ci
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write

  # The whole stage is built, not just the onboarded projects: the test jobs
  # below need the complete dependency set. `coverage_cmake_options` is the
  # THEROCK_COVERAGE_*_ALL group option when the selection covers a whole group,
  # and the individual project flags otherwise; everything not selected builds
  # normally.
  build_instrumented_math_libs:
    name: Build Instrumented Math Libs
    needs: [setup_coverage_matrix, build_instrumented_compiler_runtime]
    if: >-
      ${{
        !failure() && !cancelled() &&
        needs.setup_coverage_matrix.outputs.needs_math_libs == 'true'
      }}
    strategy:
      fail-fast: false
      matrix:
        family_info: ${{ fromJSON(needs.setup_coverage_matrix.outputs.families_matrix_json) }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    secrets: inherit
    with:
      stage_name: math-libs
      stage_display_name: "Stage - Coverage Math Libs (${{ matrix.family_info.amdgpu_family }})"
      timeout_minutes: 480 # 8 hours; instrumented builds are slower than normal
      amdgpu_family: ${{ matrix.family_info.amdgpu_family }}
      dist_amdgpu_families: ${{ needs.setup_coverage_matrix.outputs.dist_amdgpu_families }}
      extra_cmake_options: >-
        ${{ needs.setup_coverage_matrix.outputs.coverage_cmake_options }}
        -DTHEROCK_FLAG_KPACK_SPLIT_ARTIFACTS=OFF
      rocm_package_version: ${{ needs.setup_coverage_matrix.outputs.rocm_package_version }}
      release_type: ci
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write

  # One test + report job per project, all against the stack built above. A
  # selection naming several projects instruments all of them in that one build,
  # and each job still reports on its own: llvm-cov is given only that project's
  # objects, so counters from the others are never looked up.
  coverage_report:
    name: Coverage::${{ matrix.coverage.project_name }} (${{ matrix.coverage.amdgpu_families }})
    needs:
      - setup_coverage_matrix
      - build_instrumented_generic_stages
      - build_instrumented_math_libs
    # `!failure() && !cancelled()` alone would let this run when
    # setup_coverage_matrix was skipped, and fromJSON('') is a hard error, so
    # the matrix has to be checked explicitly.
    if: >-
      ${{
        !failure() && !cancelled() &&
        needs.setup_coverage_matrix.result == 'success' &&
        needs.setup_coverage_matrix.outputs.coverage_matrix != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        coverage: ${{ fromJSON(needs.setup_coverage_matrix.outputs.coverage_matrix) }}
    uses: ./.github/workflows/multi_arch_ci_coverage_linux.yml
    secrets: inherit
    with:
      project_name: ${{ matrix.coverage.project_name }}
      test_component: ${{ matrix.coverage.test_component }}
      object_globs: ${{ matrix.coverage.object_globs }}
      fetch_artifact_args: ${{ matrix.coverage.fetch_artifact_args }}
      codecov_flag: ${{ matrix.coverage.codecov_flag }}
      amdgpu_families: ${{ matrix.coverage.amdgpu_families }}
      test_type: ${{ inputs.test_type || 'standard' }}
      release_type: ci
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write

  ci_summary:
    name: Nightly Coverage Summary
    if: always()
    needs:
      - setup_coverage_matrix
      - build_instrumented_compiler_runtime
      - build_instrumented_generic_stages
      - build_instrumented_math_libs
      - coverage_report
    runs-on: ubuntu-24.04
    steps:
      - name: Checking out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
