name: Test Artifact Structure

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        type: string
        description: "Run ID to fetch artifacts from (defaults to current run)"
        default: ""
      artifact_github_repo:
        description: "GitHub repository for artifact_run_id"
        type: string
        default: ROCm/TheRock
      amdgpu_families:
        description: "amdgpu_families as a semicolon-separated list (e.g. 'gfx94X-dcgpu;gfx120X-all')"
        type: string
        default: ""
      platform:
        type: choice
        description: "Platform to fetch artifacts for"
        options:
          - linux
          - windows
        default: "linux"
      release_type:
        description: 'Release type: "ci" or "dev"'
        type: choice
        options:
          - ci
          - dev
        default: ci
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
  workflow_call:
    inputs:
      performance_mode:
        type: string
        default: ''
      artifact_run_id:
        type: string
        default: ""
      artifact_github_repo:
        type: string
        default: ""
      amdgpu_families:
        type: string
        default: ""
      platform:
        type: string
        default: "linux"
      release_type:
        type: string
        default: ci
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
      ref:
        description: "Branch, tag, or SHA to checkout. Defaults to the triggering ref."
        type: string
      build_runs_on:
        description: "Runner label for the build job"
        type: string
        default: "aws-linux-scale-rocm-prod"

permissions:
  contents: read
  actions: read

jobs:
  test_artifact_structure:
    name: "Validate artifact structure"
    runs-on: ${{ github.repository_owner == 'ROCm' && inputs.build_runs_on || 'ubuntu-26.04' }}
    container:
      # https://hub.docker.com/_/python/tags?name=3.12-slim
      image: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    env:
      ARTIFACT_GITHUB_REPO: ${{ inputs.artifact_github_repo }}
      ARTIFACT_RUN_ID: "${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}"
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      PLATFORM: ${{ inputs.platform }}
      OUTPUT_ROOT: "${{ github.workspace }}"
      THEROCK_ARTIFACTS_DIR: ${{ github.workspace }}/.download_cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          repository: ROCm/TheRock
          ref: 5b7cb88373362ab80dc0f19605915e534f4158aa

      - name: Checkout immutable experiment assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ROCm/TheRock
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .perf-instrumentation

      - name: Install test requirements
        run: |
          pip install -r requirements-test.txt

      - name: Verify frozen source and record full-run context
        id: perf_context
        env:
          PERF_MODE: ${{ inputs.performance_mode }}
          PERF_CONTEXT_JSON: ${{ toJSON(inputs) }}
          PERF_MATRIX_JSON: ${{ toJSON(matrix) }}
          PERF_REQUESTED_RUNNER: ${{ inputs.build_runs_on || inputs.test_runs_on || '' }}
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py preflight --label test_artifact_structure

      - name: Fetch artifact archives (no extract)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ./build_tools/artifact_manager.py fetch \
            --run-id="${ARTIFACT_RUN_ID}" \
            --run-github-repo="${ARTIFACT_GITHUB_REPO}" \
            --stage=all \
            --amdgpu-families="${AMDGPU_FAMILIES}" \
            --platform="${PLATFORM}" \
            --output-dir="${OUTPUT_ROOT}" \
            --no-extract
          # NOTE: artifact_manager.py appends /.download_cache to --output-dir
          # in --no-extract mode, so pass OUTPUT_ROOT here so that
          # artifacts land in THEROCK_ARTIFACTS_DIR ($OUTPUT_ROOT/.download_cache).

      - name: Validate artifact structure
        run: |
          python -m pytest tests/test_artifact_structure.py \
            -v --log-cli-level=info --timeout=300
      - name: Record final full-run provenance
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        run: |
          python3 .perf-instrumentation/build_tools/perf_full/full_probe.py finalize

      - name: Retain exact solver SDK identity for GPU consumers
        if: ${{ always() && inputs.stage_name == 'math-libs' && hashFiles('.perf-full/solver-sdk-identity.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-solver-identity-${{ inputs.performance_mode }}-${{ inputs.amdgpu_family }}
          path: .perf-full/solver-sdk-identity.json
          include-hidden-files: true
          retention-days: 14

      - name: Retain full-run investigation evidence
        if: ${{ always() && steps.perf_context.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.perf_context.outputs.artifact_name }}
          path: .perf-full
          include-hidden-files: true
          retention-days: 14
          compression-level: 1

