# Multi-Arch CI Coverage (thin parent / orchestrator)
#
# Computes the shared coverage matrix once (setup_coverage_matrix) and hands it
# to a per-platform build+fanout layer (multi_arch_ci_coverage_linux.yml today;
# a Windows sibling later). The instrumented build and the per-project
# test+report live in those layers, not here, so adding a platform duplicates
# none of the matrix logic.
#
# RFC0014 phase 1 runs every enabled component on one default architecture
# (gfx942, i.e. the gfx94X-dcgpu family). Change-based selection and
# multi-architecture expansion come later.
#
# Coverage runs as its own run, separate from the regular nightly: the nightly
# dispatches this workflow once its build finishes and hands over its own run id
# as `baseline_run_id` (RFC option C). Coverage having a run id of its own means
# a failure here leaves the nightly's status alone, and the nightly's unstable
# test jobs do not hold coverage up.

name: Multi-Arch CI Coverage

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        type: string
        description: "Regular nightly run id supplying the non-instrumented dependencies. Empty tests this run's own instrumented stack end to end."
        default: ""
      baseline_release_type:
        type: string
        description: "Release channel baseline_run_id published to; artifacts are bucketed by channel."
        default: "nightly"
      baseline_repository:
        type: string
        description: "Repository owning baseline_run_id (owner/repo). Release nightlies come from ROCm/rockrel; empty means this repository."
        default: ""
      projects_to_test:
        type: string
        description: "Comma-separated coverage projects (e.g. hiprand); case-insensitive. Group alias: rocm_libraries_all. Empty = every project this workflow can build. rccl and rocshmem need the comm-libs build job, which phase 1 does not have, so naming them (or rocm_systems_all / all) is rejected."
        default: ""
      amdgpu_families:
        type: string
        description: "Comma-separated GPU families to collect coverage on. Phase 1 uses the single default architecture."
        default: "gfx94X-dcgpu"
      coverage_config_source:
        type: string
        description: "Repository and ref holding the per-project coverage metadata."
        default: "ROCm/rocm-libraries@main"
      test_type:
        type: string
        description: "Test type to run against the instrumented build."
        default: "standard"
      quartz_tracking_id:
        type: string
        description: >-
          Leave empty. Internal Quartz tracking id, used to link this run to a
          release lineage once the nightly dispatches coverage automatically.
        default: ""

  # TEMPORARY, paired with coverage_nightly_pr_check.yml. A workflow_dispatch
  # is only offered once the file is on the default branch, so this workflow
  # cannot be run from a branch and cannot be shown in a PR's checks. A caller
  # is not subject to that, so the check workflow runs this branch's copy.
  # Actions does not expand YAML anchors, so the inputs are repeated verbatim.
  # Remove this trigger with the check workflow once the run has gone green.
  workflow_call:
    inputs:
      baseline_run_id:
        type: string
        description: "Regular nightly run id supplying the non-instrumented dependencies. Empty tests this run's own instrumented stack end to end."
        default: ""
      baseline_release_type:
        type: string
        description: "Release channel baseline_run_id published to; artifacts are bucketed by channel."
        default: "nightly"
      baseline_repository:
        type: string
        description: "Repository owning baseline_run_id (owner/repo). Release nightlies come from ROCm/rockrel; empty means this repository."
        default: ""
      projects_to_test:
        type: string
        description: "Comma-separated coverage projects (e.g. hiprand); case-insensitive. Group alias: rocm_libraries_all. Empty = every project this workflow can build. rccl and rocshmem need the comm-libs build job, which phase 1 does not have, so naming them (or rocm_systems_all / all) is rejected."
        default: ""
      amdgpu_families:
        type: string
        description: "Comma-separated GPU families to collect coverage on. Phase 1 uses the single default architecture."
        default: "gfx94X-dcgpu"
      coverage_config_source:
        type: string
        description: "Repository and ref holding the per-project coverage metadata."
        default: "ROCm/rocm-libraries@main"
      test_type:
        type: string
        description: "Test type to run against the instrumented build."
        default: "standard"
      quartz_tracking_id:
        type: string
        description: >-
          Leave empty. Internal Quartz tracking id, used to link this run to a
          release lineage once the nightly dispatches coverage automatically.
        default: ""

permissions:
  contents: read

# The two run ids are only connected through this input, so surface it in the
# run title rather than making people open the logs to find the baseline.
run-name: >-
  Multi-Arch CI Coverage
  | baseline: ${{ inputs.baseline_run_id || 'none (self-contained)' }}
  | ${{ inputs.amdgpu_families || 'gfx94X-dcgpu' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  setup_coverage_matrix:
    name: Setup Coverage Matrix
    runs-on: ubuntu-24.04
    outputs:
      coverage_matrix: ${{ steps.matrix.outputs.coverage_matrix }}
      dist_amdgpu_families: ${{ steps.matrix.outputs.dist_amdgpu_families }}
      families_matrix_json: ${{ steps.matrix.outputs.families_matrix_json }}
      coverage_cmake_options: ${{ steps.matrix.outputs.coverage_cmake_options }}
      needs_math_libs: ${{ steps.matrix.outputs.needs_math_libs }}
      rocm_package_version: ${{ steps.rocm_package_version.outputs.rocm_package_version }}
    steps:
      - name: Checking out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Generate coverage matrix
        id: matrix
        env:
          PROJECTS_TO_TEST: ${{ inputs.projects_to_test || '' }}
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families || 'gfx94X-dcgpu' }}
          COVERAGE_CONFIG_SOURCE: ${{ inputs.coverage_config_source || 'ROCm/rocm-libraries@main' }}
        run: python ./build_tools/github_actions/configure_coverage_ci.py

      - name: Compute package version
        id: rocm_package_version
        run: |
          python ./build_tools/compute_rocm_package_version.py \
            --release-type=ci \
            --override-git-sha=${{ steps.checkout.outputs.commit }}

  # The build + fanout half is per-platform. The shared matrix computed above is
  # handed to the Linux layer, which builds the instrumented stack once and then
  # fans out to the per-project report workflow. A Windows layer would be a
  # sibling job here, reusing setup_coverage_matrix and the report workflow
  # unchanged.
  coverage_linux:
    name: Coverage - Linux
    needs: setup_coverage_matrix
    # `fromJSON('')` is a hard error downstream, and an empty selection has
    # nothing to build, so the matrix is checked explicitly before fanning out.
    if: ${{ needs.setup_coverage_matrix.outputs.coverage_matrix != '[]' }}
    uses: ./.github/workflows/multi_arch_ci_coverage_linux.yml
    secrets: inherit
    with:
      coverage_matrix: ${{ needs.setup_coverage_matrix.outputs.coverage_matrix }}
      dist_amdgpu_families: ${{ needs.setup_coverage_matrix.outputs.dist_amdgpu_families }}
      families_matrix_json: ${{ needs.setup_coverage_matrix.outputs.families_matrix_json }}
      coverage_cmake_options: ${{ needs.setup_coverage_matrix.outputs.coverage_cmake_options }}
      needs_math_libs: ${{ needs.setup_coverage_matrix.outputs.needs_math_libs }}
      rocm_package_version: ${{ needs.setup_coverage_matrix.outputs.rocm_package_version }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
      baseline_release_type: ${{ inputs.baseline_release_type || 'nightly' }}
      baseline_repository: ${{ inputs.baseline_repository }}
      test_type: ${{ inputs.test_type || 'standard' }}
      release_type: ci
      quartz_tracking_id: ${{ inputs.quartz_tracking_id }}
    permissions:
      contents: read
      id-token: write

  ci_summary:
    name: Coverage Summary
    if: always()
    needs:
      - setup_coverage_matrix
      - coverage_linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checking out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
