# Multi-Arch CI Coverage - Pull Request
#
# Opt-in code coverage for pull requests, enabled by the `ci:coverage` label.
# configure_coverage_pr.py picks the coverage projects the change touches
# (`test:<project>` labels narrow them) and a non-instrumented baseline from
# main; multi_arch_ci_coverage_linux.yml then builds those projects instrumented
# and tests each one against the baseline.
#
# rocm-libraries and rocm-systems pull request workflows call this through a
# cross-repo `uses:`, passing changed_projects and external_repo as they do for
# setup_multi_arch.yml. The label gate applies to their pull requests too.
#
# As this runs on lower trust `pull_request` events it forwards no github
# secrets to child workflows, so reports are kept as run artifacts and on the
# job summary, and the Codecov upload is skipped.

name: Multi-Arch CI Coverage - Pull Request

on:
  pull_request:
    types:
      - labeled
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      projects_to_test:
        type: string
        description: "Comma-separated coverage projects (e.g. hiprand). Empty = every buildable project."
        default: ""
      amdgpu_families:
        type: string
        description: "Comma-separated GPU families to collect coverage on."
        default: "gfx94X-dcgpu"
      test_type:
        type: string
        description: "Test type to run against the instrumented build."
        default: "standard"
      baseline_run_id:
        type: string
        description: "Run id supplying the non-instrumented dependencies. Empty = the newest healthy multi_arch_ci.yml run on main."
        default: ""
      baseline_release_type:
        type: string
        description: "Release channel baseline_run_id published to."
        default: "ci"
      baseline_repository:
        type: string
        description: "Repository owning baseline_run_id (owner/repo). Empty means this repository."
        default: ""
  workflow_call:
    inputs:
      projects_to_test:
        type: string
        description: "Comma-separated coverage projects. Overrides changed_projects."
        default: ""
      changed_projects:
        type: string
        description: "Comma-separated changed project paths from the external repo (e.g. projects/hiprand). Empty = every buildable project."
        default: ""
      amdgpu_families:
        type: string
        description: "Comma-separated GPU families to collect coverage on."
        default: "gfx94X-dcgpu"
      test_type:
        type: string
        description: "Test type to run against the instrumented build."
        default: "standard"
      baseline_run_id:
        type: string
        description: "Run id supplying the non-instrumented dependencies. Empty = the newest healthy multi_arch_ci.yml run on TheRock main."
        default: ""
      baseline_release_type:
        type: string
        description: "Release channel baseline_run_id published to."
        default: "ci"
      baseline_repository:
        type: string
        description: "Repository owning baseline_run_id (owner/repo). Empty means the calling repository."
        default: ""
      external_repo:
        type: string
        description: "JSON object describing the external repo checkout, as for setup_multi_arch.yml."
        default: ""
      repository:
        type: string
        description: "Repository holding this workflow's scripts. Cross-repo callers pass ROCm/TheRock."
        default: ""
      ref:
        type: string
        description: "Ref/SHA of this workflow's scripts. Cross-repo callers pass the ref they pinned in uses:."
        default: ""

permissions:
  contents: read

concurrency:
  # One run per pull request; a new push cancels the old run. Events that do not
  # run coverage (no ci:coverage label, or an unrelated label being added) get a
  # group of their own so they cannot cancel a run in progress. Keep the
  # condition in sync with the setup job's `if`. The "coverage-pr" infix keeps
  # the group apart from a cross-repo caller's own.
  group: >-
    ${{ github.workflow }}-coverage-pr-${{
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci:coverage') &&
      (github.event.action != 'labeled' ||
        github.event.label.name == 'ci:coverage' ||
        startsWith(github.event.label.name, 'test:') ||
        startsWith(github.event.label.name, 'test_filter:')) &&
      github.head_ref || github.run_id
    }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup Coverage Plan
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (contains(github.event.pull_request.labels.*.name, 'ci:coverage') &&
          (github.event.action != 'labeled' ||
            github.event.label.name == 'ci:coverage' ||
            startsWith(github.event.label.name, 'test:') ||
            startsWith(github.event.label.name, 'test_filter:')))
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # Baseline lookup queries workflow runs and their jobs.
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      projects_to_test: ${{ steps.plan.outputs.projects_to_test }}
      amdgpu_families: ${{ steps.plan.outputs.amdgpu_families }}
      test_type: ${{ steps.plan.outputs.test_type }}
      baseline_run_id: ${{ steps.plan.outputs.baseline_run_id }}
      baseline_repository: ${{ steps.plan.outputs.baseline_repository }}
      rebuild_artifacts: ${{ steps.plan.outputs.rebuild_artifacts }}
      prebuilt_compiler_runtime: ${{ steps.plan.outputs.prebuilt_compiler_runtime }}
      external_repo_config: ${{ steps.external_repo_config.outputs.config_json }}
      ref: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checking out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          # We need the parent commit to diff the pull request's changes.
          fetch-depth: 2

      - name: Setting up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install baseline lookup dependencies
        run: pip install boto3

      # Note: the script reads PR labels from the event payload
      # (GITHUB_EVENT_PATH), which for cross-repo callers is the caller's event.
      - name: Plan coverage run
        id: plan
        env:
          PROJECTS_TO_TEST: ${{ inputs.projects_to_test }}
          CHANGED_PROJECTS: ${{ inputs.changed_projects }}
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          TEST_TYPE: ${{ inputs.test_type }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_REPOSITORY: ${{ inputs.baseline_repository }}
          THEROCK_REPOSITORY: ${{ inputs.repository || github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python ./build_tools/github_actions/configure_coverage_pr.py

      - name: Detect external repo config
        id: external_repo_config
        if: ${{ inputs.external_repo != '' }}
        env:
          EXTERNAL_REPO: ${{ inputs.external_repo }}
        run: |
          python ./build_tools/github_actions/detect_external_repo_config.py \
            --external-repo-json="${EXTERNAL_REPO}"

  coverage:
    name: Coverage
    needs: setup
    if: ${{ needs.setup.outputs.enabled == 'true' }}
    uses: ./.github/workflows/multi_arch_ci_coverage_linux.yml
    with:
      projects_to_test: ${{ needs.setup.outputs.projects_to_test }}
      amdgpu_families: ${{ needs.setup.outputs.amdgpu_families }}
      test_type: ${{ needs.setup.outputs.test_type }}
      baseline_run_id: ${{ needs.setup.outputs.baseline_run_id }}
      baseline_release_type: ${{ inputs.baseline_release_type || 'ci' }}
      baseline_repository: ${{ needs.setup.outputs.baseline_repository }}
      rebuild_artifacts: ${{ needs.setup.outputs.rebuild_artifacts }}
      prebuilt_compiler_runtime: ${{ needs.setup.outputs.prebuilt_compiler_runtime == 'true' }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      repository: ${{ inputs.repository }}
      # The commit setup planned against, so every job builds the same sources.
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write
