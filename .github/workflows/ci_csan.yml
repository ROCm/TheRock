name: CI ConcurrencySanitizer

on:
  workflow_dispatch:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Comma-separated Linux GPU families (gfx94x, gfx950), or all"
        default: "gfx94x"
      prebuilt_stages:
        type: string
        description: "Comma-separated successful stages to reuse from baseline_run_id (empty = fresh build)"
        default: ""
      baseline_run_id:
        type: string
        description: "Workflow run supplying prebuilt_stages; both inputs must be set together"
        default: ""
      runtime_repair:
        type: boolean
        description: "Rebuild only HIP/OpenCL CLR artifacts after copying a prebuilt compiler-runtime stage"
        default: false
      comm_repair:
        type: boolean
        description: "Repair RCCL/rocSHMEM device artifacts for the selected families, reusing the comm-libs baseline"
        default: false
  workflow_call:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Comma-separated Linux GPU families (gfx94x, gfx950), or all"
        default: "gfx94x"
      prebuilt_stages:
        type: string
        description: "Comma-separated successful stages to reuse from baseline_run_id (empty = fresh build)"
        default: ""
      baseline_run_id:
        type: string
        description: "Workflow run supplying prebuilt_stages; both inputs must be set together"
        default: ""
      runtime_repair:
        type: boolean
        description: "Rebuild only HIP/OpenCL CLR artifacts after copying a prebuilt compiler-runtime stage"
        default: false
      comm_repair:
        type: boolean
        description: "Repair RCCL/rocSHMEM device artifacts for the selected families, reusing the comm-libs baseline"
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: csan-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate_reuse:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate explicit stage reuse inputs
        env:
          PREBUILT_STAGES: ${{ inputs.prebuilt_stages }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          RUNTIME_REPAIR: ${{ inputs.runtime_repair }}
          COMM_REPAIR: ${{ inputs.comm_repair }}
        run: |
          if [[ -n "${PREBUILT_STAGES}" && -z "${BASELINE_RUN_ID}" ]] ||
             [[ -z "${PREBUILT_STAGES}" && -n "${BASELINE_RUN_ID}" ]]; then
            echo "::error::prebuilt_stages and baseline_run_id must be supplied together"
            exit 1
          fi
          REUSE_STAGES=",${PREBUILT_STAGES//[[:space:]]/},"
          if [[ "${RUNTIME_REPAIR}" == "true" ]]; then
            if [[ -z "${BASELINE_RUN_ID}" ]] ||
               [[ "${REUSE_STAGES}" != *,compiler-runtime,* && "${REUSE_STAGES}" != ,all, ]]; then
              echo "::error::runtime_repair requires compiler-runtime in prebuilt_stages and a baseline_run_id"
              exit 1
            fi
          fi
          if [[ "${COMM_REPAIR}" == "true" ]]; then
            if [[ -z "${BASELINE_RUN_ID}" ]] ||
               [[ "${REUSE_STAGES}" != ,all, &&
                  ( "${REUSE_STAGES}" != *,comm-libs,* || "${REUSE_STAGES}" != *,compiler-runtime,* ) ]]; then
              echo "::error::comm_repair requires comm-libs and compiler-runtime in prebuilt_stages and a baseline_run_id"
              exit 1
            fi
          fi

  setup:
    needs: validate_reuse
    uses: ./.github/workflows/setup_multi_arch.yml
    with:
      build_variant: csan
      release_type: ci
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families }}
      windows_amdgpu_families: "none"
      # Fresh builds remain the default; dry-run honors only explicit reuse.
      stage_reuse_mode: ${{ inputs.prebuilt_stages != '' && 'dry-run' || 'off' }}
      prebuilt_stages: ${{ inputs.prebuilt_stages }}
      baseline_run_id: ${{ inputs.baseline_run_id }}
      build_python_packages: false
      build_pytorch: false
      build_jax: false
      build_native_linux: false
      build_native_windows: false

  copy_prebuilt_stages:
    name: Copy Prebuilt CSAN Stages
    needs: setup
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        fromJSON(needs.setup.outputs.linux_build_config).prebuilt_stages != '' &&
        fromJSON(needs.setup.outputs.linux_build_config).baseline_run_id != ''
      }}
    runs-on: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_runs_on_small }}
    permissions:
      contents: read
      id-token: write
    container:
      image: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          ref: ${{ needs.setup.outputs.ref }}

      - name: Install artifact manager dependencies
        run: pip install boto3==1.39.15

      - name: Configure AWS credentials for artifact uploads
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ci

      - name: Copy prebuilt stage artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ci
          BASELINE_RUN_ID: ${{ fromJSON(needs.setup.outputs.linux_build_config).baseline_run_id }}
          PREBUILT_STAGES: ${{ fromJSON(needs.setup.outputs.linux_build_config).prebuilt_stages }}
          DIST_AMDGPU_FAMILIES: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
        run: |
          python build_tools/artifact_manager.py copy \
            --source-run-id="${BASELINE_RUN_ID}" \
            --stage="${PREBUILT_STAGES}" \
            --amdgpu-families="${DIST_AMDGPU_FAMILIES}" \
            --expand-family-to-targets

  repair_clr_runtime:
    name: Repair CLR runtime artifacts
    needs: [setup, copy_prebuilt_stages]
    if: >-
      ${{
        inputs.runtime_repair &&
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: compiler-runtime
      stage_display_name: "Repair CLR Runtime (HIP and OpenCL)"
      timeout_minutes: 120
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      build_variant_cmake_preset: linux-release-csan
      build_runs_on: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_runs_on_large }}
      release_type: ci
      ref: ${{ needs.setup.outputs.ref }}
      rebuild_artifacts: core-hip,core-ocl
      reuse_stage_artifacts: true
    permissions:
      contents: read
      id-token: write

  repair_comm_devices:
    name: Repair communication device artifacts
    needs: [setup, copy_prebuilt_stages]
    if: >-
      ${{
        inputs.comm_repair &&
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ./.github/workflows/multi_arch_build_portable_linux_artifacts.yml
    with:
      stage_name: comm-libs
      stage_display_name: "Repair Communication Devices (RCCL and rocSHMEM)"
      timeout_minutes: 240
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      test_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      build_variant_cmake_preset: linux-release-csan
      build_runs_on: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_runs_on_large }}
      release_type: ci
      ref: ${{ needs.setup.outputs.ref }}
      rebuild_artifacts: rccl,rocshmem
      reuse_stage_artifacts: true
    permissions:
      contents: read
      id-token: write

  linux_build:
    name: Linux CSAN stages
    needs: [setup, copy_prebuilt_stages, repair_clr_runtime]
    if: >-
      ${{
        !failure() && !cancelled() &&
        !contains(needs.*.result, 'cancelled') &&
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    # Use the same stage DAG, per-family matrices and artifact handoffs as ASAN.
    # GPU execution tests are separate from this build workflow.
    uses: ./.github/workflows/multi_arch_build_portable_linux.yml
    with:
      matrix_per_family_json: ${{ toJSON(fromJSON(needs.setup.outputs.linux_build_config).per_family_info) }}
      dist_amdgpu_families: ${{ fromJSON(needs.setup.outputs.linux_build_config).dist_amdgpu_families }}
      artifact_group: ${{ fromJSON(needs.setup.outputs.linux_build_config).artifact_group }}
      build_variant_label: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_variant_label }}
      build_variant_cmake_preset: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_variant_cmake_preset }}
      build_variant_suffix: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_variant_suffix }}
      prebuilt_stages: ${{ fromJSON(needs.setup.outputs.linux_build_config).prebuilt_stages }}
      skip_stages: ${{ fromJSON(needs.setup.outputs.linux_build_config).skip_stages }}
      build_runs_on_large: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_runs_on_large }}
      build_runs_on_small: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_runs_on_small }}
      build_runs_on_medium: ${{ fromJSON(needs.setup.outputs.linux_build_config).build_runs_on_medium }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      release_type: ci
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  summary:
    name: CSAN build summary
    if: always()
    needs: [validate_reuse, setup, copy_prebuilt_stages, repair_clr_runtime, repair_comm_devices, linux_build]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python build_tools/github_actions/workflow_summary.py --needs-json "${NEEDS_JSON}"
