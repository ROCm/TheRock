# Dispatchable wrapper for multi_arch_build_windows.yml
#
# This workflow provides a workflow_dispatch interface to the Windows build
# pipeline, enabling other workflows to dispatch builds and capture the
# resulting run_id for artifact retrieval. This is used by compiler_bump.yml
# to separate release builds into independent runs with unique artifact paths.

name: Multi-Arch Build Windows (Dispatchable)

on:
  workflow_dispatch:
    inputs:
      matrix_per_family_json:
        description: "JSON array of {amdgpu_family, test-runs-on} objects for per-arch stages"
        type: string
        required: true
      dist_amdgpu_families:
        description: "Semicolon-separated list of all GPU families for dist targets"
        type: string
        required: true
      artifact_group:
        description: "Artifact group identifier"
        type: string
        required: true
      build_variant_label:
        description: "Human-readable label for the build variant"
        type: string
        required: true
      build_variant_cmake_preset:
        description: "CMake preset for the build variant"
        type: string
        required: true
      build_variant_suffix:
        description: "Suffix to append to artifact names"
        type: string
        default: ""
      build_runs_on:
        description: "Build runner label"
        type: string
        default: "azure-windows-scale-rocm"
      rocm_package_version:
        description: "ROCm package version string"
        type: string
        required: true
      release_type:
        description: 'Release type: "ci" or "dev"'
        type: choice
        options:
          - ci
          - dev
        default: dev
      repository:
        description: "Repository to checkout"
        type: string
        default: ""
      ref:
        description: "Branch, tag, or SHA to checkout"
        type: string
        default: ""

permissions:
  contents: read

run-name: Build Windows ${{ inputs.build_variant_label }} (${{ inputs.dist_amdgpu_families }})

jobs:
  build:
    name: Build Windows
    uses: ./.github/workflows/multi_arch_build_windows.yml
    secrets: inherit
    with:
      matrix_per_family_json: ${{ inputs.matrix_per_family_json }}
      dist_amdgpu_families: ${{ inputs.dist_amdgpu_families }}
      artifact_group: ${{ inputs.artifact_group }}
      build_variant_label: ${{ inputs.build_variant_label }}
      build_variant_cmake_preset: ${{ inputs.build_variant_cmake_preset }}
      build_variant_suffix: ${{ inputs.build_variant_suffix }}
      build_runs_on: ${{ inputs.build_runs_on }}
      rocm_package_version: ${{ inputs.rocm_package_version }}
      release_type: ${{ inputs.release_type }}
      repository: ${{ inputs.repository || github.repository }}
      ref: ${{ inputs.ref || github.ref_name }}
    permissions:
      contents: read
      id-token: write
