name: Test Multi-Arch Linux XLA

on:
  workflow_call:
    inputs:
      test_amdgpu_family:
        description: GPU family to test (e.g. gfx94X-dcgpu, gfx110X-all)
        required: true
        type: string
      rocm_version:
        description: ROCm version to test against (TheRock build under test)
        required: true
        type: string
      rocm_distro_url:
        description: "URL of the TheRock multi-arch distro tarball to test against."
        required: true
        type: string
      rocm_distro_hash:
        description: 'sha256 of the tarball, or "no_hash" to skip verification.'
        type: string
        default: "no_hash"
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to checkout."
        type: string
        default: ""
      xla_ref:
        description: "ROCm/xla ref to check out."
        required: true
        type: string
      xla_repository:
        description: "Repository holding the XLA checkout the test suite runs from."
        type: string
        default: "ROCm/xla"
      xla_commit:
        description: "XLA commit to test. Empty uses xla_ref, which a moving ref like rocm-jaxlib-v0.11.2 may have advanced past."
        type: string
        default: ""
      test_runs_on:
        description: Runner label to execute tests on
        required: true
        type: string
      test_subset:
        description: >-
          Accelerator subset to run: "single_gpu", "multi_gpu", "cpu", or
          "all" for all three.
        required: false
        type: string
        default: "all"
      test_timeout_minutes:
        description: "Budget for the test step."
        required: false
        type: number
        default: 120
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically by the
          top-level orchestrator to link this run to its release lineage. Do not
          set it manually.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      test_amdgpu_family:
        description: GPU family to test (e.g. gfx94X-dcgpu, gfx110X-all)
        type: string
        default: "gfx94X-dcgpu"
      rocm_version:
        description: ROCm version to test against (TheRock build under test)
        type: string
        default: "10.2.0.dev0"
      rocm_distro_url:
        description: "URL of the TheRock multi-arch distro tarball to test against."
        type: string
        default: ""
      rocm_distro_hash:
        description: 'sha256 of the tarball, or "no_hash" to skip verification.'
        type: string
        default: "no_hash"
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to checkout."
        type: string
        default: ""
      xla_ref:
        description: "ROCm/xla ref to check out."
        type: string
        default: "rocm-jaxlib-v0.11.2"
      xla_repository:
        description: "Repository holding the XLA checkout the test suite runs from."
        type: string
        default: "ROCm/xla"
      xla_commit:
        description: "XLA commit to test. Empty uses xla_ref."
        type: string
        default: ""
      test_runs_on:
        description: Runner label to use. The selected runner should have a GPU supported by test_amdgpu_family
        type: string
        default: "linux-gfx942-1gpu-ccs-csp-ossci-rocm"
      test_subset:
        description: >-
          Accelerator subset to run: "single_gpu", "multi_gpu", "cpu", or
          "all" for all three.
        type: choice
        options: ["single_gpu", "multi_gpu", "cpu", "all"]
        default: "all"
      test_timeout_minutes:
        description: "Budget for the test step, in minutes."
        type: number
        default: 120
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically by the
          top-level orchestrator to link this run to its release lineage. Do not
          set it manually.
        type: string
        default: ""
  # Validates the pipeline itself whenever it changes, with literal defaults
  # standing in for what a real caller (e.g. multi_arch_release_linux.yml's
  # trigger_test_xla job) would pass — pull_request has no `inputs` context,
  # so every `inputs.x` below is null here and falls back to these defaults.
  pull_request:
    paths:
      - ".github/workflows/test_multi_arch_linux_xla.yml"

permissions:
  contents: read

jobs:
  test_xla:
    name: Test XLA | ${{ inputs.test_subset || 'all' }} | ${{ inputs.test_amdgpu_family || 'gfx94X-dcgpu' }}
    runs-on: ${{ inputs.test_runs_on || 'linux-gfx942-1gpu-ccs-csp-ossci-rocm' }}
    timeout-minutes: 240
    outputs:
      summary: ${{ steps.summary.outputs.summary }}

    container:
      image: ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f
      options: >-
        --shm-size=128g
        --device /dev/kfd
        --device /dev/dri
        --user root
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -v /data:/data:ro
        -e KUBE_CPU_REQUEST
        -e KUBE_MEMORY_REQUEST

    defaults:
      run:
        shell: bash

    env:
      QUARTZ_REPORTING_WORKFLOW: test_multi_arch_linux_xla.yml
      QUARTZ_WORKFLOW_POSTFIX: "- test XLA (partial)"
      TEST_AMDGPU_FAMILY: ${{ inputs.test_amdgpu_family || 'gfx94X-dcgpu' }}
      ROCM_VERSION: ${{ inputs.rocm_version || '10.2.0.dev0' }}
      XLA_REF: ${{ inputs.xla_ref || 'rocm-jaxlib-v0.11.2' }}
      TEST_SUBSET: ${{ inputs.test_subset || 'all' }}
      ROCM_DISTRO_URL: ${{ inputs.rocm_distro_url || 'https://nightly.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-10.2.0a20261021.tar.gz' }}
      ROCM_DISTRO_HASH: ${{ inputs.rocm_distro_hash || 'no_hash' }}

    steps:
      - name: "Quartz - started ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: started
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || '' }}

      - name: Checkout XLA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          persist-credentials: false
          path: xla
          repository: ${{ inputs.xla_repository || 'ROCm/xla' }}
          ref: ${{ inputs.xla_commit || inputs.xla_ref || 'rocm-jaxlib-v0.11.2' }}

      # Same tool and input the JAX test workflow uses (expand_amdgpu_families.py
      # --output-mode=device-extras); bare "targets" mode gives the comma-separated
      # gfx target list TF_ROCM_AMDGPU_TARGETS wants instead of pip extras. A
      # multi-arch test_amdgpu_family (e.g. covering both gfx942 and gfx950)
      # expands to both targets here, so there is nothing to hardcode.
      - name: Compute ROCm AMDGPU targets
        run: |
          targets=$(python build_tools/github_actions/expand_amdgpu_families.py \
            --amdgpu-families "${TEST_AMDGPU_FAMILY}")
          echo "Expanded family '${TEST_AMDGPU_FAMILY}' -> '${targets}'"
          echo "ROCM_AMD_GPU_TARGETS=${targets}" >> "$GITHUB_ENV"

      # The device serial numbers it prints identify a recurring bad device
      # across runs, since the runner and the device index change every time.
      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          python build_tools/print_driver_gpu_info.py

      - name: Run XLA tests [single_gpu]
        timeout-minutes: 120
        working-directory: xla
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=rocm_ci_hermetic \
            --config=rocm_rbe \
            --config=ci_single_gpu \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}" \
            --repo_env=ROCM_DISTRO_URL="${ROCM_DISTRO_URL}" \
            --repo_env=ROCM_DISTRO_HASH="${ROCM_DISTRO_HASH}" \
            --repo_env=TF_ROCM_AMDGPU_TARGETS="${ROCM_AMD_GPU_TARGETS}" \
            --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL="${ROCM_SINGLE_GPU_RBE_POOL}" \
            --local_test_jobs=1 \
            --jobs=50 \
            --build_event_json_file=xla_single_gpu_build_events.json \
            -- \
            //xla/...

      - name: Run XLA tests [cpu]
        timeout-minutes: 120
        working-directory: xla
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=rocm_ci_hermetic \
            --config=rocm_rbe \
            --config=ci_single_gpu \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}" \
            --repo_env=ROCM_DISTRO_URL="${ROCM_DISTRO_URL}" \
            --repo_env=ROCM_DISTRO_HASH="${ROCM_DISTRO_HASH}" \
            --repo_env=TF_ROCM_AMDGPU_TARGETS="${ROCM_AMD_GPU_TARGETS}" \
            --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL="${ROCM_SINGLE_GPU_RBE_POOL}" \
            --jobs=50 \
            --build_event_json_file=xla_single_gpu_build_events.json \
            -- \
            //xla/...

      - name: Capture job summary
        id: summary
        if: always()
        run: python build_tools/github_actions/capture_job_summary.py

      - name: "Quartz - completed ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ always() && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        uses: ROCm/Quartz/.github/actions/notify_quartz@f386a9756620938616af0b4d5d04b24ae6e0353f # notify_quartz/v1.1.1
        with:
          run_phase: completed
          run_conclusion: ${{ job.status }}
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_step_outputs: ${{ toJSON(steps) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
