name: Test Multi-Arch Linux XLA

on:
  workflow_call:
    inputs:
      test_amdgpu_target:
        description: GPU target to test (e.g. gfx942, gfx950)
        required: true
        type: string
      rocm_package_find_links_url:
        description: "pip --find-links URL for the rocm[libraries,devel] wheel to install."
        type: string
        default: ""
      rocm_package_index_url:
        description: "pip --index-url URL for the rocm[libraries,devel] wheel to install."
        type: string
        default: ""
      rocm_package_version:
        description: "Version pin for the rocm[libraries,devel] wheel (e.g. '7.13.0.dev0+abc123'). Empty installs the latest available."
        type: string
        default: ""
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to checkout."
        type: string
        default: ""
      xla_ref:
        description: "ROCm/xla ref to check out."
        required: true
        type: string
      xla_repository:
        description: "Repository holding the XLA checkout the test suite runs from."
        type: string
        default: "ROCm/xla"
      test_runs_on:
        description: Runner label to execute tests on
        required: true
        type: string
      test_timeout_minutes:
        description: "Budget for the whole test job, in minutes."
        required: false
        # A string, not a number, so the same value shape works on both
        # triggers: workflow_dispatch supports only string/choice/boolean/
        # environment, so a number input there is rejected and the workflow
        # cannot be run by hand. Converted with fromJSON() where it is used.
        type: string
        default: "240"
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically by the
          top-level orchestrator to link this run to its release lineage. Do not
          set it manually.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      test_amdgpu_target:
        description: GPU target to test on (e.g. gfx942, gfx950)
        type: string
        default: "gfx950"
      rocm_package_find_links_url:
        description: "pip --find-links URL for the rocm[libraries,devel] wheel to install."
        type: string
        default: ""
      rocm_package_index_url:
        description: "pip --index-url URL for the rocm[libraries,devel] wheel to install."
        type: string
        default: "https://nightly.repo.amd.com/rocm/whl-next/"
      rocm_package_version:
        description: "Version pin for the rocm[libraries,devel] wheel (e.g. '7.13.0.dev0+abc123'). Empty installs the latest available."
        type: string
        default: ""
      repository:
        description: "Repository to checkout. Defaults to github.repository."
        type: string
        default: ""
      ref:
        description: "Branch, tag or SHA to checkout."
        type: string
        default: ""
      xla_ref:
        description: "ROCm/xla ref to check out."
        type: string
        default: "rocm-jaxlib-v0.11.2"
      xla_repository:
        description: "Repository holding the XLA checkout the test suite runs from."
        type: string
        default: "ROCm/xla"
      test_runs_on:
        description: Runner label to use. The selected runner should have a GPU supported by test_amdgpu_family
        type: string
        default: "linux-gfx950-1gpu-ccs-ossci-rocm"
      test_timeout_minutes:
        description: "Budget for the whole test job, in minutes."
        type: string
        default: "240"
      quartz_tracking_id:
        description: >-
          Leave empty. Internal Quartz tracking id, set automatically by the
          top-level orchestrator to link this run to its release lineage. Do not
          set it manually.
        type: string
        default: ""
  # Validates the pipeline itself whenever it changes, with literal defaults
  # standing in for what a future caller would pass — pull_request has no `inputs` context,
  # so every `inputs.x` below is null here and falls back to these defaults.
  pull_request:
    paths:
      - ".github/workflows/test_multi_arch_linux_xla.yml"

permissions:
  contents: read

jobs:
  test_xla:
    name: Test XLA | ${{ inputs.test_amdgpu_target || 'gfx950' }}
    runs-on: ${{ inputs.test_runs_on || 'linux-gfx950-1gpu-ccs-ossci-rocm' }}
    # fromJSON turns the string input into the number timeout-minutes needs. The
    # fallback covers pull_request, where there is no inputs context at all.
    timeout-minutes: ${{ fromJSON(inputs.test_timeout_minutes || '240') }}

    outputs:
      summary: ${{ steps.summary.outputs.summary }}

    container:
      image: ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f
      options: >-
        --shm-size=128g
        --device /dev/kfd
        --device /dev/dri
        --user root
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e KUBE_CPU_REQUEST
        -e KUBE_MEMORY_REQUEST
      volumes:
        - /etc/rbe-certs/temp-rbe-cert.crt:/data/temp-rbe-cert.crt:ro
        - /etc/rbe-certs/temp-rbe-cert.key:/data/temp-rbe-cert.key:ro
        - /etc/rbe-certs/bb-rbe-ca.crt:/data/bb-rbe-ca.crt:ro
        - /etc/rbe-certs/bb-rbe-client.crt:/data/bb-rbe-client.crt:ro
        - /etc/rbe-certs/bb-rbe-client.key:/data/bb-rbe-client.key:ro

    defaults:
      run:
        shell: bash

    env:
      QUARTZ_REPORTING_WORKFLOW: test_multi_arch_linux_xla.yml
      QUARTZ_WORKFLOW_POSTFIX: "- test XLA (partial)"
      ROCM_AMD_GPU_TARGETS: ${{ inputs.test_amdgpu_target || 'gfx950' }}
      RBE_SINGLE_GPU_POOL: "linux_x64_gpu"
      ROCM_PACKAGE_FIND_LINKS_URL: ${{ inputs.rocm_package_find_links_url }}
      ROCM_PACKAGE_INDEX_URL: ${{ inputs.rocm_package_index_url || 'https://nightly.repo.amd.com/rocm/whl-next/' }}
      ROCM_PACKAGE_VERSION: ${{ inputs.rocm_package_version }}
      # Negative gtest filter, colon-separated:
      #   HloOpProfilerTest.BasicMeasurementsAreCorrect
      #   StreamExecutorGpuClientTest.NumaNode — Numa test doesn't work on DO nodes, rbe
      #   PrngTest.PassInGlobalRngSeed
      #   CommandBufferTests/CommandBufferTest.Convolutions* — TODO: fix known therock issue https://amd-hub.atlassian.net/browse/ROCM-33231
      #   HloOpProfilerTest --TODO: fix known issue: https://amd-hub.atlassian.net/browse/ROCM-33725
      XLA_TEST_FILTER: >-
        -HloOpProfilerTest.BasicMeasurementsAreCorrect:StreamExecutorGpuClientTest.NumaNode:PrngTest.PassInGlobalRngSeed:HloOpProfilerTest*:CommandBufferTests/CommandBufferTest.Convolutions*
      ROCM_COMMON_BAZEL_ARGS: >-
        --config=rocm_ci_hermetic
        --config=rocm_rbe_dynamic
        --config=rocm_rbe_dev
        --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}"
        --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL="${RBE_SINGLE_GPU_POOL}"
        --repo_env=ROCM_PATH="${ROCM_PATH}"
        --repo_env=TF_ROCM_AMDGPU_TARGETS="${ROCM_AMD_GPU_TARGETS}"
        --test_filter="${XLA_TEST_FILTER}"
        --jobs=50
        --bes_keywords=nightly
        --bes_keywords=therock_xla

    steps:
      - name: "Quartz - started ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        uses: ROCm/Quartz/.github/actions/notify_quartz@2d3d15630651544b1469f71da25da9b73ffa8667 # notify_quartz/v1.1.3
        with:
          run_phase: started
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          persist-credentials: false
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || '' }}

      - name: Checkout XLA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 15
        with:
          persist-credentials: false
          path: xla
          repository: ${{ inputs.xla_repository || 'ROCm/xla' }}
          ref: ${{ inputs.xla_ref || 'rocm-jaxlib-v0.11.2' }}

      # The device serial numbers it prints identify a recurring bad device
      # across runs, since the runner and the device index change every time.
      - name: Driver / GPU sanity check
        timeout-minutes: 3
        run: |
          python build_tools/print_driver_gpu_info.py

      # Pip-install ROCm from already-built wheels and resolve a local install
      # prefix, same as multi_arch_build_linux_jax_wheels_ci.yml's jaxlib
      # build does for its own bazel ROCM_PATH. ROCM_AMD_GPU_TARGETS is
      # already a concrete gfx target (e.g. "gfx950"), so the matching device
      # extra is just "device-${ROCM_AMD_GPU_TARGETS}".
      - name: Install rocm[libraries,devel] wheels
        run: |
          pkg="rocm[libraries,devel,device-${ROCM_AMD_GPU_TARGETS}]${ROCM_PACKAGE_VERSION:+==$ROCM_PACKAGE_VERSION}"
          python build_tools/setup_venv.py .venv \
            --packages "${pkg}" \
            --index-url="${ROCM_PACKAGE_INDEX_URL}" \
            --find-links="${ROCM_PACKAGE_FIND_LINKS_URL}" \
            --activate-in-future-github-actions-steps

      - name: Resolve ROCM_PATH from installed wheels
        run: |
          echo "ROCM_PATH=$(rocm-sdk path --root)" >> "$GITHUB_ENV"

      - name: Run XLA tests [single_gpu]
        working-directory: xla
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=ci_single_gpu \
            --local_test_jobs=1 \
            --build_event_json_file=xla_single_gpu_build_events.json \
            --bes_keywords=single_gpu \
            ${{ env.ROCM_COMMON_BAZEL_ARGS }} \
            -- \
            //xla/...

      - name: Run XLA tests [cpu]
        working-directory: xla
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            --config=ci_rocm_cpu \
            --build_event_json_file=xla_cpu_build_events.json \
            --bes_keywords=cpu \
            ${{ env.ROCM_COMMON_BAZEL_ARGS }} \
            -- \
            //xla/...

      - name: Capture job summary
        id: summary
        if: always()
        run: python build_tools/github_actions/capture_job_summary.py

      - name: "Quartz - completed ${{ env.QUARTZ_WORKFLOW_POSTFIX }}"
        continue-on-error: true
        if: ${{ always() && vars.NOTIFY_QUARTZ_ENABLED == 'true' }}
        uses: ROCm/Quartz/.github/actions/notify_quartz@2d3d15630651544b1469f71da25da9b73ffa8667 # notify_quartz/v1.1.3
        with:
          run_phase: completed
          run_conclusion: ${{ job.status }}
          reporting_workflow: ${{ env.QUARTZ_REPORTING_WORKFLOW }}
          workflow_inputs: ${{ toJSON(inputs) }}
          workflow_step_outputs: ${{ toJSON(steps) }}
          gh_app_client_id: ${{ secrets.GH_APP_HAULY_CID }}
          gh_app_private_key: ${{ secrets.GH_APP_HAULY_PRIVATE_KEY }}
