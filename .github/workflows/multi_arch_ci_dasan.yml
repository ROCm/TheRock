name: Experimental DASan compiler, runtime, and math libraries

on:
  workflow_call:
    inputs:
      math_libraries:
        type: boolean
        default: false
        description: "Build gfx950 math libraries using a prebuilt DASan installation"
      baseline_run_id:
        type: string
        default: ""
        description: "Run providing dasan-installation-gfx942-gfx950"

permissions:
  contents: read

jobs:
  build:
    name: Build DASan (gfx942 + gfx950)
    if: ${{ !inputs.math_libraries }}
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb # 2026-08-18
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - name: Checkout DASan branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          persist-credentials: false

      - name: Build pinned compiler and runtimes
        run: |
          python build_tools/dasan_build.py \
            --in-container --prepare-sources --output-dir dasan-output \
            --gpu-targets 'gfx942;gfx950' --jobs "$(nproc)" --link-jobs 4

      - name: Prepare unchanged LLVM DASan lit suite
        run: |
          python test_tools/dasan_bundle.py \
            --source-root compiler/amd-llvm \
            --llvm-build dasan-output/build/compiler/amd-llvm/build \
            --rocm-root dasan-output/build/dist/rocm \
            --output dasan-output/dasan-lit-bundle

      - name: Validate installed host runtimes and both compile targets
        run: |
          python test_tools/dasan_smoke.py \
            --rocm-path dasan-output/build/dist/rocm \
            --llvm-lit dasan-output/dasan-lit-bundle/llvm-lit.py \
            --lit-suite dasan-output/dasan-lit-bundle/suite \
            --output-dir dasan-output/validation-host

      - name: Package installation
        run: |
          tar -cJf therock-dasan-gfx942-gfx950.tar.xz \
            -C build/dist rocm
        working-directory: dasan-output

      - name: Upload installation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dasan-installation-gfx942-gfx950
          path: dasan-output/therock-dasan-gfx942-gfx950.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build provenance and validation bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dasan-build-logs-and-tests
          path: |
            dasan-output/*.json
            dasan-output/*.log
            dasan-output/dasan-lit-bundle/
            dasan-output/validation-host/
          retention-days: 14

      - name: Collect DASan compiler diagnostics
        if: always()
        run: python build_tools/github_actions/collect_dasan_logs.py --output-dir dasan-output

      - name: Configure AWS credentials for log uploads
        if: always()
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ci

      - name: Upload DASan compiler logs to S3
        if: always()
        run: |
          python build_tools/github_actions/post_stage_upload.py \
            --run-id "${GITHUB_RUN_ID}" --stage compiler-runtime \
            --build-dir dasan-output/build

  math:
    name: Build DASan math libraries (gfx950)
    if: ${{ inputs.math_libraries }}
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 720
    permissions:
      contents: read
      actions: read
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:cf4f6d9909056906e4a1c0bc4c245658a0af4c6a6174082a86adfa2d518b7aeb # 2026-08-18
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
    steps:
      - name: Checkout DASan math branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          persist-credentials: false

      - name: Validate baseline run
        run: |
          mkdir -p dasan-math-output/build/logs
          if [[ ! "${BASELINE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "dasan_math_libraries requires a numeric baseline_run_id" | tee dasan-math-output/build/logs/reuse.log
            exit 1
          fi
          printf 'Reusing DASan installation from run %s\n' "${BASELINE_RUN_ID}" | tee dasan-math-output/build/logs/reuse.log

      - name: Install build and upload dependencies
        run: python -m pip install -r requirements.txt 2>&1 | tee dasan-math-output/build/logs/dependencies.log

      - name: Download baseline DASan installation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 15
        with:
          name: dasan-installation-gfx942-gfx950
          path: dasan-prebuilt
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}

      - name: Extract baseline DASan installation
        run: |
          tar -xJf dasan-prebuilt/therock-dasan-gfx942-gfx950.tar.xz -C dasan-prebuilt \
            2>&1 | tee dasan-math-output/build/logs/extract.log

      - name: Configure AWS credentials for initial log upload
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ci

      - name: Upload initial DASan math logs to S3
        run: |
          python build_tools/github_actions/post_stage_upload.py \
            --run-id "${GITHUB_RUN_ID}" --stage math-libs \
            --build-dir dasan-math-output/build --amdgpu-family gfx950

      - name: Build gfx950 math libraries with DASan
        run: |
          # Isolate the heartbeat process group so cleanup also stops an
          # in-flight upload before the final, blocking log upload runs.
          setsid bash -c '
            while sleep 60; do
              python build_tools/github_actions/collect_dasan_logs.py --output-dir dasan-math-output &&
                python build_tools/github_actions/post_stage_upload.py \
                  --run-id "${GITHUB_RUN_ID}" --stage math-libs \
                  --build-dir dasan-math-output/build --amdgpu-family gfx950 || true
            done
          ' > dasan-periodic-upload.log 2>&1 &
          upload_pid=$!
          trap 'build_status=$?; trap - EXIT; kill -- "-${upload_pid}" 2>/dev/null || true; wait "${upload_pid}" 2>/dev/null || true; exit "${build_status}"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python build_tools/dasan_math_build.py \
            --rocm-path dasan-prebuilt/rocm --output-dir dasan-math-output \
            --jobs "$(nproc)" --prepare-sources

      - name: Upload DASan math artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dasan-math-libraries-gfx950
          path: |
            dasan-math-output/dasan-math-gfx950.tar.gz
            dasan-math-output/dasan-math-artifacts-gfx950.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Collect DASan math diagnostics
        if: always()
        run: python build_tools/github_actions/collect_dasan_logs.py --output-dir dasan-math-output

      - name: Configure AWS credentials for log uploads
        if: always()
        uses: ./.github/actions/configure_aws_artifacts_credentials
        with:
          release_type: ci

      - name: Upload DASan math logs to S3
        if: always()
        run: |
          python build_tools/github_actions/post_stage_upload.py \
            --run-id "${GITHUB_RUN_ID}" --stage math-libs \
            --build-dir dasan-math-output/build --amdgpu-family gfx950

      - name: Upload DASan math logs and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dasan-math-logs-gfx950
          path: dasan-math-output/build/logs/
          if-no-files-found: error
          retention-days: 14

  test:
    name: DASan lit (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: gfx942
            runner: linux-gfx942-8gpu-ossci-rocm
          - arch: gfx950
            runner: linux-gfx950-8gpu-ccs-ossci-rocm
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      # Match the base/GPU options in fetch_test_configurations.py, including
      # the OSSCI and ARC runner GPU isolation settings.
      options: >-
        --user 0:0
        --ulimit memlock=-1:-1
        --ulimit nofile=1048576:1048576
        --ipc=host
        --security-opt seccomp=unconfined
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
        -e ROCR_VISIBLE_DEVICES
        -e KUBE_CPU_REQUEST
    defaults:
      run:
        shell: bash
    env:
      GPU_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout validation runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          persist-credentials: false

      - name: Download installation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dasan-installation-gfx942-gfx950
          path: dasan-test

      - name: Download validation bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dasan-build-logs-and-tests
          path: dasan-test

      - name: Extract installation
        run: tar -xJf therock-dasan-gfx942-gfx950.tar.xz
        working-directory: dasan-test

      - name: Run all 27 DASan tests including OpenMP and multiple GPUs
        run: |
          export ROCM_ROOT="$PWD/dasan-test/rocm"
          export LD_LIBRARY_PATH="$ROCM_ROOT/lib:$ROCM_ROOT/lib/llvm/lib:$ROCM_ROOT/lib/rocm_sysdeps/lib"
          GPU_COUNT="$(python3 - <<'PY'
          import ctypes
          import os
          from pathlib import Path

          runtime = ctypes.CDLL(str(Path(os.environ["ROCM_ROOT"]) / "lib/libamdhip64.so"))
          runtime.hipGetDeviceCount.argtypes = [ctypes.POINTER(ctypes.c_int)]
          runtime.hipGetDeviceCount.restype = ctypes.c_int
          count = ctypes.c_int()
          status = runtime.hipGetDeviceCount(ctypes.byref(count))
          if status != 0:
              raise SystemExit(f"Packaged hipGetDeviceCount failed with status {status}")
          if count.value < 1:
              raise SystemExit("No GPUs visible to the packaged HIP runtime")
          print(count.value)
          PY
          )"
          python3 test_tools/dasan_smoke.py \
            --rocm-path dasan-test/rocm \
            --llvm-lit dasan-test/dasan-lit-bundle/llvm-lit.py \
            --lit-suite dasan-test/dasan-lit-bundle/suite \
            --gpu-arch "${GPU_ARCH}" --gpu-device-count "${GPU_COUNT}" \
            --openmp --require-multi-device \
            --output-dir "dasan-test/validation-${GPU_ARCH}"

      - name: Upload DASan test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dasan-validation-${{ matrix.arch }}
          path: dasan-test/validation-${{ matrix.arch }}/
          retention-days: 14
