# hiptests
#
# This artifact provides only the 'test' component. 'lib' is left unassigned
# because its **/*.so default would otherwise claim the libraries used for testing.
[components.dbg."core/hip-tests/stage"]
[components.dev."core/hip-tests/stage"]
[components.doc."core/hip-tests/stage"]
[components.test."core/hip-tests/stage"]
include = [
  "share/hip/**",
]
